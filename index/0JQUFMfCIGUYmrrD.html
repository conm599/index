<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3魔方还原求解器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }
        
        .cube-section {
            flex: 1;
            min-width: 500px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .instructions-section {
            flex: 1;
            min-width: 500px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        
        .cube-container {
            perspective: 800px;
            margin: 0 auto;
            width: 250px;
            height: 250px;
            position: relative;
        }
        
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-15deg) rotateY(-25deg);
            transition: transform 0.5s;
        }
        
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.7);
        }
        
        .front { transform: translateZ(125px); }
        .back { transform: rotateY(180deg) translateZ(125px); }
        .right { transform: rotateY(90deg) translateZ(125px); }
        .left { transform: rotateY(-90deg) translateZ(125px); }
        .top { transform: rotateX(90deg) translateZ(125px); }
        .bottom { transform: rotateX(-90deg) translateZ(125px); }
        
        .cubie {
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        
        .cubie:hover {
            transform: scale(1.05);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        
        .white { background-color: #FFFFFF; color: #333; }
        .yellow { background-color: #FFEB3B; color: #333; }
        .red { background-color: #F44336; }
        .orange { background-color: #FF9800; }
        .blue { background-color: #2196F3; }
        .green { background-color: #4CAF50; }
        
        .color-palette {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .color-option {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .color-option:hover {
            transform: scale(1.1);
        }
        
        .color-option.selected {
            border-color: white;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .reset-btn {
            background: #f44336;
        }
        
        .reset-btn:hover {
            background: #d32f2f;
        }
        
        .solve-btn {
            background: #2196F3;
        }
        
        .solve-btn:hover {
            background: #1976D2;
        }
        
        .instructions {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .step {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .step-number {
            display: inline-block;
            background: #FF9800;
            color: #333;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .step-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        
        .step-description {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .step-formula {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 12px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 1.1rem;
            border-left: 4px solid #4CAF50;
        }
        
        .step-details {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
        }
        
        .cube-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .view-btn {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }
        
        @media (max-width: 1100px) {
            .main-content {
                flex-direction: column;
            }
            
            .cube-section, .instructions-section {
                min-width: 100%;
            }
        }
        
        @media (max-width: 600px) {
            .cube-container {
                width: 200px;
                height: 200px;
            }
            
            .front { transform: translateZ(100px); }
            .back { transform: rotateY(180deg) translateZ(100px); }
            .right { transform: rotateY(90deg) translateZ(100px); }
            .left { transform: rotateY(-90deg) translateZ(100px); }
            .top { transform: rotateX(90deg) translateZ(100px); }
            .bottom { transform: rotateX(-90deg) translateZ(100px); }
            
            h1 {
                font-size: 2rem;
            }
            
            .section-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>3x3魔方还原求解器</h1>
            <p class="subtitle">点击设置您的魔方状态，获取详细的还原步骤和公式</p>
        </header>
        
        <div class="main-content">
            <section class="cube-section">
                <h2 class="section-title">魔方状态设置</h2>
                
                <div class="cube-container">
                    <div class="cube" id="cube">
                        <div class="face front">
                            <!-- 前面将由JS生成 -->
                        </div>
                        <div class="face back">
                            <!-- 后面将由JS生成 -->
                        </div>
                        <div class="face right">
                            <!-- 右面将由JS生成 -->
                        </div>
                        <div class="face left">
                            <!-- 左面将由JS生成 -->
                        </div>
                        <div class="face top">
                            <!-- 顶面将由JS生成 -->
                        </div>
                        <div class="face bottom">
                            <!-- 底面将由JS生成 -->
                        </div>
                    </div>
                </div>
                
                <div class="cube-controls">
                    <button class="view-btn" id="rotateLeftBtn">左转视角</button>
                    <button class="view-btn" id="rotateRightBtn">右转视角</button>
                    <button class="view-btn" id="resetViewBtn">重置视角</button>
                </div>
                
                <div class="color-palette">
                    <div class="color-option white selected" data-color="white"></div>
                    <div class="color-option yellow" data-color="yellow"></div>
                    <div class="color-option red" data-color="red"></div>
                    <div class="color-option orange" data-color="orange"></div>
                    <div class="color-option blue" data-color="blue"></div>
                    <div class="color-option green" data-color="green"></div>
                </div>
                
                <div class="controls">
                    <button class="reset-btn" id="resetBtn">重置魔方</button>
                    <button class="solve-btn" id="solveBtn">求解还原步骤</button>
                </div>
            </section>
            
            <section class="instructions-section">
                <h2 class="section-title">还原步骤说明</h2>
                
                <div class="instructions" id="instructions">
                    <div class="loading" id="loadingMessage">
                        请设置魔方状态并点击"求解还原步骤"
                    </div>
                    <div id="solutionSteps" style="display: none;">
                        <!-- 求解步骤将在这里显示 -->
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // 魔方状态表示
        let cubeState = {
            front: Array(9).fill('white'),
            back: Array(9).fill('yellow'),
            right: Array(9).fill('red'),
            left: Array(9).fill('orange'),
            top: Array(9).fill('blue'),
            bottom: Array(9).fill('green')
        };

        // 当前选中的颜色
        let selectedColor = 'white';
        
        // 当前视角旋转角度
        let currentRotation = {
            x: -15,
            y: -25
        };

        // 初始化魔方
        function initializeCube() {
            const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
            
            faces.forEach(face => {
                const faceElement = document.querySelector(`.${face}`);
                faceElement.innerHTML = '';
                
                for (let i = 0; i < 9; i++) {
                    const cubie = document.createElement('div');
                    cubie.className = `cubie ${cubeState[face][i]}`;
                    cubie.dataset.face = face;
                    cubie.dataset.index = i;
                    cubie.addEventListener('click', handleCubieClick);
                    faceElement.appendChild(cubie);
                }
            });
            
            updateCubeRotation();
        }

        // 更新魔方旋转
        function updateCubeRotation() {
            const cube = document.getElementById('cube');
            cube.style.transform = `rotateX(${currentRotation.x}deg) rotateY(${currentRotation.y}deg)`;
        }

        // 处理魔方块点击
        function handleCubieClick(event) {
            const cubie = event.currentTarget;
            const face = cubie.dataset.face;
            const index = parseInt(cubie.dataset.index);
            
            // 更新魔方状态
            cubeState[face][index] = selectedColor;
            
            // 更新UI
            cubie.className = `cubie ${selectedColor}`;
        }

        // 重置魔方
        function resetCube() {
            cubeState = {
                front: Array(9).fill('white'),
                back: Array(9).fill('yellow'),
                right: Array(9).fill('red'),
                left: Array(9).fill('orange'),
                top: Array(9).fill('blue'),
                bottom: Array(9).fill('green')
            };
            
            initializeCube();
            
            // 重置求解步骤
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('solutionSteps').style.display = 'none';
        }
        
        // 重置视角
        function resetView() {
            currentRotation = {
                x: -15,
                y: -25
            };
            updateCubeRotation();
        }
        
        // 旋转视角
        function rotateView(direction) {
            if (direction === 'left') {
                currentRotation.y -= 30;
            } else if (direction === 'right') {
                currentRotation.y += 30;
            }
            updateCubeRotation();
        }

        // 求解魔方
        function solveCube() {
            document.getElementById('loadingMessage').textContent = "正在计算还原步骤...";
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('solutionSteps').style.display = 'none';
            
            // 模拟计算时间
            setTimeout(() => {
                generateSolutionSteps();
            }, 1500);
        }

        // 生成求解步骤
        function generateSolutionSteps() {
            const solutionSteps = document.getElementById('solutionSteps');
            solutionSteps.innerHTML = '';
            
            // 示例求解步骤（实际应用中这里应该使用真实的魔方求解算法）
            const steps = [
                {
                    title: "底层十字",
                    description: "在底层形成一个白色十字，并使侧面颜色与中心块对齐",
                    formula: "F R U R' U' F'",
                    details: "将白色面朝上，红色面对自己，用右手执行公式。注意：这一步需要调整白色边块的位置，使它们与中心块颜色对齐。"
                },
                {
                    title: "底层角块",
                    description: "完成底层四个角块的放置，使底层完全还原",
                    formula: "R U R' U R U2 R'",
                    details: "保持白色面朝下，找到带有白色和相应颜色的角块，用右手执行公式将其放置到正确位置。"
                },
                {
                    title: "中层棱块",
                    description: "还原中间层的四个棱块",
                    formula: "U R U' R' U' F' U F 或 U' F' U F U R U' R'",
                    details: "将黄色面朝上，找到不含黄色的棱块，根据情况选择公式。用右手执行R和U操作，左手执行F操作。"
                },
                {
                    title: "顶层十字",
                    description: "在顶层形成一个黄色十字",
                    formula: "F R U R' U' F'",
                    details: "将黄色面朝上，根据黄色棱块的情况，可能需要多次执行此公式。注意保持魔方方向不变。"
                },
                {
                    title: "顶层角块位置",
                    description: "调整顶层角块的位置（不关心方向）",
                    formula: "R U R' U R U2 R'",
                    details: "找到两个相邻角块颜色相同的情况，将这一面朝向自己，用右手执行公式。可能需要重复2-3次。"
                },
                {
                    title: "顶层角块方向",
                    description: "调整顶层角块的方向，使黄色面全部朝上",
                    formula: "R' D' R D",
                    details: "将需要调整的角块放在右前上方位置，重复执行公式直到角块黄色面朝上，然后转动顶层将下一个需要调整的角块移到相同位置。"
                },
                {
                    title: "顶层棱块位置",
                    description: "调整顶层棱块的位置，完成魔方还原",
                    formula: "R U' R U R U R U' R' U' R2",
                    details: "如果有一个面已经还原，将这一面朝向自己；如果没有，任意方向执行公式一次。然后用右手执行整个公式序列。"
                }
            ];
            
            steps.forEach((step, index) => {
                const stepElement = document.createElement('div');
                stepElement.className = 'step';
                stepElement.innerHTML = `
                    <div class="step-title">
                        <span class="step-number">${index + 1}</span>
                        ${step.title}
                    </div>
                    <div class="step-description">${step.description}</div>
                    <div class="step-formula">公式: ${step.formula}</div>
                    <div class="step-details">
                        <strong>操作说明:</strong> ${step.details}
                    </div>
                `;
                solutionSteps.appendChild(stepElement);
            });
            
            document.getElementById('loadingMessage').style.display = 'none';
            solutionSteps.style.display = 'block';
        }

        // 初始化事件监听
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化魔方
            initializeCube();
            
            // 颜色选择
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelector('.color-option.selected').classList.remove('selected');
                    option.classList.add('selected');
                    selectedColor = option.dataset.color;
                });
            });
            
            // 按钮事件
            document.getElementById('resetBtn').addEventListener('click', resetCube);
            document.getElementById('solveBtn').addEventListener('click', solveCube);
            document.getElementById('rotateLeftBtn').addEventListener('click', () => rotateView('left'));
            document.getElementById('rotateRightBtn').addEventListener('click', () => rotateView('right'));
            document.getElementById('resetViewBtn').addEventListener('click', resetView);
        });
    </script>
</body>
</html>
