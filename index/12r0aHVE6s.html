<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频帧提取工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
    <h1>视频帧提取工具</h1>
    
    <div>
        <input type="file" id="videoInput" accept="video/*">
        <button id="extractBtn" disabled>提取所有帧</button>
    </div>
    
    <div>
        <video id="videoPlayer" controls style="max-width: 100%; display: none;"></video>
    </div>
    
    <div id="status" style="margin-top: 20px;"></div>
    
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoInput = document.getElementById('videoInput');
            const extractBtn = document.getElementById('extractBtn');
            const videoPlayer = document.getElementById('videoPlayer');
            const canvas = document.getElementById('canvas');
            const statusDiv = document.getElementById('status');
            const ctx = canvas.getContext('2d');
            
            let videoFile = null;
            
            // 处理视频文件选择
            videoInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    videoFile = e.target.files[0];
                    videoPlayer.src = URL.createObjectURL(videoFile);
                    videoPlayer.style.display = 'block';
                    extractBtn.disabled = false;
                    statusDiv.textContent = '视频已加载，点击"提取所有帧"按钮开始处理';
                }
            });
            
            // 提取所有帧
            extractBtn.addEventListener('click', async function() {
                if (!videoFile) return;
                
                extractBtn.disabled = true;
                statusDiv.textContent = '正在处理视频，请稍候...';
                
                try {
                    // 等待视频元数据加载完成
                    await new Promise((resolve) => {
                        if (videoPlayer.readyState >= 2) {
                            resolve();
                        } else {
                            videoPlayer.addEventListener('loadedmetadata', resolve, { once: true });
                        }
                    });
                    
                    // 设置Canvas尺寸与视频相同
                    canvas.width = videoPlayer.videoWidth;
                    canvas.height = videoPlayer.videoHeight;
                    
                    // 计算视频总帧数
                    const fps = 30; // 假设帧率为30fps，可根据实际需要调整
                    const duration = videoPlayer.duration;
                    const totalFrames = Math.ceil(duration * fps);
                    
                    statusDiv.textContent = `正在提取 ${totalFrames} 帧...`;
                    
                    // 创建ZIP包
                    const zip = new JSZip();
                    
                    // 逐帧提取
                    for (let frame = 0; frame < totalFrames; frame++) {
                        // 设置视频当前时间
                        const currentTime = frame / fps;
                        videoPlayer.currentTime = currentTime;
                        
                        // 等待视频跳转到指定时间
                        await new Promise((resolve) => {
                            videoPlayer.addEventListener('seeked', resolve, { once: true });
                        });
                        
                        // 绘制当前帧到Canvas
                        ctx.drawImage(videoPlayer, 0, 0, canvas.width, canvas.height);
                        
                        // 将Canvas转换为图片数据
                        const imageData = canvas.toDataURL('image/jpeg', 0.95);
                        
                        // 移除Data URL前缀
                        const base64Data = imageData.replace(/^data:image\/jpeg;base64,/, '');
                        
                        // 添加到ZIP包，按顺序命名
                        const frameNumber = String(frame + 1).padStart(6, '0');
                        zip.file(`frame_${frameNumber}.jpg`, base64Data, {base64: true});
                        
                        // 更新进度
                        if (frame % 10 === 0) {
                            statusDiv.textContent = `正在提取 ${frame + 1}/${totalFrames} 帧...`;
                        }
                    }
                    
                    // 生成ZIP文件
                    statusDiv.textContent = '正在生成ZIP文件...';
                    const zipBlob = await zip.generateAsync({type: 'blob'});
                    
                    // 下载ZIP文件
                    saveAs(zipBlob, 'video_frames.zip');
                    
                    statusDiv.textContent = `成功提取 ${totalFrames} 帧并打包完成!`;
                    extractBtn.disabled = false;
                    
                } catch (error) {
                    console.error('提取过程中出错:', error);
                    statusDiv.textContent = '提取过程中出错: ' + error.message;
                    extractBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
