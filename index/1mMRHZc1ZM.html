                            "macos": v.macos,
                            "linux": v.linux,
                            "source": v.source
                        }
                    };
                    
                    // 构建major_versions
                    const major = version.split('.').slice(0, 2).join('.');
                    if (!pythonData.major_versions[major]) {
                        pythonData.major_versions[major] = [];
                    }
                    pythonData.major_versions[major].push(version);
                });
                
                // 对每个大版本的子版本进行排序（从高到低）
                Object.keys(pythonData.major_versions).forEach(major => {
                    pythonData.major_versions[major].sort((a, b) => {
                        const [a1, a2, a3] = a.split('.').map(Number);
                        const [b1, b2, b3] = b.split('.').map(Number);
                        if (a1 !== b1) return b1 - a1;
                        if (a2 !== b2) return b2 - a2;
                        return (b3 || 0) - (a3 || 0);
                    });
                });

        // 生成筛选器
        function generateFilters() {
            const filterContainer = document.getElementById('version-filters');
            
            // 清空容器
            filterContainer.innerHTML = '';
            
            // 添加"全部"筛选器
            const allFilter = document.createElement('button');
            allFilter.className = 'px-4 py-2 rounded-full bg-primary text-white font-medium transition-smooth hover:bg-primary/90';
            allFilter.textContent = '全部';
            allFilter.dataset.filter = 'all';
            allFilter.addEventListener('click', () => filterVersions('all'));
            filterContainer.appendChild(allFilter);
            
            // 添加大版本筛选器
            const majorVersions = Object.keys(pythonData.major_versions);
            majorVersions.forEach(major => {
                const filterBtn = document.createElement('button');
                filterBtn.className = 'px-4 py-2 rounded-full bg-white border border-gray-300 text-dark font-medium transition-smooth hover:bg-gray-100';
                filterBtn.textContent = major;
                filterBtn.dataset.filter = major;
                filterBtn.addEventListener('click', () => filterVersions(major));
                filterContainer.appendChild(filterBtn);
            });
        }
        
        // 筛选版本
        function filterVersions(filter) {
            currentFilter = filter;
            
            // 更新筛选器样式
            const filterButtons = document.querySelectorAll('#version-filters button');
            filterButtons.forEach(btn => {
                if (btn.dataset.filter === filter) {
                    btn.className = 'px-4 py-2 rounded-full bg-primary text-white font-medium transition-smooth hover:bg-primary/90';
                } else {
                    btn.className = 'px-4 py-2 rounded-full bg-white border border-gray-300 text-dark font-medium transition-smooth hover:bg-gray-100';
                }
            });
            
            // 重新生成版本卡片
            generateVersionCards();
        }
        
        // 生成版本卡片
        function generateVersionCards() {
            const cardContainer = document.getElementById('version-cards');
            
            // 清空容器
            cardContainer.innerHTML = '';
            
            // 获取要显示的版本
            let versionsToShow = [];
            
            if (currentFilter === 'all') {
                // 显示所有版本
                versionsToShow = Object.values(pythonData.all_versions);
            } else {
                // 显示特定大版本的所有子版本
                const versionNumbers = pythonData.major_versions[currentFilter] || [];
                versionsToShow = versionNumbers.map(v => pythonData.all_versions[v]).filter(v => v);
            }
            
            // 如果没有版本，显示空状态
            if (versionsToShow.length === 0) {
                cardContainer.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <i class="fa fa-search text-4xl text-gray-400 mb-4"></i>
                        <p class="text-lg text-gray-500">没有找到符合条件的Python版本</p>
                    </div>
                `;
                return;
            }
            
            // 创建版本卡片
            versionsToShow.forEach(versionInfo => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-lg overflow-hidden card-shadow transition-smooth hover:shadow-xl transform hover:-translate-y-1';
                
                // 卡片头部
                const headerClass = getVersionHeaderClass(versionInfo.version);
                card.innerHTML = `
                    <div class="${headerClass} px-6 py-4">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xl font-bold text-white">Python ${versionInfo.version}</h3>
                            <span class="bg-white/20 text-white text-xs px-2 py-1 rounded-full">${versionInfo.date || '未知日期'}</span>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="space-y-4">
                            <!-- Windows下载 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <h4 class="font-medium text-gray-700 mb-2 flex items-center">
                                    <i class="fa fa-windows text-blue-600 mr-2"></i>
                                    Windows
                                </h4>
                                <div class="grid grid-cols-3 gap-2 text-sm">
                                    ${createDownloadLink('64位', versionInfo.downloads.windows['64bit'])}
                                    ${createDownloadLink('32位', versionInfo.downloads.windows['32bit'])}
                                    ${createDownloadLink('ARM64', versionInfo.downloads.windows['arm64'])}
                                </div>
                            </div>
                            
                            <!-- macOS下载 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <h4 class="font-medium text-gray-700 mb-2 flex items-center">
                                    <i class="fa fa-apple text-gray-800 mr-2"></i>
                                    macOS
                                </h4>
                                <div class="grid grid-cols-2 gap-2 text-sm">
                                    ${createDownloadLink('Intel', versionInfo.downloads.macos['x86_64'])}
                                    ${createDownloadLink('Apple Silicon', versionInfo.downloads.macos['arm64'])}
                                </div>
                            </div>
                            
                            <!-- Linux下载 -->
                            <div class="bg-gray-50 rounded-lg p-4">
                                <h4 class="font-medium text-gray-700 mb-2 flex items-center">
                                    <i class="fa fa-linux text-orange-600 mr-2"></i>
                                    Linux / 源码
                                </h4>
                                <div class="grid grid-cols-2 gap-2 text-sm">
                                    ${createDownloadLink('x86_64', versionInfo.downloads.linux['x86_64'])}
                                    ${createDownloadLink('源码', versionInfo.downloads.source)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                cardContainer.appendChild(card);
            });
        }
        
        // 创建下载链接

            if (url === '暂无此支持') {

                        <span class="text-gray-400 font-medium">${label}</span>
                        <div class="text-xs text-gray-300 mt-1">暂无支持</div>
                    </div>
                `;
            }
            
            return `
                <a href="${url}" target="_blank" class="bg-primary/10 hover:bg-primary/20 text-primary text-center py-1 px-2 rounded transition-smooth">
                    <span class="font-medium">${label}</span>
                    <div class="text-xs text-primary/70 mt-1">下载</div>
                </a>
            `;
        }
        
        // 根据版本号获取头部样式类
        function getVersionHeaderClass(version) {
            const majorVersion = parseFloat(version.split('.').slice(0, 2).join('.'));
            
            if (majorVersion >= 3.15) return 'bg-gradient-to-r from-purple-600 to-indigo-700';
            if (majorVersion >= 3.13) return 'bg-gradient-to-r from-indigo-600 to-blue-700';
            if (majorVersion >= 3.11) return 'bg-gradient-to-r from-blue-600 to-cyan-700';
            if (majorVersion >= 3.9) return 'bg-gradient-to-r from-cyan-600 to-teal-700';
            if (majorVersion >= 3.7) return 'bg-gradient-to-r from-teal-600 to-green-700';
            if (majorVersion >= 3.5) return 'bg-gradient-to-r from-green-600 to-lime-700';
            if (majorVersion >= 3.3) return 'bg-gradient-to-r from-lime-600 to-yellow-700';
            if (majorVersion >= 3.1) return 'bg-gradient-to-r from-yellow-600 to-orange-700';
            if (majorVersion >= 3.0) return 'bg-gradient-to-r from-orange-600 to-red-700';
            if (majorVersion >= 2.7) return 'bg-gradient-to-r from-red-600 to-pink-700';
            return 'bg-gradient-to-r from-gray-600 to-gray-800';
        }
        
        // 添加平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if (targetId === '#') return;
                
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
</body>
</html>
