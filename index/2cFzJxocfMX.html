<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级真实地球模拟</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000;
        }
        canvas { 
            display: block; 
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }
        .error {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        加载中... 哼哼，别急，马上就好！<br>
        <span id="loadingProgress">0/5</span>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, earth;
        let textureLoader = new THREE.TextureLoader();
        let resourcesToLoad = 5;
        let resourcesLoaded = 0;
        
        // 创建记忆记录
        createMemory("用户需求", "用户需要一个能够正常显示地球的3D模拟，特别是使用法线贴图的版本。");
        
        function createMemory(key, value) {
            const memoryId = Date.now();
            console.log(`已创建记忆记录 [${memoryId}]: ${key} - ${value}`);
        }
        
        function init() {
            try {
                // 创建场景
                scene = new THREE.Scene();
                
                // 创建相机
                camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 3;
                
                // 创建渲染器
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                document.body.appendChild(renderer.domElement);
                
                // 添加轨道控制器
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                
                // 添加光源
                const ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);
                
                const sunLight = new THREE.DirectionalLight(0xffffff, 1);
                sunLight.position.set(5, 3, 5);
                scene.add(sunLight);
                
                // 创建地球
                createEarth();
                
                // 添加星空背景
                createStars();
                
                // 添加云层
                createClouds();
                
                // 添加动画循环
                animate();
                
                // 响应窗口大小变化
                window.addEventListener('resize', onWindowResize);
                
                // 隐藏加载界面
                document.getElementById('loading').style.display = 'none';
                
                // 记录成功创建地球
                createMemory("地球加载成功", "用户成功加载了3D地球模拟，使用了Three.js库和纹理贴图。");
                
            } catch(error) {
                showError("初始化失败: " + error.message);
            }
        }
        
        function createEarth() {
            try {
                // 确保所有纹理都可用
                const textureUrls = [
                    'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
                    'https://threejs.org/examples/textures/planets/earth_normal_1024.jpg',
                    'https://threejs.org/examples/textures/planets/earth_specular_1024.jpg',
                    'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
                    'https://threejs.org/examples/textures/planets/earth_height_1024.jpg'
                ];
                
                // 创建地球几何体
                const geometry = new THREE.SphereGeometry(1, 64, 64);
                
                // 创建能够加载纹理的材质
                const material = new THREE.MeshPhongMaterial({
                    map: null,
                    normalMap: null,
                    specularMap: null,
                    displacementMap: null
                });
                
                earth = new THREE.Mesh(geometry, material);
                scene.add(earth);
                
                // 依次加载所有纹理
                textureUrls.forEach((url, index) => {
                    textureLoader.load(
                        url,
                        texture => {
                            // 根据不同的纹理类型应用到材质
                            switch(index) {
                                case 0: // 地球表面
                                    material.map = texture;
                                    break;
                                case 1: // 法线贴图
                                    material.normalMap = texture;
                                    break;
                                case 2: // 高光贴图
                                    material.specularMap = texture;
                                    break;
                                case 3: // 云层
                                    material.cloudsTexture = texture; // 自定义属性
                                    break;
                                case 4: // 高度贴图
                                    material.displacementMap = texture;
                                    break;
                            }
                            
                            // 所有纹理加载完成后更新材质
                            if (index === resourcesToLoad - 1) {
                                earth.material = material;
                            }
                            
                            resourcesLoaded++;
                            updateLoadingProgress();
                        },
                        undefined,
                        error => {
                            console.error("纹理加载失败:", error);
                            
                            // 如果特定纹理加载失败，尝试使用备选方案
                            if (index === 0) {
                                // 使用渐变色作为备选
                                material.color = new THREE.Color(0x1a5e9b);
                                material.emissive = new THREE.Color(0x000000);
                            }
                            
                            resourcesLoaded++;
                            updateLoadingProgress();
                        }
                    );
                });
                
            } catch(error) {
                showError("创建地球失败: " + error.message);
            }
        }
        
        function createStars() {
            try {
                const starsGeometry = new THREE.BufferGeometry();
                const starsMaterial = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.7,
                    sizeAttenuation: false
                });
                
                const starsVertices = [];
                for (let i = 0; i < 3000; i++) {
                    const x = (Math.random() - 0.5) * 2000;
                    const y = (Math.random() - 0.5) * 2000;
                    const z = (Math.random() - 0.5) * 2000;
                    starsVertices.push(x, y, z);
                }
                
                starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
                const stars = new THREE.Points(starsGeometry, starsMaterial);
                scene.add(stars);
                
                // 记录星空创建
                createMemory("星空创建", "用户成功添加了星空背景到地球模拟中。");
                
            } catch(error) {
                console.error("创建星空失败:", error);
            }
        }
        
        function createClouds() {
            try {
                // 创建云层几何体
                const cloudGeometry = new THREE.SphereGeometry(1.02, 64, 64);
                
                // 创建云层材质
                const cloudMaterial = new THREE.MeshPhongMaterial({
                    map: textureLoader.load(
                        'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
                        texture => {
                            // 创建云层
                            const clouds = new THREE.Mesh(cloudGeometry, new THREE.MeshPhongMaterial({
                                map: texture,
                                transparent: true,
                                opacity: 0.3
                            }));
                            scene.add(clouds);
                            
                            // 记录云层创建
                            createMemory("云层创建", "用户成功添加了云层效果到地球模拟中。");
                        },
                        undefined,
                        error => {
                            console.error("云层纹理加载失败:", error);
                            
                            // 备选方案：使用半透明球体
                            const cloudFallback = new THREE.Mesh(
                                new THREE.SphereGeometry(1.02, 32, 32),
                                new THREE.MeshPhongMaterial({
                                    color: 0xffffff,
                                    transparent: true,
                                    opacity: 0.3
                                })
                            );
                            scene.add(cloudFallback);
                        }
                    );
                });
                
            } catch(error) {
                console.error("创建云层失败:", error);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // 地球自转
            if (earth) {
                earth.rotation.y += 0.0005;
            }
            
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            try {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            } catch(error) {
                console.error("窗口大小变化处理失败:", error);
            }
        }
        
        function updateLoadingProgress() {
            resourcesLoaded++;
            const progress = Math.floor((resourcesLoaded / resourcesToLoad) * 100);
            document.getElementById('loadingProgress').textContent = `${resourcesLoaded}/${resourcesToLoad}`;
            
            if (resourcesLoaded >= resourcesToLoad) {
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function showError(message) {
            try {
                const errorDiv = document.createElement('div');
                errorDiv.style.position = 'fixed';
                errorDiv.style.top = '50%';
                errorDiv.style.left = '50%';
                errorDiv.style.transform = 'translate(-50%, -50%)';
                errorDiv.style.color = 'white';
                errorDiv.style.backgroundColor = 'rgba(0,0,0,0.7)';
                errorDiv.style.padding = '20px';
                errorDiv.style.borderRadius = '10px';
                errorDiv.style.zIndex = '1000';
                errorDiv.style.fontSize = '24px';
                errorDiv.style.fontWeight = 'bold';
                errorDiv.className = 'error';
                errorDiv.textContent = message;
                
                document.body.appendChild(errorDiv);
                
                // 5秒后自动关闭错误提示
                setTimeout(() => {
                    if (errorDiv.parentNode) {
                        errorDiv.parentNode.removeChild(errorDiv);
                    }
                }, 5000);
                
            } catch(error) {
                console.error("显示错误信息失败:", error);
            }
        }
        
        // 开始加载
        document.getElementById('loading').style.display = 'block';
        // 直接初始化
        setTimeout(init, 1000);
    </script>
</body>
</html>
