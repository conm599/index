<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muse Pro - 最终滚动与背景图修复版</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: rgba(30, 30, 30, 0.6); 
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --player-height: 90px;
            --sidebar-width: 220px;
            --lyric-base-size: 22px;
            --glass-blur: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* 禁止 Body 滚动 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* 移除 body background-color，让 #global-bg 负责所有背景 */
            background-color: transparent; 
            color: var(--text-main);
        }

        /* === 滚动条样式（可选） === */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        /* === 全局背景层：z-index:-1 确保它在最底层 === */
        #global-bg {
            position: fixed; top: -20px; left: -20px; right: -20px; bottom: -20px; z-index: -1;
            background-position: center; background-size: cover; background-repeat: no-repeat;
            transition: filter 0.3s ease;
        }
        #global-bg.default-bg { background-image: linear-gradient(180deg, #1a1a1a 0%, #050505 100%); }

        /* === 布局框架 === */
        .app-layout { display: flex; height: 100%; position: relative; }

        /* === 侧边栏（保持深色不透明） === */
        .sidebar {
            position: fixed; left: -100%; top: 0; height: 100%; width: var(--sidebar-width); 
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
            padding: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 300;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .sidebar.active { left: 0; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            color: var(--text-sub); padding: 12px 16px; border-radius: 8px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn svg { width: 24px; height: 24px; }
        .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.1); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 299; }
        .sidebar-overlay.active { display: block; }

        /* === 主内容区 - FIX 1: 设置半透明背景，让背景图透出来 === */
        .main-content {
            flex: 1; height: 100%; 
            overflow-y: auto; /* 允许主页滚动 */
            padding: 20px 20px 120px; 
            position: relative;
            background-color: rgba(18, 18, 18, 0.85); /* FIX: 半透明深色背景，确保文字可读性 */
            backdrop-filter: blur(1px); /* 轻微模糊 */
        }
        
        /* === 通用组件 (图标尺寸确认) === */
        .mobile-menu-btn svg { width: 24px; height: 24px; }
        .btn-back-minimal svg { width: 24px; height: 24px; }
        .search-box svg { width: 18px; height: 18px; }
        .btn-control svg { width: 28px; height: 28px; } 
        .btn-play-mini svg { width: 24px; height: 24px; }
        
        /* ============================================================
           !!! 核心修复：全屏播放器滚动逻辑（PC与移动端分离） !!!
           ============================================================ */
        
        .full-player {
            position: fixed; inset: 0; 
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(40px);
            z-index: 200; 
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .full-player.active { transform: translateY(0); }
        
        /* 经典模式布局：非纯净模式 */
        .fp-content { 
            flex: 1; 
            overflow-y: auto; /* 允许垂直滚动 (主要滚动条) */
            -webkit-overflow-scrolling: touch;
            padding: 20px 60px 120px; 
        }
        
        .fp-right { flex: 1; display: flex; flex-direction: column; }
        
        /* 歌词容器 (PC 经典模式) - FIX 2: 移除固定高度和内部滚动，由 fp-content 统一滚动 */
        .lyrics-box { 
            height: auto; /* 允许歌词内容自由撑开高度 */
            overflow-y: hidden; /* 禁用内部滚动条 */
            padding: 20px 0; 
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            text-align: left; 
        }
        
        /* 仅在 PC 尺寸下启用双列 Flex 布局 */
        @media (min-width: 769px) {
            .fp-content {
                display: flex; 
                gap: 60px;
                align-items: flex-start; /* 确保内容从顶部开始排列 */
            }
            .fp-left { 
                flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
                padding-top: 20px; 
            }
        }
        
        /* --- 纯净模式（全屏歌词模式）：无论 PC 还是 Mobile 都必须是内部滚动 --- */
        .full-player.pure-mode .fp-content {
            display: flex; 
            flex-direction: column; 
            padding: 0;
            overflow: hidden; /* 纯净模式下 Content 不滚动 */
        }
        .full-player.pure-mode .fp-right {
            width: 100%; height: 100%; max-width: 800px; margin: 0 auto;
        }
        .full-player.pure-mode .lyrics-box {
            height: 100% !important; 
            max-height: none !important;
            overflow-y: auto !important; /* 强制开启内部滚动 */
            padding: 100px 20px 150px;
            text-align: center;
        }

        /* === 移动端适配：经典模式下的歌词容器需要固定高度来节省空间 === */
        @media (max-width: 768px) {
            .fp-content { 
                display: block; /* 移动端经典模式为单列 */
                padding: 60px 20px 120px; 
            }
            .fp-left { display: block; margin-bottom: 30px; padding-top: 0; }
            .fp-cover-art { width: 260px; height: 260px; margin: 0 auto 20px; display: block; }
            
            /* Mobile 经典模式下，歌词容器使用固定高度和内部滚动 */
            .lyrics-box { 
                height: 350px; 
                overflow-y: auto; /* 开启内部滚动 */
                margin-bottom: 30px; 
            } 
        }
    </style>
</head>
<body>

    <div id="global-bg" class="default-bg"></div>
    <div class="sidebar-overlay" onclick="ui.toggleSidebar()"></div>

    <div class="app-layout">
        <nav class="sidebar" id="sidebar">
            <div class="logo"><span style="color:var(--primary)">Muse</span> Pro</div>
            <div class="nav-btn active" onclick="window.router.home(); ui.toggleSidebar();"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> 推荐首页</div>
            <div class="nav-btn" onclick="window.router.quality(); ui.toggleSidebar();"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg> 音质</div>
            <div class="nav-btn" onclick="window.router.settings(); ui.toggleSidebar();"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.2-.15.25-.42.12-.64l-2-3.46c-.13-.22-.4-.3-.6-.17l-2.61 1.02c-.39-.37-.82-.71-1.27-.99L15 2h-4l-.27 2.06c-.45.28-.88.62-1.27.99L6.87 4.12c-.2-.13-.47-.05-.6.17l-2 3.46c-.13.22-.08.5.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.2.15-.25.42-.12.64l2 3.46c.13.22.4.3.6.17l2.61-1.02c.39.37.82.71 1.27.99L11 22h4l.27-2.06c.45-.28.88-.62 1.27-.99l2.61 1.02c.2.13.47.05.6-.17l2-3.46c.13-.22.08-.5-.12-.64l-2.11-1.65zm-7.43 3.52c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg> 设置</div>
        </nav>

        <main class="main-content" id="main-view"></main>
    </div>

    <div class="full-player" id="full-player">
        <div class="fp-header">
            <button class="btn-back-minimal" onclick="ui.togglePureMode()" title="切换纯净模式" style="margin-right:10px">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3V5h18v1zm-8 14h-2v-2h2v2zm2.18-7H3v-1h12.18l5.82-6v16l-5.82-9z"/></svg>
            </button>
            <a href="#" class="btn-back-minimal" id="fp-download-btn" target="_blank" download title="下载">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
            <button class="btn-back-minimal" onclick="window.ui.toggleFullPlayer(false)" title="关闭">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <div class="fp-content">
            <div class="fp-left">
                <img src="" class="fp-cover-art" id="fp-cover">
                <div class="fp-meta">
                    <div class="fp-title" id="fp-title"></div>
                    <div class="fp-artist" id="fp-artist"></div>
                </div>
            </div>
            <div class="fp-right">
                <div class="lyrics-box" id="lyrics-box"><div class="lyric-line">等待播放...</div></div>
                <div class="related-section" id="related-section">
                    <div style="color:#ccc; font-size:12px; margin-bottom:10px;">猜你喜欢</div>
                    <div class="related-grid" id="related-container"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-player" id="footer-player">
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="player-left">
            <img src="" class="circle-art" id="mini-cover" onclick="window.ui.toggleFullPlayer(true)">
            <div style="display:flex; flex-direction:column; justify-content:center;">
                <div style="color:white; font-size:14px; cursor:pointer;" id="mini-title" onclick="window.ui.toggleFullPlayer(true)"></div>
                <div style="color:#888; font-size:12px;" id="mini-artist"></div>
            </div>
        </div>
        <div class="player-center">
            <div class="controls">
                <button class="btn-control" onclick="window.player.prev()"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn-play-mini" onclick="window.player.toggle()">
                    <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-control" onclick="window.player.next()"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
        </div>
        <div style="width:30%;"></div>
    </footer>

    <div class="loader" id="loader"><div class="spinner"></div></div>
    <audio id="audio"></audio>

    <script>
        const API = 'https://163api.qijieya.cn';
        const state = { playlist: [], index: 0, playing: false, lyrics: [], userScroll: false, scrollTimer: null, history: [{type: 'home'}] };
        var userSettings = { bgUrl: '', bgBlur: 50, lyricSize: 22, showRelated: true, quality: 'standard' };

        function initSettings() {
            try { const s = localStorage.getItem('museProSettings'); if(s) userSettings = JSON.parse(s); } catch(e){}
            if(!userSettings.quality) userSettings.quality = 'standard';
            if(userSettings.showRelated === undefined) userSettings.showRelated = true;
            applySettings();
        }

        function applySettings() {
            const bg = document.getElementById('global-bg');
            const root = document.documentElement;
            if(userSettings.bgUrl) { bg.style.backgroundImage = `url('${userSettings.bgUrl}')`; bg.classList.remove('default-bg'); } 
            else { bg.style.backgroundImage = ''; bg.classList.add('default-bg'); }
            const blur = userSettings.bgBlur * 0.1;
            bg.style.filter = userSettings.bgBlur > 0 ? `blur(${blur}px)` : 'none';
            root.style.setProperty('--lyric-base-size', `${userSettings.lyricSize}px`);
            const rel = document.getElementById('related-section');
            if(rel) rel.style.display = userSettings.showRelated ? 'block' : 'none';
        }

        window.saveSet = function(k, v) { 
            userSettings[k] = v; applySettings(); 
            localStorage.setItem('museProSettings', JSON.stringify(userSettings)); 
        };

        var ui = {
            el: id => document.getElementById(id),
            loading(show) { this.el('loader').style.display = show ? 'flex' : 'none'; },
            toggleSidebar() {
                this.el('sidebar').classList.toggle('active');
                document.querySelector('.sidebar-overlay').classList.toggle('active');
            },
            setActiveNav(name) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                if (name === 'home') document.querySelectorAll('.nav-btn')[0]?.classList.add('active');
                if (name === 'quality') document.querySelectorAll('.nav-btn')[1]?.classList.add('active');
                if (name === 'settings') document.querySelectorAll('.nav-btn')[2]?.classList.add('active');
            },
            renderList(list, listName) {
                return list.map((s, i) => `
                    <div class="song-row" onclick="window.player.playList('${listName}', ${i})">
                        <div class="song-index">${i+1}</div>
                        <div class="song-info">
                            <img src="${s.al ? s.al.picUrl : (s.album ? s.album.picUrl : '')}?param=100y100" onerror="this.src='https://via.placeholder.com/100'">
                            <div><div style="font-weight:600; color:white;">${s.name}</div><div style="font-size:12px; color:#ccc;">${s.ar ? s.ar.map(a=>a.name).join('/') : (s.artists ? s.artists.map(a=>a.name).join('/') : '未知')}</div></div>
                        </div>
                        <div class="song-album-name">${s.al ? s.al.name : (s.album ? s.album.name : '')}</div>
                        <div class="song-duration">${window.player.fmtTime((s.dt||s.duration)/1000)}</div>
                    </div>
                `).join('');
            },
            renderHome() {
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="search-box"><svg width="18" height="18" fill="#ccc" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input type="text" placeholder="搜索..." onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)"></div><div style="width:24px"></div></div><div class="content-wrapper"><div class="section-title">🔥 热门推荐</div><div class="song-list" id="hot-list-container"></div></div>`;
                this.loadHot(); this.setActiveNav('home');
            },
            async loadHot() {
                this.loading(true); const res = await window.api.get('/playlist/detail?id=3778678'); this.loading(false);
                window.hotList = res.playlist.tracks.slice(0, 50);
                this.el('hot-list-container').innerHTML = this.renderList(window.hotList, 'hotList');
            },
            renderSearch(data, type, kw) {
                const tabs = `<div class="search-tabs"><div class="tab-item ${type==1?'active':''}" onclick="window.router.search('${kw}', 1)">单曲</div><div class="tab-item ${type==10?'active':''}" onclick="window.router.search('${kw}', 10)">专辑</div><div class="tab-item ${type==1000?'active':''}" onclick="window.router.search('${kw}', 1000)">歌单</div></div>`;
                let content = '';
                if(type==1 && data.result.songs) { window.searchList = data.result.songs; content = `<div class="song-list">${this.renderList(window.searchList, 'searchList')}</div>`; }
                else if (type==10 && data.result.albums) { content = `<div class="related-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">` + data.result.albums.map(a => `<div class="related-card" onclick="window.router.loadAlbum(${a.id})"><img src="${a.picUrl}?param=300y300"><div class="related-title" style="font-size:14px; margin-top:5px;">${a.name}</div></div>`).join('') + `</div>`; }
                else if (type==1000 && data.result.playlists) { content = `<div class="related-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">` + data.result.playlists.map(p => `<div class="related-card" onclick="window.router.loadPlaylist(${p.id})"><img src="${p.coverImgUrl}?param=300y300"><div class="related-title" style="font-size:14px; margin-top:5px;">${p.name}</div></div>`).join('') + `</div>`; }
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="search-box"><input type="text" value="${kw}" onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)"></div><button class="btn-back-minimal" onclick="window.router.goBack()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div><div class="content-wrapper">${tabs}${content}</div>`;
            },
            renderAlbumDetail(data) {
                const album = data.album; window.albumList = data.songs.map(s => { if(!s.al) s.al = {}; if(!s.al.picUrl) s.al.picUrl = album.picUrl; return s; });
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div style="flex:1"></div><button class="btn-back-minimal" onclick="window.router.goBack()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div><div class="content-wrapper"><div class="album-header"><img src="${album.picUrl}?param=500y500" class="album-cover"><div class="album-info"><div class="album-title">${album.name}</div><div style="color:#ccc; margin-bottom:10px;">${album.artist.name}</div><button class="play-all-btn" onclick="window.player.playList('albumList', 0)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放全部</button></div></div><div class="song-list">${this.renderList(window.albumList, 'albumList')}</div></div>`;
            },
            renderPlaylistDetail(data) {
                const pl = data.playlist; window.plList = pl.tracks;
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div style="flex:1"></div><button class="btn-back-minimal" onclick="window.router.goBack()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div><div class="content-wrapper"><div class="album-header"><img src="${pl.coverImgUrl}?param=500y500" class="album-cover"><div class="album-info"><div class="album-title">${pl.name}</div><button class="play-all-btn" onclick="window.player.playList('plList', 0)"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放全部</button></div></div><div class="song-list">${this.renderList(window.plList, 'plList')}</div></div>`;
            },
            renderSettings() {
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><h2 style="font-weight:700">设置</h2><button class="btn-back-minimal" onclick="window.router.home()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div><div class="content-wrapper" style="padding:20px 0"><div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:16px; margin-bottom:20px;"><h3 style="margin-bottom:15px; color:var(--primary)">个性化</h3><div style="margin-bottom:20px"><label style="display:block; margin-bottom:10px; font-weight:600">背景模糊度: <span id="blur-val">${userSettings.bgBlur}%</span></label><input type="range" min="0" max="100" value="${userSettings.bgBlur}" oninput="this.nextElementSibling.innerText=this.value+'%'; saveSet('bgBlur', parseInt(this.value))" style="width:100%"></div><div style="margin-bottom:20px"><label style="display:block; margin-bottom:10px; font-weight:600">上传背景图</label><input type="file" accept="image/*" onchange="ui.handleBg(this)" style="color:white"></div></div><div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:16px;"><h3 style="margin-bottom:15px; color:var(--primary)">播放器</h3><div style="margin-bottom:20px"><label style="display:block; margin-bottom:10px; font-weight:600">歌词大小: <span id="size-val">${userSettings.lyricSize}px</span></label><input type="range" min="16" max="36" value="${userSettings.lyricSize}" oninput="this.nextElementSibling.innerText=this.value+'px'; saveSet('lyricSize', parseInt(this.value))" style="width:100%"></div><div style="display: flex; justify-content: space-between; align-items: center;"><label style="font-weight: 600;">显示相似推荐</label><input type="checkbox" ${userSettings.showRelated ? 'checked' : ''} onchange="saveSet('showRelated', this.checked)" style="width: 20px; height: 20px;"></div></div></div>`;
                this.setActiveNav('settings');
            },
            renderQuality() {
                const q = userSettings.quality;
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><h2 style="font-weight:700">音质选择</h2><button class="btn-back-minimal" onclick="window.router.home()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div><div class="content-wrapper" style="padding:20px 0"><div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:16px;"><div class="song-row" onclick="saveSet('quality', 'standard'); ui.renderQuality();" style="background:${q=='standard'?'rgba(29,185,84,0.2)':'transparent'}"><div style="font-weight:600">标准音质 (128k)</div><div>${q=='standard'?'✅':''}</div></div><div class="song-row" onclick="saveSet('quality', 'exhigh'); ui.renderQuality();" style="background:${q=='exhigh'?'rgba(29,185,84,0.2)':'transparent'}"><div style="font-weight:600">极高音质 (320k)</div><div>${q=='exhigh'?'✅':''}</div></div><div class="song-row" onclick="saveSet('quality', 'lossless'); ui.renderQuality();" style="background:${q=='lossless'?'rgba(29,185,84,0.2)':'transparent'}"><div style="font-weight:600">无损音质 (FLAC)</div><div>${q=='lossless'?'✅':''}</div></div><div style="margin-top:20px; color:#888; font-size:12px;">* 部分高音质需要VIP账号Cookie支持，否则自动降级。</div></div></div>`;
                this.setActiveNav('quality');
            },
            handleBg(input) {
                if(input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = e => { userSettings.bgUrl = e.target.result; saveSet('bgUrl', e.target.result); };
                    reader.readAsDataURL(input.files[0]);
                }
            },
            toggleFullPlayer(show) {
                const fp = this.el('full-player');
                if(show) { fp.classList.add('active'); } else { fp.classList.remove('active'); }
                if(!show) fp.classList.remove('pure-mode');
                const rel = document.getElementById('related-section');
                if(rel) rel.style.display = userSettings.showRelated ? 'block' : 'none';
            },
            togglePureMode() { this.el('full-player').classList.toggle('pure-mode'); }
        };

        window.api = {
            get: async u => (await fetch(API+u)).json(),
            search: (kw, type) => window.api.get(`/cloudsearch?keywords=${kw}&type=${type}`),
            url: id => { const l = userSettings.quality||'standard'; return window.api.get(`/song/url/v1?id=${id}&level=${l}`); },
            album: id => window.api.get(`/album?id=${id}`),
            playlist: id => window.api.get(`/playlist/detail?id=${id}`),
            lyric: id => window.api.get(`/lyric?id=${id}`),
            simi: id => window.api.get(`/simi/song?id=${id}`)
        };

        window.player = {
            audio: document.getElementById('audio'),
            init() {
                this.audio.addEventListener('timeupdate', () => {
                    const cur = this.audio.currentTime;
                    ui.el('progress-fill').style.width = (cur / this.audio.duration * 100) + '%';
                    this.syncLyrics(cur);
                });
                this.audio.addEventListener('ended', () => this.next());
                ui.el('progress-bar').addEventListener('click', e => {
                    const pct = e.offsetX / e.target.offsetWidth;
                    this.audio.currentTime = pct * this.audio.duration;
                });
                // 歌词滚动监听器
                ui.el('lyrics-box').addEventListener('scroll', () => {
                    // 仅在歌词盒内部有滚动条（即纯净模式或移动端经典模式）时才记录用户滚动
                    if (ui.el('lyrics-box').style.overflowY === 'auto' || ui.el('lyrics-box').style.overflowY === 'scroll') {
                        state.userScroll = true;
                        clearTimeout(state.scrollTimer);
                        state.scrollTimer = setTimeout(() => state.userScroll = false, 4000);
                    }
                });
                // 全屏播放器滚动监听器 (用于PC经典模式)
                ui.el('full-player').querySelector('.fp-content').addEventListener('scroll', () => {
                    // 仅在 fp-content 有滚动条时（PC经典模式）才记录用户滚动
                    if (window.innerWidth > 768) {
                        state.userScroll = true;
                        clearTimeout(state.scrollTimer);
                        state.scrollTimer = setTimeout(() => state.userScroll = false, 4000);
                    }
                });

            },
            async playList(listName, index) {
                const list = window[listName];
                if(!list) return;
                state.playlist = list.map(s => ({
                    id: s.id, name: s.name, 
                    artist: s.ar ? s.ar.map(a=>a.name).join('/') : (s.artists ? s.artists.map(a=>a.name).join('/') : '未知'),
                    cover: s.al && s.al.picUrl ? s.al.picUrl : (s.album && s.album.picUrl ? s.album.picUrl : 'https://via.placeholder.com/300'),
                    dt: s.dt || s.duration
                }));
                state.index = index;
                this.loadSong();
                ui.el('footer-player').classList.add('visible');
            },
            async loadSong() {
                const song = state.playlist[state.index];
                ui.loading(true);
                const set = (id, t) => { if(ui.el(id)) ui.el(id).innerText = t; };
                const setImg = (id, s) => { if(ui.el(id)) ui.el(id).src = s; };
                set('mini-title', song.name); set('mini-artist', song.artist); setImg('mini-cover', song.cover);
                set('fp-title', song.name); set('fp-artist', song.artist); setImg('fp-cover', song.cover);
                try {
                    const res = await window.api.url(song.id);
                    const url = res.data[0].url;
                    if (url) {
                        this.audio.src = url; this.audio.play(); state.playing = true; this.updateBtn();
                        ui.el('fp-download-btn').href = url;
                        this.loadLyrics(song.id); this.loadSimi(song.id);
                    } else { alert('VIP/无版权'); }
                } catch(e){}
                ui.loading(false);
            },
            async loadLyrics(id) {
                const res = await window.api.lyric(id);
                state.lyrics = [];
                const box = ui.el('lyrics-box');
                if(res.lrc) {
                    state.lyrics = res.lrc.lyric.split('\n').map(l => {
                        const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/.exec(l);
                        return m ? { t: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/1000, txt: m[4] } : null;
                    }).filter(x=>x);
                    box.innerHTML = state.lyrics.map((l,i) => `<div class="lyric-line" id="l-${i}" onclick="window.player.seek(${l.t})">${l.txt}</div>`).join('');
                } else { box.innerHTML = '<div class="lyric-line">纯音乐 / 无歌词</div>'; }
            },
            async loadSimi(id) {
                ui.el('related-container').innerHTML = '';
                if(!userSettings.showRelated) return;
                const res = await window.api.simi(id);
                if(res.songs) {
                    window.simiList = res.songs;
                    ui.el('related-container').innerHTML = res.songs.slice(0,6).map((s,i) => `<div class="related-card" onclick="window.player.playList('simiList', ${i})"><img src="${s.album.picUrl}?param=100y100"><div class="related-title">${s.name}</div></div>`).join('');
                }
            },
            syncLyrics(t) {
                if(state.lyrics.length === 0) return;
                let idx = state.lyrics.findIndex(l => l.t > t) - 1;
                if(idx < 0) idx = 0;
                document.querySelector('.lyric-line.active')?.classList.remove('active');
                const line = ui.el('l-'+idx);
                
                if(line) { 
                    line.classList.add('active'); 
                    if(!state.userScroll) {
                        // 逻辑：如果当前是 PC 经典模式 (fp-content 滚动)，则滚动 fp-content。否则滚动 lyrics-box。
                        const scrollContainer = (window.innerWidth > 768 && !document.getElementById('full-player').classList.contains('pure-mode')) 
                            ? ui.el('full-player').querySelector('.fp-content') 
                            : ui.el('lyrics-box');

                        // 确保 scrollContainer 存在
                        if (scrollContainer) {
                            // 计算需要滚动到的位置，以使歌词居中
                            const lineRect = line.getBoundingClientRect();
                            const containerRect = scrollContainer.getBoundingClientRect();
                            
                            if (scrollContainer === ui.el('lyrics-box')) {
                                // lyrics-box 滚动逻辑（移动端/纯净模式）
                                scrollContainer.scrollTop = line.offsetTop - (containerRect.height / 2) + (lineRect.height / 2);
                            } else {
                                // fp-content 滚动逻辑（PC经典模式）
                                // 计算行到容器顶部的相对位置
                                const relativeTop = line.offsetTop - scrollContainer.scrollTop;
                                // 需要滚动量 = 相对顶部位置 - 容器高度的一半 + 行高度的一半
                                const scrollTo = scrollContainer.scrollTop + relativeTop - (containerRect.height / 2) + (lineRect.height / 2);
                                scrollContainer.scrollTo({top: scrollTo, behavior: 'smooth'});
                            }
                        }
                    }
                }
            },
            toggle() { if(this.audio.paused){this.audio.play();state.playing=true;}else{this.audio.pause();state.playing=false;} this.updateBtn(); },
            updateBtn() {
                const play = ui.el('icon-play'); const pause = ui.el('icon-pause'); const mini = ui.el('mini-cover');
                if(play) play.style.display = state.playing ? 'none' : 'block';
                if(pause) pause.style.display = state.playing ? 'block' : 'none';
                if(mini) state.playing ? mini.classList.add('spinning') : mini.classList.remove('spinning');
            },
            prev() { if(state.playlist.length) { state.index=(state.index-1+state.playlist.length)%state.playlist.length; this.loadSong(); } },
            next() { if(state.playlist.length) { state.index=(state.index+1)%state.playlist.length; this.loadSong(); } },
            seek(t) { this.audio.currentTime = t; state.userScroll = false; },
            fmtTime: s => { const m=Math.floor(s/60), ss=Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; }
        };

        window.router = {
            home: () => { state.history.push({type:'home'}); ui.renderHome(); },
            settings: () => { state.history.push({type:'settings'}); ui.renderSettings(); },
            quality: () => { state.history.push({type:'quality'}); ui.renderQuality(); },
            search: async (kw, type) => {
                if(!kw) return; ui.loading(true);
                const res = await window.api.search(kw, type); ui.loading(false);
                state.history.push({type:'search', data:{res, type, kw}});
                ui.renderSearch(res, type, kw);
            },
            loadAlbum: async (id) => {
                ui.loading(true); const res = await window.api.album(id); ui.loading(false);
                state.history.push({type:'album', data:res}); ui.renderAlbumDetail(res);
            },
            loadPlaylist: async (id) => {
                ui.loading(true); const res = await window.api.playlist(id); ui.loading(false);
                state.history.push({type:'playlist', data:res}); ui.renderPlaylistDetail(res);
            },
            goBack: () => {
                state.history.pop();
                const last = state.history[state.history.length-1];
                if(!last) return window.router.home();
                if(last.type==='home') ui.renderHome();
                if(last.type==='settings') ui.renderSettings();
                if(last.type==='quality') ui.renderQuality();
                if(last.type==='search') ui.renderSearch(last.data.res, last.data.type, last.data.kw);
                if(last.type==='album') ui.renderAlbumDetail(last.data);
                if(last.type==='playlist') ui.renderPlaylistDetail(last.data);
            }
        };

        window.ui = ui; window.router = router; window.player = player;
        initSettings(); window.router.home(); window.player.init();
    </script>
</body>
</html>
