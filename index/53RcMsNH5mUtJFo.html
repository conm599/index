<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逼真3D地球模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            text-align: center;
            padding: 20px;
            background-color: rgba(0, 0, 30, 0.7);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 150, 255, 0.7);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        .container {
            display: flex;
            flex: 1;
            position: relative;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
        }
        
        #info-panel {
            width: 350px;
            background: rgba(10, 20, 50, 0.85);
            padding: 20px;
            border-left: 1px solid rgba(0, 150, 255, 0.3);
            overflow-y: auto;
            box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
        }
        
        .panel-title {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #4fc3f7;
            border-bottom: 1px solid rgba(79, 195, 247, 0.3);
            padding-bottom: 8px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .stat-box {
            background: rgba(15, 30, 70, 0.6);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(79, 195, 247, 0.2);
            transition: all 0.3s ease;
        }
        
        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4fc3f7;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .controls {
            margin-top: 15px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .slider-label {
            width: 100px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .slider {
            flex: 1;
            height: 6px;
            background: rgba(79, 195, 247, 0.2);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4fc3f7;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
        
        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #29b6f6;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        button {
            flex: 1;
            padding: 10px;
            background: rgba(79, 195, 247, 0.2);
            border: 1px solid rgba(79, 195, 247, 0.4);
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        button:hover {
            background: rgba(79, 195, 247, 0.4);
            box-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4fc3f7;
            font-size: 1.2rem;
            text-align: center;
        }
        
        .loading span {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #4fc3f7;
            margin: 0 4px;
            animation: bounce 2s infinite;
        }
        
        .loading span:nth-child(1) { animation-delay: 0.2s; }
        .loading span:nth-child(2) { animation-delay: 0.4s; }
        .loading span:nth-child(3) { animation-delay: 0.6s; }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            margin-top: 15px;
            padding: 10px;
            background: rgba(15, 30, 70, 0.6);
            border-radius: 8px;
        }
        
        .toggle-label {
            width: 120px;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(79, 195, 247, 0.3);
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider-toggle {
            background-color: rgba(79, 195, 247, 0.7);
        }
        
        input:checked + .slider-toggle:before {
            transform: translateX(26px);
        }
        
        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            opacity: 0.7;
            background-color: rgba(0, 0, 30, 0.7);
        }
        
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            #info-panel {
                width: 100%;
                height: 40%;
                border-left: none;
                border-top: 1px solid rgba(79, 195, 247, 0.3);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>逼真3D地球模拟器</h1>
        <p class="subtitle">基于真实地球纹理和物理光照模型的3D渲染</p>
    </header>
    
    <div class="container">
        <div id="canvas-container">
            <div class="loading">
                加载中 <span></span> <span></span> <span></span>
            </div>
        </div>
        
        <div id="info-panel">
            <h2 class="panel-title">地球信息</h2>
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-value" id="rotation-speed">360°</div>
                    <div class="stat-label">自转速度</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="day-night">50%</div>
                    <div class="stat-label">昼夜比例</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="atmosphere-density">75%</div>
                    <div class="stat-label">大气密度</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="cloud-opacity">60%</div>
                    <div class="stat-label">云层密度</div>
                </div>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <div class="slider-container">
                        <span class="slider-label">地球旋转速度</span>
                        <input type="range" min="0" max="100" value="50" class="slider" id="rotation-slider">
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="slider-container">
                        <span class="slider-label">大气层透明度</span>
                        <input type="range" min="0" max="100" value="75" class="slider" id="atmosphere-slider">
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="slider-container">
                        <span class="slider-label">云层密度</span>
                        <input type="range" min="0" max="100" value="60" class="slider" id="cloud-slider">
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="toggle-atmosphere">大气层: 启用</button>
                    <button id="toggle-clouds">云层: 启用</button>
                </div>
                
                <div class="toggle-container">
                    <span class="toggle-label">使用法线贴图</span>
                    <label class="switch">
                        <input type="checkbox" id="normal-maps" checked>
                        <span class="slider-toggle"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        使用 Three.js 构建 | 逼真地球模拟器 | 所有数据仅供参考
    </footer>
    
    <!-- 引入Three.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // 主脚本
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化变量
            let scene, camera, renderer, earth, atmosphere, clouds;
            let rotationSpeed = 0.005;
            let isAtmosphereEnabled = true;
            let isCloudsEnabled = true;
            let isNormalMapsEnabled = true;
            let dayNightRatio = 0.5;
            let atmosphereDensity = 0.75;
            let cloudOpacity = 0.6;
            
            // 纹理路径
            const texturePaths = {
                earthColor: 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
                earthNormal: 'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
                earthSpecular: 'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
                earthBump: 'https://threejs.org/examples/textures/planets/earth_bump_2048.jpg',
                cloudColor: 'https://threejs.org/examples/textures/planets/cloud_color_1024.png',
                cloudOpacityMap: 'https://threejs.org/examples/textures/planets/cloud_opacity_1024.png',
                atmosphereTexture: 'https://threejs.org/examples/textures/planets/atmosphere_2048.png'
            };
            
            // 初始化场景
            function init() {
                // 创建场景
                scene = new THREE.Scene();
                
                // 创建相机
                camera = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 350), 0.1, 1000);
                camera.position.z = 5;
                
                // 创建渲染器
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth - 350, window.innerHeight - 200);
                renderer.setClearColor(0x000000, 0);
                document.getElementById('canvas-container').appendChild(renderer.domElement);
                
                // 添加环境光
                const ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);
                
                // 添加方向光（模拟太阳）
                const sunLight = new THREE.DirectionalLight(0xffffff, 1);
                sunLight.position.set(5, 3, 5);
                scene.add(sunLight);
                
                // 创建地球
                createEarth();
                
                // 创建大气层
                createAtmosphere();
                
                // 创建云层
                createClouds();
                
                // 添加轨道控制器
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                
                // 添加窗口大小调整事件监听
                window.addEventListener('resize', onWindowResize);
                
                // 开始动画循环
                animate();
            }
            
            // 创建地球
            function createEarth() {
                // 创建地球组
                earth = new THREE.Group();
                
                // 加载地球纹理
                const textureLoader = new THREE.TextureLoader();
                
                // 地球颜色贴图
                const earthColorTexture = textureLoader.load(texturePaths.earthColor, function() {
                    document.querySelector('.loading').style.display = 'none';
                });
                
                // 法线贴图
                const earthNormalTexture = textureLoader.load(texturePaths.earthNormal);
                
                // 高光贴图
                const earthSpecularTexture = textureLoader.load(texturePaths.earthSpecular);
                
                // 高度贴图
                const earthBumpTexture = textureLoader.load(texturePaths.earthBump);
                
                // 创建地球几何体
                const geometry = new THREE.SphereGeometry(1, 64, 64);
                
                // 创建地球材质
                const earthMaterial = new THREE.MeshPhongMaterial({
                    map: earthColorTexture,
                    normalMap: isNormalMapsEnabled ? earthNormalTexture : null,
                    normalScale: new THREE.Vector2(1, 1),
                    specularMap: earthSpecularTexture,
                    specular: new THREE.Color(0x333333),
                    shininess: 5,
                    bumpMap: earthBumpTexture,
                    bumpScale: 0.05
                });
                
                // 创建地球网格
                const earthMesh = new THREE.Mesh(geometry, earthMaterial);
                earth.add(earthMesh);
                
                // 添加到场景
                scene.add(earth);
                
                // 初始旋转角度
                earth.rotation.y = Math.PI;
            }
            
            // 创建大气层
            function createAtmosphere() {
                const geometry = new THREE.SphereGeometry(1.01, 64, 64);
                
                // 创建大气层材质
                const atmosphereMaterial = new THREE.MeshPhongMaterial({
                    transparent: true,
                    opacity: atmosphereDensity,
                    color: 0x0077ff,
                    side: THREE.BackSide
                });
                
                atmosphere = new THREE.Mesh(geometry, atmosphereMaterial);
                scene.add(atmosphere);
            }
            
            // 创建云层
            function createClouds() {
                const geometry = new THREE.SphereGeometry(1.005, 64, 64);
                
                // 创建云层材质
                const cloudMaterial = new THREE.MeshPhongMaterial({
                    map: textureLoader.load(texturePaths.cloudColor),
                    opacity: cloudOpacity,
                    transparent: true,
                    side: THREE.BackSide
                });
                
                clouds = new THREE.Mesh(geometry, cloudMaterial);
                scene.add(clouds);
            }
            
            // 窗口大小调整
            function onWindowResize() {
                camera.aspect = (window.innerWidth - 350) / (window.innerHeight - 200);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth - 350, window.innerHeight - 200);
            }
            
            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                
                // 地球旋转
                earth.rotation.y += rotationSpeed;
                
                // 更新云层旋转速度比地球略快
                clouds.rotation.y += rotationSpeed * 1.01;
                
                // 更新大气层旋转速度比地球略慢
                atmosphere.rotation.y += rotationSpeed * 0.95;
                
                // 渲染场景
                renderer.render(scene, camera);
            }
            
            // 事件监听器
            document.getElementById('rotation-slider').addEventListener('input', function(e) {
                rotationSpeed = e.target.value * 0.001;
                document.getElementById('rotation-speed').textContent = (rotationSpeed * 1000).toFixed(1) + '°';
            });
            
            document.getElementById('atmosphere-slider').addEventListener('input', function(e) {
                atmosphereDensity = e.target.value / 100;
                atmosphere.material.opacity = atmosphereDensity;
                document.getElementById('atmosphere-density').textContent = (atmosphereDensity * 100).toFixed(0) + '%';
            });
            
            document.getElementById('cloud-slider').addEventListener('input', function(e) {
                cloudOpacity = e.target.value / 100;
                clouds.material.opacity = cloudOpacity;
                document.getElementById('cloud-opacity').textContent = (cloudOpacity * 100).toFixed(0) + '%';
            });
            
            document.getElementById('toggle-atmosphere').addEventListener('click', function() {
                isAtmosphereEnabled = !isAtmosphereEnabled;
                atmosphere.visible = isAtmosphereEnabled;
                this.textContent = isAtmosphereEnabled ? '大气层: 启用' : '大气层: 禁用';
            });
            
            document.getElementById('toggle-clouds').addEventListener('click', function() {
                isCloudsEnabled = !isCloudsEnabled;
                clouds.visible = isCloudsEnabled;
                this.textContent = isCloudsEnabled ? '云层: 启用' : '云层: 禁用';
            });
            
            document.getElementById('normal-maps').addEventListener('change', function() {
                isNormalMapsEnabled = this.checked;
                if (earth && earth.children && earth.children[0]) {
                    earth.children[0].material.normalMap = isNormalMapsEnabled ? texturePaths.earthNormal : null;
                    earth.children[0].material.needsUpdate = true;
                }
            });
            
            // 启动应用
            init();
        });
    </script>
</body>
</html>
