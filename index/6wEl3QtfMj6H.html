<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musp Pro</title>
    <link rel="icon" type="image/png" href="ico.png" sizes="32x32">
    <link rel="shortcut icon" type="image/png" href="ico.png" sizes="32x32">
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: rgba(30, 30, 30, 0.6); 
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --player-height: 90px;
            --sidebar-width: 220px;
            --lyric-base-size: 22px;
            --glass-blur: 10px;
        }

        /* 开关样式 */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* === 布局框架 === */
        .app-layout { display: flex; flex: 1; height: calc(100vh - var(--player-height)); overflow: hidden; position: relative; }

        /* === 侧边栏 (全平台统一折叠逻辑) === */
        .sidebar {
            position: fixed; 
            left: -100%; /* 默认隐藏 */
            top: 0; 
            height: 100%; 
            width: var(--sidebar-width); 
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            padding: 24px;
            display: flex; flex-direction: column; gap: 10px; z-index: 300; /* 层级最高 */
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .sidebar.active { left: 0; } /* 激活时滑出 */
        
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            color: var(--text-sub); padding: 12px 16px; border-radius: 8px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.1); }
        
        /* 遮罩层 */
        .sidebar-overlay { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.6); z-index: 299; 
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        /* === 主内容区 === */
        .main-content {
            flex: 1; width: 100%;
            background-repeat: no-repeat; background-size: cover; background-position: center center;
            overflow-y: auto; padding: 20px 20px 120px; position: relative;
        }
        .main-content.default-bg {
             filter: brightness(0.4) contrast(1.2);
        }
        .content-wrapper { position: relative; z-index: 5; }

        /* === 顶部栏 (统一显示汉堡菜单) === */
        .top-bar {
            position: sticky; top: 0; background: transparent; 
            padding: 10px 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 15px;
        }
        
        .mobile-menu-btn { 
            display: block; /* 全平台显示 */
            background: none; border: none; color: white; cursor: pointer; 
            padding: 8px; border-radius: 50%;
        }
        .mobile-menu-btn:hover { background: rgba(255,255,255,0.1); }
        
        .btn-back-minimal {
            background: transparent; border: none; color: rgba(255,255,255,0.7); 
            cursor: pointer; padding: 10px; border-radius: 50%; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .btn-back-minimal:hover { color: white; background: rgba(255,255,255,0.1); transform: scale(1.1); }
        .btn-back-minimal svg { width: 24px; height: 24px; }

        /* === 搜索框 === */
        .search-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 8px 20px;
            display: flex; align-items: center; width: 100%; max-width: 400px; transition: 0.3s;
        }
        .search-box input { background: transparent; border: none; color: white; margin-left: 10px; width: 100%; font-size: 14px; }

        /* === 列表样式 === */
        .section-title { font-size: 24px; font-weight: 700; margin: 20px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        .song-list { display: flex; flex-direction: column; }
        .song-row {
            display: grid; grid-template-columns: 40px 4fr 2fr 1fr; padding: 12px 10px;
            align-items: center; cursor: pointer; border-radius: 8px;
            background: transparent; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .song-row:hover { background: rgba(255, 255, 255, 0.1); }
        .song-index { color: #666; font-size: 14px; text-align: center; font-weight: 500; }
        .song-info { display: flex; align-items: center; gap: 15px; color: white; }
        .song-info img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
        .song-album-name { color: var(--text-sub); font-size: 13px; }
        .song-duration { color: var(--text-sub); font-size: 13px; }

        .search-tabs { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 10px; overflow-x: auto; }
        .tab-item {
            padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap;
            color: var(--text-sub); cursor: pointer; background: rgba(255,255,255,0.1);
        }
        .tab-item.active { background: var(--primary); color: black; }

        /* 专辑详情头 */
        .album-header {
            display: flex; gap: 30px; margin-bottom: 20px; padding: 25px; 
            background: rgba(255, 255, 255, 0.05); border-radius: 16px;
            backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .album-cover { width: 180px; height: 180px; border-radius: 10px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .album-info { display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 200px; text-align: left; }
        .album-title { font-size: 28px; font-weight: 800; margin-bottom: 10px; line-height: 1.2; }
        .play-all-btn {
            background: var(--primary); color: black; border: none; border-radius: 50px;
            padding: 10px 28px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; gap: 8px; width: fit-content; margin-top: 15px;
        }

        /* === 全屏播放器 (关键修复区域) === */
        .full-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            /* 关键修改1: 默认保留毛玻璃，但通过 JS 动态控制类名来移除 */
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 200;
            
            /* 关键修改2: 使用 translate3d 强制开启 GPU 加速，替代原来的 translateY */
            transform: translate3d(0, 100%, 0);
            
            /* 关键修改3: 告诉浏览器这个元素即将发生变化，提前准备显存 */
            will-change: transform, backdrop-filter;
            
            /* 关键修改4: 稍微加快动画时间 (0.4s -> 0.35s) 并优化贝塞尔曲线，使其更跟手 */
            transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1);
            
            display: flex; flex-direction: column;
            overflow: hidden;
            
            /* 关键修改5: CSS层面的渲染优化，限制重绘区域 */
            contain: strict;
        }
        
        /* 动画中的状态类 - 只优化阴影和其他计算密集型效果，保留毛玻璃 */
        .full-player.animating {
            box-shadow: none !important; /* 只移除阴影计算，保留毛玻璃效果 */
            /* 不再移除 backdrop-filter，保持毛玻璃效果 */
            /* 不再修改 background，使用默认的半透明背景 */
        }
        
        /* 用户禁用毛玻璃效果时的类 */
        .full-player.no-glass {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            background: rgba(15, 15, 15, 0.98); /* 禁用毛玻璃时使用不透明背景色 */
        }
        
        /* 封面图片优化样式 */
        .fp-cover-art {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            border-radius: 16px;
            
            /* 优化: 只有在静态时才显示大阴影 */
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            
            margin-bottom: 30px;
            object-fit: cover;
            
            /* 优化: 图片本身的渲染优化 */
            transform: translateZ(0);
            backface-visibility: hidden;
        }
        
        /* 动画过程中，移除图片的阴影，极大提升 FPS */
        .full-player.animating .fp-cover-art {
            box-shadow: none !important;
        }
        
        .full-player.active {
            transform: translate3d(0, 0, 0);
        }
        
        .fp-header { 
            display: flex; justify-content: flex-end; align-items: center; gap: 20px; 
            padding: 20px 30px; 
            /* 设为sticky，滚动时吸顶 */
            position: sticky; top: 0; z-index: 20;
            /* 背景渐变防止文字重叠 */
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); 
        }
        
        .fp-content { 
            display: flex; flex: 1; padding: 20px 60px 60px; gap: 60px; 
            min-height: min-content; /* 允许内容撑开 */
            position: relative;
        }
        
        .fp-left { 
            flex: 0 0 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: opacity 0.4s;
            position: sticky;
            top: 20px;
            height: fit-content;
            align-self: flex-start;
        }
        
        /* 修复PC端横屏模式下歌词滚动问题 */
        @media (min-width: 769px) {
            .fp-right {
                height: calc(100vh - 120px); /* 限制右侧区域高度 */
                max-height: 800px; /* 最大高度限制 */
            }
        }
        .fp-cover-art { width: 100%; max-width: 400px; aspect-ratio: 1; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); margin-bottom: 30px; object-fit: cover; }
        .fp-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .fp-artist { font-size: 18px; color: var(--text-sub); text-align: center; }

        .fp-right { 
            flex: 1; display: flex; flex-direction: column; position: relative; 
            min-height: 400px; /* 保证歌词区有最小高度 */
            overflow: hidden; /* 改为hidden，让lyrics-box完全控制滚动 */
        }
        
        .lyrics-box { 
            flex: 1; overflow-y: auto; padding: 20px 0; 
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); 
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            text-align: left;
            min-height: 400px; /* 改为min-height以适应内容 */
            touch-action: pan-y;
            cursor: grab; /* 显示抓取指针，表明可滚动 */
        }
        
        .lyrics-box:active {
            cursor: grabbing; /* 拖动时显示抓取中指针 */
        }
        
        /* 歌词滚动区域内部滚动，与页面整体滚动不冲突 */
        .lyrics-box { 
            overscroll-behavior: contain; 
            -ms-overflow-style: none;  /* IE和Edge隐藏滚动条 */
            scrollbar-width: none;     /* Firefox隐藏滚动条 */
        }
        
        /* 隐藏Chrome、Safari等浏览器的滚动条 */
        .lyrics-box::-webkit-scrollbar {
            display: none;
        }

        .lyric-line { font-size: var(--lyric-base-size); font-weight: 700; color: rgba(255,255,255,0.3); margin: 26px 0; transition: 0.3s; cursor: pointer; }
        .lyric-line.active { font-size: calc(var(--lyric-base-size) + 6px); color: white; transform: scale(1.05); transform-origin: left; text-shadow: 0 0 20px rgba(255,255,255,0.4); }

        .related-section { 
            margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); 
            flex-shrink: 0; 
        }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .related-card { cursor: pointer; text-align: center; }
        .related-card img { width: 100%; border-radius: 6px; margin-bottom: 5px; opacity: 0.7; transition: 0.2s; }
        .related-card:hover img { opacity: 1; }
        .related-title { font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* === 纯净模式 (通过按钮触发) === */
        .full-player.pure-mode .fp-left { display: none; } 
        .full-player.pure-mode .related-section { display: none; }
        .full-player.pure-mode .fp-right { width: 100%; max-width: 800px; margin: 0 auto; height: 80vh; }
        .full-player.pure-mode .lyrics-box { 
            text-align: center; 
            height: 100%; /* 修复4: 强制占满高度 */
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
        }
        .full-player.pure-mode .lyric-line.active { transform-origin: center; transform: scale(1.2); }
        
        /* === 底部播放条 (10% 透明度) === */
        .footer-player {
            height: var(--player-height); 
            background: rgba(0, 0, 0, 0.1); /* 10% 不透明度 */
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-player.visible { transform: translateY(0); }
        
        .circle-art { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); animation: rotate 10s linear infinite; animation-play-state: paused; }
        .circle-art.spinning { animation-play-state: running; }
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }

        .btn-control { background: none; border: none; color: #b3b3b3; cursor: pointer; transition: 0.2s; }
        .btn-control:hover { color: white; }
        .btn-play-mini { width: 38px; height: 38px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; }
        /* 收藏按钮样式 */
        .btn-favorite { background: none; border: none; color: #b3b3b3; cursor: pointer; transition: 0.2s; }
        .btn-favorite:hover { color: white; }
        .btn-favorite.active { color: #ff4757; } /* 激活状态为红色 */
        
        /* 模态框样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(25, 25, 25, 0.95);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .playlist-modal h3 {
            color: white; margin: 0 0 20px 0; font-size: 20px;
        }
        .playlist-name-input {
            width: 100%; padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; color: white;
            font-size: 16px; margin-bottom: 20px;
            box-sizing: border-box;
        }
        .playlist-name-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .modal-actions {
            display: flex; gap: 12px; justify-content: flex-end;
        }
        .btn-primary, .btn-secondary {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 歌单网格样式 - 横排显示 */
        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .playlist-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }
        .playlist-card:hover {
            background: rgba(30, 30, 30, 0.8);
            transform: translateY(-5px);
        }
        .playlist-cover {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--primary);
        }
        .playlist-info {
            text-align: center;
        }
        .playlist-name {
            color: white;
            font-weight: 600;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .playlist-count {
            color: var(--text-sub);
            font-size: 12px;
        }
        .playlist-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            opacity: 1;
            /* 始终显示删除按钮，兼容移动设备 */
        }
        /* 保留过渡效果但移除hover条件，确保在移动设备上始终可见 */
        .btn-action {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            background: rgba(0, 0, 0, 0.7);
        }
        
        /* 空状态样式 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-sub);
            text-align: center;
        }
        .empty-state p {
            margin-top: 16px;
            font-size: 14px;
        }
        
        /* 按钮样式 */
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 歌单选择列表样式 */
        .playlist-select-list {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .playlist-select-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .playlist-select-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .playlist-select-item .playlist-name {
            color: white;
            font-size: 16px;
        }
        .playlist-select-item .playlist-count {
            color: #888;
            font-size: 12px;
            margin-top: 2px;
        }
        
        .progress-bar { width: 100%; height: 40px; background: transparent; position: absolute; top: 0; left: 0; cursor: pointer; }
        .progress-track { width: 100%; height: 3px; background: rgba(255,255,255,0.1); position: absolute; top: 18.5px; left: 0; }
        .progress-fill { height: 3px; background: var(--primary); width: 0%; position: absolute; top: 18.5px; left: 0; }
        .progress-thumb { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: var(--primary); border-radius: 50%; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        .progress-bar:hover .progress-thumb { opacity: 1; }
        .progress-fill:hover .progress-thumb { opacity: 1; }

        .loader { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }

        /* === 移动端适配 === */
        @media (max-width: 768px) {
            .song-row { grid-template-columns: 30px 1fr; }
            .song-row > div:nth-child(3), .song-row > div:nth-child(4) { display: none; }
            
            .album-header { flex-direction: column; text-align: center; padding: 20px; }
            .album-cover { width: 160px; height: 160px; margin: 0 auto; }
            .album-info { text-align: center; }
            .play-all-btn { margin: 15px auto 0; }
            
            /* 全屏页移动端布局 */
            .fp-content { flex-direction: column; padding: 60px 20px 40px; gap: 30px; }
            .fp-left { flex: 0 0 auto; }
            .fp-cover-art { width: 260px; margin-bottom: 20px; }
            .fp-right { height: auto; min-height: 0; }

    <script>
        const API = 'https://163api.qijieya.cn';
        const state = { 
            playlist: [], index: 0, playing: false, lyrics: [], 
            userScroll: false, scrollTimer: null, history: [{type: 'home'}]
        };

        // 图片缓存管理系统
        window.imageCacheManager = {
            // 最大缓存图片数量
            MAX_CACHE_SIZE: 200,
            
            // 初始化缓存管理器
            init: function() {
                if (!localStorage.getItem('musicPlayerImageCacheIndex')) {
                    localStorage.setItem('musicPlayerImageCacheIndex', JSON.stringify({}));
                }
                if (!localStorage.getItem('musicPlayerImageCacheOrder')) {
                    localStorage.setItem('musicPlayerImageCacheOrder', JSON.stringify([]));
                }
            },
            
            // 记录图片已缓存
            cacheImage: function(imageId, imageUrl) {
                try {
                    let cacheIndex = JSON.parse(localStorage.getItem('musicPlayerImageCacheIndex') || '{}');
                    let cacheOrder = JSON.parse(localStorage.getItem('musicPlayerImageCacheOrder') || '[]');
                    
                    // 如果缓存已满且不是更新现有项，删除最旧的缓存记录
                    if (!cacheIndex[imageId] && Object.keys(cacheIndex).length >= this.MAX_CACHE_SIZE) {
                        const oldestKey = cacheOrder.shift();
                        delete cacheIndex[oldestKey];
                    }
                    
                    // 更新缓存索引和访问顺序
                    cacheIndex[imageId] = {
                        url: imageUrl,
                        timestamp: Date.now()
                    };
                    this.updateOrder(imageId, cacheOrder);
                    
                    // 保存回localStorage
                    localStorage.setItem('musicPlayerImageCacheIndex', JSON.stringify(cacheIndex));
                    localStorage.setItem('musicPlayerImageCacheOrder', JSON.stringify(cacheOrder));
                } catch (e) {
                    console.error('图片缓存记录失败:', e);
                }
            },
            
            // 检查图片是否已缓存
            isImageCached: function(imageId) {
                try {
                    const cacheIndex = JSON.parse(localStorage.getItem('musicPlayerImageCacheIndex') || '{}');
                    const cacheOrder = JSON.parse(localStorage.getItem('musicPlayerImageCacheOrder') || '[]');
                    
                    if (cacheIndex[imageId]) {
                        // 更新使用顺序（LRU策略）
                        this.updateOrder(imageId, cacheOrder);
                        localStorage.setItem('musicPlayerImageCacheOrder', JSON.stringify(cacheOrder));
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('检查图片缓存状态失败:', e);
                    return false;
                }
            },
            
            // 获取图片缓存信息
            getImageInfo: function(imageId) {
                try {
                    const cacheIndex = JSON.parse(localStorage.getItem('musicPlayerImageCacheIndex') || '{}');
                    return cacheIndex[imageId] || null;
                } catch (e) {
                    console.error('获取图片缓存信息失败:', e);
                    return null;
                }
            },
            
            // 更新缓存顺序（LRU策略）
            updateOrder: function(imageId, order) {
                // 移除旧位置
                const index = order.indexOf(imageId);
                if (index > -1) {
                    order.splice(index, 1);
                }
                // 添加到末尾（最近使用）
                order.push(imageId);
            },
            
            // 清除特定图片的缓存记录
            removeImage: function(imageId) {
                try {
                    let cacheIndex = JSON.parse(localStorage.getItem('musicPlayerImageCacheIndex') || '{}');
                    let cacheOrder = JSON.parse(localStorage.getItem('musicPlayerImageCacheOrder') || '[]');
                    
                    delete cacheIndex[imageId];
                    const index = cacheOrder.indexOf(imageId);
                    if (index > -1) {
                        cacheOrder.splice(index, 1);
                    }
                    
                    localStorage.setItem('musicPlayerImageCacheIndex', JSON.stringify(cacheIndex));
                    localStorage.setItem('musicPlayerImageCacheOrder', JSON.stringify(cacheOrder));
                } catch (e) {
                    console.error('清除图片缓存记录失败:', e);
                }
            },
            
            // 清除所有图片缓存记录
            clearAll: function() {
                try {
                    localStorage.removeItem('musicPlayerImageCacheIndex');
                    localStorage.removeItem('musicPlayerImageCacheOrder');
                    this.init();
                } catch (e) {
                    console.error('清除所有图片缓存记录失败:', e);
                }
            },
            
            // 创建缓存友好的图片URL
            getCachedImageUrl: function(imageUrl, size = 100) {
                // 确保使用HTTPS
                if (imageUrl && !imageUrl.startsWith('http')) {
                    imageUrl = 'https:' + imageUrl;
                }
                
                // 为不同尺寸创建不同的缓存键
                const imageId = imageUrl ? `${imageUrl}_${size}` : null;
                
                if (!imageId) {
                    return `https://p1.music.126.net/-xMsNLpquZTmMZlIztTgHg==/109951165953469081.jpg?param=${size}y${size}&t=1763804680205`;
                }
                
                // 记录图片已被请求（会在图片加载完成后更新为已缓存）
                if (!this.isImageCached(imageId)) {
                    this.cacheImage(imageId, imageUrl);
                }
                
                // 返回缓存友好的URL，确保相同图片返回相同URL以利用浏览器缓存
                // 移除时间戳，使用参数化的尺寸查询
                if (imageUrl.includes('param=')) {
                    // 如果URL已经包含param参数，只更新尺寸
                    return imageUrl.replace(/param=\d+y\d+/, `param=${size}y${size}`);
                } else {
                    // 添加尺寸参数，不添加时间戳
                    return imageUrl + (imageUrl.includes('?') ? '&' : '?') + `param=${size}y${size}`;
                }
            }
        };

        // 歌曲信息缓存系统
        window.songCache = {
            // 最大缓存数量
            MAX_CACHE_SIZE: 200,
            
            // 初始化缓存
            init: function() {
                if (!localStorage.getItem('musicPlayerSongCache')) {
                    localStorage.setItem('musicPlayerSongCache', JSON.stringify({}));
                }
                if (!localStorage.getItem('musicPlayerCacheOrder')) {
                    localStorage.setItem('musicPlayerCacheOrder', JSON.stringify([]));
                }
            },
            
            // 获取缓存的歌曲信息
            get: function(songId) {
                try {
                    const cache = JSON.parse(localStorage.getItem('musicPlayerSongCache') || '{}');
                    const order = JSON.parse(localStorage.getItem('musicPlayerCacheOrder') || '[]');
                    
                    if (cache[songId]) {
                        // 更新使用顺序（LRU策略）
                        this.updateOrder(songId, order);
                        localStorage.setItem('musicPlayerCacheOrder', JSON.stringify(order));
                        return cache[songId];
                    }
                    return null;
                } catch (e) {
                    console.error('获取歌曲缓存失败:', e);
                    return null;
                }
            },
            
            // 缓存歌曲信息
            set: function(songId, songInfo) {
                try {
                    let cache = JSON.parse(localStorage.getItem('musicPlayerSongCache') || '{}');
                    let order = JSON.parse(localStorage.getItem('musicPlayerCacheOrder') || '[]');
                    
                    // 如果缓存已满且不是更新现有项，删除最旧的缓存
                    if (!cache[songId] && Object.keys(cache).length >= this.MAX_CACHE_SIZE) {
                        const oldestKey = order.shift();
                        delete cache[oldestKey];
                    }
                    
                    // 更新缓存和访问顺序
                    cache[songId] = songInfo;
                    this.updateOrder(songId, order);
                    
                    // 保存回localStorage
                    localStorage.setItem('musicPlayerSongCache', JSON.stringify(cache));
                    localStorage.setItem('musicPlayerCacheOrder', JSON.stringify(order));
                } catch (e) {
                    console.error('设置歌曲缓存失败:', e);
                }
            },
            
            // 更新缓存顺序（LRU策略）
            updateOrder: function(songId, order) {
                // 移除旧位置
                const index = order.indexOf(songId);
                if (index > -1) {
                    order.splice(index, 1);
                }
                // 添加到末尾（最近使用）
                order.push(songId);
            },
            
            // 清除特定歌曲的缓存
            remove: function(songId) {
                try {
                    let cache = JSON.parse(localStorage.getItem('musicPlayerSongCache') || '{}');
                    let order = JSON.parse(localStorage.getItem('musicPlayerCacheOrder') || '[]');
                    
                    delete cache[songId];
                    const index = order.indexOf(songId);
                    if (index > -1) {
                        order.splice(index, 1);
                    }
                    
                    localStorage.setItem('musicPlayerSongCache', JSON.stringify(cache));
                    localStorage.setItem('musicPlayerCacheOrder', JSON.stringify(order));
                } catch (e) {
                    console.error('清除歌曲缓存失败:', e);
                }
            },
            
            // 清除所有缓存
            clear: function() {
                try {
                    localStorage.removeItem('musicPlayerSongCache');
                    localStorage.removeItem('musicPlayerCacheOrder');
                    this.init();
                } catch (e) {
                    console.error('清除所有歌曲缓存失败:', e);
                }
            }
        };
        
        var userSettings = { bgUrl: '', bgBlur: 0, lyricSize: 22, showRelated: false, quality: 'exhigh', autoSearchPlay: false, autoPlayFirst: false, manualSearchAutoPlay: false, disableGlassEffect: false };

        function initSettings() {
            try {
                const s = localStorage.getItem('museProSettings');
                if(s) userSettings = JSON.parse(s);
            } catch(e){}
            if(!userSettings.quality) userSettings.quality = 'standard';
            applySettings();
        }

        function applySettings() {
            const main = document.getElementById('main-view');
            const root = document.documentElement;
            if(userSettings.bgUrl) {
                main.style.backgroundImage = `url('${userSettings.bgUrl}')`;
                main.classList.remove('default-bg');
            } else {
                // 根据设备类型设置默认背景图片
                const isMobile = window.innerWidth <= 768;
                const defaultBg = isMobile ? 'as.jpg' : 'pc.jpg';
                main.style.backgroundImage = `url('${defaultBg}')`;
                main.classList.add('default-bg');
            }
            const blur = userSettings.bgBlur * 0.1;
            main.style.filter = userSettings.bgBlur > 0 ? `blur(${blur}px)` : 'none';
            
            // 修复：确保歌词大小设置生效
            root.style.setProperty('--lyric-base-size', `${userSettings.lyricSize}px`);
            
            const rel = document.getElementById('related-section');
            if(rel) rel.style.display = userSettings.showRelated ? 'block' : 'none';
            
            // 应用毛玻璃效果设置
            const fullPlayer = document.querySelector('.full-player');
            if(fullPlayer) {
                if(userSettings.disableGlassEffect) {
                    fullPlayer.classList.add('no-glass');
                } else {
                    fullPlayer.classList.remove('no-glass');
                }
            }
        }

        function saveSet(k, v) { 
            userSettings[k] = v; 
            applySettings(); 
            try { 
                localStorage.setItem('museProSettings', JSON.stringify(userSettings)); 
                console.log('设置已保存到localStorage');
            } catch(e) {
                console.error('localStorage保存失败:', e);
                if(e.name === 'QuotaExceededError' && k === 'bgUrl') {
                    // 如果是背景图导致存储超出限制，尝试压缩图片
                    compressAndSaveImage(v);
                }
            }
        }
        
        function compressAndSaveImage(dataUrl) {
            try {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // 设置压缩尺寸
                    const maxWidth = 1024;
                    const maxHeight = 768;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }
                    if (height > maxHeight) {
                        width *= maxHeight / height;
                        height = maxHeight;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // 压缩质量
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    userSettings.bgUrl = compressedDataUrl;
                    try {
                        localStorage.setItem('museProSettings', JSON.stringify(userSettings));
                        console.log('压缩后的图片已保存');
                        applySettings();
                    } catch(e2) {
                        console.error('压缩后仍然无法保存:', e2);
                        alert('背景图太大，无法保存。请尝试使用更小的图片。');
                        userSettings.bgUrl = '';
                        localStorage.setItem('museProSettings', JSON.stringify(userSettings));
                        applySettings();
                    }
                };
                img.src = dataUrl;
            } catch(e) {
                console.error('图片压缩失败:', e);
            }
        }

        // 全局变量保存历史播放列表
        window.historyList = [];
        
        var ui = {
            el: id => document.getElementById(id),
            loading(show) { this.el('loader').style.display = show ? 'flex' : 'none'; },
            // 显示提示信息
            showToast(message) {
                // 检查是否已存在toast元素
                let toast = document.querySelector('.toast-message');
                if (!toast) {
                    // 创建toast元素
                    toast = document.createElement('div');

            async loadHot() {
                this.loading(true);
                try {
                    // 1. 首先尝试从缓存加载
                    const cachedHotList = localStorage.getItem('hotListCache');
                    const cacheTimestamp = localStorage.getItem('hotListTimestamp');
                    const now = Date.now();
                    const cacheValidity = 3600000; // 缓存有效期1小时
                    
                    if (cachedHotList && cacheTimestamp && (now - parseInt(cacheTimestamp)) < cacheValidity) {
                        console.log('加载热门推荐(缓存)');
                        window.hotList = JSON.parse(cachedHotList);
                        this.el('hot-list-container').innerHTML = this.renderList(window.hotList.slice(0, 20), 'hotList'); // 先渲染20首
                        this.loading(false);
                        // 异步渲染剩余部分
                        setTimeout(() => {
                            this.el('hot-list-container').innerHTML = this.renderList(window.hotList, 'hotList');
                        }, 500);
                        return;
                    }
                    
                    // 2. 缓存失效或不存在，从API加载
                    console.log('加载热门推荐(API)');
                    // 设置超时的fetch
                    const timeoutFetch = (url, options, timeout = 10000) => {
                        return Promise.race([
                            fetch(url, options),
                            new Promise((_, reject) => 
                                setTimeout(() => reject(new Error('请求超时')), timeout)
                            )
                        ]);
                    };
                    
                    const res = await (await timeoutFetch(API + '/playlist/detail?id=3778678')).json();
                    
                    // 只保存必要字段，减少缓存大小
                    window.hotList = res.playlist.tracks.map(track => ({
                        id: track.id,
                        name: track.name,
                        ar: track.ar,
                        al: { id: track.al.id, name: track.al.name, picUrl: track.al.picUrl },
                        dt: track.dt
                    })).slice(0, 30); // 减少到30首
                    
                    // 缓存数据
                    localStorage.setItem('hotListCache', JSON.stringify(window.hotList));
                    localStorage.setItem('hotListTimestamp', now.toString());
                    
                    // 先渲染15首，提升用户体验
                    this.el('hot-list-container').innerHTML = this.renderList(window.hotList.slice(0, 15), 'hotList');
                    this.loading(false);
                    
                    // 异步渲染剩余部分
                    setTimeout(() => {
                        this.el('hot-list-container').innerHTML = this.renderList(window.hotList, 'hotList');
                    }, 300);
                } catch (error) {
                    console.error('加载热门推荐失败:', error);
                    this.loading(false);
                    
                    // 显示错误提示，并尝试使用缓存（即使过期）
                    const cachedHotList = localStorage.getItem('hotListCache');
                    if (cachedHotList) {
                        window.hotList = JSON.parse(cachedHotList);
                        this.el('hot-list-container').innerHTML = this.renderList(window.hotList.slice(0, 20), 'hotList');
                    } else {
                        this.el('hot-list-container').innerHTML = `
                            <div style="text-align:center; padding:40px; color:#999;">
                                <div>加载失败，请稍后重试</div>
                                <button onclick="ui.loadHot()" style="margin-top:20px; padding:8px 16px; background:var(--primary); border:none; border-radius:4px; color:white;">重试</button>
                            </div>
                        `;
                    }
                }
            },

        window.api = {

            },
            
            // 通用请求方法
            get: async u => {
                try {
                    const apiLine = userSettings.apiLine || 'default';
                    const baseUrl = window.api.getApiBaseUrl();
                    
                    // 设置超时的fetch
                    const timeoutFetch = (url, options, timeout = 8000) => {
                        return Promise.race([
                            fetch(url, options),
                            new Promise((_, reject) => 
                                setTimeout(() => reject(new Error('请求超时')), timeout)
                            )
                        ]);
                    };
                    
                    // 对于限免线路，需要特殊处理URL格式
                    if (apiLine === 'premium') {
                        // 限免线路不需要API前缀，直接使用完整URL
                        return await (await timeoutFetch(baseUrl + u)).json();
                    } else {
                        // 免费线路使用原始格式
                        return await (await timeoutFetch(baseUrl + u)).json();
                    }
                } catch (error) {
                    console.error('API请求失败:', u, error);
                    throw error;
                }

            // 搜索方法 - 根据不同线路调整请求格式

                if (apiLine === 'premium') {
                    // 限免线路搜索格式：?type=song&name=关键词
                    return window.api.get(`/?type=song&name=${encodeURIComponent(kw)}`);
                } else {
                    // 免费线路保持原有格式
                    return window.api.get(`/cloudsearch?keywords=${kw}&type=${type}&limit=${limit}&offset=${offset}`);
                }

            // 获取歌曲URL - 限免线路使用特殊格式
            url: async id => {
                const apiLine = userSettings.apiLine || 'default';
                let level = userSettings.quality || 'standard';
                
                // 实现线路权限控制
                if (apiLine !== 'premium') {
                    // 普通线路只允许标准、高品质和极高音质
                    // 自动降级高级音质到极高音质
                    const restrictedQualities = ['lossless', 'hires', 'hires24bit', 'hiresmaster'];
                    if (restrictedQualities.includes(level)) {
                        console.log('普通线路无法使用高级音质，自动降级到极高音质');
                        level = 'exhigh';
                    }
                }
                
                // 首先尝试从缓存获取URL信息
                const cacheKey = `song_url_${id}_${level}`;
                const cachedUrl = window.songCache.get(cacheKey);
                
                if (cachedUrl && typeof cachedUrl.url === 'string') {
                    console.log('从缓存获取歌曲URL:', id);
                    return cachedUrl.url;
                }
                
                try {
                    if (apiLine === 'premium') {
                        // 限免线路直接返回URL字符串而不是JSON
                        const baseUrl = window.api.getApiBaseUrl();
                        // 直接构造URL并返回，不再进行预请求测试
                        const url = `${baseUrl}/?type=url&id=${id}&quality=${level}`;
                        // 缓存URL
                        window.songCache.set(cacheKey, { url, timestamp: Date.now() });
                        return url;
                    } else {
                        const res = await window.api.get(`/song/url/v1?id=${id}&level=${level}`);
                        // 缓存响应结果
                        window.songCache.set(cacheKey, { ...res, timestamp: Date.now() });
                        return res;

                    console.error('获取歌曲URL失败:', e);
                    // 失败时返回缓存数据（如果有）
                    if (cachedUrl) {
                        console.log('使用缓存的备用数据:', id);

                this.audio.addEventListener('timeupdate', () => {
                    const cur = this.audio.currentTime;

                    if (duration > 0 && !isDragging) {
                        const pct = cur / duration;
                        ui.el('progress-fill').style.width = (pct * 100) + '%';
                        // 当鼠标悬停或正在播放时，保持小圆球可见
                        const progressThumb = ui.el('progress-fill').querySelector('.progress-thumb');
                        if (progressThumb && state.playing) {
                            progressThumb.style.opacity = '1';
                        }
                    }
                    this.syncLyrics(cur);
                });
                this.audio.addEventListener('ended', () => this.next());
                const progressBar = ui.el('progress-bar');
                const progressFill = ui.el('progress-fill');
                const progressThumb = progressFill.querySelector('.progress-thumb');
                let isDragging = false;
                
                // 点击进度条跳转到指定时间
                progressBar.addEventListener('click', e => {
                    // 计算点击位置相对于进度条的百分比
                    const rect = progressBar.getBoundingClientRect();
                    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    this.audio.currentTime = pct * this.audio.duration;
                    updateProgressUI(pct);
                });
                
                // 鼠标按下开始拖动
                progressThumb.addEventListener('mousedown', startDrag);
                progressFill.addEventListener('mousedown', startDrag);
                
                function startDrag(e) {
                    isDragging = true;
                    document.addEventListener('mousemove', onDrag);
                    document.addEventListener('mouseup', stopDrag);
                    
                    // 立即处理当前鼠标位置
                    const rect = progressBar.getBoundingClientRect();
                    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    updateProgressUI(pct);
                    
                    e.preventDefault();
                }
                
                function onDrag(e) {
                    if (isDragging) {
                        const rect = progressBar.getBoundingClientRect();
                        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                        updateProgressUI(pct);
                    }
                }
                
                function stopDrag() {
                    if (isDragging) {
                        isDragging = false;
                        const pct = parseFloat(progressFill.style.width) / 100;
                        window.player.audio.currentTime = pct * window.player.audio.duration;
                        document.removeEventListener('mousemove', onDrag);
                        document.removeEventListener('mouseup', stopDrag);
                    }
                }
                
                function updateProgressUI(pct) {
                    const percent = pct * 100;
                    progressFill.style.width = percent + '%';

                    progressThumb.style.opacity = '1';

                });
                
                // 添加鼠标滚轮事件监听器，确保PC端可以自由滚动歌词
                lyricsBox.addEventListener('wheel', (e) => {
                    // 只有当鼠标在歌词区域内时才处理滚轮事件
                    if (lyricsBox.contains(e.target)) {

                        // 手动控制滚动位置

                        // 阻止事件冒泡和默认行为

            },

                } else {
                    // 添加收藏
                    favorites.push(song);
                    // 如果是当前播放的歌曲，更新收藏按钮状态
                    if (!index || state.playlist[state.index]?.id === song.id) {
                        this.updateFavoriteBtn(true);
                    }
                    // 显示收藏成功提示
                    ui.showToast('收藏成功');
                }
                
                // 保存到localStorage
                localStorage.setItem('musicPlayerFavorites', JSON.stringify(favorites));
                
                // 如果是在历史记录页面操作，刷新页面以更新收藏状态
                if (index !== undefined && state.history[state.history.length - 1]?.type === 'history') {
                    ui.renderHistory();
                }
            },
            isFavorite(index) {
                // 从参数中获取歌曲，优先使用索引对应的历史记录歌曲
                let song;
                if (typeof index === 'number') {
                    // 历史记录页面调用，使用历史记录列表
                    song = window.historyList[index];
                } else {
                    // 其他地方调用，使用当前播放列表
                    song = state.playlist[state.index];
                }
                
                if (!song) return false;
                
                const favorites = JSON.parse(localStorage.getItem('musicPlayerFavorites') || '[]');
                return favorites.some(fav => fav.id === song.id);
            },
            updateFavoriteBtn(isFav) {
                const btn = ui.el('btn-favorite');
                if (btn) {
                    if (isFav) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            },
            // 加载歌曲时更新收藏按钮状态
            updateFavoriteStatus() {
                this.updateFavoriteBtn(this.isFavorite());
            }
        };

        // 初始化localStorage数据结构
        function initStorage() {
            // 初始化收藏列表
            if (!localStorage.getItem('musicPlayerFavorites')) {
                localStorage.setItem('musicPlayerFavorites', JSON.stringify([]));
            }
            // 初始化歌单列表
            if (!localStorage.getItem('musicPlayerPlaylists')) {
                localStorage.setItem('musicPlayerPlaylists', JSON.stringify([]));
            }
            // 初始化歌曲缓存系统
            window.songCache.init();
            // 初始化图片缓存管理系统
            window.imageCacheManager.init();
        }
        initStorage();

        // 更新手动搜索自动播放开关的状态
        function updateManualSearchAutoPlayState() {
            const manualSearchCheckbox = document.querySelector('input[type="checkbox"][onchange*="manualSearchAutoPlay"]');
            if (manualSearchCheckbox) {
                if (!userSettings.autoPlayFirst) {
                    // 如果自动播放第一首关闭，则禁用手动搜索自动播放
                    manualSearchCheckbox.checked = false;
                    manualSearchCheckbox.disabled = true;
                    manualSearchCheckbox.nextElementSibling.style.backgroundColor = '#ccc';
                    // 同时更新设置
                    saveSet('manualSearchAutoPlay', false);
                } else {
                    // 如果自动播放第一首开启，则启用手动搜索自动播放
                    manualSearchCheckbox.disabled = false;
                    manualSearchCheckbox.nextElementSibling.style.backgroundColor = '';
                }
            }
        }

        window.router = {
            home: () => { state.history.push({type:'home'}); ui.renderHome(); },
            settings: () => { state.history.push({type:'settings'}); ui.renderSettings(); },
            quality: () => { state.history.push({type:'quality'}); ui.renderQuality(); },
            favorites: () => { state.history.push({type:'favorites'}); ui.renderFavorites(); },
            playlists: () => { state.history.push({type:'playlists'}); ui.renderPlaylists(); },
            history: () => { state.history.push({type:'history'}); ui.renderHistory(); },
            search: async (kw, type, offset = 0, source = 'nav') => {
                if (offset === 0) ui.loading(true);
                
                const originalApiLine = userSettings.apiLine;
                userSettings.apiLine = 'default';
                const res = await window.api.search(kw, type, 30, offset);
                userSettings.apiLine = originalApiLine;
                
                let formattedRes = res;
                
                if (offset === 0) {
                    ui.loading(false);
                    // 保存历史时记录 source，防止后退时重复触发
                    state.history.push({type:'search', data:{res: formattedRes, type, kw, list: formattedRes.result.songs || []}});
                } else {
                    const last = state.history[state.history.length-1];
                    if (last && last.type === 'search') {
                        last.data.list = [...last.data.list, ...(formattedRes.result.songs || [])];
                    }
                }
                
                ui.renderSearch(formattedRes, type, kw, offset);
                
                // === 核心修复逻辑：判断是否自动播放 ===
                let shouldAutoPlay = false;

                // 只有在第一页且有结果时才考虑自动播放
                if (offset === 0 && formattedRes.result.songs && formattedRes.result.songs.length > 0 && userSettings.autoPlayFirst) {
                    if (source === 'smart') {
                        // 场景1: 智能搜索（从收藏/歌单点击），始终自动播放
                        shouldAutoPlay = true;
                    } else if (source === 'manual') {
                        // 场景2: 手动搜索框输入，检查 "manualSearchAutoPlay" 设置
                        if (userSettings.manualSearchAutoPlay) {
                            shouldAutoPlay = true;
                        }
                    }
                    // 场景3: source === 'nav' (切换Tab、加载更多等) -> 不自动播放
                }
                
                if (shouldAutoPlay) {
                    setTimeout(() => {
                        window.player.playList('searchList', 0);
                    }, 300);
                }
                
                ui.isManualSearch = false; // 重置标志位
            },
            loadAlbum: async (id) => {
                ui.loading(true);
                // 专辑功能总是使用默认API，不受线路选择影响
                // 临时保存当前API线路设置
                const originalApiLine = userSettings.apiLine;
                // 强制使用默认API获取专辑数据
                userSettings.apiLine = 'default';
                const res = await window.api.album(id);
                // 恢复原来的API线路设置
                userSettings.apiLine = originalApiLine;
                ui.loading(false);
                state.history.push({type:'album', data:res}); ui.renderAlbumDetail(res);
            },
            loadPlaylist: async (id) => {
                ui.loading(true);
                // 歌单功能总是使用默认API，不受线路选择影响
                // 临时保存当前API线路设置
                const originalApiLine = userSettings.apiLine;
                // 强制使用默认API获取歌单数据
                userSettings.apiLine = 'default';
                const res = await window.api.playlist(id);
                // 恢复原来的API线路设置
                userSettings.apiLine = originalApiLine;
                ui.loading(false);
                state.history.push({type:'playlist', data:res}); ui.renderPlaylistDetail(res);
            },
            
            loadUserPlaylist: (index) => {
                const playlists = JSON.parse(localStorage.getItem('musicPlayerPlaylists') || '[]');
                const playlist = playlists[index];
                
                if (!playlist) return;
                
                // 将歌单设置到全局变量，供player使用
                window.userPlaylist = playlist.songs;
                
                // 渲染歌单详情
                ui.renderUserPlaylistDetail(playlist, index);
                state.history.push({type:'userPlaylist', data:{playlist, index}});
            },
            goBack: () => {
                state.history.pop();
                const last = state.history[state.history.length-1];
                if(!last) return window.router.home();
                if(last.type==='home') ui.renderHome();
                if(last.type==='settings') ui.renderSettings();
                if(last.type==='quality') ui.renderQuality();
                if(last.type==='search') ui.renderSearch(last.data.res, last.data.type, last.data.kw);
                if(last.type==='album') ui.renderAlbumDetail(last.data);
                if(last.type==='playlist') ui.renderPlaylistDetail(last.data);
                // 添加对userPlaylist类型的处理，返回到播放列表页面
                if(last.type==='playlists' || last.type==='userPlaylist') window.router.playlists();
            }
        };

        window.ui = ui; window.router = router; window.player = player;
        initSettings(); window.router.home(); window.player.init();
    </script>
        <script>
            // 实时检测屏幕宽度并调整播放控制栏按钮位置
            function adjustPlayerControls() {
                const playerActions = document.querySelector('.player-actions');
                if (playerActions) {
                    const screenWidth = window.innerWidth;
                    // 在移动设备上确保按钮显示在右侧边缘
                    playerActions.style.right = '0';
                    playerActions.style.marginRight = '10px';
                }
            }
            
            // 页面加载时和窗口大小改变时执行
            window.addEventListener('load', adjustPlayerControls);
            window.addEventListener('resize', adjustPlayerControls);
        </script>
