<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>纯 HTML 互动宇宙模拟器</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 310px;
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 14px;
      border-radius: 14px;
      background: rgba(5, 10, 25, 0.74);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 150, 255, 0.25);
      z-index: 10;
      user-select: none;
    }

    #ui h1 {
      font-size: 18px;
      margin: 0 0 10px;
      letter-spacing: .5px;
    }

    #ui .row {
      margin: 10px 0;
    }

    #ui label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: .95;
    }

    #ui input[type="range"] {
      width: 150px;
    }

    #ui button {
      background: linear-gradient(135deg, #124dff, #00b7ff);
      border: 0;
      color: white;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      margin: 3px 2px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(0, 140, 255, .25);
    }

    #ui button:hover {
      filter: brightness(1.13);
    }

    #info {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      font-size: 13px;
      line-height: 1.55;
    }

    #hint {
      position: fixed;
      right: 14px;
      bottom: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .45);
      color: rgba(255,255,255,.86);
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
    }

    .small {
      opacity: .72;
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(0, 183, 255, .18);
      border: 1px solid rgba(0, 183, 255, .35);
      font-size: 11px;
      margin-left: 5px;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
<div id="app"></div>

<div id="ui">
  <h1>互动宇宙模拟器 <span class="badge">Pure HTML</span></h1>

  <div class="row">
    <button id="pauseBtn">暂停</button>
    <button id="resetBtn">重置视角</button>
    <button id="focusBtn">聚焦选中</button>
    <button id="fullBtn">全屏</button>
  </div>

  <div class="row">
    <label>
      时间速度
      <input id="speedRange" type="range" min="0" max="20" step="0.1" value="3">
      <span id="speedText">3.0x</span>
    </label>
  </div>

  <div class="row">
    <label>
      星球大小
      <input id="sizeRange" type="range" min="0.4" max="3" step="0.05" value="1">
      <span id="sizeText">1.00</span>
    </label>
  </div>

  <div class="row">
    <label>
      轨道距离
      <input id="distRange" type="range" min="0.5" max="2.2" step="0.05" value="1">
      <span id="distText">1.00</span>
    </label>
  </div>

  <div class="row">
    <label>
      法线强度
      <input id="normalRange" type="range" min="0" max="2.5" step="0.05" value="0.9">
      <span id="normalText">0.90</span>
    </label>
  </div>

  <div class="row">
    <label><span>显示轨道</span><input id="orbitCheck" type="checkbox" checked></label>
    <label><span>显示标签</span><input id="labelCheck" type="checkbox" checked></label>
    <label><span>显示运动轨迹</span><input id="trailCheck" type="checkbox" checked></label>
    <label><span>显示法线线段</span><input id="normalCheck" type="checkbox"></label>
    <label><span>跟随选中星体</span><input id="followCheck" type="checkbox"></label>
  </div>

  <div class="row">
    <button id="addAsteroidBtn">添加随机小行星</button>
    <button id="meteorBtn">生成彗星</button>
  </div>

  <div id="info">
    <b>当前选中：</b><span id="selectedName">太阳</span><br>
    <span id="selectedDesc">点击任意星体查看信息。</span>
  </div>

  <p class="small">
    操作：鼠标/手指拖拽旋转视角，滚轮缩放，点击选择星体。<br>
    快捷键：空格暂停，F 全屏，O 显示/隐藏轨道，N 显示/隐藏法线。
  </p>
</div>

<div id="hint">
  拖拽旋转 · 滚轮缩放 · 点击星体选择
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const app = document.getElementById("app");

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000010, 0.0022);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  5000
);
camera.position.set(0, 80, 170);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 1200;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let paused = false;
let timeSpeed = 3;
let sizeScale = 1;
let distScale = 1;
let normalStrength = 0.9;
let selectedBody = null;
let followSelected = false;

const celestialBodies = [];
const clickable = [];
const orbitLines = [];
const labels = [];
const trailObjects = [];
const normalHelpers = [];

const textureCache = new Map();

function seededRandom(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function makeCanvasTexture(width, height, drawFn) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  drawFn(ctx, width, height);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

function makePlanetTexture(type, colors, seed = 1) {
  const key = `tex-${type}-${seed}`;
  if (textureCache.has(key)) return textureCache.get(key);

  const tex = makeCanvasTexture(1024, 512, (ctx, w, h) => {
    ctx.fillStyle = colors.base || "#888";
    ctx.fillRect(0, 0, w, h);

    if (type === "sun") {
      const grad = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, w/1.4);
      grad.addColorStop(0, "#fff8b2");
      grad.addColorStop(.18, "#ffd447");
      grad.addColorStop(.5, "#ff7b00");
      grad.addColorStop(1, "#9b1500");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 4200; i++) {
        const x = seededRandom(seed + i * 1.31) * w;
        const y = seededRandom(seed + i * 2.17) * h;
        const r = 1 + seededRandom(seed + i * 4.9) * 8;
        ctx.fillStyle = `rgba(255, ${100 + Math.random()*130}, 0, ${0.04 + Math.random()*0.16})`;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (type === "rock") {
      for (let i = 0; i < 7000; i++) {
        const x = seededRandom(seed + i * 1.7) * w;
        const y = seededRandom(seed + i * 2.3) * h;
        const a = 0.04 + seededRandom(seed + i * 5.1) * 0.22;
        const gray = 80 + seededRandom(seed + i * 3.4) * 100;
        ctx.fillStyle = `rgba(${gray},${gray},${gray},${a})`;
        ctx.fillRect(x, y, 1 + seededRandom(i)*5, 1 + seededRandom(i+9)*5);
      }

      for (let i = 0; i < 80; i++) {
        const x = seededRandom(seed + i * 10.2) * w;
        const y = seededRandom(seed + i * 9.6) * h;
        const r = 4 + seededRandom(seed + i) * 22;
        ctx.strokeStyle = `rgba(20,20,20,.25)`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = `rgba(255,255,255,.045)`;
        ctx.beginPath();
        ctx.arc(x-r*.2, y-r*.2, r*.45, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (type === "earth") {
      ctx.fillStyle = "#0a4e96";
      ctx.fillRect(0,0,w,h);

      for (let i = 0; i < 1050; i++) {
        const x = seededRandom(seed + i * 4.3) * w;
        const y = seededRandom(seed + i * 7.1) * h;
        const rx = 20 + seededRandom(seed + i) * 85;
        const ry = 8 + seededRandom(seed + i * 2) * 34;
        ctx.fillStyle = i % 3 === 0 ? "#1f8a45" : i % 3 === 1 ? "#497a2e" : "#c1a15a";
        ctx.globalAlpha = 0.58;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, seededRandom(i)*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (let i = 0; i < 450; i++) {
        const x = seededRandom(seed + i * 11.1) * w;
        const y = seededRandom(seed + i * 13.2) * h;
        const rx = 25 + seededRandom(i) * 90;
        const ry = 4 + seededRandom(i+5) * 18;
        ctx.fillStyle = "rgba(255,255,255,.35)";
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, seededRandom(i+2)*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(240,250,255,.92)";
      ctx.fillRect(0, 0, w, 28);
      ctx.fillRect(0, h-32, w, 32);
    }

    if (type === "gas") {
      const bands = colors.bands || ["#b98b5e", "#e6c38a", "#8c5d42"];
      for (let y = 0; y < h; y++) {
        const bandIndex = Math.floor((y / h) * bands.length * 3 + Math.sin(y * .035 + seed) * 1.5);
        ctx.fillStyle = bands[Math.abs(bandIndex) % bands.length];
        ctx.globalAlpha = .78;
        ctx.fillRect(0, y, w, 1);
      }
      ctx.globalAlpha = 1;

      for (let i = 0; i < 320; i++) {
        const x = seededRandom(seed + i * 4.2) * w;
        const y = seededRandom(seed + i * 2.8) * h;
        const rx = 20 + seededRandom(i) * 90;
        const ry = 3 + seededRandom(i+3) * 15;
        ctx.fillStyle = `rgba(255,255,255,${0.025 + seededRandom(i)*0.09})`;
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI*2);
        ctx.fill();
      }

      if (colors.spot) {
        ctx.fillStyle = colors.spot;
        ctx.beginPath();
        ctx.ellipse(w * .63, h * .55, 72, 34, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.15)";
        ctx.lineWidth = 5;
        ctx.stroke();
      }
    }

    if (type === "ice") {
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#91f1ff");
      grad.addColorStop(.5, "#3567d7");
      grad.addColorStop(1, "#dffbff");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);
      for (let i=0;i<1000;i++) {
        const x = seededRandom(seed+i*2.3)*w;
        const y = seededRandom(seed+i*5.2)*h;
        ctx.strokeStyle = `rgba(255,255,255,${0.05+seededRandom(i)*.25})`;
        ctx.lineWidth = 1 + seededRandom(i)*3;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x + 20 + seededRandom(i)*120, y + Math.sin(i)*18);
        ctx.stroke();
      }
    }
  });

  textureCache.set(key, tex);
  return tex;
}

function makeNormalMap(seed = 1, strength = 1) {
  const key = `normal-${seed}`;
  if (textureCache.has(key)) return textureCache.get(key);

  const w = 512;
  const h = 256;
  const height = new Float32Array(w * h);

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const nx = x / w;
      const ny = y / h;
      let v = 0;
      v += Math.sin((nx * 32 + seed) * Math.PI * 2) * .18;
      v += Math.sin((ny * 18 + seed * .31) * Math.PI * 2) * .12;
      v += seededRandom(seed + x * 12.9898 + y * 78.233) * .7;
      height[y * w + x] = v;
    }
  }

  const tex = makeCanvasTexture(w, h, (ctx) => {
    const img = ctx.createImageData(w, h);

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const xm = (x - 1 + w) % w;
        const xp = (x + 1) % w;
        const ym = Math.max(0, y - 1);
        const yp = Math.min(h - 1, y + 1);

        const dx = height[y * w + xp] - height[y * w + xm];
        const dy = height[yp * w + x] - height[ym * w + x];

        const n = new THREE.Vector3(-dx * strength, -dy * strength, 1).normalize();

        const i = (y * w + x) * 4;
        img.data[i] = Math.floor((n.x * 0.5 + 0.5) * 255);
        img.data[i + 1] = Math.floor((n.y * 0.5 + 0.5) * 255);
        img.data[i + 2] = Math.floor((n.z * 0.5 + 0.5) * 255);
        img.data[i + 3] = 255;
      }
    }

    ctx.putImageData(img, 0, 0);
  });

  textureCache.set(key, tex);
  return tex;
}

function makeLabel(text) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,256,64);
  ctx.font = "bold 30px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "#00b7ff";
  ctx.shadowBlur = 10;
  ctx.fillStyle = "rgba(255,255,255,.95)";
  ctx.fillText(text, 128, 32);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent: true,
    depthWrite: false
  });

  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(18, 4.5, 1);
  labels.push(sprite);
  return sprite;
}

function createOrbitLine(radius, color = 0x3355ff) {
  const points = [];
  const segments = 240;
  for (let i = 0; i <= segments; i++) {
    const a = i / segments * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
  }

  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 0.32
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  orbitLines.push(line);
  return line;
}

function createNormalHelper(radius) {
  const pts = [];
  const latSteps = 7;
  const lonSteps = 12;

  for (let i = 1; i < latSteps; i++) {
    const theta = i / latSteps * Math.PI;
    for (let j = 0; j < lonSteps; j++) {
      const phi = j / lonSteps * Math.PI * 2;
      const n = new THREE.Vector3(
        Math.sin(theta) * Math.cos(phi),
        Math.cos(theta),
        Math.sin(theta) * Math.sin(phi)
      ).normalize();

      const start = n.clone().multiplyScalar(radius * 1.02);
      const end = n.clone().multiplyScalar(radius * 1.38);
      pts.push(start, end);
    }
  }

  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: .85
  });

  const lines = new THREE.LineSegments(geo, mat);
  lines.visible = false;
  normalHelpers.push(lines);
  return lines;
}

function createTrail(color = 0xffffff) {
  const max = 260;
  const positions = new Float32Array(max * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setDrawRange(0, 0);

  const mat = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: .48
  });

  const line = new THREE.Line(geo, mat);
  line.userData.points = [];
  line.userData.max = max;
  scene.add(line);
  trailObjects.push(line);
  return line;
}

function updateTrail(line, position) {
  const arr = line.userData.points;
  arr.push(position.clone());
  if (arr.length > line.userData.max) arr.shift();

  const pos = line.geometry.attributes.position;
  for (let i = 0; i < arr.length; i++) {
    pos.setXYZ(i, arr[i].x, arr[i].y, arr[i].z);
  }

  line.geometry.setDrawRange(0, arr.length);
  pos.needsUpdate = true;
}

function createPlanet(config) {
  const orbitRoot = new THREE.Object3D();
  scene.add(orbitRoot);

  const planetRoot = new THREE.Object3D();
  orbitRoot.add(planetRoot);

  const radius = config.radius;
  const geometry = new THREE.SphereGeometry(radius, 96, 64);

  const map = makePlanetTexture(config.type, config.colors, config.seed);
  const normalMap = makeNormalMap(config.seed, 1);

  const material = new THREE.MeshStandardMaterial({
    map,
    normalMap,
    normalScale: new THREE.Vector2(normalStrength, normalStrength),
    roughness: config.roughness ?? 0.82,
    metalness: config.metalness ?? 0,
    emissive: config.emissive || 0x000000,
    emissiveIntensity: config.emissiveIntensity || 0
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  planetRoot.add(mesh);

  const label = makeLabel(config.name);
  label.position.set(0, radius + 4, 0);
  planetRoot.add(label);

  const normalHelper = createNormalHelper(radius);
  mesh.add(normalHelper);

  let ring = null;
  if (config.ring) {
    const ringGeo = new THREE.RingGeometry(radius * 1.35, radius * 2.3, 160);
    const ringTex = makeCanvasTexture(512, 64, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0,0,w,0);
      grad.addColorStop(0, "rgba(255,255,255,0)");
      grad.addColorStop(.2, "rgba(210,180,120,.35)");
      grad.addColorStop(.45, "rgba(250,230,180,.8)");
      grad.addColorStop(.55, "rgba(120,90,60,.25)");
      grad.addColorStop(.8, "rgba(230,210,160,.6)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);
      for(let i=0;i<80;i++){
        ctx.strokeStyle = `rgba(0,0,0,${Math.random()*.18})`;
        ctx.beginPath();
        const x = Math.random()*w;
        ctx.moveTo(x,0);
        ctx.lineTo(x,h);
        ctx.stroke();
      }
    });

    const ringMat = new THREE.MeshStandardMaterial({
      map: ringTex,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: .85,
      roughness: 1
    });
    ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.receiveShadow = true;
    planetRoot.add(ring);
  }

  if (config.distance > 0) {
    createOrbitLine(config.distance, config.orbitColor || 0x2244ff);
  }

  const trail = createTrail(config.trailColor || 0xffffff);

  const body = {
    ...config,
    orbitRoot,
    planetRoot,
    mesh,
    label,
    ring,
    trail,
    angle: config.initialAngle || Math.random() * Math.PI * 2,
    moons: []
  };

  planetRoot.position.set(config.distance, 0, 0);
  mesh.userData.body = body;
  clickable.push(mesh);
  celestialBodies.push(body);

  return body;
}

function createMoon(parent, config) {
  const moonRoot = new THREE.Object3D();
  parent.planetRoot.add(moonRoot);

  const geometry = new THREE.SphereGeometry(config.radius, 48, 32);
  const material = new THREE.MeshStandardMaterial({
    map: makePlanetTexture("rock", {base: "#888"}, config.seed),
    normalMap: makeNormalMap(config.seed),
    normalScale: new THREE.Vector2(normalStrength, normalStrength),
    roughness: .9
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  moonRoot.add(mesh);
  mesh.position.x = config.distance;

  const label = makeLabel(config.name);
  label.position.set(0, config.radius + 2, 0);
  mesh.add(label);

  const normalHelper = createNormalHelper(config.radius);
  mesh.add(normalHelper);

  const moon = {
    ...config,
    parent,
    moonRoot,
    mesh,
    label,
    normalHelper,
    angle: Math.random() * Math.PI * 2
  };

  mesh.userData.body = moon;
  clickable.push(mesh);
  labels.push(label);
  normalHelpers.push(normalHelper);
  parent.moons.push(moon);
  return moon;
}

const sun = createPlanet({
  name: "太阳",
  desc: "恒星，场景主光源。拥有自发光材质和程序化火焰纹理。",
  type: "sun",
  colors: {base: "#ff9c00"},
  seed: 1,
  radius: 13,
  distance: 0,
  orbitSpeed: 0,
  rotationSpeed: .12,
  emissive: 0xff8a00,
  emissiveIntensity: 2.1,
  roughness: .55,
  trailColor: 0xffcc33
});

const planets = [
  createPlanet({
    name: "水星",
    desc: "靠近太阳的岩质行星，表面布满撞击坑。",
    type: "rock",
    colors: {base: "#7c756c"},

function createStarField() {
  const count = 8500;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const r = 700 + Math.random() * 1600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(THREE.MathUtils.randFloatSpread(2));

    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

    const c = new THREE.Color().setHSL(
      0.55 + Math.random() * .15,
      .4 + Math.random() * .4,
      .65 + Math.random() * .35
    );
    colors[i*3] = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
  }

  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.6,
    vertexColors: true,
    transparent: true,
    opacity: .95,
    depthWrite: false
  });

  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
  return stars;
}

const stars = createStarField();

function createNebula() {
  const count = 1500;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  for(let i=0;i<count;i++){
    const arm = i % 3;
    const angle = i * .025 + arm * Math.PI * 2 / 3;
    const radius = 80 + Math.random() * 420;
    const y = THREE.MathUtils.randFloatSpread(80);

    positions[i*3] = Math.cos(angle) * radius + THREE.MathUtils.randFloatSpread(30);
    positions[i*3+1] = y;
    positions[i*3+2] = Math.sin(angle) * radius + THREE.MathUtils.randFloatSpread(30);

    const c = new THREE.Color().setHSL(.58 + Math.random()*.18, .75, .45 + Math.random()*.25);
    colors[i*3] = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
  }

  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 4,
    vertexColors: true,
    transparent: true,
    opacity: .18,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const nebula = new THREE.Points(geo, mat);
  scene.add(nebula);
  return nebula;
}

const nebula = createNebula();

function createAsteroidBelt() {
  const count = 1400;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const sizes = [];

  for (let i = 0; i < count; i++) {
    const radius = 70 + Math.random() * 9;
    const angle = Math.random() * Math.PI * 2;
    const y = THREE.MathUtils.randFloatSpread(2.2);

    positions[i*3] = Math.cos(angle) * radius;
    positions[i*3+1] = y;
    positions[i*3+2] = Math.sin(angle) * radius;
    sizes.push(Math.random());
  }

  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.2,
    color: 0x9b8b76,
    transparent: true,
    opacity: .85
  });

  const belt = new THREE.Points(geo, mat);
  scene.add(belt);
  return belt;
}

const asteroidBelt = createAsteroidBelt();

let comet = null;

function createComet() {
  if (comet) {
    scene.remove(comet.group);
  }

  const group = new THREE.Group();
  scene.add(group);

  const nucleus = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 32, 24),
    new THREE.MeshStandardMaterial({
      color: 0xd8f7ff,
      emissive: 0x86dfff,
      emissiveIntensity: .45,
      roughness: .55
    })
  );
  group.add(nucleus);

  const tailGeo = new THREE.ConeGeometry(4, 32, 32, 1, true);
  const tailMat = new THREE.MeshBasicMaterial({
    color: 0x88ddff,
    transparent: true,
    opacity: .24,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const tail = new THREE.Mesh(tailGeo, tailMat);
  tail.rotation.z = Math.PI / 2;
  tail.position.x = -17;
  group.add(tail);

  comet = {
    group,
    angle: Math.random() * Math.PI * 2,
    speed: .85 + Math.random() * .7,
    radiusX: 190,
    radiusZ: 80
  };
}

function selectBody(body) {
  selectedBody = body;
  document.getElementById("selectedName").textContent = body.name || "未知";
  document.getElementById("selectedDesc").innerHTML =
    `${body.desc || "无描述"}<br>` +
    `半径：${(body.radius || 0).toFixed(2)}　` +
    `轨道距离：${(body.distance || 0).toFixed(2)}　` +
    `自转速度：${(body.rotationSpeed || 0).toFixed(2)}`;

  clickable.forEach(obj => {
    if (obj.material && obj.material.emissive && obj.userData.body !== body && obj.userData.body !== sun) {
      obj.material.emissive.setHex(0x000000);
      obj.material.emissiveIntensity = 0;
    }
  });

  if (body.mesh && body !== sun && body.mesh.material.emissive) {
    body.mesh.material.emissive.setHex(0x153bff);
    body.mesh.material.emissiveIntensity = .18;
  }
}

selectBody(sun);

function getBodyWorldPosition(body) {
  const p = new THREE.Vector3();
  if (body.planetRoot) body.planetRoot.getWorldPosition(p);
  else if (body.mesh) body.mesh.getWorldPosition(p);
  return p;
}

function updateScale() {
  celestialBodies.forEach(body => {
    if (body.distance > 0) {
      body.planetRoot.position.x = body.distance * distScale;
    }
    const s = sizeScale;
    body.mesh.scale.setScalar(s);
    if (body.ring) body.ring.scale.setScalar(s);
    body.label.position.y = body.radius * s + 4;
  });

  orbitLines.forEach((line, i) => {
    const body = celestialBodies.filter(b => b.distance > 0)[i];
    if (!body) return;
    const scale = body.distance * distScale / body.distance;
    line.scale.setScalar(scale);
  });
}

function updateNormalStrength() {
  celestialBodies.forEach(body => {
    if (body.mesh.material.normalScale) {
      body.mesh.material.normalScale.set(normalStrength, normalStrength);
    }
    body.moons?.forEach(moon => {
      if (moon.mesh.material.normalScale) {
        moon.mesh.material.normalScale.set(normalStrength, normalStrength);
      }
    });
  });
}

function onPointerDown(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickable, false);
  if (hits.length > 0) {
    const body = hits[0].object.userData.body;
    if (body) selectBody(body);
  }
}

renderer.domElement.addEventListener("pointerdown", onPointerDown);

function resetCamera() {
  camera.position.set(0, 80, 170);
  controls.target.set(0, 0, 0);
  controls.update();
}

function focusSelectedBody() {
  if (!selectedBody) return;
  const p = getBodyWorldPosition(selectedBody);
  controls.target.copy(p);

  const dir = new THREE.Vector3()
    .subVectors(camera.position, controls.target)
    .normalize();

  const distance = Math.max(18, (selectedBody.radius || 4) * sizeScale * 9);
  camera.position.copy(p).add(dir.multiplyScalar(distance));
  controls.update();
}

  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "继续" : "暂停";

};

document.getElementById("orbitCheck").onchange = e => {
  orbitLines.forEach(o => o.visible = e.target.checked);
};

document.getElementById("labelCheck").onchange = e => {

};

document.getElementById("trailCheck").onchange = e => {
  trailObjects.forEach(t => t.visible = e.target.checked);
};

document.getElementById("normalCheck").onchange = e => {
  normalHelpers.forEach(n => n.visible = e.target.checked);
};

document.getElementById("followCheck").onchange = e => {
  followSelected = e.target.checked;
};

window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    document.getElementById("pauseBtn").click();
  }
  if (e.key.toLowerCase() === "f") {
    document.getElementById("fullBtn").click();
  }
  if (e.key.toLowerCase() === "o") {
    const c = document.getElementById("orbitCheck");
    c.checked = !c.checked;
    c.dispatchEvent(new Event("change"));
  }
  if (e.key.toLowerCase() === "n") {
    const c = document.getElementById("normalCheck");
    c.checked = !c.checked;
    c.dispatchEvent(new Event("change"));
  }
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const dt = paused ? 0 : delta * timeSpeed;

  stars.rotation.y += delta * 0.006;
  nebula.rotation.y -= delta * 0.003;
  asteroidBelt.rotation.y += dt * 0.018;

  for (const body of celestialBodies) {
    body.angle += dt * body.orbitSpeed * 0.12;

    if (body.distance > 0) {
      const d = body.distance * distScale;
      body.planetRoot.position.set(
        Math.cos(body.angle) * d,
        Math.sin(body.angle * .7) * 0.8,
        Math.sin(body.angle) * d
      );
    }

    body.mesh.rotation.y += dt * body.rotationSpeed;
    if (body.ring) body.ring.rotation.z += dt * 0.03;

    const worldPos = getBodyWorldPosition(body);
    updateTrail(body.trail, worldPos);

    for (const moon of body.moons || []) {
      moon.angle += dt * moon.orbitSpeed * .25;
      moon.moonRoot.rotation.y = moon.angle;
      moon.mesh.rotation.y += dt * moon.rotationSpeed;
    }
  }

  if (comet) {
    comet.angle += dt * comet.speed * .08;
    const x = Math.cos(comet.angle) * comet.radiusX;
    const z = Math.sin(comet.angle) * comet.radiusZ;
    const y = Math.sin(comet.angle * 2.4) * 28;
    comet.group.position.set(x, y, z);

    const tangent = new THREE.Vector3(
      -Math.sin(comet.angle) * comet.radiusX,
      Math.cos(comet.angle * 2.4) * 28 * 2.4,
      Math.cos(comet.angle) * comet.radiusZ
    ).normalize();

    comet.group.lookAt(comet.group.position.clone().add(tangent));
  }

  if (followSelected && selectedBody) {
    const p = getBodyWorldPosition(selectedBody);
    controls.target.lerp(p, 0.12);
  }

  controls.update();
  renderer.render(scene, camera);
}

updateScale();
animate();
