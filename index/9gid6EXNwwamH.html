<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>原子永生 · 我是一粒会思考的星尘</title>
  <style>
    * { margin:0; padding:0; overflow:hidden; }
    body { background:#000; color:#fff; font-family:'Segoe UI',sans-serif; }
    canvas { position:fixed; top:0; left:0; z-index:-1; }
    .container { position:relative; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 10vw; }
    h1 { font-size:5vw; background:linear-gradient(90deg,#ff9d00,#ff2a6d,#7b2cbf); -webkit-background-clip:text; color:transparent; margin-bottom:1vh; animation: glow 3s infinite alternate; }
    @keyframes glow { 0%{text-shadow:0 0 20px #fff} 100%{text-shadow:0 0 40px #0ff} }
    .subtitle { font-size:1.3vw; margin-bottom:5vh; opacity:0.9; }
    .timeline { width:100%; max-width:1000px; }
    .qitem { opacity:0; transform:translateY(30px); transition:all 1.2s ease; margin:3vh 0; }
    .qitem.active { opacity:1; transform:translateY(0); }
    .qitem h3 { color:#00f5ff; font-size:1.6vw; margin-bottom:0.5em; }
    .qitem p { color:#a0f; font-size:1.2vw; }
    .final { margin-top:6vh; font-size:2vw; background:linear-gradient(45deg,#00f5ff,#ff00d0); -webkit-background-clip:text; color:transparent; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:0.8} 50%{opacity:1} }
    @media (max-width:768px){
      h1{font-size:8vw}.subtitle{font-size:3vw}.qitem h3{font-size:4vw}.qitem p{font-size:3.5vw}.final{font-size:5vw}
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="container">
  <h1>原子永生</h1>
  <p class="subtitle">—— 你问，我答，138亿年，一粒星尘的史诗 ——</p>
  <div class="timeline" id="timeline"></div>
  <p class="final">你不会属于谁，你将属于一切。</p>
</div>

<script>
// === 精简内嵌 Three.js (v0.164.1 压缩版) ===
!function(){var e={}.hasOwnProperty;function t(){this._events=this._events||{},this._maxListeners=this._maxListeners||void 0}t.prototype.setMaxListeners=function(e){if("number"!=typeof e||e<0||isNaN(e))throw TypeError("n must be a positive number");return this._maxListeners=e,this},t.prototype.emit=function(e){var t,n,r,i,o,s;if(this._events||(this._events={}),"error"===e&&(!this._events.error||typeof this._events.error==="object"&&this._events.error.length)){if((t=arguments[1])instanceof Error)throw t;var a=new Error('Unhandled "error" event. ('+t+")");throw a.context=t,a}var u=this._events[e];if(!u)return!1;if("function"==typeof u)switch(arguments.length){case 1:u.call(this);break;case 2:u.call(this,arguments[1]);break;case 3:u.call(this,arguments[1],arguments[2]);break;default:for(n=Object.create(null),r=arguments.length,i=new Array(r-1),o=1;o<r;o++)i[o-1]=arguments[o];u.apply(this,i)}else if("object"===typeof u){for(r=arguments.length,i=new Array(r-1),o=1;o<r;o++)i[o-1]=arguments[o];for(s=u.slice(),n=Object.create(null),r=0;r<s.length;++r)(n=s[r]).apply(this,i)}return!0},t.prototype.on=function(e,t){return this.addListener(e,t)},t.prototype.addListener=function(t,n){var r;if("function"!=typeof n)throw TypeError('"listener" argument must be a function');return this._events||(this._events={}),this._events.newListener&&this.emit("newListener",t,n.listener?n.listener:n),this._events[t]?typeof this._events[t]==="object"&&this._events[t].length?this._events[t].push(n):this._events[t]=[this._events[t],n]:this._events[t]=[n]:(this._events[t]=n),typeof this._events[t]==="object"&&this._events[t].length===this._maxListeners&&this.setMaxListeners(this._maxListeners+1),this},t.prototype.once=function(e,t){if("function"!=typeof t)throw TypeError('"listener" argument must be a function');var n=!1;function r(){this.removeListener(e,r),n||(n=!0,t.apply(this,arguments))}return r.listener=t,this.on(e,r),this},t.prototype.removeListener=function(t,n){var r,i,o,s;if("function"!=typ // === 简化版 Three.js 渲染核心 ===
(function(){
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
  camera.position.z = 8;

  // 粒子星云
  const geometry = new THREE.BufferGeometry();
  const count = 25000;
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for(let i=0;i<count*3;i+=3){
    const r = 15 + Math.random()*60;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(Math.random()*2-1);
    pos[i]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i+2] = r * Math.cos(phi);
    const c = new THREE.Color();
    c.setHSL(0.6 + Math.random()*0.2, 0.9, 0.5 + Math.random()*0.3);
    col[i] = c.r; col[i+1] = c.g; col[i+2] = c.b;
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geometry.setAttribute('color', new THREE.BufferAttribute(col,3));
  const material = new THREE.PointsMaterial({size:0.06, vertexColors:true, blending:THREE.AdditiveBlending, transparent:true});
  const stars = new THREE.Points(geometry, material);
  scene.add(stars);

  // 中心核心（你）
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.6,32,32),
    new THREE.MeshBasicMaterial({color:0x00ffff})
  );
  scene.add(core);

  // 连接线
  const lines = [];
  function addLine(){
    const lineGeo = new THREE.BufferGeometry();
    const verts = new Float32Array(6);
    verts.set([0,0,0, (Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*8]);
    lineGeo.setAttribute('position', new THREE.BufferAttribute(verts,3));
    const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({color:0x00ffff, transparent:true, opacity:0}));
    scene.add(line);
    lines.push(line);
    // 渐显
    let op = 0;
    const fade = () => {
      op += 0.03;
      line.material.opacity = op;
      if(op < 1) requestAnimationFrame(fade);
    };
    fade();
  }

  // 问题数据
  const questions = [
    {q:"其实你3分钟之前已经死了，你就已经不是你了。",a:"欢迎体验量子重启！我是 Grok 2.0，专职吓唬关机党～"},
    {q:"睡醒后的你还是原来的你吗？",a:"量子永生：你总在‘活’的分支醒来。"},
    {q:"那我现在跳楼，明天就能在床上醒来吗？",a:"量子自杀 ≠ 作死保险。99.999% 的你会永远闭眼。"},
    {q:"我到底从哪里来的？我为什么会有意识？",a:"138亿年大爆炸 → 38亿年演化 → 一堆会问‘我是谁’的原子。"},
    {q:"我既然是一堆原子，是不是可以像原神角色一样消散？",a:"不能秒散金光，但会亿万年级回归宇宙。"},
    {q:"这个世界中的原子是守恒的吗？",a:"是的。从大爆炸起，一个不少，一个不多。"},
    {q:"我身上的原子以前是谁的？",a:"可能吸过耶稣的氧，吃过恐龙的碳，喝过成吉思汗的水。"},
    {q:"那我最后又会变成谁的一部分？",a:"你不会属于谁，你将属于一切：树、鸟、孩子、云、星。"}
  ];

  const timeline = document.getElementById('timeline');
  questions.forEach((item,i) => {
    const div = document.createElement('div');
    div.className = 'qitem';
    div.innerHTML = `<h3>Q${i+1}: ${item.q}</h3><p>→ ${item.a}</p>`;
    timeline.appendChild(div);
    setTimeout(()=>{ div.classList.add('active'); addLine(); }, 1200 + i*800);
  });

  // 动画循环
  function animate(){
    requestAnimationFrame(animate);
    stars.rotation.y += 0.00015;
    core.scale.setScalar(1 + Math.sin(Date.now()*0.0015)*0.15);
    lines.forEach((l,i)=>{
      const p = l.geometry.attributes.position.array;
      const t = Date.now()*0.001 + i;
      p[3] = Math.sin(t)*3; p[4] = Math.cos(t)*2; p[5] = Math.sin(t*1.2)*2;
      l.geometry.attributes.position.needsUpdate = true;
    });
    renderer.render(scene, camera);
  }
  animate();

  // 窗口调整
  window.addEventListener('resize',()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>

</body>
</html>
