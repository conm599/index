<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生信息查询系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        neutral: '#64748B',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .search-container {
                @apply relative w-full max-w-2xl mx-auto transition-all duration-500;
            }
            .search-input {
                @apply w-full px-6 py-4 rounded-full bg-white border border-gray-200 shadow-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all duration-300 text-lg;
            }
            .search-results {
                @apply absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-xl overflow-hidden transform transition-all duration-300 opacity-0 scale-95 pointer-events-none;
            }
            .search-results.active {
                @apply opacity-100 scale-100 pointer-events-auto;
            }
            .result-item {
                @apply hover:bg-gray-50 transition-colors duration-200;
            }
            .table-header {
                @apply bg-gray-50 text-gray-600 font-medium;
            }
            .fade-in {
                animation: fadeIn 0.5s ease-in-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex flex-col items-center justify-center p-4">
    <!-- 页面容器 -->
    <div class="w-full max-w-6xl flex flex-col items-center">
        <!-- 标题区域 -->
        <div class="text-center mb-10 fade-in">
            <h1 class="text-[clamp(2rem,5vw,3.5rem)] font-bold text-dark mb-2 tracking-tight">
                学生信息查询
            </h1>
            <p class="text-neutral text-lg max-w-2xl mx-auto">
                输入学生姓名进行查询，支持模糊搜索
            </p>
        </div>
        
        <!-- 搜索区域 -->
        <div class="search-container fade-in" style="animation-delay: 0.1s">
            <div class="relative">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="请输入学生姓名..." 
                    class="search-input pl-12"
                >
                <i class="fa fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 text-xl"></i>
            </div>
            
            <!-- 搜索结果区域 -->
            <div id="search-results" class="search-results">
                <div class="p-4 text-center text-gray-500" id="empty-state">
                    请输入姓名进行搜索
                </div>
                <div id="results-container" class="hidden">
                    <table class="w-full text-left">
                        <thead class="table-header">
                            <tr>
                                <th class="px-6 py-3 border-b border-gray-200">序号</th>
                                <th class="px-6 py-3 border-b border-gray-200">姓名</th>
                                <th class="px-6 py-3 border-b border-gray-200">性别</th>
                                <th class="px-6 py-3 border-b border-gray-200">班级</th>
                                <th class="px-6 py-3 border-b border-gray-200">身份证号</th>
                                <th class="px-6 py-3 border-b border-gray-200">联系电话</th>
                            </tr>
                        </thead>
                        <tbody id="results-body">
                            <!-- 搜索结果将在这里动态生成 -->
                        </tbody>
                    </table>
                </div>
                <div class="p-4 text-center text-gray-500 hidden" id="no-results">
                    没有找到匹配的学生信息
                </div>
            </div>
        </div>
        
        <!-- 详细信息模态框 -->
        <div id="detail-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
            <div class="bg-white rounded-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto m-4 transform scale-95 transition-transform duration-300" id="modal-content">
                <div class="p-6 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white z-10">
                    <h2 class="text-xl font-bold text-dark" id="modal-title">学生详细信息</h2>
                    <button id="close-modal" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fa fa-times text-xl"></i>
                    </button>
                </div>
                <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6" id="modal-body">
                    <!-- 详细信息将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

        // 处理身份证号，将后四位替换为x
        function maskIdCard(idCard) {
            if (!idCard) return '';
            return idCard.slice(0, -4) + 'xxxx';
        }

        // 处理所有学生的身份证号
        const processedStudents = students.map(student => ({
            ...student,
            身份证件号: maskIdCard(student.身份证件号),
            监护人一身份证号码: maskIdCard(student.监护人一身份证号码),
            监护人二身份证号码: maskIdCard(student.监护人二身份证号码)
        }));

        // DOM元素
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        const resultsContainer = document.getElementById('results-container');
        const resultsBody = document.getElementById('results-body');
        const emptyState = document.getElementById('empty-state');
        const noResults = document.getElementById('no-results');
        const detailModal = document.getElementById('detail-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const closeModal = document.getElementById('close-modal');

        // 搜索功能
        function searchStudents(query) {
            if (!query.trim()) {
                searchResults.classList.remove('active');
                resultsContainer.classList.add('hidden');
                noResults.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            const lowerCaseQuery = query.toLowerCase();
            const matchedStudents = processedStudents.filter(student => 
                student.姓名.toLowerCase().includes(lowerCaseQuery)
            );

            searchResults.classList.add('active');
            emptyState.classList.add('hidden');

            if (matchedStudents.length === 0) {
                resultsContainer.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            resultsContainer.classList.remove('hidden');
            renderResults(matchedStudents);
        }

        // 渲染搜索结果
        function renderResults(students) {
            resultsBody.innerHTML = '';
            
            students.forEach(student => {
                const row = document.createElement('tr');
                row.className = 'result-item hover:shadow-md transition-shadow';
                row.innerHTML = `
                    <td class="px-6 py-4 border-b border-gray-200">${student.序号}</td>
                    <td class="px-6 py-4 border-b border-gray-200 font-medium">${student.姓名}</td>
                    <td class="px-6 py-4 border-b border-gray-200">${student.性别}</td>
                    <td class="px-6 py-4 border-b border-gray-200">${student.班级名称}</td>
                    <td class="px-6 py-4 border-b border-gray-200">${student.身份证件号}</td>
                    <td class="px-6 py-4 border-b border-gray-200">${student.联系电话}</td>
                `;
                
                row.addEventListener('click', () => showDetails(student));
                resultsBody.appendChild(row);
            });
        }

        // 显示详细信息
        function showDetails(student) {
            modalTitle.textContent = `${student.姓名} 的详细信息`;
            modalBody.innerHTML = '';

            // 生成详细信息内容
            const details = [
                { label: '学部', value: student.学部 },
                { label: '序号', value: student.序号 },
                { label: '姓名', value: student.姓名 },
                { label: '性别', value: student.性别 },
                { label: '中考准考证号', value: student.中考准考证号 },
                { label: '身份证号', value: student.身份证件号 },
                { label: '班级名称', value: student.班级名称 },
                { label: '专业简称', value: student.专业简称 },
                { label: '民族', value: student.民族 },
                { label: '户口性质', value: student.户口性质 },
                { label: '学生居住地类型', value: student.学生居住地类型 },
                { label: '政治面貌', value: student.政治面貌 },
                { label: '健康状况', value: student.健康状况 },
                { label: '学生来源', value: student.学生来源 },
                { label: '招生对象', value: student.招生对象 },
                { label: '毕业学校', value: student.毕业学校 },
                { label: '是否建档立卡贫困户', value: student.是否建档立卡贫困户 },
                { label: '就读方式', value: student.就读方式 },
                { label: '户口所在地', value: student.户口所在地 },
                { label: '户口详细地址', value: student.户口所在地区县以下详细地址 },
                { label: '所属派出所', value: student.所属派出所 },
                { label: '乘火车区间', value: student.乘火车区间 },
                { label: '是否随迁子女', value: student.是否随迁子女 },
                { label: '跨省招考', value: student.跨省招考 },
                { label: '分段培养方式', value: student.分段培养方式 },
                { label: '联系电话', value: student.联系电话 },
                { label: '监护人一', value: `${student.监护人一姓名}（${student.监护人一关系}） ${student.监护人一手机号码}` },
                { label: '监护人一身份证号', value: student.监护人一身份证号码 },
                { label: '监护人二', value: student.监护人二姓名 ? `${student.监护人二姓名}（${student.监护人二关系}） ${student.监护人二手机号码}` : '-' },
                { label: '监护人二身份证号', value: student.监护人二身份证号码 || '-' }
            ];

            details.forEach(item => {
                const detailItem = document.createElement('div');
                detailItem.className = 'mb-4';
                detailItem.innerHTML = `
                    <h4 class="text-sm font-semibold text-gray-500">${item.label}</h4>
                    <p class="text-gray-800">${item.value || '-'}</p>
                `;
                modalBody.appendChild(detailItem);
            });

            // 显示模态框
            detailModal.classList.remove('pointer-events-none');
            setTimeout(() => {
                detailModal.classList.add('opacity-100');
                modalContent.classList.add('scale-100');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        // 关闭模态框
        function hideModal() {
            detailModal.classList.remove('opacity-100');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                detailModal.classList.add('pointer-events-none');
            }, 300);
        }

        // 事件监听
        searchInput.addEventListener('input', (e) => {
            searchStudents(e.target.value);
        });

        closeModal.addEventListener('click', hideModal);

        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) {
                hideModal();
            }
        });

        // 点击外部关闭搜索结果
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
                searchResults.classList.remove('active');
            }
        });

        // 聚焦时显示结果
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim()) {
                searchResults.classList.add('active');
            }
        });
    </script>
