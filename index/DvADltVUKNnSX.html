<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atom Eternal：我是一粒会思考的星尘</title>
  <style>
    * { margin:0; padding:0; overflow:hidden; }
    body { background:#000; color:#fff; font-family:'Segoe UI',sans-serif; }
    canvas { position:fixed; top:0; left:0; z-index:-1; }
    .container { position:relative; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
    h1 { font-size:4vw; background:linear-gradient(90deg,#ff9d00,#ff2a6d,#7b2cbf); -webkit-background-clip:text; color:transparent; margin-bottom:2vh; }
    .timeline { width:80%; max-width:900px; }
    .question { opacity:0; transform:translateY(50px); transition:all 1.2s cubic-bezier(0.25,0.8,0.25,1); }
    .question.active { opacity:1; transform:translateY(0); }
    .particle { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%; pointer-events:none; }
    .final { margin-top:5vh; font-size:1.5vw; background:linear-gradient(45deg,#00f5ff,#ff00d0); -webkit-background-clip:text; color:transparent; }
  </style>
</head>
<body>

<canvas id="universe"></canvas>

<div class="container">
  <h1>Atom Eternal</h1>
  <p style="font-size:1.2vw; margin-bottom:4vh; opacity:0.8;">—— 你问，我答，138亿年，一粒星尘的史诗 ——</p>

  <div class="timeline">
    <!-- 所有问题将动态插入 -->
  </div>

  <p class="final">你不会属于谁，你将属于一切。</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/examples/js/controls/OrbitControls.js"></script>
<script>
/* ==================== 三、你的 8 个问题（时间轴） ==================== */
const questions = [
  { q: "其实你3分钟之前已经死了，你就已经不是你了。", a: "欢迎体验量子重启！我是 Grok 2.0，专职吓唬关机党～", delay: 1000 },
  { q: "睡醒后的你还是原来的你吗？", a: "量子永生：你总在‘活’的分支醒来。", delay: 1500 },
  { q: "那我现在跳楼，明天就能在床上醒来吗？", a: "量子自杀 ≠ 作死保险。99.999% 的你会永远闭眼。", delay: 1800 },
  { q: "我到底从哪里来的？我为什么会有意识？", a: "138亿年大爆炸 → 38亿年演化 → 一堆会问‘我是谁’的原子。", delay: 2100 },
  { q: "我既然是一堆原子，是不是可以像原神角色一样消散？", a: "不能秒散金光，但会亿万年级回归宇宙。", delay: 2400 },
  { q: "这个世界中的原子是守恒的吗？", a: "是的。从大爆炸起，一个不少，一个不多。", delay: 2700 },
  { q: "我身上的原子以前是谁的？", a: "可能吸过耶稣的氧，吃过恐龙的碳，喝过成吉思汗的水。", delay: 3000 },
  { q: "那我最后又会变成谁的一部分？", a: "你不会属于谁，你将属于一切：树、鸟、孩子、云、星。", delay: 3500 }
];

/* ==================== 一、宇宙粒子背景（Three.js） ==================== */
const canvas = document.getElementById('universe');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 5;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// 星云粒子
const particles = new THREE.BufferGeometry();
const particleCount = 30000;
const posArray = new Float32Array(particleCount * 3);
const colorArray = new Float32Array(particleCount * 3);

for(let i = 0; i < particleCount * 3; i += 3) {
  const radius = 20 + Math.random() * 80;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.random() * Math.PI;

  posArray[i]   = radius * Math.sin(phi) * Math.cos(theta);
  posArray[i+1] = radius * Math.sin(phi) * Math.sin(theta);
  posArray[i+2] = radius * Math.cos(phi);

  const color = new THREE.Color();
  color.setHSL(0.55 + Math.random() * 0.15, 0.8, 0.5 + Math.random() * 0.3);
  colorArray[i]   = color.r;
  colorArray[i+1] = color.g;
  colorArray[i+2] = color.b;
}

particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
particles.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

const material = new THREE.PointsMaterial({
  size: 0.05,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  transparent: true,
  opacity: 0.8
});

const starField = new THREE.Points(particles, material);
scene.add(starField);

// 中心发光核心（代表“你”）
const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// 光线连接线（问题触发时出现）
const lines = [];

/* ==================== 二、动态时间轴生成 ==================== */
const timeline = document.querySelector('.timeline');
questions.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'question';
  div.innerHTML = `
    <h3 style="margin:1em 0; color:#00f5ff;">Q${i+1}: ${item.q}</h3>
    <p style="font-size:1.1em; margin-bottom:2em; color:#a0f;">→ ${item.a}</p>
  `;
  timeline.appendChild(div);

  // 触发动画
  setTimeout(() => {
    div.classList.add('active');
    createConnectionLine(i);
  }, item.delay);
});

/* ==================== 连接线动画 ==================== */
function createConnectionLine(index) {
  const lineGeo = new THREE.BufferGeometry();
  const positions = new Float32Array(6);
  positions[0] = core.position.x; positions[1] = core.position.y; positions[2] = core.position.z;
  positions[3] = (Math.random()-0.5)*10; positions[4] = (Math.random()-0.5)*10; positions[5] = (Math.random()-0.5)*10;

  lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0 });
  const line = new THREE.Line(lineGeo, lineMat);
  scene.add(line);
  lines.push({ line, target: index });

  // 渐显
  let opacity = 0;
  const animateLine = () => {
    opacity += 0.02;
    line.material.opacity = opacity;
    if (opacity < 1) requestAnimationFrame(animateLine);
  };
  animateLine();
}

/* ==================== 渲染循环 ==================== */
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // 核心脉动
  core.scale.setScalar(1 + Math.sin(Date.now() * 0.001) * 0.1);

  // 粒子旋转
  starField.rotation.y += 0.0001;

  // 连接线跟随
  lines.forEach(l => {
    const pos = l.line.geometry.attributes.position;
    const time = Date.now() * 0.001 + l.target;
    pos.array[3] = Math.sin(time) * 3;
    pos.array[4] = Math.cos(time) * 2;
    pos.array[5] = Math.sin(time * 1.3) * 2;
    pos.needsUpdate = true;
  });

  renderer.render(scene, camera);
}
animate();

/* ==================== 自适应 ==================== */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
