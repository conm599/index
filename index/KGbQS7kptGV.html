<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简网络测速</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text-main);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: #f3f4f6;
            padding: 1.5rem 1rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .metric-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .metric-unit {
            font-size: 1rem;
            font-weight: 500;
        }

        .progress-container {
            width: 100%;
            height: 0.5rem;
            background: #e5e7eb;
            border-radius: 9999px;
            margin-bottom: 1rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            min-height: 1.25rem;
        }

        button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) {
            background: #4338ca;
            transform: translateY(-1px);
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>网络性能测速</h1>
    
    <div class="metrics-grid">
        <div class="metric-card">
            <span class="metric-label">延迟 (Ping)</span>
            <div class="metric-value">
                <span id="ping-val">--</span>
                <span class="metric-unit">ms</span>
            </div>
        </div>
        <div class="metric-card">
            <span class="metric-label">下载速度</span>
            <div class="metric-value">
                <span id="speed-val">0.00</span>
                <span class="metric-unit">Mbps</span>
            </div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div class="status-text" id="status-text">准备就绪，点击下方按钮开始测试</div>
    
    <button id="start-btn" onclick="startSpeedTest()">开始测速 (24线程)</button>
</div>

<script>
    // 目标测试文件配置
    const TEST_URL = 'https://fmv.vpnmnm.ggff.net/200m';
    const THREAD_COUNT = 24;      // 并发线程数
    const TEST_DURATION = 15000;  // 测速持续时间：15秒

    let abortController = null;
    let speedInterval = null;

    async function startSpeedTest() {
        const btn = document.getElementById('start-btn');
        const pingVal = document.getElementById('ping-val');
        const speedVal = document.getElementById('speed-val');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');

        // 初始化状态
        btn.disabled = true;
        btn.innerText = '测速中...';
        pingVal.innerText = '--';
        speedVal.innerText = '0.00';
        progressBar.style.width = '0%';
        
        if (abortController) abortController.abort();
        abortController = new AbortController();
        const signal = abortController.signal;

        try {
            // 1. 测延迟 (Ping)
            statusText.innerText = '正在测试延迟...';
            const ping = await measurePing(signal);
            pingVal.innerText = ping;

            // 2. 多线程测速 (Download)
            statusText.innerText = `正在下载测试 (${THREAD_COUNT} 线程)...`;
            await runDownloadThreads(signal, speedVal, progressBar, statusText);

        } catch (err) {
            if (err.name === 'AbortError') {
                statusText.innerText = '测速已完成。';
            } else {
                statusText.innerText = '测速发生错误，请检查网络或跨域(CORS)设置。';
                console.error(err);
            }
        } finally {
            btn.disabled = false;
            btn.innerText = '重新测速';
            if (speedInterval) clearInterval(speedInterval);
        }
    }

    // 测量延迟（通过发起请求的耗时计算）
    async function measurePing(signal) {
        const start = performance.now();
        try {
            // 加时间戳防止缓存
            await fetch(`${TEST_URL}?ping=${Date.now()}`, { 
                method: 'HEAD', 
                mode: 'cors',
                signal 
            });
        } catch (e) {
            // 如果 HEAD 请求因 CORS 被拒，捕获异常但不中断
        }
        return Math.round(performance.now() - start);
    }

    // 执行多线程下载测速
    async function runDownloadThreads(signal, speedElement, progressElement, statusElement) {
        let totalBytesLoaded = 0;
        let lastBytesLoaded = 0;
        const startTime = performance.now();
        let lastTime = startTime;

        // 定时器：每 500ms 计算并刷新一次当前速度
        speedInterval = setInterval(() => {
            const now = performance.now();
            const timeDiff = (now - lastTime) / 1000; // 转换为秒
            const bytesDiff = totalBytesLoaded - lastBytesLoaded;
            
            if (timeDiff > 0) {
                // 计算 Mbps: 字节 * 8 / 1024 / 1024 = 兆比特
                const speedBps = (bytesDiff * 8); 
                const speedMbps = speedBps / 1024 / 1024 / timeDiff;
                speedElement.innerText = speedMbps.toFixed(2);
            }

            lastBytesLoaded = totalBytesLoaded;
            lastTime = now;

            // 更新进度条
            const elapsed = now - startTime;
            const progress = Math.min((elapsed / TEST_DURATION) * 100, 100);
            progressElement.style.width = `${progress}%`;
            
            // 将累计下载量显示在状态栏
            const downloadedMB = (totalBytesLoaded / 1024 / 1024).toFixed(1);
            statusElement.innerText = `多线程全速下载中... 已接收 ${downloadedMB} MB`;

        }, 500);

        // 创建下载任务 (流式读取并丢弃数据，防止内存溢出)
        const createThread = async () => {
            try {
                const response = await fetch(`${TEST_URL}?t=${Math.random()}`, { signal });
                if (!response.ok) return;
                const reader = response.body.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (value) {
                        totalBytesLoaded += value.length; // 仅统计流量，不保存到内存
                    }
                }
            } catch (e) {
                // 忽略主动 Abort 产生的错误
            }
        };

        // 并发触发 24 个线程
        const threads = [];
        for (let i = 0; i < THREAD_COUNT; i++) {
            threads.push(createThread());
        }

        // 设定硬性超时，到达时间后掐断所有请求并结算最终平均速度
        return new Promise((resolve) => {
            setTimeout(() => {
                abortController.abort(); // 掐断底层 Fetch
                clearInterval(speedInterval);
                progressElement.style.width = '100%';
                
                // 计算最终综合平均速度
                const totalSeconds = (performance.now() - startTime) / 1000;
                const finalMbps = (totalBytesLoaded * 8 / 1024 / 1024) / totalSeconds;
                speedElement.innerText = finalMbps.toFixed(2);
                statusElement.innerText = '测速完成';
                
                resolve();
            }, TEST_DURATION);
        });
    }
</script>

</body>
</html>
