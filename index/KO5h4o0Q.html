<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全端适配-重力歌词</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #080808;
            overflow: hidden;
            font-family: 'Montserrat', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1000px;
            /* 防止移动端点击高亮 */
            -webkit-tap-highlight-color: transparent;
        }

        #stage {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b1b1b 0%, #000000 80%);
        }

        /* --- 核心适配修改区域 START --- */
        .lyric-line {
            position: absolute;
            top: 45%; /* 稍微往上提一点，防止多行歌词挡住屏幕下方 */
            left: 50%; /* 左边距50% */
            transform: translate(-50%, -50%); /* 居中修正 */
            
            width: 90%; /* 手机端保留左右边距 */
            max-width: 1200px; /* 电脑端限制最大宽度 */
            
            text-align: center;
            pointer-events: none;
            transform-style: preserve-3d;
            
            /* 关键点：允许弹性换行 */
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; /* 换行后依然居中 */
            align-content: center;
        }

        .char {
            display: inline-block;
            
            /* 关键点：智能字号 clamp(最小值, 推荐值, 最大值)
               手机端最小 2rem
               电脑端最大 4.5rem
               中间根据视口宽度(6vw)自动调整
            */
            font-size: clamp(2rem, 6vw, 4.5rem);
            font-weight: 900;
            
            /* 增加行高，防止换行后上下字打架 */
            line-height: 1.3; 
            /* 左右留一点点空隙，增加阅读舒适度 */
            margin: 0 2px;
            
            opacity: 0;
            background-image: linear-gradient(to bottom right, #4facfe 0%, #00f2fe 30%, #f093fb 60%, #f5576c 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(79, 172, 254, 0.4)); /* 手机端光晕稍微减弱一点，提升性能 */
            
            transform: translateY(-120vh) scale(0.8);
            will-change: transform, opacity;
        }
        /* --- 核心适配修改区域 END --- */

        /* 动画保持之前的丝滑版本 */
        @keyframes dropInSmooth {
            0% { opacity: 0; transform: translateY(-120vh) scale(0.8); filter: blur(8px); animation-timing-function: ease-in; }
            50% { opacity: 1; transform: translateY(30px) scaleY(0.9); filter: blur(2px); animation-timing-function: ease-out; }
            65% { transform: translateY(-15px) scaleY(1.02); filter: blur(0); animation-timing-function: ease-in-out; }
            80% { transform: translateY(8px) scaleY(0.98); animation-timing-function: ease-in-out; }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        @keyframes floatingSmooth {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(0.5deg); }
        }

        @keyframes dropOutSmooth {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            25% { opacity: 0.8; transform: translateY(-30px) rotate(-5deg); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
            100% { opacity: 0; transform: translateY(130vh) rotate(15deg); filter: blur(4px); }
        }

        .char.animate-in { animation: dropInSmooth 1s forwards; }
        .char.animate-float { animation: floatingSmooth 4s ease-in-out infinite; }
        .char.animate-out { animation: dropOutSmooth 0.9s forwards; }

        #control {
            position: absolute;
            bottom: 10%; /* 手机端按钮位置调整 */
            z-index: 100;
            padding: 12px 30px;
            background: linear-gradient(to right, #4facfe, #f5576c);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="stage"></div>
    <button id="control" onclick="startLyrics()">开始播放 (手机适配版)</button>

    <script>
        // 增加了一些长短不一的歌词来测试手机端换行效果
        const lyricsData = [
            { text: "这是一个适配手机的版本", duration: 3.0 },
            { text: "如果歌词非常非常长它会自动换行", duration: 4.0 },
            { text: "短句依然居中", duration: 2.5 },
            { text: "即使是像这样超级长的一段话它也能在屏幕里完美显示并且保持掉落动画的连贯性", duration: 6.0 },
            { text: "字体大小会自动缩放", duration: 3.0 },
            { text: "视觉效果依然丝滑", duration: 3.0 }
        ];

        let currentIndex = 0;
        const stage = document.getElementById('stage');
        const btn = document.getElementById('control');

        function startLyrics() {
            btn.style.display = 'none';
            playLine(0);
        }

        function playLine(index) {
            if (index >= lyricsData.length) return;

            const currentLineData = lyricsData[index];
            const text = currentLineData.text;
            const totalDuration = currentLineData.duration * 1000;
            
            // 算法：保持不变，依然根据字数动态计算
            let interval = (currentLineData.duration / text.length) - 0.12;
            if (interval > 0.25) interval = 0.25;
            if (interval < 0.04) interval = 0.04;

            const lineContainer = document.createElement('div');
            lineContainer.className = 'lyric-line';
            stage.appendChild(lineContainer);

            const chars = [];
            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('span');
                span.innerText = text[i];
                span.className = 'char';
                lineContainer.appendChild(span);
                chars.push(span);
            }

            chars.forEach((char, i) => {
                const delay = i * interval * 1000; 
                setTimeout(() => {
                    char.classList.add('animate-in');
                    setTimeout(() => {
                        if (!char.classList.contains('animate-out')) {
                            char.classList.remove('animate-in');
                            char.style.opacity = 1;
                            // 注意：这里不用 js 强行重置 transform，交给 css 动画状态管理
                            // 否则可能打断换行后的布局位置
                            char.style.transform = 'translateY(0) scale(1)'; 
                            char.style.filter = 'blur(0)';
                            char.classList.add('animate-float');
                        }
                    }, 1000); 
                }, delay);
            });

            setTimeout(() => {
                chars.forEach((char, i) => {
                    setTimeout(() => {
                        char.classList.remove('animate-in', 'animate-float');
                        char.classList.add('animate-out');
                    }, i * 40); 
                });

                setTimeout(() => {
                    lineContainer.remove();
                }, 1500);

                playLine(index + 1);

            }, totalDuration);
        }
    </script>
</body>
</html>
