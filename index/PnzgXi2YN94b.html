<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对话预测AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .chat-container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 85vh;
        }
        
        .chat-header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .chat-header p {
            opacity: 0.8;
            font-size: 14px;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            max-width: 70%;
            padding: 12px 18px;
            margin-bottom: 15px;
            border-radius: 18px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            align-self: flex-end;
            background: #4b6cb7;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .ai-message {
            align-self: flex-start;
            background: #f0f2f5;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .prediction-section {
            background: #e3f2fd;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            border-left: 4px solid #2196f3;
        }
        
        .prediction-title {
            font-weight: bold;
            color: #1565c0;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .prediction-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .prediction-option {
            background: white;
            border: 1px solid #bbdefb;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .prediction-option:hover {
            background: #e3f2fd;
            transform: translateY(-2px);
        }
        
        .chat-input-container {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            transition: border 0.3s;
        }
        
        .chat-input:focus {
            border-color: #4b6cb7;
        }
        
        .send-button {
            background: #4b6cb7;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        
        .send-button:hover {
            background: #3a5999;
        }
        
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: #f0f2f5;
            color: #666;
            padding: 12px 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            border-bottom-left-radius: 5px;
        }
        
        .typing-dots {
            display: flex;
        }
        
        .typing-dots span {
            height: 8px;
            width: 8px;
            background-color: #999;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.5s infinite;
        }
        
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        @media (max-width: 600px) {
            .chat-container {
                height: 90vh;
            }
            
            .message {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>智能对话预测AI</h1>
            <p>我能预测您接下来可能想说的话，试试看吧！</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">
                您好！我是智能对话预测AI。我可以尝试预测您接下来可能想说的话。请随意与我聊天！
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="userInput" placeholder="输入您的消息...">
            <button class="send-button" id="sendButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // 对话知识库和预测逻辑
        const knowledgeBase = {
            greetings: {
                patterns: ["你好", "您好", "嗨", "hello", "hi", "早上好", "下午好", "晚上好"],
                responses: [
                    "您好！很高兴与您聊天。",
                    "嗨！今天过得怎么样？",
                    "你好！有什么我可以帮助您的吗？"
                ],
                predictions: [
                    "您今天过得怎么样？",
                    "有什么新鲜事想分享吗？",
                    "您最近在忙什么？"
                ]
            },
            feelings: {
                patterns: ["开心", "高兴", "难过", "伤心", "生气", "愤怒", "失望", "兴奋"],
                responses: [
                    "我理解您的感受。",
                    "情绪是生活的一部分，我在这里倾听。",
                    "感谢您分享您的感受。"
                ],
                predictions: [
                    "是什么让您有这种感觉？",
                    "您想多谈谈这个感受吗？",
                    "这种情况持续多久了？"
                ]
            },
            weather: {
                patterns: ["天气", "下雨", "晴天", "温度", "气候", "天气预报"],
                responses: [
                    "天气确实会影响我们的心情。",
                    "您喜欢什么样的天气？",
                    "我无法获取实时天气，但可以聊聊天气话题。"
                ],
                predictions: [
                    "您那里的天气怎么样？",
                    "您喜欢晴天还是雨天？",
                    "天气对您的计划有影响吗？"
                ]
            },
            hobbies: {
                patterns: ["爱好", "兴趣", "运动", "读书", "音乐", "电影", "游戏", "旅游"],
                responses: [
                    "爱好让生活更有趣。",
                    "您有什么特别的爱好吗？",
                    "我也对这方面感兴趣！"
                ],
                predictions: [
                    "您经常从事这个爱好吗？",
                    "您是从什么时候开始对这个感兴趣的？",
                    "您能推荐一些相关的资源吗？"
                ]
            },
            food: {
                patterns: ["食物", "美食", "餐厅", "烹饪", "食谱", "吃饭", "早餐", "午餐", "晚餐"],
                responses: [
                    "美食总是让人心情愉悦。",
                    "您喜欢什么类型的食物？",
                    "谈论食物让我都饿了！"
                ],
                predictions: [
                    "您最喜欢的一道菜是什么？",
                    "您会做饭吗？",
                    "您有推荐的餐厅吗？"
                ]
            },
            work: {
                patterns: ["工作", "职业", "公司", "项目", "会议", "同事", "老板", "加班"],
                responses: [
                    "工作是我们生活的重要组成部分。",
                    "您的工作听起来很有趣。",
                    "平衡工作和生活很重要。"
                ],
                predictions: [
                    "您喜欢您的工作吗？",
                    "您的工作中最有挑战的部分是什么？",
                    "您有职业规划吗？"
                ]
            },
            default: {
                responses: [
                    "很有意思的观点！",
                    "请告诉我更多。",
                    "我明白了，请继续。",
                    "这很有趣，然后呢？"
                ],
                predictions: [
                    "您能详细说明一下吗？",
                    "关于这个话题您还有什么想说的？",
                    "这让我想到..."
                ]
            }
        };

        // 对话历史记录
        let conversationHistory = [];
        
        // DOM元素
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        
        // 发送消息函数
        function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;
            
            // 添加用户消息到聊天界面
            addMessage(message, 'user');
            userInput.value = '';
            
            // 保存到对话历史
            conversationHistory.push({ role: 'user', content: message });
            
            // 显示"正在输入"指示器
            typingIndicator.style.display = 'flex';
            
            // 模拟AI思考时间
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                
                // 生成AI回复
                const aiResponse = generateAIResponse(message);
                
                // 添加AI回复到聊天界面
                addMessage(aiResponse.response, 'ai');
                
                // 如果有预测，添加预测部分
                if (aiResponse.predictions && aiResponse.predictions.length > 0) {
                    addPredictionSection(aiResponse.predictions);
                }
                
                // 保存到对话历史
                conversationHistory.push({ role: 'ai', content: aiResponse.response });
            }, 1500);
        }
        
        // 添加消息到聊天界面
        function addMessage(content, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.classList.add(sender === 'user' ? 'user-message' : 'ai-message');
            messageElement.textContent = content;
            
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 添加预测部分
        function addPredictionSection(predictions) {
            const predictionElement = document.createElement('div');
            predictionElement.classList.add('prediction-section');
            
            const predictionTitle = document.createElement('div');
            predictionTitle.classList.add('prediction-title');
            predictionTitle.textContent = '您可能想接着问：';
            
            const predictionOptions = document.createElement('div');
            predictionOptions.classList.add('prediction-options');
            
            predictions.forEach(prediction => {
                const option = document.createElement('div');
                option.classList.add('prediction-option');
                option.textContent = prediction;
                option.addEventListener('click', () => {
                    userInput.value = prediction;
                    sendMessage();
                });
                predictionOptions.appendChild(option);
            });
            
            predictionElement.appendChild(predictionTitle);
            predictionElement.appendChild(predictionOptions);
            
            chatMessages.appendChild(predictionElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 生成AI回复
        function generateAIResponse(userMessage) {
            // 转换为小写以便匹配
            const lowerMessage = userMessage.toLowerCase();
            
            // 查找匹配的知识库类别
            let matchedCategory = 'default';
            
            for (const category in knowledgeBase) {
                if (category === 'default') continue;
                
                const patterns = knowledgeBase[category].patterns;
                for (const pattern of patterns) {
                    if (lowerMessage.includes(pattern.toLowerCase())) {
                        matchedCategory = category;
                        break;
                    }
                }
                if (matchedCategory !== 'default') break;
            }
            
            // 从匹配的类别中随机选择回复和预测
            const category = knowledgeBase[matchedCategory];
            const response = category.responses[Math.floor(Math.random() * category.responses.length)];
            const predictions = category.predictions ? 
                category.predictions : knowledgeBase.default.predictions;
            
            return {
                response: response,
                predictions: predictions
            };
        }
        
        // 事件监听
        sendButton.addEventListener('click', sendMessage);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 初始焦点在输入框
        userInput.focus();
    </script>
</body>
</html>
