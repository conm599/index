<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义搜索起始页</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            /* 整体背景使用非常淡的清透蓝白 */
            background-color: #F0F5FF; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 50px 60px;
            border-radius: 32px;
            /* 柔和的环境光阴影 */
            box-shadow: 0 20px 40px rgba(153, 208, 255, 0.2);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* 搜索引擎切换区 */
        .engine-selector {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 35px;
        }

        .engine-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.4;
            filter: grayscale(100%);
            padding: 8px;
            background: transparent;
        }

        .engine-btn:hover {
            opacity: 0.8;
            transform: translateY(-2px);
        }

        /* 激活状态 */
        .engine-btn.active {
            opacity: 1;
            filter: grayscale(0%);
            background: white;
            box-shadow: 0 4px 15px rgba(153, 208, 255, 0.6);
            transform: translateY(-2px) scale(1.1);
        }

        /* 搜索框区域 */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 500px;
            padding: 18px 120px 18px 30px;
            /* 胶囊形设计 */
            border-radius: 50px; 
            border: 2px solid #e2e8f0;
            font-size: 16px;
            outline: none;
            background: white;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            /* 聚焦时的高亮颜色 */
            border-color: #99D0FF; 
            box-shadow: 0 0 0 4px rgba(153, 208, 255, 0.3);
        }

        .search-submit {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            padding: 0 30px;
            border-radius: 40px;
            border: none;
            /* 按钮主题色 */
            background-color: #99D0FF; 
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-submit:hover {
            background-color: #7ab8f5;
            box-shadow: 0 4px 12px rgba(153, 208, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="search-container">
        <div class="engine-selector" id="engine-selector">
            <img src="https://www.google.com/favicon.ico" class="engine-btn active" data-engine="google" alt="Google">
            <img src="https://www.bing.com/favicon.ico" class="engine-btn" data-engine="bing" alt="Bing">
            <img src="https://www.baidu.com/favicon.ico" class="engine-btn" data-engine="baidu" alt="Baidu">
        </div>

        <form id="search-form" action="https://www.google.com/search" method="GET" target="_blank">
            <div class="search-box">
                <input type="text" id="search-input" name="q" class="search-input" placeholder="输入你想搜索的内容..." autocomplete="off" autofocus>
                <button type="submit" class="search-submit">搜索</button>
            </div>
        </form>
    </div>

    <script>
        // 配置各家搜索引擎的提交地址和搜索词参数名
        const engines = {
            google: { url: 'https://www.google.com/search', param: 'q', placeholder: '使用 Google 搜索...' },
            bing:   { url: 'https://www.bing.com/search', param: 'q', placeholder: '使用 Bing 搜索...' },
            baidu:  { url: 'https://www.baidu.com/s', param: 'wd', placeholder: '使用百度搜索...' }
        };

        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const btns = document.querySelectorAll('.engine-btn');

        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 1. 移除所有 active 类
                btns.forEach(b => b.classList.remove('active'));
                // 2. 为当前点击的按钮添加 active 类
                btn.classList.add('active');

                // 3. 动态更改表单的 action 和 input 的 name
                const engineKey = btn.getAttribute('data-engine');
                const config = engines[engineKey];
                
                form.action = config.url;
                input.name = config.param;
                input.placeholder = config.placeholder;
                
                // 4. 切换后自动聚焦到输入框
                input.focus();
            });
        });
    </script>
</body>
</html>
