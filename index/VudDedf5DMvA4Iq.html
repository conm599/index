<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muse Pro - 图标与背景修复版</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: rgba(30, 30, 30, 0.6); 
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --player-height: 90px;
            --sidebar-width: 220px;
            --lyric-base-size: 22px;
            --glass-blur: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* === 全局背景层 === */
        #global-bg {
            position: fixed; top: -20px; left: -20px; right: -20px; bottom: -20px; z-index: -1;
            background-position: center; background-size: cover; background-repeat: no-repeat;
            transition: filter 0.3s ease;
        }
        #global-bg.default-bg { background-image: linear-gradient(180deg, #1a1a1a 0%, #050505 100%); }

        /* === 布局框架 === */
        .app-layout { display: flex; height: 100%; position: relative; }

        /* === 侧边栏 === */
        .sidebar {
            position: fixed; left: -100%; top: 0; height: 100%; width: var(--sidebar-width); 
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
            padding: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 300;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .sidebar.active { left: 0; }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            color: var(--text-sub); padding: 12px 16px; border-radius: 8px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { color: white; background: rgba(255,255,255,0.1); }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 299; }
        .sidebar-overlay.active { display: block; }

        /* === 主内容区 === */
        .main-content {
            flex: 1; height: 100%; 
            overflow-y: auto;
            padding: 20px 20px 120px; 
            position: relative;
        }
        
        /* === 通用组件 === */
        .top-bar {
            position: sticky; top: 0; background: transparent; padding: 10px 0; z-index: 10; 
            display: flex; justify-content: space-between; align-items: center; gap: 15px;
        }
        .mobile-menu-btn { 
            display: block; background: none; border: none; color: white; cursor: pointer; padding: 8px; 
            z-index: 1000; /* 提高图标层级 */
        }
        .btn-back-minimal {
            background: transparent; border: none; color: rgba(255,255,255,0.7); 
            cursor: pointer; padding: 10px; border-radius: 50%; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; /* 提高图标层级 */
        }
        .search-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 8px 20px; display: flex; align-items: center; width: 100%; max-width: 400px;
        }
        .search-box input { background: transparent; border: none; color: white; margin-left: 10px; width: 100%; font-size: 14px; }

        .song-row {
            display: grid; grid-template-columns: 40px 4fr 2fr 1fr; padding: 12px 10px;
            align-items: center; cursor: pointer; border-radius: 8px;
            background: transparent; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .song-row:hover { background: rgba(255, 255, 255, 0.1); }
        .song-index { color: #666; font-size: 14px; text-align: center; }
        .song-info { display: flex; align-items: center; gap: 15px; color: white; }
        .song-info img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
        .song-album-name, .song-duration { color: var(--text-sub); font-size: 13px; }
        
        .section-title { font-size: 24px; font-weight: 700; margin: 20px 0; }
        .search-tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-item { padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--text-sub); cursor: pointer; background: rgba(255,255,255,0.1); }
        .tab-item.active { background: var(--primary); color: black; }

        .album-header {
            display: flex; gap: 30px; margin-bottom: 20px; padding: 25px; 
            background: rgba(255, 255, 255, 0.05); border-radius: 16px; backdrop-filter: blur(10px); flex-wrap: wrap; justify-content: center;
        }
        .album-cover { width: 180px; height: 180px; border-radius: 10px; object-fit: cover; }
        .album-info { display: flex; flex-direction: column; justify-content: center; flex: 1; min-width: 200px; }
        .album-title { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .play-all-btn {
            background: var(--primary); color: black; border: none; border-radius: 50px;
            padding: 10px 28px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; width: fit-content; margin-top: 15px;
        }

        /* === 全屏播放器 === */
        .full-player {
            position: fixed; inset: 0; 
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(40px);
            z-index: 200; 
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .full-player.active { transform: translateY(0); }
        
        .fp-header { 
            flex: 0 0 auto;
            display: flex; justify-content: flex-end; align-items: center; gap: 20px; 
            padding: 15px 20px; z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }
        
        .fp-content { 
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex; padding: 20px 60px 120px; gap: 60px; 
        }
        
        .fp-left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .fp-cover-art { width: 100%; max-width: 350px; aspect-ratio: 1; border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); margin-bottom: 30px; object-fit: cover; }
        .fp-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .fp-artist { font-size: 18px; color: var(--text-sub); text-align: center; }

        .fp-right { flex: 1; display: flex; flex-direction: column; }
        
        /* 歌词容器 */
        .lyrics-box { 
            height: 400px;
            overflow-y: auto; 
            padding: 20px 0; 
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            text-align: left; 
        }
        
        .lyric-line { 
            font-size: var(--lyric-base-size, 22px); 
            font-weight: 700; color: rgba(255,255,255,0.3); margin: 26px 0; transition: 0.3s; cursor: pointer; 
        }
        .lyric-line.active { 
            font-size: calc(var(--lyric-base-size, 22px) + 6px); 
            color: white; transform: scale(1.05); transform-origin: left; text-shadow: 0 0 20px rgba(255,255,255,0.4); 
        }

        .related-section { 
            margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); 
        }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        .related-card { cursor: pointer; text-align: center; }
        .related-card img { width: 100%; border-radius: 6px; margin-bottom: 5px; opacity: 0.7; transition: 0.2s; }
        .related-title { font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* === 底部播放条 === */
        .footer-player {
            height: var(--player-height); background: rgba(0, 0, 0, 0.1); backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-player.visible { transform: translateY(0); }
        .circle-art { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); animation: rotate 10s linear infinite; animation-play-state: paused; }
        .circle-art.spinning { animation-play-state: running; }
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
        .btn-control { 
            background: none; border: none; color: #b3b3b3; cursor: pointer; transition: 0.2s; 
            z-index: 1000; /* 提高图标层级 */
        }
        .btn-control:hover { color: white; }
        .btn-play-mini { 
            width: 38px; height: 38px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; 
            z-index: 1000; /* 提高图标层级 */
        }
        .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.1); position: absolute; top: 0; left: 0; cursor: pointer; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; }

        .loader { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }

        /* === 移动端适配 === */
        @media (max-width: 768px) {
            .song-row { grid-template-columns: 30px 1fr; }
            .song-row > div:nth-child(3), .song-row > div:nth-child(4) { display: none; }
            .album-header { flex-direction: column; text-align: center; padding: 20px; }
            .album-cover { width: 160px; height: 160px; margin: 0 auto; }
            .play-all-btn { margin: 15px auto 0; }
            
            .fp-content { 
                display: block;
                padding: 60px 20px 120px; 
                height: auto;
            }
            .fp-left { display: block; margin-bottom: 30px; }
            .fp-cover-art { width: 260px; height: 260px; margin: 0 auto 20px; display: block; }
            .fp-right { display: block; height: auto; }
            
            .lyrics-box { height: 350px; margin-bottom: 30px; }
            
            .player-left { width: 60%; gap: 10px; } .player-center { width: 40%; }
            .footer-player .btn-control:not(.btn-play-mini) { display: none; }
        }
    </style>
</head>
<body>

    <div id="global-bg" class="default-bg"></div>
    <div class="sidebar-overlay" onclick="ui.toggleSidebar()"></div>

    <div class="app-layout">
        <nav class="sidebar" id="sidebar">
            <div class="logo"><span style="color:var(--primary)">Muse</span> Pro</div>
            <div class="nav-btn active" onclick="window.router.home(); ui.toggleSidebar();"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> 推荐首页</div>
            <div class="nav-btn" onclick="window.router.settings(); ui.toggleSidebar();"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.2-.15.25-.42.12-.64l-2-3.46c-.13-.22-.4-.3-.6-.17l-2.61 1.02c-.39-.37-.82-.71-1.27-.99L15 2h-4l-.27 2.06c-.45.28-.88.62-1.27.99L6.87 4.12c-.2-.13-.47-.05-.6.17l-2 3.46c-.13.22-.08.5.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.2.15-.25.42-.12.64l2 3.46c.13.22.4.3.6.17l2.61-1.02c.39.37.82.71 1.27.99L11 22h4l.27-2.06c.45-.28.88-.62 1.27-.99l2.61 1.02c.2.13.47.05.6-.17l2-3.46c.13-.22.08-.5-.12-.64l-2.11-1.65zm-7.43 3.52c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg> 设置</div>
        </nav>

        <main class="main-content" id="main-view"></main>
    </div>

    <div class="full-player" id="full-player">
        <div class="fp-header">
            <a href="#" class="btn-back-minimal" id="fp-download-btn" target="_blank" download title="下载">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
            <button class="btn-back-minimal" onclick="window.ui.toggleFullPlayer(false)" title="关闭">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <div class="fp-content">
            <div class="fp-left">
                <img src="" class="fp-cover-art" id="fp-cover">
                <div class="fp-meta">
                    <div class="fp-title" id="fp-title"></div>
                    <div class="fp-artist" id="fp-artist"></div>
                </div>
            </div>
            <div class="fp-right">
                <div class="lyrics-box" id="lyrics-box"><div class="lyric-line">等待播放...</div></div>
                <div class="related-section" id="related-section">
                    <div style="color:#ccc; font-size:12px; margin-bottom:10px;">猜你喜欢</div>
                    <div class="related-grid" id="related-container"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-player" id="footer-player">
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="player-left">
            <img src="" class="circle-art" id="mini-cover" onclick="window.ui.toggleFullPlayer(true)">
            <div style="display:flex; flex-direction:column; justify-content:center;">
                <div style="color:white; font-size:14px; cursor:pointer;" id="mini-title" onclick="window.ui.toggleFullPlayer(true)"></div>
                <div style="color:#888; font-size:12px;" id="mini-artist"></div>
            </div>
        </div>
        <div class="player-center">
            <div class="controls">
                <button class="btn-control" onclick="window.player.prev()"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn-play-mini" onclick="window.player.toggle()">
                    <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-control" onclick="window.player.next()"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
        </div>
        <div style="width:30%;"></div>
    </footer>

    <div class="loader" id="loader"><div class="spinner"></div></div>
    <audio id="audio"></audio>

    <script>
        const API = 'https://163api.qijieya.cn';
        const state = { playlist: [], index: 0, playing: false, lyrics: [], userScroll: false, scrollTimer: null, history: [{type: 'home'}] };
        var userSettings = { bgUrl: '', bgBlur: 50, lyricSize: 22, showRelated: true, quality: 'standard' };

        function initSettings() {
            try { 
                const s = localStorage.getItem('museProSettings'); 
                if(s) {
                    const parsed = JSON.parse(s);
                    userSettings = {...userSettings, ...parsed};
                }
            } catch(e){}
            applySettings();
        }

        function applySettings() {
            const bg = document.getElementById('global-bg');
            const root = document.documentElement;
            
            // 修复背景图显示问题
            if(userSettings.bgUrl && userSettings.bgUrl.trim() !== '') { 
                bg.style.backgroundImage = `url('${userSettings.bgUrl}')`; 
                bg.classList.remove('default-bg'); 
            } else { 
                bg.style.backgroundImage = ''; 
                bg.classList.add('default-bg'); 
            }
            
            const blur = userSettings.bgBlur * 0.1;
            bg.style.filter = userSettings.bgBlur > 0 ? `blur(${blur}px)` : 'none';
            
            // 强制刷新歌词大小CSS变量
            root.style.setProperty('--lyric-base-size', `${userSettings.lyricSize}px`);
            
            // 刷新歌词显示
            const lyricLines = document.querySelectorAll('.lyric-line');
            lyricLines.forEach(line => {
                line.style.fontSize = `${userSettings.lyricSize}px`;
                if(line.classList.contains('active')) {
                    line.style.fontSize = `${userSettings.lyricSize + 6}px`;
                }
            });
            
            // 相似推荐显示控制
            const rel = document.getElementById('related-section');
            if(rel) rel.style.display = userSettings.showRelated ? 'block' : 'none';
        }

        function saveSettings() {
            localStorage.setItem('museProSettings', JSON.stringify(userSettings));
        }

        var ui = {
            el: id => document.getElementById(id),
            loading(show) { this.el('loader').style.display = show ? 'flex' : 'none'; },
            toggleSidebar() {
                this.el('sidebar').classList.toggle('active');
                document.querySelector('.sidebar-overlay').classList.toggle('active');
            },
            setActiveNav(name) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                if (name === 'home') document.querySelectorAll('.nav-btn')[0]?.classList.add('active');
                if (name === 'settings') document.querySelectorAll('.nav-btn')[1]?.classList.add('active');
            },
            renderHome() {
                this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="search-box"><svg width="18" height="18" fill="#ccc" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input type="text" placeholder="搜索..." onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)"></div><div style="width:24px"></div></div><div class="content-wrapper"><div class="section-title">🔥 热门推荐</div><div class="song-list" id="hot-list-container"></div></div>`;
                this.loadHot(); 
                this.setActiveNav('home');
            },
            async loadHot() {
                this.loading(true); 
                const res = await window.api.get('/playlist/detail?id=3778678'); 
                this.loading(false);
                window.hotList = res.playlist.tracks.slice(0, 50);
                this.el('hot-list-container').innerHTML = this.renderList(window.hotList, 'hotList');
            },
            renderList(list, listName) {
                return list.map((s, i) => `
                    <div class="song-row" onclick="window.player.playList('${listName}', ${i})">
                        <div class="song-index">${i+1}</div>
                        <div class="song-info">
                            <img src="${s.al ? s.al.picUrl : (s.album ? s.album.picUrl : '')}?param=100y100" onerror="this.src='https://via.placeholder.com/100'">
                            <div><div style="font-weight:600; color:white;">${s.name}</div><div style="font-size:12px; color:#ccc;">${s.ar ? s.ar.map(a=>a.name).join('/') : (s.artists ? s.artists.map(a=>a.name).join('/') : '未知')}</div></div>
                        </div>
                        <div class="song-album-name">${s.al ? s.al.name : (s.album ? s.album.name : '')}</div>
                        <div class="song-duration">${window.player.fmtTime((s.dt||s.duration)/1000)}</div>
                    </div>
                `).join('');
            },
            renderSettings() {
                this.el('main-view').innerHTML = `
                    <div class="top-bar">
                        <button class="mobile-menu-btn" onclick="ui.toggleSidebar()">
                            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                            </svg>
                        </button>
                        <h2 style="font-weight:700">设置</h2>
                        <button class="btn-back-minimal" onclick="window.router.home()">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="content-wrapper" style="padding:20px 0">
                        <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:16px; margin-bottom:20px;">
                            <h3 style="margin-bottom:15px; color:var(--primary)">个性化</h3>
                            <div style="margin-bottom:20px">
                                <label style="display:block; margin-bottom:10px; font-weight:600">背景模糊度: <span id="blur-val">${userSettings.bgBlur}%</span></label>
                                <input type="range" min="0" max="100" value="${userSettings.bgBlur}" oninput="document.getElementById('blur-val').innerText=this.value+'%'; userSettings.bgBlur=parseInt(this.value); saveSettings(); applySettings();" style="width:100%">
                            </div>
                            <div style="margin-bottom:20px">
                                <label style="display:block; margin-bottom:10px; font-weight:600">上传背景图</label>
                                <input type="file" accept="image/*" onchange="ui.handleBg(this)" style="color:white">
                                <div id="bg-preview" style="margin-top:10px; display:${userSettings.bgUrl ? 'block' : 'none'}">
                                    <div style="font-size:12px; color:#ccc; margin-bottom:5px;">当前背景预览:</div>
                                    <div style="width:100px; height:60px; background-image:url('${userSettings.bgUrl}'); background-size:cover; background-position:center; border-radius:4px;"></div>
                                    <button onclick="userSettings.bgUrl=''; saveSettings(); applySettings(); document.getElementById('bg-preview').style.display='none';" style="margin-top:5px; background:#c0392b; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px;">移除背景</button>
                                </div>
                            </div>
                        </div>
                        <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:16px;">
                            <h3 style="margin-bottom:15px; color:var(--primary)">播放器</h3>
                            <div style="margin-bottom:20px">
                                <label style="display:block; margin-bottom:10px; font-weight:600">歌词大小: <span id="size-val">${userSettings.lyricSize}px</span></label>
                                <input type="range" min="16" max="36" value="${userSettings.lyricSize}" oninput="document.getElementById('size-val').innerText=this.value+'px'; userSettings.lyricSize=parseInt(this.value); saveSettings(); applySettings();" style="width:100%">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <label style="font-weight: 600;">显示相似推荐</label>
                                <input type="checkbox" ${userSettings.showRelated ? 'checked' : ''} onchange="userSettings.showRelated=this.checked; saveSettings(); applySettings();" style="width: 20px; height: 20px;">
                            </div>
                        </div>
                    </div>
                `;
                this.setActiveNav('settings');
            },
            handleBg(input) {
                if(input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = e => { 
                        userSettings.bgUrl = e.target.result; 
                        saveSettings(); 
                        applySettings();
                        document.getElementById('bg-preview').style.display = 'block';
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            },
            toggleFullPlayer(show) {
                const fp = this.el('full-player');
                if(show) { 
                    fp.classList.add('active'); 
                } else { 
                    fp.classList.remove('active'); 
                }
                const rel = document.getElementById('related-section');
                if(rel) rel.style.display = userSettings.showRelated ? 'block' : 'none';
            }
        };

        window.api = {
            get: async u => (await fetch(API+u)).json(),
            search: (kw, type) => window.api.get(`/cloudsearch?keywords=${kw}&type=${type}`),
            url: id => { const l = userSettings.quality||'standard'; return window.api.get(`/song/url/v1?id=${id}&level=${l}`); },
            album: id => window.api.get(`/album?id=${id}`),
            playlist: id => window.api.get(`/playlist/detail?id=${id}`),
            lyric: id => window.api.get(`/lyric?id=${id}`),
            simi: id => window.api.get(`/simi/song?id=${id}`)
        };

        window.player = {
            audio: document.getElementById('audio'),
            init() {
                this.audio.addEventListener('timeupdate', () => {
                    const cur = this.audio.currentTime;
                    ui.el('progress-fill').style.width = (cur / this.audio.duration * 100) + '%';
                    this.syncLyrics(cur);
                });
                this.audio.addEventListener('ended', () => this.next());
                ui.el('progress-bar').addEventListener('click', e => {
                    const pct = e.offsetX / e.target.offsetWidth;
                    this.audio.currentTime = pct * this.audio.duration;
                });
                ui.el('lyrics-box').addEventListener('scroll', () => {
                    state.userScroll = true;
                    clearTimeout(state.scrollTimer);
                    state.scrollTimer = setTimeout(() => state.userScroll = false, 4000);
                });
            },
            async playList(listName, index) {
                const list = window[listName];
                if(!list) return;
                state.playlist = list.map(s => ({
                    id: s.id, name: s.name, 
                    artist: s.ar ? s.ar.map(a=>a.name).join('/') : (s.artists ? s.artists.map(a=>a.name).join('/') : '未知'),
                    cover: s.al && s.al.picUrl ? s.al.picUrl : (s.album && s.album.picUrl ? s.album.picUrl : 'https://via.placeholder.com/300'),
                    dt: s.dt || s.duration
                }));
                state.index = index;
                this.loadSong();
                ui.el('footer-player').classList.add('visible');
            },
            async loadSong() {
                const song = state.playlist[state.index];
                ui.loading(true);
                const set = (id, t) => { if(ui.el(id)) ui.el(id).innerText = t; };
                const setImg = (id, s) => { if(ui.el(id)) ui.el(id).src = s; };
                set('mini-title', song.name); set('mini-artist', song.artist); setImg('mini-cover', song.cover);
                set('fp-title', song.name); set('fp-artist', song.artist); setImg('fp-cover', song.cover);
                try {
                    const res = await window.api.url(song.id);
                    const url = res.data[0].url;
                    if (url) {
                        this.audio.src = url; this.audio.play(); state.playing = true; this.updateBtn();
                        ui.el('fp-download-btn').href = url;
                        this.loadLyrics(song.id); this.loadSimi(song.id);
                    } else { alert('VIP/无版权'); }
                } catch(e){}
                ui.loading(false);
            },
            async loadLyrics(id) {
                const res = await window.api.lyric(id);
                state.lyrics = [];
                const box = ui.el('lyrics-box');
                if(res.lrc) {
                    state.lyrics = res.lrc.lyric.split('\n').map(l => {
                        const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/.exec(l);
                        return m ? { t: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/1000, txt: m[4] } : null;
                    }).filter(x=>x);
                    box.innerHTML = state.lyrics.map((l,i) => `<div class="lyric-line" id="l-${i}" onclick="window.player.seek(${l.t})">${l.txt}</div>`).join('');
                } else { box.innerHTML = '<div class="lyric-line">纯音乐 / 无歌词</div>'; }
                
                // 应用歌词大小设置
                applySettings();
            },
            async loadSimi(id) {
                ui.el('related-container').innerHTML = '';
                if(!userSettings.showRelated) return;
                const res = await window.api.simi(id);
                if(res.songs) {
                    window.simiList = res.songs;
                    ui.el('related-container').innerHTML = res.songs.slice(0,6).map((s,i) => `<div class="related-card" onclick="window.player.playList('simiList', ${i})"><img src="${s.album.picUrl}?param=100y100"><div class="related-title">${s.name}</div></div>`).join('');
                }
            },
            syncLyrics(t) {
                if(state.lyrics.length === 0) return;
                let idx = state.lyrics.findIndex(l => l.t > t) - 1;
                if(idx < 0) idx = 0;
                document.querySelector('.lyric-line.active')?.classList.remove('active');
                const line = ui.el('l-'+idx);
                if(line) { 
                    line.classList.add('active'); 
                    if(!state.userScroll) line.scrollIntoView({behavior:'smooth', block:'center'}); 
                }
            },
            toggle() { 
                if(this.audio.paused){
                    this.audio.play();
                    state.playing=true;
                }else{
                    this.audio.pause();
                    state.playing=false;
                } 
                this.updateBtn(); 
            },
            updateBtn() {
                const play = ui.el('icon-play'); 
                const pause = ui.el('icon-pause'); 
                const mini = ui.el('mini-cover');
                if(play) play.style.display = state.playing ? 'none' : 'block';
                if(pause) pause.style.display = state.playing ? 'block' : 'none';
                if(mini) state.playing ? mini.classList.add('spinning') : mini.classList.remove('spinning');
            },
            prev() { if(state.playlist.length) { state.index=(state.index-1+state.playlist.length)%state.playlist.length; this.loadSong(); } },
            next() { if(state.playlist.length) { state.index=(state.index+1)%state.playlist.length; this.loadSong(); } },
            seek(t) { this.audio.currentTime = t; state.userScroll = false; },
            fmtTime: s => { const m=Math.floor(s/60), ss=Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; }
        };

        window.router = {
            home: () => { state.history.push({type:'home'}); ui.renderHome(); },
            settings: () => { state.history.push({type:'settings'}); ui.renderSettings(); },
            search: async (kw, type) => {
                if(!kw) return; ui.loading(true);
                const res = await window.api.search(kw, type); ui.loading(false);
                state.history.push({type:'search', data:{res, type, kw}});
                ui.renderSearch(res, type, kw);
            },
            goBack: () => {
                state.history.pop();
                const last = state.history[state.history.length-1];
                if(!last) return window.router.home();
                if(last.type==='home') ui.renderHome();
                if(last.type==='settings') ui.renderSettings();
            }
        };

        // 简化版搜索页面渲染
        ui.renderSearch = function(data, type, kw) {
            const tabs = `<div class="search-tabs"><div class="tab-item ${type==1?'active':''}" onclick="window.router.search('${kw}', 1)">单曲</div><div class="tab-item ${type==10?'active':''}" onclick="window.router.search('${kw}', 10)">专辑</div><div class="tab-item ${type==1000?'active':''}" onclick="window.router.search('${kw}', 1000)">歌单</div></div>`;
            let content = '';
            if(type==1 && data.result.songs) { 
                window.searchList = data.result.songs; 
                content = `<div class="song-list">${this.renderList(window.searchList, 'searchList')}</div>`; 
            }
            this.el('main-view').innerHTML = `<div class="top-bar"><button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><div class="search-box"><input type="text" value="${kw}" onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)"></div><button class="btn-back-minimal" onclick="window.router.goBack()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button></div><div class="content-wrapper">${tabs}${content}</div>`;
        };

        window.ui = ui; 
        window.router = router; 
        window.player = player;
        initSettings(); 
        window.router.home(); 
        window.player.init();
    </script>
</body>
</html>
