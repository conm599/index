<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>废土电台 · 锈蚀思维</title>
    <style>
        /* 工业废土风格 —— 锈迹、警告、暗调、荧光点缀 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f0f0c;
            background-image: 
                linear-gradient(45deg, #2a2a2410 2px, transparent 2px),
                linear-gradient(-45deg, #3e3b3510 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Courier New', Courier, 'Lucida Sans Typewriter', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px 8px 20px 8px;
            color: #b9b09b;
        }

        /* 主操作台 —— 生锈铁盒 */
        .terminal {
            max-width: 560px;
            width: 100%;
            background: #1c1c18;
            border: 3px solid #6e5a44;
            border-radius: 24px 24px 18px 18px;
            box-shadow: 
                0 10px 0 #0a0907,
                0 0 0 2px #b37b4e inset,
                0 0 0 4px #4f3f2f inset;
            padding: 16px 12px 18px 12px;
            backdrop-filter: blur(1px);
        }

        /* 头部 —— 生锈标牌 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px dashed #7f6a4f;
            padding-bottom: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: #332e24;
            color: #e3c394;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid #ba8b5a;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: inset 0 -2px 0 #4a3e2b;
            white-space: nowrap;
        }

        .warning-tape {
            background: repeating-linear-gradient(45deg, #f0c45a, #f0c45a 8px, #000 8px, #000 16px);
            color: #1f1b12;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 800;
            border-radius: 30px;
            border: 1px solid #ab7e41;
            text-shadow: 1px 1px 0 #836e3d;
        }

        /* 思考预算选择器 —— 像调节老旧旋钮 */
        .budget-panel {
            background: #27231d;
            border: 2px solid #7a6348;
            border-radius: 40px;
            padding: 8px 12px;
            margin: 10px 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            flex-wrap: wrap;
            row-gap: 8px;
            box-shadow: inset 0 2px 5px #0f0e0b;
        }

        .budget-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #b38f6b;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .budget-label span {
            font-size: 1.2rem;
            filter: drop-shadow(0 0 4px #7e5b36);
        }

        .budget-options {
            display: flex;
            gap: 12px;
        }

        .budget-btn {
            background: transparent;
            border: 2px solid #6b5340;
            color: #ac9f8b;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 #2b241e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .budget-btn.active {
            background: #7b6236;
            border-color: #e9c684;
            color: #15120d;
            box-shadow: 0 0 10px #ffb86b;
            text-shadow: 0 1px 0 #bba06b;
        }

        /* 思维链窗口 —— 像老式雷达屏幕 */
        .chain-block {
            background: #131511;
            border: 3px solid #6c5d49;
            border-radius: 12px;
            padding: 12px 8px;
            margin: 18px 0 10px 0;
            box-shadow: inset 0 0 20px #00000099, 0 5px 0 #3a3026;
        }

        .chain-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: #ffb270;
            border-bottom: 1px solid #66553e;
            padding-bottom: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .chain-header .blink {
            width: 12px;
            height: 12px;
            background: #e7500c;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff6a2f;
            animation: flicker 1.2s infinite;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        #chainContent {
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.4;
            color: #b3c7a5;
            background: #1d251e;
            padding: 10px 8px;
            border-radius: 6px;
            border: 1px solid #5c754b;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Courier New', Courier, monospace;
            scrollbar-width: thin;
            scrollbar-color: #876b42 #2b2b1f;
        }

        #chainContent::-webkit-scrollbar {
            width: 6px;
        }
        #chainContent::-webkit-scrollbar-track {
            background: #2b2b1f;
        }
        #chainContent::-webkit-scrollbar-thumb {
            background: #876b42;
            border-radius: 8px;
        }

        /* 主对话气泡区域 */
        .history-panel {
            background: #1a1d16;
            border: 2px solid #726146;
            border-radius: 16px;
            padding: 16px 10px;
            height: 340px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 16px 0 12px 0;
            box-shadow: inset 0 0 20px #00000077;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 3px 4px 0 #0f0d09;
            border: 1px solid #52493b;
        }

        .user-msg {
            align-self: flex-end;
            background: #3b5e3b;
            color: #dfe7cf;
            border-bottom-right-radius: 4px;
            border-color: #8aa357;
        }

        .ai-msg {
            align-self: flex-start;
            background: #2f3b2f;
            color: #c7bfa2;
            border-bottom-left-radius: 4px;
            border-color: #8f784b;
        }

        .ai-msg.streaming {
            border-left: 5px solid #eb9e3e;
        }

        /* 输入区域 —— 废土控制台 */
        .input-area {
            display: flex;
            align-items: center;
            background: #26221c;
            border: 3px solid #6f5d42;
            border-radius: 60px;
            padding: 4px 4px 4px 18px;
            margin-top: 8px;
            box-shadow: 0 6px 0 #342e24;
        }

        .input-area input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e2d5b6;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 12px 0;
            outline: none;
        }

        .input-area input::placeholder {
            color: #6a6252;
            font-style: italic;
        }

        .input-area button {
            background: #77613e;
            border: none;
            border-radius: 60px;
            padding: 12px 22px;
            color: #181308;
            font-weight: bold;
            font-family: inherit;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #c99f5e;
            box-shadow: 0 3px 0 #493d2b;
            cursor: pointer;
            transition: 0.05s linear;
            margin-left: 6px;
        }

        .input-area button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .input-area button:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #493d2b;
            cursor: not-allowed;
        }

        /* 历史记录开关 & 侧边 (但历史直接在面板中) */
        .footer-note {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.7rem;
            color: #7a6d56;
        }

        .clear-history {
            background: #3a3126;
            border: 1px solid #735e44;
            color: #c9a87c;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* 加载占位符 */
        .loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 3px solid #a8864b;
            border-radius: 50%;
            border-top-color: #41361f;
            animation: spin 1s infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="terminal">
        <!-- 头部：生锈信号 -->
        <div class="header">
            <div class="badge">⚙️ POLLINATION v/rust</div>
            <div class="warning-tape">⚠️ 思维链可见 ⚠️</div>
        </div>

        <!-- 思考预算选择器 (低/中/高) 映射为类似温度/长度 通过提示词暗示模型 -->
        <div class="budget-panel">
            <div class="budget-label"><span>🧠</span> 思考预算</div>
            <div class="budget-options">
                <button class="budget-btn" data-budget="low">低</button>
                <button class="budget-btn active" data-budget="medium">中</button>
                <button class="budget-btn" data-budget="high">高</button>
            </div>
        </div>

        <!-- 思维链展示窗 (可看见模型推理) -->
        <div class="chain-block">
            <div class="chain-header">
                <span class="blink"></span> 链式思维 · 实时解码
            </div>
            <div id="chainContent">⚡ 等待信号... 发送消息后这里会显示模型的思考碎片</div>
        </div>

        <!-- 历史记录对话区域 (直接可见) -->
        <div class="history-panel" id="historyPanel">
            <div class="message ai-msg">🛸 欢迎，拾荒者。输入消息开始对话。\n思维链将展示模型推理过程。</div>
        </div>

        <!-- 输入和发送 -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入你的讯息..." autocomplete="off">
            <button id="sendBtn">发射</button>
        </div>

        <!-- 底部：清空历史按钮 -->
        <div class="footer-note">
            <span>📟 记录保留在本地</span>
            <div class="clear-history" id="clearHistory">🧹 清空历史</div>
        </div>
    </div>

    <script>
        (function() {
            // 配置 —— 使用提供的接口和模型 (openai-fast 支持推理)
            const API_URL = 'https://text.pollinations.ai/openai';
            const MODEL = 'openai-fast';      // 根据文档，支持reasoning

            // DOM 元素
            const chainDiv = document.getElementById('chainContent');
            const historyPanel = document.getElementById('historyPanel');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const clearBtn = document.getElementById('clearHistory');
            const budgetBtns = document.querySelectorAll('.budget-btn');

            // 状态
            let currentBudget = 'medium';      // 默认中
            let abortController = null;        // 用于中断之前的请求
            let isStreaming = false;

            // 历史消息 (简单内存存储，同时展示在UI中)
            let messages = [
                { role: 'assistant', content: '🛸 欢迎，拾荒者。输入消息开始对话。\n思维链将展示模型推理过程。' }
            ];

            // === 初始化加载历史 (从localStorage) ===
            function loadHistoryFromStorage() {
                const saved = localStorage.getItem('wasteland_chat_history');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (Array.isArray(parsed) && parsed.length) {
                            messages = parsed;
                        }
                    } catch (e) {}
                }
                renderHistory();
            }
            // 保存历史到localStorage
            function persistHistory() {
                localStorage.setItem('wasteland_chat_history', JSON.stringify(messages));
            }

            // 渲染所有历史消息到面板
            function renderHistory() {
                historyPanel.innerHTML = '';
                messages.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = `message ${msg.role === 'user' ? 'user-msg' : 'ai-msg'}`;
                    msgDiv.textContent = msg.content;
                    historyPanel.appendChild(msgDiv);
                });
                // 滚动到底部
                historyPanel.scrollTop = historyPanel.scrollHeight;
            }

            // 添加一条消息 (不重新渲染整个列表以提升流式性能？但为了简单，流式更新单个)
            function appendMessage(role, content, isStreamingMsg = false) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
                if (isStreamingMsg) {
                    msgDiv.classList.add('streaming');
                }
                msgDiv.textContent = content;
                historyPanel.appendChild(msgDiv);
                historyPanel.scrollTop = historyPanel.scrollHeight;
                return msgDiv;
            }

            // 更新思维链内容 (流式)
            function updateChain(text, isDone = false) {
                chainDiv.textContent = text || '⚙️ 等待推理……';
                if (isDone) {
                    // 可追加一个结束符，但保留内容
                }
            }

            // 清除历史
            function resetChat() {
                if (abortController) {
                    abortController.abort();
                    abortController = null;
                }
                isStreaming = false;
                sendBtn.disabled = false;
                messages = [{ role: 'assistant', content: '🛸 欢迎，拾荒者。输入消息开始对话。\n思维链将展示模型推理过程。' }];
                persistHistory();
                renderHistory();
                updateChain('⚡ 等待信号... 发送消息后这里会显示模型的思考碎片');
            }

            // 预算按钮切换
            budgetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    budgetBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentBudget = btn.dataset.budget; // 'low', 'medium', 'high'
                });
            });

            // === 发送消息，流式请求 ===
            async function sendMessage() {
                const question = userInput.value.trim();
                if (!question) return;
                if (isStreaming) {
                    alert('传输线正忙，请等待当前响应结束。');
                    return;
                }

                // 取消之前可能的悬挂请求
                if (abortController) {
                    abortController.abort();
                }
                abortController = new AbortController();

                // 添加用户消息到历史
                messages.push({ role: 'user', content: question });
                persistHistory();
                renderHistory();  // 直接重绘快速显示用户输入
                userInput.value = '';

                // 创建占位AI消息 (流式输出)
                const aiMessageDiv = appendMessage('assistant', '⚙️ 建立连接...', true);
                let fullAssistantContent = '';

                // 清空并准备思维链
                updateChain('🧩 触发推理...');

                // 根据思考预算调整system提示 (简单控制)
                let budgetInstruction = '';
                if (currentBudget === 'low') {
                    budgetInstruction = '尽可能简短思考，直接给出结论。限制推理步骤。';
                } else if (currentBudget === 'medium') {
                    budgetInstruction = '适度推理，展示关键步骤。';
                } else if (currentBudget === 'high') {
                    budgetInstruction = '请详尽地、一步一步地推理，展示完整的思维链，包括备选考虑。';
                }

                // 构建消息体 (openai-like)
                const payload = {
                    model: MODEL,
                    messages: [
                        { role: 'system', content: `你是一个在废土世界运行的AI，会展示详细的思维链（reasoning）。把思考过程放在【🧠思维链】部分，最终答案放在【📡应答】。\n${budgetInstruction}` },
                        ...messages.slice(-6)  // 只带最近几条，避免超长，但保留上下文
                    ],
                    stream: true,
                    // 额外参数: 可能支持reasoning_budget? 未知, 但通过system控制
                };

                // 添加一些推理参数 (部分模型支持reasoning_tokens/effort, 通过预算名称推测)
                // Pollinations 可能通过temperature等影响，但无官方文档。这里只发送预算到system。

                isStreaming = true;
                sendBtn.disabled = true;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                        signal: abortController.signal,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';
                    let chainBuffer = '';      // 用于累积思维链显示
                    let isDone = false;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) {
                            isDone = true;
                            break;
                        }

                        buffer += decoder.decode(value, { stream: true });
                        // 解析 SSE 格式 (data: ...)
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';  // 保留最后一个不完整的行

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6);
                                if (data === '[DONE]') continue;
                                try {
                                    const parsed = JSON.parse(data);
                                    // 标准openai流式返回: choices[0].delta 可能有 content 或 reasoning 字段?
                                    // 根据pollinations可能的格式, 尝试获取 content / reasoning (有些供应商把reasoning放单独字段)
                                    let delta = parsed.choices?.[0]?.delta;
                                    if (delta) {
                                        // 如果存在 reasoning 字段 (某些推理模型提供)
                                        if (delta.reasoning) {
                                            chainBuffer += delta.reasoning;
                                            updateChain(chainBuffer);
                                        }
                                        // 常规内容
                                        if (delta.content) {
                                            fullAssistantContent += delta.content;
                                            aiMessageDiv.textContent = fullAssistantContent;
                                            // 滚动
                                            historyPanel.scrollTop = historyPanel.scrollHeight;
                                        }
                                        // 可能还有 finish_reason
                                    }

                                    // 备用: 如果没有任何reasoning字段，则尝试将content同时显示在思维链？但这里我们保留区分。
                                    // 部分实现会把完整思考放于content前，但为了demo，我们从content里猜？不建议
                                    // 若长时间没有reasoning，可能模型不支持显示思维链，我们用特殊提示
                                } catch (e) {
                                    console.warn('parse error', e);
                                }
                            }
                        }
                    }

                    // 流结束，确认最终内容
                    if (!fullAssistantContent) {
                        // 如果从未得到content，可能模型用了reasoning字段作为主输出？但通常不会。
                        fullAssistantContent = chainBuffer || '[无应答]';
                        aiMessageDiv.textContent = fullAssistantContent;
                    }

                    // 将最终assistant消息加入历史
                    messages.push({ role: 'assistant', content: fullAssistantContent });
                    persistHistory();

                    // 标记思维链结束
                    updateChain(chainBuffer || '⚠️ 未捕获到显式思维链，但对话已完成。', true);

                } catch (error) {
                    if (error.name === 'AbortError') {
                        updateChain('⛔ 传输中断。');
                    } else {
                        console.error(error);
                        aiMessageDiv.textContent = `[传输错误] ${error.message}`;
                        updateChain('💥 思维链因错误中断');
                    }
                } finally {
                    isStreaming = false;
                    sendBtn.disabled = false;
                    abortController = null;
                }
            }

            // 绑定发送事件
            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !isStreaming) {
                    sendMessage();
                }
            });

            // 清空历史
            clearBtn.addEventListener('click', () => {
                if (isStreaming) {
                    if (abortController) abortController.abort();
                    isStreaming = false;
                    sendBtn.disabled = false;
                }
                resetChat();
            });

            // 启动时加载历史
            loadHistoryFromStorage();

            // 页面关闭前不需要额外操作, 已 persist 每次添加消息后
        })();
    </script>
</body>
</html>
