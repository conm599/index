<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动设备检测工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .content {
            padding: 25px;
        }
        
        .result-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .result-icon {
            font-size: 64px;
            margin-bottom: 15px;
        }
        
        .result-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .result-detail {
            font-size: 18px;
            color: #495057;
        }
        
        .progress-container {
            margin: 25px 0;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        .android-progress {
            background: linear-gradient(90deg, #34A853, #0F9D58);
        }
        
        .ios-progress {
            background: linear-gradient(90deg, #007AFF, #5856D6);
        }
        
        .evidence-section {
            margin-top: 30px;
        }
        
        h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #343a40;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }
        
        .evidence-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .evidence-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .evidence-info {
            flex: 1;
        }
        
        .evidence-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #495057;
        }
        
        .evidence-desc {
            font-size: 14px;
            color: #6c757d;
        }
        
        .evidence-weight {
            font-weight: bold;
            font-size: 18px;
            color: #495057;
            min-width: 80px;
            text-align: right;
        }
        
        .android-weight {
            color: #0F9D58;
        }
        
        .ios-weight {
            color: #007AFF;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #6c757d;
            font-size: 14px;
            border-top: 1px solid #e9ecef;
        }
        
        .confidence {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .high-confidence {
            color: #0F9D58;
        }
        
        .medium-confidence {
            color: #F4B400;
        }
        
        .low-confidence {
            color: #DB4437;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>移动设备检测工具</h1>
            <div class="subtitle">使用多种技术检测您的设备是Android还是iOS</div>
        </header>
        
        <div class="content">
            <div class="result-section">
                <div class="result-icon">📱</div>
                <div class="result-text" id="resultText">正在检测您的设备...</div>
                <div class="result-detail" id="resultDetail">请稍候，我们正在分析您的设备特征</div>
                
                <div class="progress-container">
                    <div class="progress-bar android-progress" id="androidProgress" style="width: 50%"></div>
                    <div class="progress-bar ios-progress" id="iosProgress" style="width: 50%"></div>
                </div>
                
                <div class="confidence" id="confidenceLevel">检测中...</div>
            </div>
            
            <div class="evidence-section">
                <h2>检测依据</h2>
                <div id="evidenceList">
                    <!-- 检测依据将在这里动态生成 -->
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>本工具使用多种技术检测设备类型，包括用户代理分析、屏幕特性、触摸事件、WebGL渲染器等</p>
            <p>检测结果仅供参考，某些浏览器或设备可能无法准确识别</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化检测结果
            let androidScore = 0;
            let iosScore = 0;
            const maxScore = 100;
            const evidences = [];
            
            // 检测方法1: 用户代理分析 (权重: 30)
            function checkUserAgent() {
                const ua = navigator.userAgent;
                let weight = 30;
                let evidence = {
                    title: "用户代理分析",
                    description: `用户代理字符串: ${ua.substring(0, 60)}...`,
                    weight: weight
                };
                
                if (/android/i.test(ua)) {
                    androidScore += weight;
                    evidence.result = "Android";
                    evidence.className = "android-weight";
                } else if (/iphone|ipad|ipod/i.test(ua)) {
                    iosScore += weight;
                    evidence.result = "iOS";
                    evidence.className = "ios-weight";
                } else {
                    evidence.result = "不确定";
                    evidence.className = "";
                }
                
                evidences.push(evidence);
            }
            
            // 检测方法2: 屏幕特性 (权重: 15)
            function checkScreenProperties() {
                let weight = 15;
                let evidence = {
                    title: "屏幕特性分析",
                    description: `屏幕分辨率: ${screen.width}x${screen.height}, 像素比: ${window.devicePixelRatio}`,
                    weight: weight
                };
                
                // iOS设备通常有特定的屏幕尺寸和像素比
                const screenWidth = screen.width;
                const screenHeight = screen.height;
                const pixelRatio = window.devicePixelRatio;
                
                // 常见iOS设备屏幕尺寸
                const commonIosResolutions = [
                    [375, 812], [414, 896], [390, 844], [428, 926], // iPhone
                    [768, 1024], [834, 1112], [1024, 1366] // iPad
                ];
                
                let isIosResolution = false;
                for (const [w, h] of commonIosResolutions) {
                    if ((screenWidth === w && screenHeight === h) || 
                        (screenWidth === h && screenHeight === w)) {
                        isIosResolution = true;
                        break;
                    }
                }
                
                // iOS设备通常有整数或半整数像素比
                const isIosPixelRatio = pixelRatio === 1 || pixelRatio === 2 || pixelRatio === 3;
                
                if (isIosResolution && isIosPixelRatio) {
                    iosScore += weight;
                    evidence.result = "iOS";
                    evidence.className = "ios-weight";
                } else {
                    androidScore += weight;
                    evidence.result = "Android";
                    evidence.className = "android-weight";
                }
                
                evidences.push(evidence);
            }
            
            // 检测方法3: 触摸事件支持 (权重: 10)
            function checkTouchSupport() {
                let weight = 10;
                let evidence = {
                    title: "触摸事件分析",
                    description: `最大触摸点: ${navigator.maxTouchPoints || '未知'}`,
                    weight: weight
                };
                
                // iOS设备通常支持较多触摸点
                const maxTouchPoints = navigator.maxTouchPoints || 0;
                
                if (maxTouchPoints >= 5) {
                    // iOS设备通常支持5点或更多触摸
                    iosScore += weight;
                    evidence.result = "iOS";
                    evidence.className = "ios-weight";
                } else if (maxTouchPoints > 0) {
                    // Android设备通常支持多点触摸但可能少于5点
                    androidScore += weight;
                    evidence.result = "Android";
                    evidence.className = "android-weight";
                } else {
                    evidence.result = "不确定";
                    evidence.className = "";
                }
                
                evidences.push(evidence);
            }
            
            // 检测方法4: WebGL渲染器检测 (权重: 25)
            function checkWebGLRenderer() {
                let weight = 25;
                let evidence = {
                    title: "WebGL渲染器分析",
                    description: "通过WebGL获取GPU信息",
                    weight: weight
                };
                
                try {
                    const canvas = document.createElement('canvas');
                    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    
                    if (gl) {
                        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                        if (debugInfo) {
                            const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                            evidence.description = `GPU渲染器: ${renderer}`;
                            
                            // 检查渲染器字符串中的关键词
                            if (renderer.includes('Apple') || renderer.includes('PowerVR') || 
                                renderer.includes('Apple GPU')) {
                                iosScore += weight;
                                evidence.result = "iOS";
                                evidence.className = "ios-weight";
                            } else if (renderer.includes('Adreno') || renderer.includes('Mali') || 
                                       renderer.includes('NVIDIA') || renderer.includes('ARM')) {
                                androidScore += weight;
                                evidence.result = "Android";
                                evidence.className = "android-weight";
                            } else {
                                evidence.result = "不确定";
                                evidence.className = "";
                            }
                        } else {
                            evidence.description = "无法获取WebGL调试信息";
                            evidence.result = "不确定";
                            evidence.className = "";
                        }
                    } else {
                        evidence.description = "WebGL不支持";
                        evidence.result = "不确定";
                        evidence.className = "";
                    }
                } catch (e) {
                    evidence.description = "WebGL检测失败";
                    evidence.result = "不确定";
                    evidence.className = "";
                }
                
                evidences.push(evidence);
            }
            
            // 检测方法5: 平台信息 (权重: 10)
            function checkPlatform() {
                let weight = 10;
                let evidence = {
                    title: "平台信息分析",
                    description: `平台: ${navigator.platform}`,
                    weight: weight
                };
                
                const platform = navigator.platform.toLowerCase();
                
                if (platform.includes('iphone') || platform.includes('ipad') || platform.includes('ipod')) {
                    iosScore += weight;
                    evidence.result = "iOS";
                    evidence.className = "ios-weight";
                } else if (platform.includes('android') || platform.includes('linux')) {
                    androidScore += weight;
                    evidence.result = "Android";
                    evidence.className = "android-weight";
                } else if (platform.includes('mac')) {
                    // Mac可能是iPad或Mac电脑
                    iosScore += weight * 0.5; // 给予部分权重
                    evidence.result = "可能iOS";
                    evidence.className = "ios-weight";
                } else {
                    evidence.result = "不确定";
                    evidence.className = "";
                }
                
                evidences.push(evidence);
            }
            
            // 检测方法6: 浏览器特定API (权重: 10)
            function checkBrowserAPIs() {
                let weight = 10;
                let evidence = {
                    title: "浏览器API分析",
                    description: "检测特定于平台的API",
                    weight: weight
                };
                
                // 检查iOS特定API
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const isStandalone = window.navigator.standalone;
                const webkit = typeof window.webkitRequestFileSystem !== 'undefined';
                
                // 检查Android特定API
                const isAndroid = /Android/.test(navigator.userAgent);
                
                if (isIOS || isStandalone || webkit) {
                    iosScore += weight;
                    evidence.result = "iOS";
                    evidence.className = "ios-weight";
                    evidence.description = "检测到iOS特定API";
                } else if (isAndroid) {
                    androidScore += weight;
                    evidence.result = "Android";
                    evidence.className = "android-weight";
                    evidence.description = "检测到Android特定API";
                } else {
                    evidence.result = "不确定";
                    evidence.className = "";
                    evidence.description = "未检测到平台特定API";
                }
                
                evidences.push(evidence);
            }
            
            // 执行所有检测
            checkUserAgent();
            checkScreenProperties();
            checkTouchSupport();
            checkWebGLRenderer();
            checkPlatform();
            checkBrowserAPIs();
            
            // 计算最终结果
            const totalScore = androidScore + iosScore;
            const androidPercentage = totalScore > 0 ? Math.round((androidScore / totalScore) * 100) : 50;
            const iosPercentage = 100 - androidPercentage;
            
            // 确定设备类型
            let deviceType = "未知设备";
            let confidence = "低";
            let confidenceClass = "low-confidence";
            
            if (androidPercentage >= 70) {
                deviceType = "Android设备";
                confidence = "高";
                confidenceClass = "high-confidence";
            } else if (iosPercentage >= 70) {
                deviceType = "iOS设备";
                confidence = "高";
                confidenceClass = "high-confidence";
            } else if (androidPercentage >= 60) {
                deviceType = "可能为Android设备";
                confidence = "中";
                confidenceClass = "medium-confidence";
            } else if (iosPercentage >= 60) {
                deviceType = "可能为iOS设备";
                confidence = "中";
                confidenceClass = "medium-confidence";
            } else {
                deviceType = "无法确定设备类型";
                confidence = "低";
                confidenceClass = "low-confidence";
            }
            
            // 更新UI
            document.getElementById('resultText').textContent = deviceType;
            document.getElementById('resultDetail').textContent = 
                `Android得分: ${androidScore} | iOS得分: ${iosScore}`;
            document.getElementById('androidProgress').style.width = `${androidPercentage}%`;
            document.getElementById('iosProgress').style.width = `${iosPercentage}%`;
            document.getElementById('confidenceLevel').textContent = `置信度: ${confidence}`;
            document.getElementById('confidenceLevel').className = `confidence ${confidenceClass}`;
            
            // 显示检测依据
            const evidenceList = document.getElementById('evidenceList');
            evidences.forEach(evidence => {
                const evidenceItem = document.createElement('div');
                evidenceItem.className = 'evidence-item';
                
                evidenceItem.innerHTML = `
                    <div class="evidence-info">
                        <div class="evidence-title">${evidence.title}</div>
                        <div class="evidence-desc">${evidence.description}</div>
                    </div>
                    <div class="evidence-weight ${evidence.className}">${evidence.result} (+${evidence.weight})</div>
                `;
                
                evidenceList.appendChild(evidenceItem);
            });
        });
    </script>
</body>
</html>
