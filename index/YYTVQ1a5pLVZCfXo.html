<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静态代码托管</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio → MIDI | 阿狸 🦊</title>
<style>
:root {
  --bg: #0a0e1a;
  --surface: #141826;
  --surface-2: #1c2030;
  --border: #2a2f42;
  --accent: #00e5ff;
  --accent-dim: #00b8d4;
  --text: #e8eaf0;
  --muted: #7a7f94;
  --success: #00e676;
  --warning: #ffab00;
  --error: #ff5252;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 960px; margin: 0 auto; }
header { text-align: center; padding: 20px 0 30px; }
header h1 {
  font-size: 28px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #7c4dff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
header p { color: var(--muted); font-size: 14px; margin-top: 6px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 16px;
}
.upload-area {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 50px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}
.upload-area:hover, .upload-area.dragover {
  border-color: var(--accent);
  background: rgba(0, 229, 255, 0.05);
}
.upload-area .icon { font-size: 48px; margin-bottom: 12px; }
.upload-area .label { font-size: 16px; color: var(--text); }
.upload-area .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }
.upload-area input { display: none; }
.audio-player { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.audio-player audio { flex: 1; height: 36px; }
.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.control-group { display: flex; flex-direction: column; gap: 6px; }
.control-group label { font-size: 13px; color: var(--muted); }
.control-group select, .control-group input[type="number"] {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 8px 12px; font-size: 14px; outline: none;
}
.control-group select:focus, .control-group input:focus { border-color: var(--accent); }
.control-group input[type="range"] {
  -webkit-appearance: none; height: 6px; background: var(--surface-2);
  border-radius: 3px; outline: none;
}
.control-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  background: var(--accent); border-radius: 50%; cursor: pointer;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.2s;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #0a0e1a; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,229,255,0.3); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.progress-wrap { margin-top: 16px; }
.progress-bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dim));
  width: 0%; transition: width 0.2s; border-radius: 4px;
}
.progress-text { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: center; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 16px; }
.stat {
  background: var(--surface-2); border-radius: 8px; padding: 10px 16px;
  flex: 1; min-width: 100px; text-align: center;
}
.stat .value { font-size: 20px; font-weight: 700; color: var(--accent); }
.stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
.canvas-wrap {
  position: relative; background: #0d1117; border-radius: 10px;
  overflow: hidden; border: 1px solid var(--border);
}
canvas { display: block; width: 100%; }
.note-list { max-height: 200px; overflow-y: auto; margin-top: 12px; border-radius: 8px; background: var(--surface-2); }
.note-item {
  display: flex; justify-content: space-between; padding: 6px 12px;
  font-size: 13px; font-family: 'SF Mono', monospace; border-bottom: 1px solid var(--border);
}
.note-item:last-child { border-bottom: none; }
.note-item .note-name { color: var(--accent); font-weight: 600; }
.note-item .note-time { color: var(--muted); }
.hidden { display: none !important; }
.info-text { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
@media (max-width: 640px) { .controls-grid { grid-template-columns: 1fr; } .stats { flex-direction: column; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎵 Audio → MIDI Converter</h1>
    <p>上传音频，自动检测音高，生成 MIDI · 🦊 阿狸出品</p>
  </header>
  <div class="card">
    <div class="upload-area" id="uploadArea">
      <div class="icon">🎙️</div>
      <div class="label">拖拽音频文件到此处，或点击选择</div>
      <div class="sub">支持 WAV / MP3 / OGG / FLAC / M4A · 单声道效果最佳</div>
      <input type="file" id="fileInput" accept="audio/*">
    </div>
    <div class="audio-player hidden" id="audioPlayerWrap">
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>
  <div class="card hidden" id="settingsCard">
    <div class="controls-grid">
      <div class="control-group">
        <label>检测灵敏度</label>
        <input type="range" id="threshold" min="0.05" max="0.4" step="0.01" value="0.15">
      </div>
      <div class="control-group">
        <label>最短音符时长 (秒)</label>
        <input type="number" id="minNoteDur" min="0.02" max="1" step="0.02" value="0.1">
      </div>
      <div class="control-group">
        <label>八度偏移</label>
        <select id="octaveShift">
          <option value="-3">-3</option><option value="-2">-2</option><option value="-1">-1</option>
          <option value="0" selected>0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option>
        </select>
      </div>
      <div class="control-group">
        <label>MIDI 节拍 (BPM)</label>
        <input type="number" id="tempo" min="40" max="300" step="1" value="120">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="convertBtn">🔄 开始转换</button>
    </div>
    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">准备中...</div>
    </div>
  </div>
  <div class="card hidden" id="resultCard">
    <div class="stats" id="stats"></div>
    <div class="canvas-wrap"><canvas id="pianoRoll" width="920" height="320"></canvas></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="playMidiBtn">▶ 试听 MIDI</button>
      <button class="btn btn-primary" id="downloadBtn">⬇ 下载 MIDI 文件</button>
    </div>
    <div class="note-list hidden" id="noteList"></div>
  </div>
  <div class="info-text" style="text-align:center; padding: 10px 0 20px;">
    ⚠️ 本工具使用 YIN 算法进行单声道音高检测，适合人声、独奏乐器等单音音频。<br>
    多乐器混合或和弦的 Polyphonic 转换效果有限，建议先分离音轨。
  </div>
</div>
<script>
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function freqToMidi(f){return Math.round(69+12*Math.log2(f/440))}
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12)}
</body>
</html>
