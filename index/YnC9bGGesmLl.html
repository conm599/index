<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse Pro - 最终完美版</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-hover: #2a2a2a;
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --player-height: 90px;
            --sidebar-width: 220px;
            --lyric-base-size: 22px; /* 歌词基础大小变量 */
            --bg-blur-amount: 0; /* 背景模糊度（0-100） */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* === 滚动条 === */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        /* === 布局 === */
        .app-layout { display: flex; flex: 1; height: calc(100vh - var(--player-height)); overflow: hidden; }

        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width); background: black; padding: 24px;
            display: flex; flex-direction: column; gap: 10px; z-index: 2;
        }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            color: var(--text-sub); padding: 12px 16px; border-radius: 8px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { background: var(--bg-hover); color: white; }

        /* 主内容区 (应用背景和模糊) */
        .main-content {
            flex: 1; 
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            overflow-y: auto; 
            padding: 20px 40px 120px; 
            position: relative;
            /* 背景模糊（通过 JS 动态设置 filter: blur(Xpx)） */
        }
        /* 默认渐变背景 */
        .main-content.default-bg {
             background-image: linear-gradient(180deg, #222 0%, var(--bg-dark) 40%) !important;
             filter: none !important; /* 默认背景不模糊 */
        }
        /* 解决模糊后内容重叠的隔离 */
        .content-wrapper {
             position: relative; 
             z-index: 5;
        }
        .top-bar {
            position: sticky; top: 0; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px);
            padding: 16px 0; z-index: 10; display: flex; justify-content: space-between; align-items: center;
        }
        .search-box {
            background: #333; border-radius: 50px; padding: 8px 20px;
            display: flex; align-items: center; width: 300px;
        }
        .search-box input {
            background: transparent; border: none; color: white; margin-left: 10px; width: 100%; font-size: 14px;
        }

        /* === 搜索结果 Tabs === */
        .search-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333;
        }
        .tab-item {
            padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;
            color: var(--text-sub); cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.05);
        }
        .tab-item:hover { background: rgba(255,255,255,0.1); color: white; }
        .tab-item.active { background: var(--primary); color: black; }

        /* 网格与列表 */
        .section-title { font-size: 24px; font-weight: 700; margin: 20px 0; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }
        .card { background: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .card:hover { background: var(--bg-hover); transform: translateY(-5px); }
        .card img { width: 100%; aspect-ratio: 1; border-radius: 4px; margin-bottom: 12px; object-fit: cover; }
        .card-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-sub { font-size: 12px; color: var(--text-sub); }

        .song-list { display: flex; flex-direction: column; }
        .song-row {
            display: grid; grid-template-columns: 40px 4fr 2fr 1fr; padding: 10px 16px;
            border-radius: 4px; align-items: center; color: var(--text-sub); cursor: pointer;
        }
        .song-row:hover { background: rgba(255,255,255,0.1); }
        .song-info { display: flex; align-items: center; gap: 12px; color: white; }
        .song-info img { width: 40px; height: 40px; border-radius: 4px; }

        /* === 全屏播放器 === */
        .full-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(160deg, #333 0%, #000 100%);
            z-index: 200; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
            display: flex; flex-direction: column;
        }
        .full-player.active { transform: translateY(0); }
        
        .fp-header { 
            display: flex; justify-content: flex-end; align-items: center; gap: 20px;
            padding: 20px 40px; position: sticky; top: 0; z-index: 10; 
        }
        
        .btn-circle-action {
            background: rgba(255,255,255,0.1); border: none; width: 44px; height: 44px;
            border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; text-decoration: none;
        }
        .btn-circle-action:hover { background: var(--primary); color: black; transform: scale(1.1); }

        .fp-content {
            display: flex; flex: 1; padding: 0 60px 40px; gap: 60px; overflow: hidden;
        }
        
        .fp-left { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .fp-cover-art { 
            width: 80%; max-width: 450px; aspect-ratio: 1; border-radius: 12px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); object-fit: cover; margin-bottom: 40px; 
        }
        .fp-meta { text-align: center; }
        .fp-title { font-size: 36px; font-weight: 700; margin-bottom: 10px; line-height: 1.2; }
        .fp-artist { font-size: 20px; color: var(--text-sub); }

        .fp-right { 
            flex: 1; display: flex; flex-direction: column; height: 100%; position: relative;
        }
        
        .lyrics-box {
            flex: 1; overflow-y: auto; padding: 20px 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
        }
        .lyric-line {
            font-size: var(--lyric-base-size); /* 使用变量 */
            font-weight: 700; color: rgba(255,255,255,0.3); margin: 28px 0;
            transition: 0.3s; cursor: pointer;
        }
        .lyric-line:hover { color: rgba(255,255,255,0.7); }
        .lyric-line.active { 
            font-size: calc(var(--lyric-base-size) + 10px); /* 放大 */
            color: white; transform: scale(1.05); transform-origin: left; 
            text-shadow: 0 0 20px rgba(255,255,255,0.2); 
        }

        /* 底部推荐区域 */
        .related-section {
            margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
            height: 180px; flex-shrink: 0;
        }
        .related-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 16px;
        }
        .related-card {
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .related-card:hover { background: rgba(255,255,255,0.15); }
        .related-card img { width: 100%; aspect-ratio: 1; border-radius: 4px; margin-bottom: 6px; }
        .related-title { font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 底部播放器 */
        .footer-player {
            height: var(--player-height); background: #181818; border-top: 1px solid #282828;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-player.visible { transform: translateY(0); }
        
        .player-left { display: flex; align-items: center; width: 30%; gap: 16px; }
        .circle-art {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
            border: 2px solid #111; animation: rotate 10s linear infinite; animation-play-state: paused; cursor: pointer;
        }
        .circle-art.spinning { animation-play-state: running; }
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
        
        .player-center { width: 40%; display: flex; flex-direction: column; align-items: center; }
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 6px; }
        .btn-icon { background: none; border: none; color: #b3b3b3; cursor: pointer; }
        .btn-icon:hover { color: white; }
        .btn-play { width: 36px; height: 36px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; cursor: pointer; }
        .btn-play:hover { transform: scale(1.1); }
        
        .progress-bar { width: 100%; height: 4px; background: #555; border-radius: 2px; cursor: pointer; display: flex; }
        .progress-fill { height: 100%; background: white; width: 0%; border-radius: 2px; }

        /* Loading */
        .loader { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Custom Toggle Switch CSS for Settings */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
        }
        input:checked + .slider {
            background-color: var(--primary);
        }
        input:focus + .slider {
            box-shadow: 0 0 1px var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .slider.round {
            border-radius: 34px;
        }
        .slider.round:before {
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .fp-content { flex-direction: column; padding: 20px; overflow-y: auto; }
            .fp-left { flex: 0 0 auto; margin-bottom: 30px; }
            .fp-cover-art { width: 260px; margin-bottom: 20px; }
            .fp-right { height: auto; flex: 1; }
            .lyrics-box { height: 300px; flex: none; }
            .player-left { width: 60%; } .player-center { width: 40%; }
            .footer-player .btn-icon:not(.btn-play) { display: none; } 
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <nav class="sidebar">
            <div class="logo"><span style="color:var(--primary)">Muse</span> Pro</div>
            <div class="nav-btn active" onclick="window.router.home()">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> 推荐首页
            </div>
            <div class="nav-btn" onclick="window.router.settings()">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.2-.15.25-.42.12-.64l-2-3.46c-.13-.22-.4-.3-.6-.17l-2.61 1.02c-.39-.37-.82-.71-1.27-.99L15 2h-4l-.27 2.06c-.45.28-.88.62-1.27.99L6.87 4.12c-.2-.13-.47-.05-.6.17l-2 3.46c-.13.22-.08.5.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.2.15-.25.42-.12.64l2 3.46c.13.22.4.3.6.17l2.61-1.02c.39.37.82.71 1.27.99L11 22h4l.27-2.06c.45-.28.88-.62 1.27-.99l2.61 1.02c.2.13.47.05.6-.17l2-3.46c.13-.22.08-.5-.12-.64l-2.11-1.65zm-7.43 3.52c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg> 设置
            </div>
        </nav>

        <main class="main-content" id="main-view">
            </main>
    </div>

    <div class="full-player" id="full-player">
        <div class="fp-header">
            <a href="#" class="btn-circle-action" id="fp-download-btn" target="_blank" download title="下载歌曲">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
            <button class="btn-circle-action" onclick="window.ui.toggleFullPlayer(false)" title="关闭">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <div class="fp-content">
            <div class="fp-left">
                <img src="" class="fp-cover-art" id="fp-cover">
                <div class="fp-meta">
                    <div class="fp-title" id="fp-title"></div>
                    <div class="fp-artist" id="fp-artist"></div>
                </div>
            </div>
            
            <div class="fp-right">
                <div class="lyrics-box" id="lyrics-box">
                    <div class="lyric-line">等待播放...</div>
                </div>
                
                <div class="related-section" id="related-section">
                    <div style="color:white; font-weight:bold; margin-bottom:10px; font-size:14px;">猜你喜欢</div>
                    <div class="related-grid" id="related-container">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-player" id="footer-player">
        <div class="player-left">
            <img src="" class="circle-art" id="mini-cover" onclick="window.ui.toggleFullPlayer(true)">
            <div style="display:flex; flex-direction:column; justify-content:center;">
                <div style="color:white; font-size:14px; cursor:pointer;" id="mini-title" onclick="window.ui.toggleFullPlayer(true)"></div>
                <div style="color:#888; font-size:12px;" id="mini-artist"></div>
            </div>
        </div>
        <div class="player-center">
            <div class="controls">
                <button class="btn-icon" onclick="window.player.prev()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn-play" onclick="window.player.toggle()">
                    <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-icon" onclick="window.player.next()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        <div style="width:30%;"></div>
    </footer>

    <div class="loader" id="loader"><div class="spinner"></div></div>
    <audio id="audio"></audio>

    <script>
        const API = 'https://163api.qijieya.cn';
        const state = { playlist: [], index: 0, playing: false, lyrics: [], userScroll: false, scrollTimer: null };
        
        // --- Settings Management ---
        const DEFAULT_SETTINGS = {
            bgUrl: '',
            bgBlur: 50,
            lyricSize: 22, 
            showRelated: true
        };
        // 使用 var 确保 userSettings 在全局范围可访问
        var userSettings = {};

        function initSettings() {
            try {
                const storedSettings = localStorage.getItem('museProSettings');
                userSettings = storedSettings ? JSON.parse(storedSettings) : DEFAULT_SETTINGS;
            } catch (e) {
                console.error("Error loading settings:", e);
                userSettings = DEFAULT_SETTINGS;
            }
            applySettings(false);
        }

        function saveSettings() {
            try {
                localStorage.setItem('museProSettings', JSON.stringify(userSettings));
            } catch (e) {
                console.error("Error saving settings:", e);
            }
        }

        function applySettings(shouldSave = true) {
            const mainView = window.ui.el('main-view');
            const root = document.documentElement;

            // 1. Apply Background Image and Blur
            if (userSettings.bgUrl && userSettings.bgUrl.trim() !== '') {
                mainView.style.backgroundImage = `url('${userSettings.bgUrl}')`;
                mainView.classList.remove('default-bg');
            } else {
                mainView.style.backgroundImage = '';
                mainView.classList.add('default-bg');
            }

            const blurPx = userSettings.bgBlur * 0.1;
            mainView.style.filter = userSettings.bgBlur > 0 ? `blur(${blurPx}px)` : 'none';
            
            // 2. Apply Lyric Size
            root.style.setProperty('--lyric-base-size', `${userSettings.lyricSize}px`);

            // 3. Apply Related Toggle
            const relatedSection = window.ui.el('related-section');
            if(relatedSection) relatedSection.style.display = userSettings.showRelated ? 'block' : 'none';
            
            if (shouldSave) saveSettings();
        }

        function resetAllSettings() {
            userSettings = DEFAULT_SETTINGS;
            applySettings();
            window.router.settings();
        }

        // 使用 var 确保 router/ui/player 在全局范围可访问
        var ui = {};
        var router = {};
        var player = {};

        window.api = {
            get: async u => (await fetch(API+u)).json(),
            search: (kw, type) => window.api.get(`/cloudsearch?keywords=${kw}&type=${type}`),
            url: id => window.api.get(`/song/url/v1?id=${id}&level=standard`),
            detail: id => window.api.get(`/song/detail?ids=${id}`),
            album: id => window.api.get(`/album?id=${id}`),
            playlist: id => window.api.get(`/playlist/detail?id=${id}`),
            lyric: id => window.api.get(`/lyric?id=${id}`),
            simi: id => window.api.get(`/simi/song?id=${id}`)
        };

        ui = {
            el: id => document.getElementById(id),
            loading(show) { this.el('loader').style.display = show ? 'flex' : 'none'; },

            // 修复: 导航栏激活状态选择器
            setActiveNav(name) {
                const navBtns = document.querySelectorAll('.nav-btn');
                navBtns.forEach(btn => {
                    btn.classList.remove('active');
                });

                if (name === 'home' && navBtns[0]) {
                    navBtns[0].classList.add('active');
                } else if (name === 'settings' && navBtns[1]) {
                    // 确保选择的是第二个 nav-btn (设置按钮)
                    navBtns[1].classList.add('active');
                }
            },
            
            renderHome() {
                const mainView = this.el('main-view');
                if (!mainView) return console.error("Error: main-view not found for rendering home.");
                
                mainView.innerHTML = `
                    <div class="top-bar">
                        <div class="search-box">
                            <svg width="18" height="18" fill="#888" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" placeholder="搜索..." onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)">
                        </div>
                    </div>
                    <div class="content-wrapper">
                        <div class="section-title">🔥 热门推荐</div>
                        <div class="grid-cards" id="hot-grid"></div>
                    </div>
                `;
                this.loadHot();
                this.setActiveNav('home');
            },

            async loadHot() {
                this.loading(true);
                const res = await window.api.get('/playlist/detail?id=3778678');
                this.loading(false);
                window.hotList = res.playlist.tracks.slice(0, 24);
                this.el('hot-grid').innerHTML = window.hotList.map((s, i) => `
                    <div class="card" onclick="window.player.playList('hotList', ${i})">
                        <img src="${s.al.picUrl}?param=300y300">
                        <div class="card-title">${s.name}</div>
                        <div class="card-sub">${s.ar[0].name}</div>
                    </div>
                `).join('');
            },

            renderSearch(data, type, keyword) {
                const main = this.el('main-view');
                if (!main) return console.error("Error: main-view not found for rendering search.");

                const tabsHtml = `
                    <div class="search-tabs">
                        <div class="tab-item ${type==1?'active':''}" onclick="window.router.search('${keyword}', 1)">单曲</div>
                        <div class="tab-item ${type==10?'active':''}" onclick="window.router.search('${keyword}', 10)">专辑</div>
                        <div class="tab-item ${type==1000?'active':''}" onclick="window.router.search('${keyword}', 1000)">歌单</div>
                    </div>
                `;

                let contentHtml = '';
                
                if (type == 1 && data.result.songs) {
                    window.searchList = data.result.songs;
                    contentHtml = `<div class="song-list">` + data.result.songs.map((s, i) => `
                        <div class="song-row" onclick="window.player.playList('searchList', ${i})">
                            <div>${i+1}</div>
                            <div class="song-info">
                                <img src="${s.al.picUrl}?param=100y100">
                                <div><div>${s.name}</div><div style="font-size:12px">${s.ar.map(a=>a.name).join('/')}</div></div>
                            </div>
                            <div>${s.al.name}</div>
                            <div>${window.player.fmtTime(s.dt/1000)}</div>
                        </div>
                    `).join('') + `</div>`;
                } 
                else if (type == 10 && data.result.albums) {
                    contentHtml = `<div class="grid-cards">` + data.result.albums.map(a => `
                        <div class="card" onclick="window.router.loadAlbum(${a.id})">
                            <img src="${a.picUrl}?param=300y300">
                            <div class="card-title">${a.name}</div>
                            <div class="card-sub">${a.artist.name}</div>
                        </div>
                    `).join('') + `</div>`;
                }
                else if (type == 1000 && data.result.playlists) {
                    contentHtml = `<div class="grid-cards">` + data.result.playlists.map(p => `
                        <div class="card" onclick="window.router.loadPlaylist(${p.id})">
                            <img src="${p.coverImgUrl}?param=300y300">
                            <div class="card-title">${p.name}</div>
                            <div class="card-sub">${p.trackCount}首</div>
                        </div>
                    `).join('') + `</div>`;
                }

                main.innerHTML = `
                    <div class="top-bar">
                        <div class="search-box">
                            <input type="text" value="${keyword}" onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)">
                        </div>
                        <button class="nav-btn" onclick="window.router.home()">返回</button>
                    </div>
                    <div class="content-wrapper">
                        ${tabsHtml}
                        ${contentHtml || '<div style="color:#888;margin-top:20px">未找到相关内容</div>'}
                    </div>
                `;
                this.setActiveNav(null);
            },
            
            renderSettings: () => {
                const mainView = this.el('main-view');
                // --- FIX: 检查主视图是否存在 ---
                if (!mainView) {
                    return console.error("Critical UI Error: Element with ID 'main-view' not found for rendering settings.");
                }

                const html = `
                    <div class="top-bar">
                        <h2 style="font-weight:700;">⚙️ 用户设置</h2>
                        <button class="nav-btn" onclick="window.router.home()">返回首页</button>
                    </div>
                    <div class="content-wrapper" style="padding: 20px 0;">
                        <div style="background: var(--bg-card); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                            <h3 style="margin-bottom: 15px; color: var(--primary);">外观设置</h3>
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">背景图片 URL (留空使用默认渐变)</label>
                                <input type="text" id="setting-bg-url" value="${userSettings.bgUrl}" 
                                    placeholder="输入图片链接 (如: http://example.com/bg.jpg)"
                                    style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: white;">
                                <button onclick="window.ui.handleSettingChange('bgUrl', window.ui.el('setting-bg-url').value);" 
                                        style="margin-top: 10px; padding: 8px 15px; background: var(--primary); color: black; border: none; border-radius: 4px; cursor: pointer;">应用背景</button>
                            </div>
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">背景模糊度: <span id="blur-value">${userSettings.bgBlur}%</span></label>
                                <input type="range" min="0" max="100" value="${userSettings.bgBlur}" id="setting-bg-blur" 
                                    oninput="window.ui.el('blur-value').innerText = this.value + '%'; window.ui.handleSettingChange('bgBlur', parseInt(this.value));" 
                                    style="width: 100%; height: 5px; background: #555; border-radius: 2.5px; appearance: none; cursor: pointer;">
                            </div>
                        </div>
                        
                        <div style="background: var(--bg-card); padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                            <h3 style="margin-bottom: 15px; color: var(--primary);">播放界面设置</h3>
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">歌词字体大小: <span id="size-value">${userSettings.lyricSize}px</span></label>
                                <input type="range" min="16" max="36" value="${userSettings.lyricSize}" id="setting-lyric-size" 
                                    oninput="window.ui.el('size-value').innerText = this.value + 'px'; window.ui.handleSettingChange('lyricSize', parseInt(this.value));" 
                                    style="width: 100%; height: 5px; background: #555; border-radius: 2.5px; appearance: none; cursor: pointer;">
                            </div>

                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <label style="font-weight: 600;">全屏页显示相似推荐 (默认开启)</label>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="setting-show-related" ${userSettings.showRelated ? 'checked' : ''}
                                        onclick="window.ui.handleSettingChange('showRelated', this.checked)">
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>

                        <button onclick="if(confirm('确定要重置所有设置吗？')) resetAllSettings();" 
                                style="padding: 10px 20px; background: #c0392b; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
                            重置所有设置
                        </button>
                    </div>
                `;
                mainView.innerHTML = html;
                this.setActiveNav('settings');
            },
            
            handleSettingChange: (key, value) => {
                userSettings[key] = value;
                applySettings();
            },

            toggleFullPlayer(show) {
                const fp = this.el('full-player');
                if(show) fp.classList.add('active');
                else fp.classList.remove('active');
                
                const relatedSection = this.el('related-section');
                if(relatedSection) relatedSection.style.display = userSettings.showRelated ? 'block' : 'none';
            }
        };

        player = {
            audio: document.getElementById('audio'),
            
            init() {
                this.audio.addEventListener('timeupdate', () => {
                    const cur = this.audio.currentTime;
                    ui.el('progress-fill').style.width = (cur / this.audio.duration * 100) + '%';
                    this.syncLyrics(cur);
                });
                this.audio.addEventListener('ended', () => this.next());
                
                ui.el('progress-bar').addEventListener('click', e => {
                    const pct = e.offsetX / e.target.offsetWidth;
                    this.audio.currentTime = pct * this.audio.duration;
                });

                ui.el('lyrics-box').addEventListener('scroll', () => {
                    state.userScroll = true;
                    clearTimeout(state.scrollTimer);
                    state.scrollTimer = setTimeout(() => state.userScroll = false, 4000);
                });
            },

            async playList(listName, index) {
                const list = window[listName];
                if(!list) return;
                
                state.playlist = list.map(s => ({
                    id: s.id,
                    name: s.name,
                    artist: s.ar ? s.ar[0].name : (s.artists ? s.artists[0].name : '未知'),
                    cover: s.al ? s.al.picUrl : (s.album ? s.album.picUrl : ''),
                    dt: s.dt || s.duration
                }));
                state.index = index;
                this.loadSong();
                ui.el('footer-player').classList.add('visible');
            },

            async loadSong() {
                const song = state.playlist[state.index];
                ui.loading(true);

                const set = (id, t) => { if(ui.el(id)) ui.el(id).innerText = t; };
                const setImg = (id, s) => { if(ui.el(id)) ui.el(id).src = s; };

                set('mini-title', song.name); set('mini-artist', song.artist); setImg('mini-cover', song.cover);
                set('fp-title', song.name); set('fp-artist', song.artist); setImg('fp-cover', song.cover);

                try {
                    const res = await window.api.url(song.id);
                    const url = res.data[0].url;
                    if (url) {
                        this.audio.src = url;
                        this.audio.play();
                        state.playing = true;
                        this.updateBtn();

                        const dlBtn = ui.el('fp-download-btn');
                        dlBtn.href = url; 
                        
                        this.loadLyrics(song.id);
                        this.loadSimi(song.id);
                    } else {
                        alert('无法播放：无版权或VIP');
                    }
                } catch(e) { console.error(e); }
                ui.loading(false);
            },

            async loadLyrics(id) {
                const res = await window.api.lyric(id);
                state.lyrics = [];
                const box = ui.el('lyrics-box');
                if(res.lrc) {
                    state.lyrics = res.lrc.lyric.split('\n').map(l => {
                        const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/.exec(l);
                        return m ? { t: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/1000, txt: m[4] } : null;
                    }).filter(x=>x);
                    box.innerHTML = state.lyrics.map((l,i) => `<div class="lyric-line" id="l-${i}" onclick="window.player.seek(${l.t})">${l.txt}</div>`).join('');
                } else {
                    box.innerHTML = '<div class="lyric-line">纯音乐 / 无歌词</div>';
                }
            },

            async loadSimi(id) {
                const relatedContainer = ui.el('related-container');
                const relatedSection = ui.el('related-section');
                
                // 检查设置开关
                if (!userSettings.showRelated) {
                    if (relatedSection) relatedSection.style.display = 'none';
                    return;
                }
                if (relatedSection) relatedSection.style.display = 'block';

                const res = await window.api.simi(id);
                if(res.songs) {
                    window.simiList = res.songs;
                    relatedContainer.innerHTML = res.songs.slice(0,6).map((s,i) => `
                        <div class="related-card" onclick="window.player.playList('simiList', ${i})">
                            <img src="${s.album.picUrl}?param=100y100">
                            <div class="related-title">${s.name}</div>
                        </div>
                    `).join('');
                }
            },

            syncLyrics(t) {
                if(state.lyrics.length === 0) return;
                let idx = state.lyrics.findIndex(l => l.t > t) - 1;
                if(idx < 0) idx = 0;
                
                document.querySelector('.lyric-line.active')?.classList.remove('active');
                const line = ui.el('l-'+idx);
                if(line) {
                    line.classList.add('active');
                    if(!state.userScroll) line.scrollIntoView({behavior:'smooth', block:'center'});
                }
            },

            toggle() {
                if(this.audio.paused) { this.audio.play(); state.playing = true; }
                else { this.audio.pause(); state.playing = false; }
                this.updateBtn();
            },

            updateBtn() {
                ui.el('icon-play').style.display = state.playing ? 'none' : 'block';
                ui.el('icon-pause').style.display = state.playing ? 'block' : 'none';
                const img = ui.el('mini-cover');
                if(state.playing) img.classList.add('spinning'); else img.classList.remove('spinning');
            },

            prev() { if(state.playlist.length) { state.index = (state.index-1+state.playlist.length)%state.playlist.length; this.loadSong(); } },
            next() { if(state.playlist.length) { state.index = (state.index+1)%state.playlist.length; this.loadSong(); } },
            seek(t) { this.audio.currentTime = t; state.userScroll = false; },
            fmtTime: s => { const m=Math.floor(s/60), ss=Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; }
        };

        router = {
            home: () => {
                console.log("Router: Navigating to Home.");
                ui.renderHome();
            },
            settings: () => {
                // --- FIX: 添加日志确认执行，并调用渲染函数 ---
                console.log("Router: Attempting navigation to Settings.");
                ui.renderSettings();
            },
            search: async (kw, type) => {
                if(!kw) return;
                ui.loading(true);
                const res = await window.api.search(kw, type);
                ui.loading(false);
                ui.renderSearch(res, type, kw);
            },
            loadAlbum: async (id) => {
                ui.loading(true);
                const res = await window.api.album(id);
                ui.loading(false);
                window.albumList = res.songs;
                window.player.playList('albumList', 0); 
            },
            loadPlaylist: async (id) => {
                ui.loading(true);
                const res = await window.api.playlist(id);
                ui.loading(false);
                window.plList = res.playlist.tracks;
                window.player.playList('plList', 0); 
            }
        };
        
        // 将对象挂载到 window, 确保 HTML 中的 onclick 可以找到它们
        window.ui = ui;
        window.router = router;
        window.player = player;

        // 初始化时加载设置并跳转到首页
        initSettings();
        window.router.home();
        window.player.init();
    </script>
</body>
</html>
