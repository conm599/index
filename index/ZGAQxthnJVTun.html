// DOM元素

// 检查文件是否为图片

// 加载图片

function loadImage(file) {

const previewImg = document.createElement('img');

if (isProcessing || !originalImage) return;

offscreenCanvas.width = originalImage.naturalWidth;

offscreenCanvas.height = originalImage.naturalHeight;

offscreenCtx.drawImage(originalImage, 0, 0);

// 获取原始图片数据

originalImageData = offscreenCtx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);

// 1. 基本抠图（无抗锯齿）

const basicResult = removeBackgroundBasic(originalImageData, currentThreshold);

drawToCanvas(basicResult, canvasBefore, previewWidth, previewHeight);

// 2. 带抗锯齿的抠图

originalImageData,

currentThreshold,

// 3. 最终结果（使用抗锯齿版本）

drawToCanvas(antialiasedResult, canvas, previewWidth, previewHeight);

} catch (error) {

console.error('处理失败:', error);

// 基本抠图函数（无抗锯齿）

function removeBackgroundBasic(imageData, threshold) {

const { width, height, data } = imageData;

const result = new ImageData(width, height);

const resultData = result.data;

for (let i = 0; i < data.length; i += 4) {

const r = data[i];

const g = data[i + 1];

const b = data[i + 2];

const a = data[i + 3];

// 计算颜色与白色的距离

const whiteDistance = Math.sqrt(

Math.pow(255 - r, 2) +

Math.pow(255 - g, 2) +

Math.pow(255 - b, 2)

);

// 复制颜色

resultData[i] = r;

resultData[i + 1] = g;

resultData[i + 2] = b;

// 如果颜色接近白色（根据阈值），则设为透明

if (whiteDistance < threshold) {

resultData[i + 3] = 0;

} else {

resultData[i + 3] = a;

}

}

return result;

}

// 带TAA风格抗锯齿的抠图函数

function removeBackgroundWithAntialias(imageData, threshold, antialiasLevel) {

const { width, height, data } = imageData;

const result = new ImageData(width, height);

const resultData = result.data;

// 创建alpha映射

const alphaMap = new Float32Array(width * height);

// 第一步：计算每个像素的基本alpha值

for (let y = 0; y < height; y++) {

for (let x = 0; x < width; x++) {

const idx = (y * width + x) * 4;

const r = data[idx];

const g = data[idx + 1];

const b = data[idx + 2];

// 计算颜色与白色的距离

const whiteDistance = Math.sqrt(

Math.pow(255 - r, 2) +

Math.pow(255 - g, 2) +

Math.pow(255 - b, 2)

);

// 基本alpha值（0或1）

alphaMap[y * width + x] = whiteDistance >= threshold ? 1.0 : 0.0;

}

}

// 第二步：应用抗锯齿（TAA风格多重采样）

if (antialiasLevel > 0) {

applyTaaAntialias(alphaMap, width, height, antialiasLevel);

}

// 第三步：应用抗锯齿后的alpha值

for (let y = 0; y < height; y++) {

for (let x = 0; x < width; x++) {

const idx = (y * width + x) * 4;

const alpha = alphaMap[y * width + x];

// 复制颜色

resultData[idx] = data[idx];

resultData[idx + 1] = data[idx + 1];

resultData[idx + 2] = data[idx + 2];

// 应用抗锯齿后的alpha

resultData[idx + 3] = Math.round(alpha * 255);

}

}

return result;

}

// 应用TAA风格抗锯齿

function applyTaaAntialias(alphaMap, width, height, level) {

// 根据抗锯齿级别确定采样次数

const samples = level * 2 + 1;

const radius = Math.floor(level / 2);

// 创建临时数组

const tempAlphaMap = new Float32Array(width * height);

for (let y = 0; y < height; y++) {

for (let x = 0; x < width; x++) {

const idx = y * width + x;

const currentAlpha = alphaMap[idx];

// 如果当前像素已经是完全透明或完全不透明，跳过抗锯齿

if (currentAlpha <= 0.01 || currentAlpha >= 0.99) {

tempAlphaMap[idx] = currentAlpha;

continue;

}

// 多重采样

let totalAlpha = 0;

let sampleCount = 0;

for (let dy = -radius; dy <= radius; dy++) {

for (let dx = -radius; dx <= radius; dx++) {

const nx = Math.max(0, Math.min(width - 1, x + dx));

const ny = Math.max(0, Math.min(height - 1, y + dy));

const nIdx = ny * width + nx;

// 使用高斯权重

const distance = Math.sqrt(dx * dx + dy * dy);

const weight = Math.exp(-distance * distance / (2 * radius * radius));

totalAlpha += alphaMap[nIdx] * weight;

sampleCount += weight;

}

}

// 计算加权平均

tempAlphaMap[idx] = sampleCount > 0 ? totalAlpha / sampleCount : currentAlpha;

}

}

// 复制回原数组

for (let i = 0; i < alphaMap.length; i++) {

alphaMap[i] = tempAlphaMap[i];

}

// 边缘增强：对边缘区域进行轻微锐化

for (let y = 1; y < height - 1; y++) {

for (let x = 1; x < width - 1; x++) {

const idx = y * width + x;

const currentAlpha = tempAlphaMap[idx];

// 只处理边缘区域

if (currentAlpha > 0.1 && currentAlpha < 0.9) {

// 计算周围像素的平均值

let neighborSum = 0;

let neighborCount = 0;

for (let dy = -1; dy <= 1; dy++) {

for (let dx = -1; dx <= 1; dx++) {

if (dx === 0 && dy === 0) continue;

const nIdx = (y + dy) * width + (x + dx);

neighborSum += tempAlphaMap[nIdx];

neighborCount++;

}

}

const neighborAvg = neighborSum / neighborCount;

// 如果当前像素与周围平均差异较大，稍微增强对比度

const diff = currentAlpha - neighborAvg;

if (Math.abs(diff) > 0.1) {

alphaMap[idx] = Math.max(0, Math.min(1, currentAlpha + diff * 0.3));

}

}

}

}

}

// 绘制到canvas（保持宽高比）

function drawToCanvas(imageData, targetCanvas, targetWidth, targetHeight) {

const tempCanvas = document.createElement('canvas');

const tempCtx = tempCanvas.getContext('2d', { alpha: true });

tempCanvas.width = imageData.width;

tempCanvas.height = imageData.height;

tempCtx.putImageData(imageData, 0, 0);

// 计算保持宽高比的尺寸

const aspectRatio = imageData.width / imageData.height;

let drawWidth = targetWidth;

let drawHeight = targetHeight;

if (drawWidth / drawHeight > aspectRatio) {

drawWidth = drawHeight * aspectRatio;

} else {

drawHeight = drawWidth / aspectRatio;

}

const offsetX = (targetWidth - drawWidth) / 2;

const offsetY = (targetHeight - drawHeight) / 2;

const targetCtx = targetCanvas.getContext('2d', { alpha: true });

targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

targetCtx.imageSmoothingEnabled = true;

targetCtx.imageSmoothingQuality = 'high';

targetCtx.drawImage(tempCanvas, offsetX, offsetY, drawWidth, drawHeight);

}

// 处理并导出完整分辨率图片

async function processAndExportFullResolution(quality) {

return new Promise((resolve, reject) => {

try {

// 创建离屏canvas

const exportCanvas = document.createElement('canvas');

const exportCtx = exportCanvas.getContext('2d', { alpha: true, willReadFrequently: true });

// 使用原始分辨率

exportCanvas.width = originalWidth;

exportCanvas.height = originalHeight;

// 绘制原始图片

exportCtx.drawImage(originalImage, 0, 0);

// 获取原始图片数据

const imageData = exportCtx.getImageData(0, 0, originalWidth, originalHeight);

// 使用当前参数处理图片

const processedData = removeBackgroundWithAntialias(

imageData,

currentThreshold,

currentAntialias

);

// 将处理后的数据绘制到canvas

exportCtx.putImageData(processedData, 0, 0);

// 导出为WebP

const dataURL = exportCanvas.toDataURL('image/webp', quality);

resolve(dataURL);

} catch (error) {

reject(error);

}

});

}

// 自动计算最佳阈值

function calculateAutoThreshold(img) {

// 创建临时canvas进行分析

const tempCanvas = document.createElement('canvas');

const tempCtx = tempCanvas.getContext('2d', { alpha: true, willReadFrequently: true });

// 使用较小尺寸以提高性能

const sampleSize = 200;

let width = img.naturalWidth;

let height = img.naturalHeight;

const ratio = Math.min(sampleSize / width, sampleSize / height);

tempCanvas.width = width * ratio;

tempCanvas.height = height * ratio;

// 绘制图片到临时canvas

tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);

// 获取图片数据

const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

const data = imageData.data;

// 分析图片，计算最佳阈值

let whitePixels = 0;

let totalPixels = 0;

const whiteDistances = [];

for (let i = 0; i < data.length; i += 4) {

const r = data[i];

const g = data[i + 1];

const b = data[i + 2];

// 计算与白色的距离

const whiteDistance = Math.sqrt(

Math.pow(255 - r, 2) +

Math.pow(255 - g, 2) +

Math.pow(255 - b, 2)

);

whiteDistances.push(whiteDistance);

// 统计接近白色的像素

if (whiteDistance < 100) {

whitePixels++;

}

totalPixels++;

}

// 计算平均距离

whiteDistances.sort((a, b) => a - b);

const medianDistance = whiteDistances[Math.floor(whiteDistances.length / 2)];

// 自适应阈值计算

if (whitePixels / totalPixels > 0.3) {

// 白色背景较多，使用较高阈值

return Math.min(255, Math.max(100, medianDistance + 30));

} else {

// 白色背景较少，使用较低阈值

return Math.min(255, Math.max(50, medianDistance - 20));

}

}
