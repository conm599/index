<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU压力测试</title>
</head>
<body style="margin:0; padding:0; overflow:hidden;">
    <canvas id="gpuCanvas" style="width:100vw; height:100vh; display:block;"></canvas>
    <script>
        const canvas = document.getElementById('gpuCanvas');
        let gl = null;
        let program = null;
        let buffer = null;
        let particles = 100000; // 初始粒子数：10万
        const complexity = 50;  // 固定复杂度：50
        const particleSize = 2.0;// 固定粒子大小
        const speed = 1.0;       // 固定运动速度
        let animationId = null;
        let isRunning = true;

        // 初始化WebGL
        try {
            gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        } catch (e) {
            console.error("WebGL初始化失败:", e);
        }

        if (gl) {
            initWebGL();
            startTest();
            // 每秒增加10万粒子
            setInterval(() => {
                if (isRunning && particles < 20000000) { // 上限2000万，避免内存溢出
                    particles += 100000;
                    initParticleBuffer(); // 更新粒子缓冲区
                }
            }, 1000);
        } else {
            document.body.innerHTML = "<div style='width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:#000; color:#fff;'>不支持WebGL，无法测试</div>";
        }

        function initWebGL() {
            // 顶点着色器（含复杂计算）
            const vertexShaderSource = `
                attribute vec2 aPosition;
                uniform float uTime;
                uniform float uComplexity;
                uniform float uSpeed;
                
                void main() {
                    vec2 position = aPosition;
                    float t = uTime * uSpeed;
                    
                    // 复杂度固定为50的循环计算
                    for (int i = 0; i < 50; i++) {
                        float freq = float(i+1) * 0.3;
                        float amp = 0.5 / float(i+1);
                        
                        position.x += sin(position.y * freq * 0.5 + t * (0.5 + float(i)*0.1)) * amp;
                        position.y += cos(position.x * freq * 0.7 + t * (0.6 + float(i)*0.15)) * amp;
                        
                        position.x = cos(position.x * 1.2 + t * 0.8) * sin(position.y * 0.9 + t * 1.1);
                        position.y = sin(position.x * 0.8 + t * 1.2) * cos(position.y * 1.1 + t * 0.9);
                        
                        position.x = pow(abs(position.x), 1.0 + sin(t * 0.3) * 0.5);
                        position.y = pow(abs(position.y), 1.0 + cos(t * 0.4) * 0.5);
                    }
                    
                    gl_Position = vec4(position, 0.0, 1.0);
                    gl_PointSize = ${particleSize}.0;
                }
            `;

            // 片段着色器
            const fragmentShaderSource = `
                precision mediump float;
                
                void main() {
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float dist = length(coord);
                    
                    if (dist > 0.5) discard;
                    
                    vec3 color = vec3(
                        0.5 + 0.5 * sin(gl_FragCoord.x * 0.01),
                        0.5 + 0.5 * cos(gl_FragCoord.y * 0.01),
                        0.7 + 0.3 * sin(gl_FragCoord.x * 0.02 + gl_FragCoord.y * 0.01)
                    );
                    
                    float alpha = pow(1.0 - dist * 2.0, 2.0);
                    gl_FragColor = vec4(color, alpha);
                }
            `;

            // 创建着色器程序
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            
            program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('着色器程序错误:', gl.getProgramInfoLog(program));
                return;
            }
            
            gl.useProgram(program);
            initParticleBuffer();
        }

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('着色器编译错误:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            
            return shader;
        }

        function initParticleBuffer() {
            // 生成粒子位置数据
            const positions = new Float32Array(particles * 2);
            for (let i = 0; i < particles * 2; i += 2) {
                positions[i] = Math.random() * 2 - 1;   // x: -1~1
                positions[i + 1] = Math.random() * 2 - 1; // y: -1~1
            }

            // 绑定缓冲区
            buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
            
            // 设置顶点属性
            const positionLocation = gl.getAttribLocation(program, 'aPosition');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
        }

        function render(time) {
            if (!isRunning) return;

            // 适配画布尺寸
            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }

            // 清除画布
            gl.clearColor(0.05, 0.05, 0.1, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            // 传递uniform变量
            const timeLocation = gl.getUniformLocation(program, 'uTime');
            gl.uniform1f(timeLocation, time * 0.001);
            
            const complexityLocation = gl.getUniformLocation(program, 'uComplexity');
            gl.uniform1f(complexityLocation, complexity);
            
            const speedLocation = gl.getUniformLocation(program, 'uSpeed');
            gl.uniform1f(speedLocation, speed);

            // 渲染粒子
            gl.drawArrays(gl.POINTS, 0, particles);

            // 持续渲染
            animationId = requestAnimationFrame(render);
        }

        function startTest() {
            isRunning = true;
            animationId = requestAnimationFrame(render);
        }

        // 页面关闭时停止渲染
        window.addEventListener('beforeunload', () => {
            isRunning = false;
            cancelAnimationFrame(animationId);
        });
    </script>
</body>
</html>
