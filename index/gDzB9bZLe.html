<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐播放器</title>
    <style>
        :root {
            --primary-color: #e74c3c;
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --progress-bg: #0f3460;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-secondary: #666666;
            --progress-bg: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: var(--transition);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .player {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), transparent);
            z-index: 0;
            border-radius: 20px 20px 0 0;
        }

        .album-art {
            width: 100%;
            max-width: 280px;
            height: 280px;
            margin: 0 auto 24px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .player.playing .album-art img {
            animation: rotateAlbum 20s linear infinite;
        }

        @keyframes rotateAlbum {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .song-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 16px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 6px;
            background-color: var(--progress-bg);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .control-btn.active {
            color: var(--primary-color);
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            color: white;
        }

        .play-btn:hover {
            background-color: #ff6b6b;
            transform: scale(1.05);
        }

        .volume-container {
            display: flex;
            align-items: center;
            margin-top: 16px;
        }

        .volume-btn {
            margin-right: 12px;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background-color: var(--progress-bg);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .volume-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 2px;
            width: 80%;
        }

        .volume-handle {
            width: 12px;
            height: 12px;
            background-color: var(--primary-color);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            right: 20%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .loading {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .search-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 8px 16px;
            margin-right: 12px;
        }

        .search-box input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-btn {
            background: var(--primary-color);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: var(--transition);
        }

        .search-btn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        .search-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .search-tab {
            padding: 8px 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }

        .search-tab.active {
            border-bottom-color: var(--primary-color);
            color: var(--primary-color);
        }

        .search-results {
            max-height: 500px;
            overflow-y: auto;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .result-item img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            margin-right: 12px;
        }

        .result-info {
            flex: 1;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-artist {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .result-duration {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .playlist-info {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }

        .playlist-count {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            .player {
                padding: 20px;
            }
            
            .album-art {
                width: 240px;
                height: 240px;
            }
            
            .song-title {
                font-size: 18px;
            }
            
            .song-artist {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>
            
            <button class="theme-toggle" id="theme-toggle">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12,18C8.7,18 6,15.3 6,12C6,8.7 8.7,6 12,6C15.3,6 18,8.7 18,12C18,15.3 15.3,18 12,18M12,8C9.8,8 8,9.8 8,12C8,14.2 9.8,16 12,16C14.2,16 16,14.2 16,12C16,9.8 14.2,8 12,8M12,4C7.6,4 4,7.6 4,12C4,16.4 7.6,20 12,20C16.4,20 20,16.4 20,12C20,7.6 16.4,4 12,4M12,2C17.5,2 22,6.5 22,12C22,17.5 17.5,22 12,22C6.5,22 2,17.5 2,12C2,6.5 6.5,2 12,2Z" />
                </svg>
            </button>
            
            <div class="album-art">
                <img id="cover" src="https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg" alt="专辑封面">
            </div>
            
            <div class="song-info">
                <div class="song-title" id="song-title">歌曲标题</div>
                <div class="song-artist" id="song-artist">艺术家</div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" id="shuffle-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M14.83,13.41L13.42,14.82L16.55,17.95L14.5,20H20V14.5L17.96,16.54L14.83,13.41M14.5,4L16.54,6.04L4,18.59L5.41,20L17.96,7.46L20,9.5V4M10.59,9.17L5.41,4L4,5.41L9.17,10.58L10.59,9.17Z" />
                    </svg>
                </button>
                
                <button class="control-btn" id="prev-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" />
                    </svg>
                </button>
                
                <button class="control-btn play-btn" id="play-btn">
                    <svg viewBox="0 0 24 24" id="play-icon">
                        <path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                    </svg>
                </button>
                
                <button class="control-btn" id="next-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M6,18L14.5,12L6,6M16,6V18H18V6H16Z" />
                    </svg>
                </button>
                
                <button class="control-btn" id="repeat-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" />
                    </svg>
                </button>
            </div>
            
            <div class="volume-container">
                <button class="control-btn volume-btn" id="volume-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
                    </svg>
                </button>
                <div class="volume-slider" id="volume-slider">
                    <div class="volume-fill" id="volume-fill"></div>
                    <div class="volume-handle" id="volume-handle"></div>
                </div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-header">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="搜索歌曲、专辑或歌手...">
                </div>
                <button class="search-btn" id="search-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                    </svg>
                </button>
            </div>
            
            <div class="search-tabs">
                <div class="search-tab active" data-type="1">单曲</div>
                <div class="search-tab" data-type="10">专辑</div>
                <div class="search-tab" data-type="1000">歌单</div>
            </div>
            
            <div class="search-results" id="search-results">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24">
                        <path fill="currentColor" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12,10.5A1.5,1.5 0 0,1 13.5,12A1.5,1.5 0 0,1 12,13.5A1.5,1.5 0 0,1 10.5,12A1.5,1.5 0 0,1 12,10.5M7.5,10.5A1.5,1.5 0 0,1 9,12A1.5,1.5 0 0,1 7.5,13.5A1.5,1.5 0 0,1 6,12A1.5,1.5 0 0,1 7.5,10.5M16.5,10.5A1.5,1.5 0 0,1 18,12A1.5,1.5 0 0,1 16.5,13.5A1.5,1.5 0 0,1 15,12A1.5,1.5 0 0,1 16.5,10.5Z" />
                    </svg>
                    <p>搜索你喜欢的音乐</p>
                </div>
            </div>
        </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        // 获取DOM元素
        const player = document.querySelector('.player');
        const audio = document.getElementById('audio');
        const cover = document.getElementById('cover');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeFill = document.getElementById('volume-fill');
        const volumeHandle = document.getElementById('volume-handle');
        const themeToggle = document.getElementById('theme-toggle');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const searchTabs = document.querySelectorAll('.search-tab');
        const searchResults = document.getElementById('search-results');

        // 播放列表和状态
        let currentSongIndex = 0;
        let songs = [];
        let isShuffled = false;
        let repeatMode = 'none'; // none, one, all
        let isDraggingProgress = false;
        let isDraggingVolume = false;
        let currentSearchType = '1';

        // API基础URL
        const API_BASE = 'https://163api.qijieya.cn';

        // 应用主题
        document.documentElement.setAttribute('data-theme', 'dark');

        // 初始化播放列表
        function initPlaylist() {
            // 默认播放列表
            songs = [
                {
                    id: '28403111',
                    title: '晴天',
                    artist: '周杰伦',
                    cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                    duration: 258000
                },
                {
                    id: '65528',
                    title: '七里香',
                    artist: '周杰伦',
                    cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                    duration: 298000
                },
                {
                    id: '108478',
                    title: '稻香',
                    artist: '周杰伦',
                    cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                    duration: 220000
                }
            ];
            loadSong(currentSongIndex);
        }

        // 搜索音乐
        async function searchMusic() {
            const keywords = searchInput.value.trim();
            if (!keywords) return;
            
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/cloudsearch?keywords=${encodeURIComponent(keywords)}&type=${currentSearchType}&limit=30`);
                const data = await response.json();
                
                if (data.code === 200) {
                    displayResults(data.result);
                } else {
                    throw new Error('搜索失败');
                }
            } catch (error) {
                console.error('搜索失败:', error);
                searchResults.innerHTML = '<div class="empty-state">搜索失败，请稍后重试</div>';
            } finally {
                hideLoading();
            }
        }

        // 显示搜索结果
        function displayResults(result) {
            if (!result || (result.songCount === 0 && result.playlistCount === 0 && result.albumCount === 0)) {
                searchResults.innerHTML = '<div class="empty-state">没有找到相关结果</div>';
                return;
            }
            
            let html = '';
            
            if (currentSearchType === '1' && result.songs) {
                // 单曲搜索结果
                result.songs.forEach(song => {
                    const artists = song.ar ? song.ar.map(artist => artist.name).join(' / ') : '未知艺术家';
                    const duration = formatTime(song.dt / 1000);
                    
                    html += `
                        <div class="result-item" data-id="${song.id}" data-type="song">
                            <img src="${song.al ? song.al.picUrl : 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg'}" alt="封面">
                            <div class="result-info">
                                <div class="result-title">${song.name}</div>
                                <div class="result-artist">${artists}</div>
                            </div>
                            <div class="result-duration">${duration}</div>
                        </div>
                    `;
                });
            } else if (currentSearchType === '10' && result.albums) {
                // 专辑搜索结果
                result.albums.forEach(album => {
                    const artist = album.artist ? album.artist.name : '未知艺术家';
                    
                    html += `
                        <div class="result-item" data-id="${album.id}" data-type="album">
                            <img src="${album.picUrl || 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg'}" alt="封面">
                            <div class="result-info">
                                <div class="result-title">${album.name}</div>
                                <div class="result-artist">${artist}</div>
                            </div>
                        </div>
                    `;
                });
            } else if (currentSearchType === '1000' && result.playlists) {
                // 歌单搜索结果
                result.playlists.forEach(playlist => {
                    html += `
                        <div class="result-item" data-id="${playlist.id}" data-type="playlist">
                            <img src="${playlist.coverImgUrl || 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg'}" alt="封面">
                            <div class="result-info">
                                <div class="result-title">${playlist.name}</div>
                                <div class="playlist-info">
                                    <div class="result-artist">${playlist.creator.nickname}</div>
                                    <div class="playlist-count">${playlist.trackCount}首</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            
            searchResults.innerHTML = html;
            
            // 添加点击事件
            document.querySelectorAll('.result-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.dataset.id;
                    const type = item.dataset.type;
                    
                    if (type === 'song') {
                        playSongById(id);
                    } else if (type === 'album') {
                        loadAlbum(id);
                    } else if (type === 'playlist') {
                        loadPlaylist(id);
                    }
                });
            });
        }

        // 根据ID播放歌曲
        async function playSongById(songId) {
            showLoading();
            try {
                // 获取歌曲详情
                const detailResponse = await fetch(`${API_BASE}/song/detail?ids=${songId}`);
                const detailData = await detailResponse.json();
                
                if (detailData.code === 200 && detailData.songs && detailData.songs.length > 0) {
                    const song = detailData.songs[0];
                    
                    // 获取歌曲URL
                    const urlResponse = await fetch(`${API_BASE}/song/url/v1?id=${songId}&level=standard`);
                    const urlData = await urlResponse.json();
                    
                    if (urlData.code === 200 && urlData.data && urlData.data.length > 0) {
                        const songUrl = urlData.data[0].url;
                        
                        if (songUrl) {
                            // 添加到播放列表并播放
                            const newSong = {
                                id: songId,
                                title: song.name,
                                artist: song.ar ? song.ar.map(artist => artist.name).join(' / ') : '未知艺术家',
                                cover: song.al ? song.al.picUrl : 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                                url: songUrl,
                                duration: song.dt
                            };
                            
                            songs = [newSong];
                            currentSongIndex = 0;
                            loadSong(currentSongIndex);
                        } else {
                            throw new Error('无法获取歌曲播放地址');
                        }
                    } else {
                        throw new Error('无法获取歌曲播放地址');
                    }
                } else {
                    throw new Error('无法获取歌曲详情');
                }
            } catch (error) {
                console.error('播放歌曲失败:', error);
                alert('播放失败，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        // 加载专辑
        async function loadAlbum(albumId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/album?id=${albumId}`);
                const data = await response.json();
                
                if (data.code === 200 && data.songs) {
                    // 获取所有歌曲的URL
                    const songIds = data.songs.map(song => song.id).join(',');
                    const urlResponse = await fetch(`${API_BASE}/song/url/v1?id=${songIds}&level=standard`);
                    const urlData = await urlResponse.json();
                    
                    if (urlData.code === 200 && urlData.data) {
                        // 构建播放列表
                        songs = data.songs.map((song, index) => {
                            const urlInfo = urlData.data.find(item => item.id === song.id);
                            return {
                                id: song.id,
                                title: song.name,
                                artist: song.ar ? song.ar.map(artist => artist.name).join(' / ') : '未知艺术家',
                                cover: song.al ? song.al.picUrl : 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                                url: urlInfo ? urlInfo.url : null,
                                duration: song.dt
                            };
                        }).filter(song => song.url); // 过滤掉没有URL的歌曲
                        
                        if (songs.length > 0) {
                            currentSongIndex = 0;
                            loadSong(currentSongIndex);
                        } else {
                            throw new Error('专辑中没有可播放的歌曲');
                        }
                    } else {
                        throw new Error('无法获取歌曲播放地址');
                    }
                } else {
                    throw new Error('无法获取专辑信息');
                }
            } catch (error) {
                console.error('加载专辑失败:', error);
                alert('加载专辑失败，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        // 加载歌单
        async function loadPlaylist(playlistId) {
            showLoading();
            try {
                const response = await fetch(`${API_BASE}/playlist/detail?id=${playlistId}`);
                const data = await response.json();
                
                if (data.code === 200 && data.playlist && data.playlist.tracks) {
                    // 获取所有歌曲的URL
                    const songIds = data.playlist.tracks.map(track => track.id).join(',');
                    const urlResponse = await fetch(`${API_BASE}/song/url/v1?id=${songIds}&level=standard`);
                    const urlData = await urlResponse.json();
                    
                    if (urlData.code === 200 && urlData.data) {
                        // 构建播放列表
                        songs = data.playlist.tracks.map((track, index) => {
                            const urlInfo = urlData.data.find(item => item.id === track.id);
                            return {
                                id: track.id,
                                title: track.name,
                                artist: track.ar ? track.ar.map(artist => artist.name).join(' / ') : '未知艺术家',
                                cover: track.al ? track.al.picUrl : 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                                url: urlInfo ? urlInfo.url : null,
                                duration: track.dt
                            };
                        }).filter(song => song.url); // 过滤掉没有URL的歌曲
                        
                        if (songs.length > 0) {
                            currentSongIndex = 0;
                            loadSong(currentSongIndex);
                        } else {
                            throw new Error('歌单中没有可播放的歌曲');
                        }
                    } else {
                        throw new Error('无法获取歌曲播放地址');
                    }
                } else {
                    throw new Error('无法获取歌单信息');
                }
            } catch (error) {
                console.error('加载歌单失败:', error);
                alert('加载歌单失败，请稍后重试');
            } finally {
                hideLoading();
            }
        }

        // 加载歌曲
        function loadSong(index) {
            if (songs.length === 0) return;
            
            const song = songs[index];
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            cover.src = song.cover;
            
            // 设置音频源
            if (song.url) {
                audio.src = song.url;
                totalTimeEl.textContent = formatTime(song.duration / 1000);
            } else {
                // 如果没有URL，尝试获取
                fetchSongUrl(song.id).then(url => {
                    if (url) {
                        song.url = url;
                        audio.src = url;
                        totalTimeEl.textContent = formatTime(song.duration / 1000);
                    }
                });
            }
            
            // 更新播放状态
            updatePlayState();
        }

        // 获取歌曲URL
        async function fetchSongUrl(songId) {
            try {
                const response = await fetch(`${API_BASE}/song/url/v1?id=${songId}&level=standard`);
                const data = await response.json();
                
                if (data.code === 200 && data.data && data.data.length > 0) {
                    return data.data[0].url;
                }
            } catch (error) {
                console.error('获取歌曲URL失败:', error);
            }
            return null;
        }

        // 更新播放状态
        function updatePlayState() {
            if (audio.paused) {
                player.classList.remove('playing');
                playIcon.innerHTML = '<path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />';
            } else {
                player.classList.add('playing');
                playIcon.innerHTML = '<path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z" />';
            }
        }

        // 播放/暂停
        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updatePlayState();
        }

        // 下一首
        function nextSong() {
            if (isShuffled) {
                currentSongIndex = Math.floor(Math.random() * songs.length);
            } else {
                currentSongIndex = (currentSongIndex + 1) % songs.length;
            }
            loadSong(currentSongIndex);
            if (!audio.paused) {
                audio.play();
            }
        }

        // 上一首
        function prevSong() {
            if (isShuffled) {
                currentSongIndex = Math.floor(Math.random() * songs.length);
            } else {
                currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            }
            loadSong(currentSongIndex);
            if (!audio.paused) {
                audio.play();
            }
        }

        // 切换随机播放
        function toggleShuffle() {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('active', isShuffled);
        }

        // 切换循环模式
        function toggleRepeat() {
            const modes = ['none', 'one', 'all'];
            const currentIndex = modes.indexOf(repeatMode);
            repeatMode = modes[(currentIndex + 1) % modes.length];
            
            repeatBtn.classList.toggle('active', repeatMode !== 'none');
            
            // 更新图标
            if (repeatMode === 'one') {
                repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" /></svg>';
            } else {
                repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" /></svg>';
            }
        }

        // 更新进度条
        function updateProgress() {
            if (!isDraggingProgress) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        }

        // 设置进度
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            
            audio.currentTime = (clickX / width) * duration;
        }

        // 格式化时间
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 更新音量
        function setVolume(e) {
            const width = volumeSlider.clientWidth;
            const clickX = e.offsetX;
            const volume = Math.max(0, Math.min(1, clickX / width));
            
            audio.volume = volume;
            volumeFill.style.width = `${volume * 100}%`;
            volumeHandle.style.right = `${(1 - volume) * 100}%`;
        }

        // 切换主题
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
        }

        // 显示加载状态
        function showLoading() {
            loading.classList.add('show');
        }

        // 隐藏加载状态
        function hideLoading() {
            loading.classList.remove('show');
        }

        // 事件监听
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        shuffleBtn.addEventListener('click', toggleShuffle);
        repeatBtn.addEventListener('click', toggleRepeat);
        themeToggle.addEventListener('click', toggleTheme);

        // 搜索事件
        searchBtn.addEventListener('click', searchMusic);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMusic();
            }
        });

        // 搜索标签切换
        searchTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                searchTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentSearchType = tab.dataset.type;
                
                // 如果搜索框有内容，重新搜索
                if (searchInput.value.trim()) {
                    searchMusic();
                }
            });
        });

        // 进度条事件
        progressBar.addEventListener('click', setProgress);
        
        progressBar.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            setProgress(e);
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                setProgress(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });

        // 音量控制事件
        volumeSlider.addEventListener('click', setVolume);
        
        volumeHandle.addEventListener('mousedown', (e) => {
            isDraggingVolume = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingVolume) {
                const rect = volumeSlider.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const volume = Math.max(0, Math.min(1, x / rect.width));
                
                audio.volume = volume;
                volumeFill.style.width = `${volume * 100}%`;
                volumeHandle.style.right = `${(1 - volume) * 100}%`;
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingVolume = false;
        });

        // 音频事件
        audio.addEventListener('loadedmetadata', () => {
            if (!isNaN(audio.duration)) {
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('timeupdate', updateProgress);

        audio.addEventListener('ended', () => {
            if (repeatMode === 'one') {
                audio.currentTime = 0;
                audio.play();
            } else if (repeatMode === 'all' || currentSongIndex < songs.length - 1) {
                nextSong();
            } else {
                player.classList.remove('playing');
                playIcon.innerHTML = '<path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />';
            }
        });

        // 初始化
        initPlaylist();
    </script>
</body>
</html>
