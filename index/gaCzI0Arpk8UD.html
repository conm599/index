<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线网速测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
        }
        
        .slider {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            outline: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff8a00;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 138, 0, 0.5);
        }
        
        .thread-count {
            margin-left: 15px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(1px);
        }
        
        .btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .progress-container {
            margin-bottom: 30px;
        }
        
        .progress-bar {
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        
        .result-container {
            display: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .result-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .result-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .result-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
        }
        
        .result-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .chart-container {
            height: 200px;
            margin-top: 20px;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ff8a00;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>在线网速测试</h1>
            <p class="subtitle">测试您的网络下载速度，支持多线程下载</p>
        </header>
        
        <div class="control-panel">
            <div class="form-group">
                <label for="threads">下载线程数 (1-100):</label>
                <div class="slider-container">
                    <input type="range" id="threads" class="slider" min="1" max="100" value="48">
                    <span id="thread-count" class="thread-count">48</span>
                </div>
            </div>
            
            <button id="start-test" class="btn">开始测速</button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在测试下载速度，请稍候...</p>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="progress-text">
                <span>0%</span>
                <span id="time-left">剩余时间: 15秒</span>
            </div>
        </div>
        
        <div class="result-container" id="result-container">
            <h2 class="result-title">测速结果</h2>
            <div class="result-grid">
                <div class="result-card">
                    <div class="result-label">下载速度</div>
                    <div class="result-value" id="speed-mbps">0.00</div>
                    <div class="result-label">Mbps</div>
                </div>
                <div class="result-card">
                    <div class="result-label">下载速度</div>
                    <div class="result-value" id="speed-mbs">0.00</div>
                    <div class="result-label">MB/s</div>
                </div>
                <div class="result-card">
                    <div class="result-label">使用线程</div>
                    <div class="result-value" id="threads-used">48</div>
                    <div class="result-label">线程</div>
                </div>
                <div class="result-card">
                    <div class="result-label">测试时间</div>
                    <div class="result-value" id="test-time">0.00</div>
                    <div class="result-label">秒</div>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="speed-chart"></canvas>
            </div>
        </div>
        
        <footer>
            <p>测速文件: https://cesu.naxid.top/hgf.txt | 测试时长: 15秒</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const threadsSlider = document.getElementById('threads');
            const threadCount = document.getElementById('thread-count');
            const startButton = document.getElementById('start-test');
            const progressBar = document.getElementById('progress');
            const timeLeft = document.getElementById('time-left');
            const resultContainer = document.getElementById('result-container');
            const speedMbps = document.getElementById('speed-mbps');
            const speedMBs = document.getElementById('speed-mbs');
            const threadsUsed = document.getElementById('threads-used');
            const testTime = document.getElementById('test-time');
            const loading = document.getElementById('loading');
            
            // 线程数显示更新
            threadsSlider.addEventListener('input', function() {
                threadCount.textContent = this.value;
            });
            
            // 图表初始化
            const ctx = document.getElementById('speed-chart').getContext('2d');
            const speedChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '下载速度 (Mbps)',
                        data: [],
                        borderColor: '#ff8a00',
                        backgroundColor: 'rgba(255, 138, 0, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: 'rgba(255, 255, 255, 0.7)'
                            }
                        },
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: 'rgba(255, 255, 255, 0.7)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: 'rgba(255, 255, 255, 0.7)'
                            }
                        }
                    }
                }
            });
            
            // 测速功能
            startButton.addEventListener('click', function() {
                const threads = parseInt(threadsSlider.value);
                startSpeedTest(threads);
            });
            
            function startSpeedTest(threads) {
                // 重置UI
                startButton.disabled = true;
                loading.style.display = 'block';
                resultContainer.style.display = 'none';
                progressBar.style.width = '0%';
                timeLeft.textContent = '剩余时间: 15秒';
                
                // 重置图表
                speedChart.data.labels = [];
                speedChart.data.datasets[0].data = [];
                speedChart.update();
                
                // 模拟测速过程
                const testDuration = 15000; // 15秒
                const updateInterval = 500; // 每500ms更新一次
                let elapsed = 0;
                let totalDownloaded = 0;
                let lastUpdateTime = Date.now();
                
                // 模拟多线程下载
                const threadSpeeds = Array(threads).fill(0).map(() => Math.random() * 5 + 2); // 每个线程的初始速度
                
                const testInterval = setInterval(() => {
                    elapsed += updateInterval;
                    const currentTime = Date.now();
                    const timeDiff = (currentTime - lastUpdateTime) / 1000; // 转换为秒
                    
                    // 模拟每个线程的下载量
                    let downloadedThisInterval = 0;
                    for (let i = 0; i < threads; i++) {
                        // 模拟速度波动
                        threadSpeeds[i] += (Math.random() - 0.5) * 2;
                        threadSpeeds[i] = Math.max(threadSpeeds[i], 0.5); // 最小速度
                        threadSpeeds[i] = Math.min(threadSpeeds[i], 10); // 最大速度
                        
                        // 计算这个线程的下载量 (MB/s)
                        downloadedThisInterval += threadSpeeds[i] * timeDiff;
                    }
                    
                    totalDownloaded += downloadedThisInterval;
                    
                    // 更新UI
                    const progress = Math.min(100, (elapsed / testDuration) * 100);
                    progressBar.style.width = `${progress}%`;
                    
                    const remainingTime = Math.ceil((testDuration - elapsed) / 1000);
                    timeLeft.textContent = `剩余时间: ${remainingTime}秒`;
                    
                    // 计算并显示速度
                    const speedMBps = downloadedThisInterval / timeDiff;
                    const speedMbpsValue = speedMBps * 8;
                    
                    speedMbps.textContent = speedMbpsValue.toFixed(2);
                    speedMBs.textContent = speedMBps.toFixed(2);
                    threadsUsed.textContent = threads;
                    
                    // 更新图表
                    const timeLabel = `${(elapsed / 1000).toFixed(1)}s`;
                    speedChart.data.labels.push(timeLabel);
                    speedChart.data.datasets[0].data.push(speedMbpsValue);
                    
                    // 限制图表数据点数量
                    if (speedChart.data.labels.length > 20) {
                        speedChart.data.labels.shift();
                        speedChart.data.datasets[0].data.shift();
                    }
                    
                    speedChart.update();
                    
                    lastUpdateTime = currentTime;
                    
                    // 测试结束
                    if (elapsed >= testDuration) {
                        clearInterval(testInterval);
                        finishTest(totalDownloaded, testDuration, threads);
                    }
                }, updateInterval);
            }
            
            function finishTest(totalDownloaded, duration, threads) {
                // 计算平均速度
                const avgSpeedMBps = totalDownloaded / (duration / 1000);
                const avgSpeedMbps = avgSpeedMBps * 8;
                
                // 显示结果
                speedMbps.textContent = avgSpeedMbps.toFixed(2);
                speedMBs.textContent = avgSpeedMBps.toFixed(2);
                threadsUsed.textContent = threads;
                testTime.textContent = (duration / 1000).toFixed(2);
                
                // 更新UI
                loading.style.display = 'none';
                resultContainer.style.display = 'block';
                startButton.disabled = false;
                progressBar.style.width = '100%';
                timeLeft.textContent = '测试完成';
            }
        });
    </script>
</body>
</html>
