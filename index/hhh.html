<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse Player - Modern Web Player</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-surface: #181818;
            --bg-highlight: #282828;
            --primary: #1db954;
            --primary-hover: #1ed760;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border: #333;
            --nav-width: 240px;
            --player-height: 90px;
            --transition: all 0.3s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            font-family: 'Circular Std', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 布局框架 */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--player-height));
            position: relative;
        }

        /* 侧边栏 */
        .sidebar {
            width: var(--nav-width);
            background-color: black;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .logo { font-size: 24px; font-weight: 700; color: white; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .nav-item {
            color: var(--text-sub);
            text-decoration: none;
            font-weight: 600;
            padding: 10px 0;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .nav-item:hover, .nav-item.active { color: white; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; }

        /* 主内容区 */
        .main-view {
            flex: 1;
            background: linear-gradient(180deg, #2a2a2a 0%, var(--bg-base) 100%);
            overflow-y: auto;
            padding: 20px 32px;
            position: relative;
        }

        /* 搜索栏 */
        .search-header {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 10px 0 20px;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .search-input-wrapper {
            background: white;
            border-radius: 500px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            width: 300px;
        }
        .search-input-wrapper input {
            border: none;
            background: transparent;
            color: black;
            margin-left: 10px;
            width: 100%;
            font-size: 14px;
        }
        .filter-tabs { display: flex; gap: 10px; }
        .filter-chip {
            background: rgba(255,255,255,0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-chip.active { background: white; color: black; font-weight: bold; }

        /* 网格布局 (专辑/歌单) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }
        .card {
            background: var(--bg-surface);
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }
        .card:hover { background: var(--bg-highlight); }
        .card-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .card-title { font-weight: 700; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { color: var(--text-sub); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 列表布局 (歌曲) */
        .track-list { display: flex; flex-direction: column; }
        .track-row {
            display: grid;
            grid-template-columns: 40px 4fr 3fr 1fr;
            padding: 10px 16px;
            border-radius: 4px;
            align-items: center;
            color: var(--text-sub);
            cursor: pointer;
        }
        .track-row:hover { background: rgba(255,255,255,0.1); color: white; }
        .track-row.header { border-bottom: 1px solid var(--border); margin-bottom: 10px; cursor: default; }
        .track-row.header:hover { background: transparent; }
        .track-info { display: flex; align-items: center; gap: 12px; color: white; }
        .track-info img { width: 40px; height: 40px; border-radius: 4px; }
        .track-name { font-size: 16px; }
        .track-artist { font-size: 14px; color: var(--text-sub); }
        .track-index { text-align: center; }

        /* 详情页头部 */
        .playlist-header {
            display: flex;
            align-items: flex-end;
            gap: 24px;
            padding: 20px 0 40px;
        }
        .playlist-cover { width: 230px; height: 230px; box-shadow: 0 4px 60px rgba(0,0,0,0.5); object-fit: cover; }
        .playlist-meta h1 { font-size: 48px; font-weight: 900; margin: 10px 0; }
        .playlist-meta span { font-size: 14px; font-weight: 700; }

        /* 底部播放栏 */
        .player-bar {
            height: var(--player-height);
            background-color: var(--bg-surface);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        
        .now-playing { display: flex; align-items: center; width: 30%; gap: 14px; }
        .now-playing img { width: 56px; height: 56px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .now-playing img:hover { filter: brightness(0.8); }
        .song-meta { display: flex; flex-direction: column; justify-content: center; }
        .song-name { color: white; font-size: 14px; cursor: pointer; }
        .artist-name { color: var(--text-sub); font-size: 11px; margin-top: 4px; }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
        }
        .control-buttons { display: flex; align-items: center; gap: 20px; margin-bottom: 8px; }
        .btn-control { background: none; border: none; color: var(--text-sub); cursor: pointer; }
        .btn-control:hover { color: white; }
        .btn-play {
            width: 32px; height: 32px; background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: black;
            transition: 0.2s;
        }
        .btn-play:hover { transform: scale(1.05); }
        
        .progress-area { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 500px; font-size: 11px; color: var(--text-sub); }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: #535353;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill { height: 100%; background: white; border-radius: 2px; width: 0%; }
        .progress-bar:hover .progress-fill { background: var(--primary); }

        .volume-controls { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .volume-slider { width: 100px; height: 4px; background: #535353; border-radius: 2px; cursor: pointer; }
        .volume-fill { width: 70%; height: 100%; background: white; border-radius: 2px; }

        /* 歌词全屏覆盖层 */
        .lyrics-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - var(--player-height));
            background: linear-gradient(180deg, #4a4a4a 0%, #121212 100%);
            z-index: 50;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lyrics-overlay.active { transform: translateY(0); }
        .lyrics-container {
            display: flex;
            width: 80%;
            max-width: 1000px;
            height: 80%;
            gap: 50px;
        }
        .lyrics-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .lyrics-cover-large {
            width: 400px;
            height: 400px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            border-radius: 8px;
            object-fit: cover;
        }
        .lyrics-right {
            flex: 1;
            overflow-y: scroll;
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
        }
        .lyrics-right::-webkit-scrollbar { display: none; }
        .lyric-line {
            font-size: 24px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            margin: 30px 0;
            transition: 0.3s;
            cursor: pointer;
        }
        .lyric-line.active {
            color: white;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        .close-lyrics {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 40px; height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .loading-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            display: none; align-items: center; justify-content: center; z-index: 20;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .app-container { flex-direction: column; }
            .lyrics-container { flex-direction: column; align-items: center; gap: 20px; }
            .lyrics-cover-large { width: 200px; height: 200px; margin-bottom: 20px; }
            .track-row { grid-template-columns: 50px 1fr 60px; }
            .track-album { display: none; }
            .playlist-header { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
                Muse Player
            </div>
            <a href="#" class="nav-item active" onclick="router.go('home')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                首页 / 搜索
            </a>
            </nav>

        <main class="main-view" id="main-view">
            </main>

        <div class="loading-overlay" id="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <div class="lyrics-overlay" id="lyrics-overlay">
        <button class="close-lyrics" onclick="toggleLyrics()">
            <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <div class="lyrics-container">
            <div class="lyrics-left">
                <img src="" class="lyrics-cover-large" id="lyrics-cover">
                <div style="margin-top:20px; text-align:center;">
                    <h2 id="lyrics-title" style="font-size:28px; margin-bottom:10px;"></h2>
                    <p id="lyrics-artist" style="color:#b3b3b3; font-size:18px;"></p>
                </div>
            </div>
            <div class="lyrics-right" id="lyrics-content">
                <div class="lyric-line">暂无歌词...</div>
            </div>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <img id="player-cover" src="https://via.placeholder.com/56" alt="Cover" onclick="toggleLyrics()">
            <div class="song-meta">
                <div class="song-name" id="player-title" onclick="toggleLyrics()">未播放</div>
                <div class="artist-name" id="player-artist">-</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button class="btn-control" onclick="player.prev()">
                    <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="btn-play" id="play-pause-btn" onclick="player.toggle()">
                    <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="btn-control" onclick="player.next()">
                    <svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="progress-area">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <div class="volume-slider" id="volume-slider">
                <div class="volume-fill" style="width: 80%"></div>
            </div>
        </div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const API_BASE = 'https://163api.qijieya.cn';
        
        // 工具函数：时间格式化
        const formatTime = (seconds) => {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        // 状态管理
        const state = {
            searchType: '1', // 1: song, 10: album, 1000: playlist
            queue: [],
            currentIndex: 0,
            isPlaying: false,
            lyrics: [] // {time: seconds, text: string}
        };

        // 核心 API 请求封装
        const api = {
            async fetch(endpoint) {
                try {
                    const res = await fetch(`${API_BASE}${endpoint}`);
                    return await res.json();
                } catch (e) {
                    console.error("API Error:", e);
                    return null;
                }
            },
            search: (keyword, type) => api.fetch(`/cloudsearch?keywords=${keyword}&type=${type}&limit=30`),
            songUrl: (id) => api.fetch(`/song/url/v1?id=${id}&level=standard`),
            songDetail: (ids) => api.fetch(`/song/detail?ids=${ids}`),
            album: (id) => api.fetch(`/album?id=${id}`),
            playlist: (id) => api.fetch(`/playlist/detail?id=${id}`),
            // 关键修复：使用代理API获取歌词，避免跨域
            lyric: (id) => api.fetch(`/lyric?id=${id}`) 
        };

        // 路由/视图管理器
        const router = {
            container: document.getElementById('main-view'),
            
            go(page, param) {
                if (page === 'home') this.renderHome();
                else if (page === 'album') this.renderAlbum(param);
                else if (page === 'playlist') this.renderPlaylist(param);
            },

            renderHome() {
                this.container.innerHTML = `
                    <div class="search-header">
                        <div class="search-input-wrapper">
                            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="#000" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" id="search-input" placeholder="搜索歌曲、专辑、歌单..." onkeypress="handleSearch(event)">
                        </div>
                        <div class="filter-tabs">
                            <div class="filter-chip active" onclick="changeSearchType(this, '1')">单曲</div>
                            <div class="filter-chip" onclick="changeSearchType(this, '10')">专辑</div>
                            <div class="filter-chip" onclick="changeSearchType(this, '1000')">歌单</div>
                        </div>
                    </div>
                    <div id="results-area">
                        <div style="text-align:center; margin-top:100px; color:#555;">
                            <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>
                            <p style="margin-top:20px;">搜索你喜欢的音乐</p>
                        </div>
                    </div>
                `;
            },

            async renderAlbum(id) {
                ui.showLoading(true);
                const data = await api.album(id);
                ui.showLoading(false);
                
                if(!data || !data.album) return;

                const album = data.album;
                const songs = data.songs;

                let html = `
                    <div class="playlist-header">
                        <img src="${album.picUrl}" class="playlist-cover">
                        <div class="playlist-meta">
                            <span>专辑</span>
                            <h1>${album.name}</h1>
                            <p>${album.artist.name} • ${songs.length} 首歌曲</p>
                        </div>
                    </div>
                    <div class="track-list">
                        <div class="track-row header">
                            <div>#</div>
                            <div>标题</div>
                            <div class="track-album">歌手</div>
                            <div>时长</div>
                        </div>
                `;

                songs.forEach((song, index) => {
                    html += `
                        <div class="track-row" onclick="player.playCollection(${index}, 'album_temp')">
                            <div class="track-index">${index + 1}</div>
                            <div class="track-info">
                                <div class="track-meta">
                                    <div class="track-name">${song.name}</div>
                                </div>
                            </div>
                            <div class="track-artist">${song.ar.map(a => a.name).join(', ')}</div>
                            <div>${formatTime(song.dt / 1000)}</div>
                        </div>
                    `;
                });

                html += `</div>`;
                this.container.innerHTML = html;
                
                // 临时存储列表供播放器使用
                window.tempCollection = songs.map(s => ({
                    id: s.id,
                    name: s.name,
                    ar: s.ar,
                    al: s.al,
                    dt: s.dt
                }));
            },

            async renderPlaylist(id) {
                ui.showLoading(true);
                const data = await api.playlist(id);
                ui.showLoading(false);
                
                if(!data || !data.playlist) return;
                const pl = data.playlist;
                const tracks = pl.tracks;

                let html = `
                    <div class="playlist-header">
                        <img src="${pl.coverImgUrl}" class="playlist-cover">
                        <div class="playlist-meta">
                            <span>歌单</span>
                            <h1>${pl.name}</h1>
                            <p>${pl.creator.nickname} • ${pl.trackCount} 首歌曲</p>
                        </div>
                    </div>
                    <div class="track-list">
                        <div class="track-row header">
                            <div>#</div>
                            <div>标题</div>
                            <div class="track-album">专辑</div>
                            <div>时长</div>
                        </div>
                `;

                tracks.forEach((song, index) => {
                    html += `
                        <div class="track-row" onclick="player.playCollection(${index}, 'playlist_temp')">
                            <div class="track-index">${index + 1}</div>
                            <div class="track-info">
                                <img src="${song.al.picUrl}?param=50y50">
                                <div>
                                    <div class="track-name">${song.name}</div>
                                    <div class="track-artist">${song.ar.map(a => a.name).join(', ')}</div>
                                </div>
                            </div>
                            <div class="track-album">${song.al.name}</div>
                            <div>${formatTime(song.dt / 1000)}</div>
                        </div>
                    `;
                });

                html += `</div>`;
                this.container.innerHTML = html;

                window.tempCollection = tracks;
            }
        };

        // UI 操作逻辑
        const ui = {
            showLoading: (show) => {
                document.getElementById('loading').style.display = show ? 'flex' : 'none';
            },
            renderSearchResults: (data) => {
                const area = document.getElementById('results-area');
                if (!data) { area.innerHTML = '<p>无结果</p>'; return; }

                // 渲染单曲
                if (state.searchType === '1' && data.result.songs) {
                    let html = `<div class="track-list">`;
                    data.result.songs.forEach(song => {
                        html += `
                            <div class="track-row" onclick="player.playSingle(${song.id})">
                                <div class="track-index">▶</div>
                                <div class="track-info">
                                    <img src="${song.al.picUrl}?param=50y50">
                                    <div>
                                        <div class="track-name">${song.name}</div>
                                        <div class="track-artist">${song.ar.map(a => a.name).join(', ')}</div>
                                    </div>
                                </div>
                                <div class="track-album">${song.al.name}</div>
                                <div>${formatTime(song.dt / 1000)}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    area.innerHTML = html;
                } 
                // 渲染专辑
                else if (state.searchType === '10' && data.result.albums) {
                    let html = `<div class="grid-container">`;
                    data.result.albums.forEach(album => {
                        html += `
                            <div class="card" onclick="router.go('album', ${album.id})">
                                <img src="${album.picUrl}?param=300y300" class="card-img">
                                <div class="card-title">${album.name}</div>
                                <div class="card-sub">${album.artist.name}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    area.innerHTML = html;
                }
                // 渲染歌单
                else if (state.searchType === '1000' && data.result.playlists) {
                    let html = `<div class="grid-container">`;
                    data.result.playlists.forEach(pl => {
                        html += `
                            <div class="card" onclick="router.go('playlist', ${pl.id})">
                                <img src="${pl.coverImgUrl}?param=300y300" class="card-img">
                                <div class="card-title">${pl.name}</div>
                                <div class="card-sub">By ${pl.creator.nickname}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                    area.innerHTML = html;
                }
            }
        };

        // 播放器核心逻辑
        const player = {
            audio: document.getElementById('audio-element'),
            
            init() {
                this.audio.addEventListener('timeupdate', this.onTimeUpdate);
                this.audio.addEventListener('ended', this.next.bind(this));
                
                // 进度条点击
                document.getElementById('progress-bar').addEventListener('click', (e) => {
                    const rect = e.target.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    this.audio.currentTime = percent * this.audio.duration;
                });

                // 音量条
                document.getElementById('volume-slider').addEventListener('click', (e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    this.audio.volume = percent;
                    document.querySelector('.volume-fill').style.width = (percent * 100) + '%';
                });
            },

            async playSingle(id) {
                // 为了简单，单曲播放时把它作为只有一首歌的队列
                ui.showLoading(true);
                const detail = await api.songDetail(id);
                if(detail && detail.songs) {
                    state.queue = [detail.songs[0]];
                    state.currentIndex = 0;
                    await this.loadSong(state.queue[0]);
                }
                ui.showLoading(false);
            },

            async playCollection(index, sourceKey) {
                // 从 window.tempCollection 加载整个列表
                if(window.tempCollection) {
                    state.queue = [...window.tempCollection];
                    state.currentIndex = index;
                    await this.loadSong(state.queue[index]);
                }
            },

            async loadSong(song) {
                ui.showLoading(true);
                
                // 更新UI
                document.getElementById('player-title').innerText = song.name;
                document.getElementById('player-artist').innerText = song.ar.map(a=>a.name).join('/');
                document.getElementById('player-cover').src = song.al.picUrl;
                
                // 更新歌词UI头部
                document.getElementById('lyrics-title').innerText = song.name;
                document.getElementById('lyrics-artist').innerText = song.ar.map(a=>a.name).join('/');
                document.getElementById('lyrics-cover').src = song.al.picUrl;

                // 获取 URL
                const urlData = await api.songUrl(song.id);
                if (urlData && urlData.data && urlData.data[0].url) {
                    this.audio.src = urlData.data[0].url;
                    this.audio.play();
                    this.updatePlayBtn(true);
                    
                    // 加载歌词
                    this.loadLyrics(song.id);
                } else {
                    alert("无法获取播放地址（可能需要VIP）");
                }
                
                ui.showLoading(false);
            },

            async loadLyrics(id) {
                const res = await api.lyric(id);
                const lyricsContainer = document.getElementById('lyrics-content');
                state.lyrics = [];
                
                if (res && res.lrc && res.lrc.lyric) {
                    // 解析歌词
                    const lines = res.lrc.lyric.split('\n');
                    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
                    
                    state.lyrics = lines.map(line => {
                        const match = regex.exec(line);
                        if (match) {
                            const min = parseInt(match[1]);
                            const sec = parseInt(match[2]);
                            const ms = parseInt(match[3]);
                            // 统一毫秒位数
                            const time = min * 60 + sec + (ms < 100 ? ms/100 : ms/1000); 
                            return { time, text: match[4].trim() };
                        }
                        return null;
                    }).filter(item => item && item.text); // 过滤空行
                }

                // 渲染歌词 HTML
                if (state.lyrics.length > 0) {
                    lyricsContainer.innerHTML = state.lyrics.map((l, i) => 
                        `<div class="lyric-line" data-index="${i}" onclick="player.seekTo(${l.time})">${l.text}</div>`
                    ).join('');
                } else {
                    lyricsContainer.innerHTML = '<div class="lyric-line">纯音乐或无歌词</div>';
                }
            },

            seekTo(time) {
                this.audio.currentTime = time;
            },

            toggle() {
                if (this.audio.paused) {
                    this.audio.play();
                    this.updatePlayBtn(true);
                } else {
                    this.audio.pause();
                    this.updatePlayBtn(false);
                }
            },

            next() {
                if (state.queue.length === 0) return;
                state.currentIndex = (state.currentIndex + 1) % state.queue.length;
                this.loadSong(state.queue[state.currentIndex]);
            },

            prev() {
                if (state.queue.length === 0) return;
                state.currentIndex = (state.currentIndex - 1 + state.queue.length) % state.queue.length;
                this.loadSong(state.queue[state.currentIndex]);
            },

            updatePlayBtn(isPlaying) {
                const btn = document.getElementById('play-pause-btn');
                btn.innerHTML = isPlaying 
                    ? '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'
                    : '<svg viewBox="0 0 24 24" style="width:24px;height:24px;fill:currentColor"><path d="M8 5v14l11-7z"/></svg>';
            },

            onTimeUpdate() {
                const cur = player.audio.currentTime;
                const dur = player.audio.duration;
                
                // 更新时间显示
                document.getElementById('current-time').innerText = formatTime(cur);
                document.getElementById('total-time').innerText = formatTime(dur);
                document.getElementById('progress-fill').style.width = (cur/dur*100) + '%';

                // 歌词同步
                player.syncLyrics(cur);
            },

            syncLyrics(time) {
                if (!state.lyrics.length) return;
                
                // 找到当前时间对应的歌词行
                let activeIndex = -1;
                for (let i = 0; i < state.lyrics.length; i++) {
                    if (time >= state.lyrics[i].time) {
                        activeIndex = i;
                    } else {
                        break;
                    }
                }

                if (activeIndex !== -1) {
                    const lines = document.querySelectorAll('.lyric-line');
                    // 移除旧高亮
                    const currentActive = document.querySelector('.lyric-line.active');
                    if (currentActive) currentActive.classList.remove('active');
                    
                    // 添加新高亮
                    if (lines[activeIndex]) {
                        lines[activeIndex].classList.add('active');
                        // 滚动
                        lines[activeIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
        };

        // 全局事件处理
        function handleSearch(e) {
            if (e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val) {
                    ui.showLoading(true);
                    api.search(val, state.searchType).then(data => {
                        ui.renderSearchResults(data);
                        ui.showLoading(false);
                    });
                }
            }
        }

        function changeSearchType(el, type) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            state.searchType = type;
            
            // 如果搜索框有内容，立即重新搜索
            const val = document.getElementById('search-input').value.trim();
            if (val) {
                handleSearch({key: 'Enter', target: {value: val}});
            }
        }

        function toggleLyrics() {
            document.getElementById('lyrics-overlay').classList.toggle('active');
        }

        // 初始化
        router.go('home');
        player.init();

    </script>
</body>
</html>
