<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse Pro - 沉浸式音乐体验</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --bg-hover: #2a2a2a;
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --player-height: 90px;
            --sidebar-width: 220px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* === 滚动条样式 === */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }

        /* === 主布局 === */
        .app-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--player-height));
            overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: black;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }
        .logo { font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            color: var(--text-sub);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            cursor: pointer;
        }
        .nav-btn:hover, .nav-btn.active { background: var(--bg-hover); color: white; }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            background: linear-gradient(180deg, #222 0%, var(--bg-dark) 40%);
            overflow-y: auto;
            padding: 20px 40px 100px; /* 底部留白给播放器 */
            position: relative;
        }

        /* 顶部搜索 */
        .top-bar {
            position: sticky;
            top: 0;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-box {
            background: #333;
            border-radius: 50px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            width: 300px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            margin-left: 10px;
            width: 100%;
            font-size: 14px;
        }

        /* 通用网格和列表 */
        .section-title { font-size: 24px; font-weight: 700; margin: 30px 0 20px; }
        
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }
        .card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 8px;
            transition: var(--transition);
            cursor: pointer;
        }
        .card:hover { background: var(--bg-hover); transform: translateY(-5px); }
        .card img { width: 100%; aspect-ratio: 1; border-radius: 4px; margin-bottom: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-sub { font-size: 13px; color: var(--text-sub); }

        .song-list { display: flex; flex-direction: column; }
        .song-row {
            display: grid;
            grid-template-columns: 40px 4fr 2fr 1fr;
            padding: 10px 16px;
            border-radius: 4px;
            align-items: center;
            color: var(--text-sub);
            cursor: pointer;
        }
        .song-row:hover { background: rgba(255,255,255,0.1); }
        .song-row.active { color: var(--primary); }
        .song-info { display: flex; align-items: center; gap: 12px; color: white; }
        .song-info img { width: 40px; height: 40px; border-radius: 4px; }

        /* === 底部播放器 (全局) === */
        .footer-player {
            height: var(--player-height);
            background: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            transform: translateY(100%); /* 默认隐藏 */
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-player.visible { transform: translateY(0); }

        /* 左侧：旋转封面与信息 */
        .player-left { display: flex; align-items: center; width: 30%; gap: 16px; }
        .circle-art-container {
            width: 56px; height: 56px;
            position: relative;
            cursor: pointer;
        }
        .circle-art {
            width: 100%; height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #111;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            animation: rotate 10s linear infinite;
            animation-play-state: paused; /* 默认暂停 */
        }
        .circle-art.spinning { animation-play-state: running; }
        
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }

        .player-info { display: flex; flex-direction: column; justify-content: center; }
        .player-title { color: white; font-size: 14px; cursor: pointer; }
        .player-title:hover { text-decoration: underline; }
        .player-artist { color: var(--text-sub); font-size: 12px; }

        /* 中间：控制按钮 */
        .player-center { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .controls { display: flex; align-items: center; gap: 24px; margin-bottom: 6px; }
        .btn-icon { background: none; border: none; color: var(--text-sub); cursor: pointer; transition: 0.2s; display: flex; align-items: center; }
        .btn-icon:hover { color: white; }
        .btn-icon svg { width: 20px; height: 20px; fill: currentColor; }
        .btn-play-lg {
            width: 36px; height: 36px;
            background: white; border-radius: 50%;
            color: black; display: flex; align-items: center; justify-content: center;
        }
        .btn-play-lg:hover { transform: scale(1.1); }

        /* 进度条 */
        .progress-area { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-sub); }
        .progress-track { flex: 1; height: 4px; background: #535353; border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { width: 0%; height: 100%; background: white; border-radius: 2px; position: absolute; top: 0; left: 0; }
        .progress-track:hover .progress-fill { background: var(--primary); }

        /* 右侧：音量与下载 */
        .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 15px; }
        .btn-download { color: var(--text-sub); cursor: pointer; text-decoration: none; }
        .btn-download:hover { color: var(--primary); }

        /* === 全屏详情页 (弹窗) === */
        .full-player {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(160deg, #333 0%, #000 100%);
            z-index: 200;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto; /* 允许页面内滚动 */
        }
        .full-player.active { transform: translateY(0); }

        .fp-header {
            display: flex; justify-content: flex-end; padding: 20px 40px;
            position: sticky; top: 0; z-index: 10;
        }
        .btn-close {
            background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px;
            border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .btn-close:hover { background: rgba(255,255,255,0.2); }

        .fp-content {
            display: flex;
            flex-direction: row;
            padding: 0 60px 60px;
            height: calc(100vh - 80px); /* 减去头部高度 */
            gap: 60px;
        }
        
        .fp-left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .fp-cover-art {
            width: 80%; max-width: 400px; aspect-ratio: 1;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            object-fit: cover;
            margin-bottom: 30px;
        }
        .fp-meta { text-align: center; }
        .fp-title { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .fp-artist { font-size: 18px; color: var(--text-sub); }

        .fp-right { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            height: 100%;
        }
        
        /* 歌词区域 */
        .lyrics-box {
            flex: 1;
            overflow-y: auto;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            padding: 40px 0;
            text-align: left;
        }
        .lyric-line {
            font-size: 20px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            margin: 24px 0;
            transition: color 0.3s, transform 0.3s;
            cursor: pointer;
            line-height: 1.4;
        }
        .lyric-line:hover { color: rgba(255,255,255,0.7); }
        .lyric-line.active { 
            color: white; 
            font-size: 26px; 
            transform: scale(1.02); 
            transform-origin: left center;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* 相关推荐区域 */
        .related-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }
        .related-card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .related-card:hover { background: rgba(255,255,255,0.15); }
        .related-card img { width: 100%; aspect-ratio: 1; border-radius: 4px; margin-bottom: 8px; }
        .related-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 加载动画 */
        .loader-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 999;
            display: none; align-items: center; justify-content: center;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .fp-content { flex-direction: column; height: auto; padding: 20px; }
            .fp-left { margin-bottom: 30px; }
            .fp-cover-art { width: 250px; }
            .lyrics-box { height: 300px; flex: none; }
            .player-right { display: none; } /* 手机端隐藏音量 */
            .player-left { width: 60%; }
            .player-center { width: 40%; }
            .controls .btn-icon:not(.btn-play-lg) { display: none; } /* 手机底部只留播放 */
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <nav class="sidebar">
            <div class="logo">
                <span style="color: var(--primary)">Muse</span> Pro
            </div>
            <div class="nav-btn active" onclick="router.home()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm5 15h-2v-6H9v6H7v-7.81l5-4.5 5 4.5V18z"/></svg>
                推荐首页
            </div>
            </nav>

        <main class="main-content" id="main-view">
            </main>
    </div>

    <div class="full-player" id="full-player">
        <div class="fp-header">
            <button class="btn-close" onclick="ui.toggleFullPlayer(false)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="fp-content">
            <div class="fp-left">
                <img src="" class="fp-cover-art" id="fp-cover">
                <div class="fp-meta">
                    <div class="fp-title" id="fp-title">歌名</div>
                    <div class="fp-artist" id="fp-artist">歌手</div>
                </div>
            </div>
            
            <div class="fp-right">
                <div class="lyrics-box" id="lyrics-box">
                    <div class="lyric-line">点击播放音乐查看歌词...</div>
                </div>
                
                <div class="related-section">
                    <h3 style="margin-bottom: 15px; color:white;">猜你喜欢</h3>
                    <div class="related-grid" id="related-container">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-player" id="footer-player">
        <div class="player-left">
            <div class="circle-art-container" onclick="ui.toggleFullPlayer(true)">
                <img src="" class="circle-art" id="mini-cover">
            </div>
            <div class="player-info">
                <div class="player-title" id="mini-title" onclick="ui.toggleFullPlayer(true)">未播放</div>
                <div class="player-artist" id="mini-artist"></div>
            </div>
        </div>

        <div class="player-center">
            <div class="controls">
                <button class="btn-icon" onclick="player.prev()" title="上一首">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="btn-play-lg" id="btn-play-toggle" onclick="player.toggle()">
                    <svg id="icon-play" viewBox="0 0 24 24" width="24" height="24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" viewBox="0 0 24 24" width="24" height="24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-icon" onclick="player.next()" title="下一首">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
            <div class="progress-area">
                <span id="time-current">0:00</span>
                <div class="progress-track" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="time-total">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <a href="#" id="btn-download" class="btn-download" title="下载歌曲" target="_blank" download>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
            <input type="range" min="0" max="1" step="0.1" value="0.8" oninput="player.setVolume(this.value)" style="width:80px">
        </div>
    </footer>

    <div class="loader-overlay" id="loader"><div class="spinner"></div></div>
    <audio id="audio"></audio>

    <script>
        const API_BASE = 'https://163api.qijieya.cn';
        
        // 工具：防抖延时
        const debounce = (func, wait) => {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        };

        // 状态管理
        const state = {
            playlist: [],
            currentIndex: 0,
            isPlaying: false,
            lyrics: [],
            userScrolling: false, // 关键：用户是否正在手动滑歌词
            scrollTimer: null     // 关键：自动回弹倒计时
        };

        // API 封装
        const api = {
            get: async (path) => {
                try {
                    const res = await fetch(`${API_BASE}${path}`);
                    return await res.json();
                } catch(e) { console.error(e); return null; }
            },
            // 获取热歌榜 (使用热歌榜ID 3778678)
            getHotList: () => api.get('/playlist/detail?id=3778678'),
            search: (kw) => api.get(`/cloudsearch?keywords=${kw}`),
            songUrl: (id) => api.get(`/song/url/v1?id=${id}&level=standard`),
            lyric: (id) => api.get(`/lyric?id=${id}`),
            simiSong: (id) => api.get(`/simi/song?id=${id}`)
        };

        // UI 渲染与交互
        const ui = {
            main: document.getElementById('main-view'),
            loader: document.getElementById('loader'),

            loading(show) { this.loader.style.display = show ? 'flex' : 'none'; },

            // 渲染主页（推荐列表）
            async renderHome() {
                this.main.innerHTML = `
                    <div class="top-bar">
                        <div class="search-box">
                            <svg width="18" height="18" fill="#888" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" placeholder="搜索歌曲..." onkeypress="if(event.key==='Enter') router.search(this.value)">
                        </div>
                    </div>
                    <div class="section-title">🔥 热门推荐</div>
                    <div class="grid-cards" id="hot-grid"></div>
                `;

                this.loading(true);
                const data = await api.getHotList();
                this.loading(false);

                if (data && data.playlist) {
                    const tracks = data.playlist.tracks.slice(0, 30); // 取前30首
                    const grid = document.getElementById('hot-grid');
                    
                    // 存入全局播放列表池，点击时直接用
                    window.hotTracks = tracks;

                    grid.innerHTML = tracks.map((track, idx) => `
                        <div class="card" onclick="player.playFromList('hotTracks', ${idx})">
                            <img src="${track.al.picUrl}?param=300y300" loading="lazy">
                            <div class="card-title">${track.name}</div>
                            <div class="card-sub">${track.ar[0].name}</div>
                        </div>
                    `).join('');
                }
            },

            renderSearchResults(songs) {
                window.searchTracks = songs;
                let html = `
                    <div class="top-bar">
                        <div class="search-box">
                            <svg width="18" height="18" fill="#888" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" placeholder="搜索歌曲..." value="${window.lastKeyword || ''}" onkeypress="if(event.key==='Enter') router.search(this.value)">
                        </div>
                        <button class="nav-btn" onclick="router.home()">返回推荐</button>
                    </div>
                    <div class="section-title">搜索结果</div>
                    <div class="song-list">
                `;
                
                html += songs.map((song, idx) => `
                    <div class="song-row" onclick="player.playFromList('searchTracks', ${idx})">
                        <div class="song-index">${idx + 1}</div>
                        <div class="song-info">
                            <img src="${song.al.picUrl}?param=100y100">
                            <div>
                                <div style="color:white; font-weight:500">${song.name}</div>
                                <div style="font-size:12px">${song.ar.map(a=>a.name).join('/')}</div>
                            </div>
                        </div>
                        <div>${song.al.name}</div>
                        <div>${formatTime(song.dt/1000)}</div>
                    </div>
                `).join('');
                
                html += `</div>`;
                this.main.innerHTML = html;
            },

            toggleFullPlayer(show) {
                const fp = document.getElementById('full-player');
                if (show) fp.classList.add('active');
                else fp.classList.remove('active');
            },

            renderRelated(songs) {
                const container = document.getElementById('related-container');
                if (!songs || songs.length === 0) {
                    container.innerHTML = '<div style="color:#666">暂无相似推荐</div>';
                    return;
                }
                
                // 创建临时列表用于点击相关推荐播放
                window.relatedTracks = songs;

                container.innerHTML = songs.map((song, idx) => `
                    <div class="related-card" onclick="player.playFromList('relatedTracks', ${idx})">
                        <img src="${song.album.picUrl}?param=200y200">
                        <div class="related-title">${song.name}</div>
                        <div style="font-size:11px; color:#888">${song.artists[0].name}</div>
                    </div>
                `).join('');
            }
        };

        // 播放器逻辑
        const player = {
            audio: document.getElementById('audio'),
            
            init() {
                // 进度更新
                this.audio.addEventListener('timeupdate', () => {
                    const cur = this.audio.currentTime;
                    const dur = this.audio.duration || 0;
                    document.getElementById('time-current').innerText = formatTime(cur);
                    document.getElementById('time-total').innerText = formatTime(dur);
                    document.getElementById('progress-fill').style.width = (cur/dur * 100) + '%';
                    
                    this.syncLyrics(cur);
                });

                // 播放结束自动下一首
                this.audio.addEventListener('ended', () => this.next());
                
                // 进度条点击
                document.getElementById('progress-track').addEventListener('click', (e) => {
                    const rect = e.target.getBoundingClientRect();
                    const pos = (e.clientX - rect.left) / rect.width;
                    this.audio.currentTime = pos * this.audio.duration;
                });

                // 歌词区域滚动监听（实现人性化防抖）
                const lyricsBox = document.getElementById('lyrics-box');
                lyricsBox.addEventListener('scroll', () => {
                    // 用户开始滚动
                    state.userScrolling = true;
                    clearTimeout(state.scrollTimer);
                    
                    // 4秒后认为用户停止交互，恢复自动滚动
                    state.scrollTimer = setTimeout(() => {
                        state.userScrolling = false;
                    }, 4000);
                });
            },

            async playFromList(listName, index) {
                const list = window[listName];
                if (!list) return;
                
                // 转换数据结构统一格式 (搜索结果和歌单详情字段略有不同)
                state.playlist = list.map(s => ({
                    id: s.id,
                    name: s.name,
                    artist: s.ar ? s.ar[0].name : (s.artists ? s.artists[0].name : '未知'),
                    cover: s.al ? s.al.picUrl : (s.album ? s.album.picUrl : ''),
                    dt: s.dt || s.duration
                }));
                
                state.currentIndex = index;
                await this.loadSong();
                
                // 激活底部栏
                document.getElementById('footer-player').classList.add('visible');
            },

            async loadSong() {
                const song = state.playlist[state.currentIndex];
                if (!song) return;

                ui.loading(true);

                // 1. 更新UI文字和图片
                const updateUI = (id, val) => {
                    const el = document.getElementById(id);
                    if(el) {
                        if(el.tagName === 'IMG') el.src = val;
                        else el.innerText = val;
                    }
                };

                // 底部 Mini Player
                updateUI('mini-title', song.name);
                updateUI('mini-artist', song.artist);
                updateUI('mini-cover', song.cover);

                // 全屏 Player
                updateUI('fp-title', song.name);
                updateUI('fp-artist', song.artist);
                updateUI('fp-cover', song.cover);
                
                // 重置歌词
                document.getElementById('lyrics-box').innerHTML = '<div class="lyric-line">加载歌词中...</div>';
                document.getElementById('lyrics-box').scrollTo(0,0);

                try {
                    // 2. 获取播放链接
                    const urlData = await api.songUrl(song.id);
                    if (urlData.data[0].url) {
                        this.audio.src = urlData.data[0].url;
                        
                        // 设置下载链接
                        const dlBtn = document.getElementById('btn-download');
                        dlBtn.href = urlData.data[0].url;
                        
                        this.audio.play();
                        state.isPlaying = true;
                        this.updatePlayState();

                        // 3. 并行加载歌词和相关推荐
                        this.loadLyrics(song.id);
                        this.loadSimi(song.id);

                    } else {
                        alert('该歌曲暂无版权或需要VIP');
                    }
                } catch (e) {
                    console.error(e);
                }
                ui.loading(false);
            },

            async loadLyrics(id) {
                const res = await api.lyric(id);
                state.lyrics = [];
                const box = document.getElementById('lyrics-box');
                
                if (res.lrc && res.lrc.lyric) {
                    const lines = res.lrc.lyric.split('\n');
                    const regex = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
                    
                    state.lyrics = lines.map(line => {
                        const m = regex.exec(line);
                        if (m) {
                            return {
                                time: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/1000,
                                text: m[4].trim()
                            };
                        }
                        return null;
                    }).filter(x => x && x.text);

                    box.innerHTML = state.lyrics.map((l, i) => 
                        `<div class="lyric-line" id="line-${i}" onclick="player.seek(${l.time})">${l.text}</div>`
                    ).join('');
                } else {
                    box.innerHTML = '<div class="lyric-line">暂无歌词</div>';
                }
            },

            async loadSimi(id) {
                const res = await api.simiSong(id);
                if (res && res.songs) {
                    ui.renderRelated(res.songs);
                } else {
                    document.getElementById('related-container').innerHTML = '';
                }
            },

            syncLyrics(time) {
                if (!state.lyrics.length) return;
                
                // 找到对应行
                let idx = state.lyrics.findIndex(l => l.time > time) - 1;
                if (idx < 0) idx = 0;

                // 高亮样式
                const lines = document.querySelectorAll('.lyric-line');
                document.querySelector('.lyric-line.active')?.classList.remove('active');
                if (lines[idx]) {
                    lines[idx].classList.add('active');
                    
                    // 只有当用户没有在手动滚动时，才自动跳转
                    if (!state.userScrolling) {
                        lines[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            },

            seek(time) {
                this.audio.currentTime = time;
                // 点击歌词跳转后，我们假设用户希望立即看到那里，所以重置滚动锁
                state.userScrolling = false;
            },

            toggle() {
                if (this.audio.paused) {
                    this.audio.play();
                    state.isPlaying = true;
                } else {
                    this.audio.pause();
                    state.isPlaying = false;
                }
                this.updatePlayState();
            },

            updatePlayState() {
                const playIcon = document.getElementById('icon-play');
                const pauseIcon = document.getElementById('icon-pause');
                const miniCover = document.getElementById('mini-cover');

                if (state.isPlaying) {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    miniCover.classList.add('spinning'); // 图片旋转
                } else {
                    playIcon.style.display = 'block';
                    pauseIcon.style.display = 'none';
                    miniCover.classList.remove('spinning'); // 停止旋转
                }
            },

            prev() {
                if (state.playlist.length === 0) return;
                state.currentIndex = (state.currentIndex - 1 + state.playlist.length) % state.playlist.length;
                this.loadSong();
            },

            next() {
                if (state.playlist.length === 0) return;
                state.currentIndex = (state.currentIndex + 1) % state.playlist.length;
                this.loadSong();
            },

            setVolume(val) { this.audio.volume = val; }
        };

        // 路由逻辑
        const router = {
            home() { ui.renderHome(); },
            async search(kw) {
                window.lastKeyword = kw;
                if(!kw) return;
                ui.loading(true);
                const res = await api.search(kw);
                ui.loading(false);
                if (res.result && res.result.songs) {
                    ui.renderSearchResults(res.result.songs);
                }
            }
        };

        // 辅助函数
        function formatTime(s) {
            if(isNaN(s)) return '0:00';
            const m = Math.floor(s/60);
            const sec = Math.floor(s%60);
            return `${m}:${sec<10?'0':''}${sec}`;
        }

        // 初始化
        router.home();
        player.init();

    </script>
</body>
</html>
