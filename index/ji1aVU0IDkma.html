<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>网易云音乐API测试 - 用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .app-container {
            display: flex;
            gap: 20px;
            height: 80vh;
        }
        
        /* 登录面板样式 */
        .login-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-panel h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #764ba2;
            font-size: 28px;
        }
        
        .login-method {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 25px;
        }
        
        .login-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            cursor: pointer;
            font-weight: 500;
            color: #888;
            transition: all 0.3s ease;
        }
        
        .login-tab.active {
            color: #764ba2;
            border-bottom: 3px solid #764ba2;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }
        
        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #764ba2;
            outline: none;
        }
        
        .captcha-group {
            display: flex;
            gap: 10px;
        }
        
        .captcha-group input {
            flex: 1;
        }
        
        .send-captcha-btn {
            padding: 14px 20px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .send-captcha-btn:hover:not(:disabled) {
            background: #e0e0e0;
        }
        
        .send-captcha-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .login-status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .login-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .login-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .login-status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        /* 用户信息面板样式 */
        .user-info-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 30px;
            flex: 1;
            overflow-y: auto;
            display: none;
        }
        
        .user-info-panel.active {
            display: block;
        }
        
        .user-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #eee;
        }
        
        .user-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #f0f0f0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .user-basic-info h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .user-basic-info p {
            color: #666;
            margin-bottom: 5px;
            font-size: 16px;
        }
        
        .user-id {
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 5px;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        .info-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 20px;
            color: #764ba2;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .info-label {
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        .info-value {
            color: #333;
            font-size: 16px;
            word-break: break-word;
        }
        
        .info-value.boolean-true {
            color: #27ae60;
            font-weight: bold;
        }
        
        .info-value.boolean-false {
            color: #e74c3c;
            font-weight: bold;
        }
        
        .json-viewer {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
            max-height: 400px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            margin-top: 20px;
        }
        
        .json-key {
            color: #92278f;
        }
        
        .json-string {
            color: #3ab54a;
        }
        
        .json-number {
            color: #25aae2;
        }
        
        .json-boolean {
            color: #f98280;
        }
        
        .json-null {
            color: #f1592a;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* 响应式设计 */
        @media (max-width: 992px) {
            .app-container {
                flex-direction: column;
                height: auto;
            }
            
            .login-panel {
                width: 100%;
            }
        }
        
        @media (max-width: 576px) {
            .login-panel {
                padding: 25px;
            }
            
            .user-header {
                flex-direction: column;
                text-align: center;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-music"></i> 网易云音乐API测试平台</h1>
            <p>使用 wyy.naxid.top API 进行用户登录和用户信息获取测试</p>
        </div>
        
        <div class="app-container">
            <!-- 登录面板 -->
            <div class="login-panel" id="loginPanel">
                <h2>用户登录</h2>
                
                <div class="login-method">
                    <div class="login-tab active" data-method="captcha">验证码登录</div>
                    <div class="login-tab" data-method="password">密码登录</div>
                </div>
                
                <!-- 验证码登录表单 -->
                <form id="captchaLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> 手机号码</label>
                        <input type="tel" id="phone" class="form-control" placeholder="请输入手机号码" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="captcha"><i class="fas fa-sms"></i> 验证码</label>
                        <div class="captcha-group">
                            <input type="text" id="captcha" class="form-control" placeholder="请输入验证码" required>
                            <button type="button" id="sendCaptchaBtn" class="send-captcha-btn">发送验证码</button>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-btn" id="captchaLoginBtn">
                        <i class="fas fa-sign-in-alt"></i> 验证码登录
                    </button>
                </form>
                
                <!-- 密码登录表单 -->
                <form id="passwordLoginForm" class="login-form" style="display: none;">
                    <div class="form-group">
                        <label for="phone2"><i class="fas fa-phone"></i> 手机号码</label>
                        <input type="tel" id="phone2" class="form-control" placeholder="请输入手机号码" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock"></i> 密码</label>
                        <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                    </div>
                    
                    <button type="submit" class="login-btn" id="passwordLoginBtn">
                        <i class="fas fa-sign-in-alt"></i> 密码登录
                    </button>
                </form>
                
                <div id="loginStatus" class="login-status"></div>
            </div>
            
            <!-- 用户信息面板 -->
            <div class="user-info-panel" id="userInfoPanel">
                <div class="user-header">
                    <img id="userAvatar" class="user-avatar" src="https://p4.music.126.net/VnZiScyynLG7atLIZ2YPkw==/18686200114669622.jpg" alt="用户头像">
                    <div class="user-basic-info">
                        <h2 id="userName">用户昵称</h2>
                        <p id="userSignature">用户签名</p>
                        <p><i class="fas fa-venus-mars"></i> 性别: <span id="userGender">未知</span></p>
                        <p><i class="fas fa-birthday-cake"></i> 年龄: <span id="userAge">未知</span></p>
                        <div class="user-id">ID: <span id="userId">0</span></div>
                        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出登录</button>
                    </div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="level">0</div>
                        <div class="stat-label">用户等级</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="playlistCount">0</div>
                        <div class="stat-label">创建歌单</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="follows">0</div>
                        <div class="stat-label">关注人数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="followeds">0</div>
                        <div class="stat-label">粉丝数量</div>
                    </div>
                </div>
                
                <div class="info-section">
                    <h3 class="section-title"><i class="fas fa-info-circle"></i> 基本信息</h3>
                    <div class="info-grid" id="basicInfoGrid">
                        <!-- 基本信息会通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="info-section">
                    <h3 class="section-title"><i class="fas fa-chart-bar"></i> 账号信息</h3>
                    <div class="info-grid" id="accountInfoGrid">
                        <!-- 账号信息会通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="info-section">
                    <h3 class="section-title"><i class="fas fa-heart"></i> 社交信息</h3>
                    <div class="info-grid" id="socialInfoGrid">
                        <!-- 社交信息会通过JS动态生成 -->
                    </div>
                </div>
                
                <div class="info-section">
                    <h3 class="section-title"><i class="fas fa-code"></i> 原始JSON数据</h3>
                    <div class="json-viewer" id="jsonViewer">
                        <!-- JSON数据会通过JS动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API配置
        const API_CONFIG = {
            BASE_URL: 'https://wyy.naxid.top',
            TIMESTAMP: Date.now()
        };

        // 全局状态
        let userData = {
            profile: null,
            account: null,
            level: null,
            subcount: null,
            playlists: null,
            cookie: null
        };

        let countdownInterval = null;
        let countdownSeconds = 60;

        // DOM元素
        const loginPanel = document.getElementById('loginPanel');
        const userInfoPanel = document.getElementById('userInfoPanel');
        const loginTabs = document.querySelectorAll('.login-tab');
        const captchaLoginForm = document.getElementById('captchaLoginForm');
        const passwordLoginForm = document.getElementById('passwordLoginForm');
        const phoneInput = document.getElementById('phone');
        const phone2Input = document.getElementById('phone2');
        const captchaInput = document.getElementById('captcha');
        const passwordInput = document.getElementById('password');
        const sendCaptchaBtn = document.getElementById('sendCaptchaBtn');
        const captchaLoginBtn = document.getElementById('captchaLoginBtn');
        const passwordLoginBtn = document.getElementById('passwordLoginBtn');
        const loginStatus = document.getElementById('loginStatus');
        const logoutBtn = document.getElementById('logoutBtn');
        
        // 用户信息显示元素
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userSignature = document.getElementById('userSignature');
        const userGender = document.getElementById('userGender');
        const userAge = document.getElementById('userAge');
        const userId = document.getElementById('userId');
        const levelEl = document.getElementById('level');
        const playlistCountEl = document.getElementById('playlistCount');
        const followsEl = document.getElementById('follows');
        const followedsEl = document.getElementById('followeds');
        const basicInfoGrid = document.getElementById('basicInfoGrid');
        const accountInfoGrid = document.getElementById('accountInfoGrid');
        const socialInfoGrid = document.getElementById('socialInfoGrid');
        const jsonViewer = document.getElementById('jsonViewer');

        // 初始化事件监听器
        function initEventListeners() {
            // 登录方式切换
            loginTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const method = this.getAttribute('data-method');
                    
                    // 更新标签状态
                    loginTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 显示对应的表单
                    if (method === 'captcha') {
                        captchaLoginForm.style.display = 'block';
                        passwordLoginForm.style.display = 'none';
                    } else {
                        captchaLoginForm.style.display = 'none';
                        passwordLoginForm.style.display = 'block';
                    }
                });
            });
            
            // 发送验证码按钮
            sendCaptchaBtn.addEventListener('click', sendCaptcha);
            
            // 验证码登录表单提交
            captchaLoginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                loginWithCaptcha();
            });
            
            // 密码登录表单提交
            passwordLoginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                loginWithPassword();
            });
            
            // 退出登录按钮
            logoutBtn.addEventListener('click', logout);
            
            // 页面加载时检查是否已登录
            checkLoginStatus();
        }

        // 检查登录状态
        function checkLoginStatus() {
            const savedCookie = localStorage.getItem('netease_cookie');
            const savedProfile = localStorage.getItem('netease_profile');
            
            if (savedCookie && savedProfile) {
                try {
                    userData.cookie = savedCookie;
                    userData.profile = JSON.parse(savedProfile);
                    showUserInfo();
                } catch (e) {
                    console.error('解析保存的用户数据失败:', e);
                    clearLoginData();
                }
            }
        }

        // 发送验证码
        async function sendCaptcha() {
            const phone = phoneInput.value.trim();
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                showStatus('请输入有效的手机号码', 'error');
                return;
            }
            
            // 禁用发送按钮
            sendCaptchaBtn.disabled = true;
            sendCaptchaBtn.textContent = `发送中...`;
            
            try {
                const response = await fetch(
                    `${API_CONFIG.BASE_URL}/captcha/sent?phone=${phone}&timestamp=${Date.now()}`
                );
                
                const data = await response.json();
                
                if (data.code === 200) {
                    showStatus('验证码已发送，请注意查收', 'success');
                    
                    // 开始倒计时
                    startCountdown();
                } else {
                    showStatus(`发送失败: ${data.message || '未知错误'}`, 'error');
                    sendCaptchaBtn.disabled = false;
                    sendCaptchaBtn.textContent = '发送验证码';
                }
            } catch (error) {
                console.error('发送验证码失败:', error);
                showStatus('网络错误，请稍后重试', 'error');
                sendCaptchaBtn.disabled = false;
                sendCaptchaBtn.textContent = '发送验证码';
            }
        }

        // 开始倒计时
        function startCountdown() {
            countdownSeconds = 60;
            
            countdownInterval = setInterval(() => {
                countdownSeconds--;
                sendCaptchaBtn.textContent = `${countdownSeconds}秒后重发`;
                
                if (countdownSeconds <= 0) {
                    clearInterval(countdownInterval);
                    sendCaptchaBtn.disabled = false;
                    sendCaptchaBtn.textContent = '发送验证码';
                }
            }, 1000);
        }

        // 验证码登录
        async function loginWithCaptcha() {
            const phone = phoneInput.value.trim();
            const captcha = captchaInput.value.trim();
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                showStatus('请输入有效的手机号码', 'error');
                return;
            }
            
            if (!captcha) {
                showStatus('请输入验证码', 'error');
                return;
            }
            
            // 禁用登录按钮
            captchaLoginBtn.disabled = true;
            captchaLoginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
            showStatus('正在登录...', 'loading');
            
            try {
                const response = await fetch(
                    `${API_CONFIG.BASE_URL}/login/cellphone?phone=${phone}&captcha=${captcha}&timestamp=${Date.now()}`
                );
                
                const data = await response.json();
                
                if (data.code === 200) {
                    // 保存cookie
                    userData.cookie = data.cookie || '';
                    
                    // 保存登录数据
                    await saveLoginData(data);
                    
                    showStatus('登录成功！正在获取用户信息...', 'success');
                    
                    // 获取用户信息
                    await fetchUserInfo();
                    
                    // 显示用户信息
                    showUserInfo();
                } else {
                    showStatus(`登录失败: ${data.message || '未知错误'}`, 'error');
                    captchaLoginBtn.disabled = false;
                    captchaLoginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 验证码登录';
                }
            } catch (error) {
                console.error('登录失败:', error);
                showStatus('网络错误，请稍后重试', 'error');
                captchaLoginBtn.disabled = false;
                captchaLoginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 验证码登录';
            }
        }

        // 密码登录
        async function loginWithPassword() {
            const phone = phone2Input.value.trim();
            const password = passwordInput.value.trim();
            
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                showStatus('请输入有效的手机号码', 'error');
                return;
            }
            
            if (!password) {
                showStatus('请输入密码', 'error');
                return;
            }
            
            // 禁用登录按钮
            passwordLoginBtn.disabled = true;
            passwordLoginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
            showStatus('正在登录...', 'loading');
            
            try {
                const response = await fetch(
                    `${API_CONFIG.BASE_URL}/login/cellphone?phone=${phone}&password=${encodeURIComponent(password)}&timestamp=${Date.now()}`
                );
                
                const data = await response.json();
                
                if (data.code === 200) {
                    // 保存cookie
                    userData.cookie = data.cookie || '';
                    
                    // 保存登录数据
                    await saveLoginData(data);
                    
                    showStatus('登录成功！正在获取用户信息...', 'success');
                    
                    // 获取用户信息
                    await fetchUserInfo();
                    
                    // 显示用户信息
                    showUserInfo();
                } else {
                    showStatus(`登录失败: ${data.message || '未知错误'}`, 'error');
                    passwordLoginBtn.disabled = false;
                    passwordLoginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 密码登录';
                }
            } catch (error) {
                console.error('登录失败:', error);
                showStatus('网络错误，请稍后重试', 'error');
                passwordLoginBtn.disabled = false;
                passwordLoginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 密码登录';
            }
        }

        // 保存登录数据
        async function saveLoginData(loginData) {
            if (loginData.profile) {
                userData.profile = loginData.profile;
                localStorage.setItem('netease_profile', JSON.stringify(loginData.profile));
            }
            
            if (loginData.account) {
                userData.account = loginData.account;
                localStorage.setItem('netease_account', JSON.stringify(loginData.account));
            }
            
            if (userData.cookie) {
                localStorage.setItem('netease_cookie', userData.cookie);
            }
        }

        // 获取用户信息
        async function fetchUserInfo() {
            if (!userData.cookie || !userData.profile) {
                showStatus('请先登录', 'error');
                return;
            }
            
            const userId = userData.profile.userId;
            
            try {
                // 获取用户详情
                const detailResponse = await fetch(
                    `${API_CONFIG.BASE_URL}/user/detail?uid=${userId}&timestamp=${Date.now()}&cookie=${encodeURIComponent(userData.cookie)}`
                );
                const detailData = await detailResponse.json();
                
                if (detailData.code === 200) {
                    userData.profile = { ...userData.profile, ...detailData.profile };
                    localStorage.setItem('netease_profile', JSON.stringify(userData.profile));
                }
                
                // 获取账号信息
                const accountResponse = await fetch(
                    `${API_CONFIG.BASE_URL}/user/account?timestamp=${Date.now()}&cookie=${encodeURIComponent(userData.cookie)}`
                );
                const accountData = await accountResponse.json();
                
                if (accountData.code === 200) {
                    userData.account = accountData;
                    localStorage.setItem('netease_account', JSON.stringify(accountData));
                }
                
                // 获取用户等级
                const levelResponse = await fetch(
                    `${API_CONFIG.BASE_URL}/user/level?timestamp=${Date.now()}&cookie=${encodeURIComponent(userData.cookie)}`
                );
                const levelData = await levelResponse.json();
                
                if (levelData.code === 200) {
                    userData.level = levelData;
                }
                
                // 获取用户订阅计数
                const subcountResponse = await fetch(
                    `${API_CONFIG.BASE_URL}/user/subcount?timestamp=${Date.now()}&cookie=${encodeURIComponent(userData.cookie)}`
                );
                const subcountData = await subcountResponse.json();
                
                if (subcountData.code === 200) {
                    userData.subcount = subcountData;
                }
                
                // 获取用户歌单
                const playlistsResponse = await fetch(
                    `${API_CONFIG.BASE_URL}/user/playlist?uid=${userId}&timestamp=${Date.now()}&cookie=${encodeURIComponent(userData.cookie)}`
                );
                const playlistsData = await playlistsResponse.json();
                
                if (playlistsData.code === 200) {
                    userData.playlists = playlistsData;
                }
                
            } catch (error) {
                console.error('获取用户信息失败:', error);
                showStatus('获取用户信息失败，部分功能可能不可用', 'error');
            }
        }

        // 显示用户信息
        function showUserInfo() {
            // 切换到用户信息面板
            loginPanel.style.display = 'none';
            userInfoPanel.classList.add('active');
            
            // 更新基本用户信息
            if (userData.profile) {
                const profile = userData.profile;
                
                // 用户头像
                if (profile.avatarUrl) {
                    userAvatar.src = profile.avatarUrl;
                }
                
                // 用户昵称
                userName.textContent = profile.nickname || '未知用户';
                
                // 用户签名
                userSignature.textContent = profile.signature || '暂无签名';
                
                // 用户ID
                userId.textContent = profile.userId || '未知';
                
                // 用户性别
                let genderText = '未知';
                if (profile.gender === 1) genderText = '男';
                else if (profile.gender === 2) genderText = '女';
                else if (profile.gender === 0) genderText = '保密';
                userGender.textContent = genderText;
                
                // 用户年龄（通过生日计算）
                if (profile.birthday) {
                    const birthYear = new Date(profile.birthday).getFullYear();
                    const currentYear = new Date().getFullYear();
                    const age = currentYear - birthYear;
                    userAge.textContent = age > 0 ? `${age}岁` : '未知';
                } else {
                    userAge.textContent = '未知';
                }
                
                // 更新基本信息网格
                updateBasicInfoGrid(profile);
            }
            
            // 更新账号信息
            if (userData.account) {
                updateAccountInfoGrid(userData.account);
            }
            
            // 更新社交信息
            if (userData.subcount) {
                updateSocialInfoGrid(userData.subcount);
                
                // 更新统计卡片
                followsEl.textContent = userData.subcount.followCount || 0;
                followedsEl.textContent = userData.subcount.followedCount || 0;
            }
            
            // 更新用户等级
            if (userData.level) {
                levelEl.textContent = userData.level.level || 0;
            }
            
            // 更新歌单数量
            if (userData.playlists) {
                // 计算用户创建的歌单数量（排除收藏的歌单）
                let createdPlaylists = 0;
                if (userData.playlists.playlist) {
                    createdPlaylists = userData.playlists.playlist.filter(
                        playlist => playlist.userId.toString() === userData.profile.userId.toString()
                    ).length;
                }
                playlistCountEl.textContent = createdPlaylists;
            }
            
            // 更新JSON查看器
            updateJsonViewer();
        }

        // 更新基本信息网格
        function updateBasicInfoGrid(profile) {
            const basicInfoItems = [
                { label: '用户ID', value: profile.userId },
                { label: '昵称', value: profile.nickname },
                { label: '签名', value: profile.signature || '暂无' },
                { label: '生日', value: profile.birthday ? new Date(profile.birthday).toLocaleDateString() : '未知' },
                { label: '省份', value: profile.province ? `ID: ${profile.province}` : '未知' },
                { label: '城市', value: profile.city ? `ID: ${profile.city}` : '未知' },
                { label: '背景图片', value: profile.backgroundUrl ? '已设置' : '未设置' },
                { label: 'VIP类型', value: profile.vipType === 0 ? '普通用户' : `VIP${profile.vipType}` },
                { label: '达人等级', value: profile.djStatus || 0 },
                { label: '认证类型', value: profile.authStatus === 0 ? '未认证' : `认证类型: ${profile.authStatus}` }
            ];
            
            basicInfoGrid.innerHTML = basicInfoItems.map(item => `
                <div class="info-item">
                    <div class="info-label">${item.label}</div>
                    <div class="info-value">${item.value}</div>
                </div>
            `).join('');
        }

        // 更新账号信息网格
        function updateAccountInfoGrid(account) {
            const accountInfo = account.account || account;
            const profile = account.profile || {};
            
            const accountInfoItems = [
                { label: '账号ID', value: accountInfo.id },
                { label: '用户名', value: accountInfo.userName },
                { label: '状态', value: accountInfo.status === 0 ? '正常' : `状态码: ${accountInfo.status}` },
                { label: '创建时间', value: accountInfo.createTime ? new Date(accountInfo.createTime).toLocaleString() : '未知' },
                { label: '付费类型', value: accountInfo.whitelistAuthority === 0 ? '普通用户' : '白名单用户' },
                { label: '盐值', value: accountInfo.salt || '无' },
                { label: '令牌版本', value: accountInfo.tokenVersion || 0 },
                { label: '登录类型', value: accountInfo.type || 0 },
                { label: '积分', value: profile.point || 0 },
                { label: '经验', value: profile.listenSongs || 0 }
            ];
            
            accountInfoGrid.innerHTML = accountInfoItems.map(item => `
                <div class="info-item">
                    <div class="info-label">${item.label}</div>
                    <div class="info-value">${item.value}</div>
                </div>
            `).join('');
        }

        // 更新社交信息网格
        function updateSocialInfoGrid(subcount) {
            const socialInfoItems = [
                { label: '动态数', value: subcount.eventCount || 0 },
                { label: '关注数', value: subcount.followCount || 0 },
                { label: '粉丝数', value: subcount.followedCount || 0 },
                { label: '私信数', value: subcount.msgCount || 0 },
                { label: '未读私信', value: subcount.newMsgCount || 0 },
                { label: '通知数', value: subcount.noticeCount || 0 },
                { label: '云盘歌曲', value: subcount.cloudSongCount || 0 },
                { label: '创建歌单', value: subcount.createdPlaylistCount || 0 },
                { label: '收藏歌单', value: subcount.subPlaylistCount || 0 },
                { label: '创建电台', value: subcount.djRadioCount || 0 },
                { label: '订阅电台', value: subcount.subDjRadioCount || 0 },
                { label: '收藏MV', value: subcount.mvCount || 0 },
                { label: '收藏专辑', value: subcount.albumCount || 0 },
                { label: '收藏歌手', value: subcount.artistCount || 0 }
            ];
            
            socialInfoGrid.innerHTML = socialInfoItems.map(item => `
                <div class="info-item">
                    <div class="info-label">${item.label}</div>
                    <div class="info-value">${item.value}</div>
                </div>
            `).join('');
        }

        // 更新JSON查看器
        function updateJsonViewer() {
            // 创建一个合并的用户数据对象
            const allUserData = {
                profile: userData.profile,
                account: userData.account,
                level: userData.level,
                subcount: userData.subcount,
                playlists: userData.playlists ? { 
                    count: userData.playlists.playlist ? userData.playlists.playlist.length : 0,
                    // 只显示前3个歌单的简略信息，避免数据过大
                    preview: userData.playlists.playlist ? 
                        userData.playlists.playlist.slice(0, 3).map(p => ({ name: p.name, id: p.id })) : []
                } : null,
                cookie: userData.cookie ? '已保存（出于安全考虑不显示完整内容）' : null
            };
            
            // 格式化JSON
            const formattedJson = JSON.stringify(allUserData, null, 2);
            
            // 语法高亮
            const highlightedJson = formattedJson
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, function(match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
            
            jsonViewer.innerHTML = highlightedJson;
        }

        // 退出登录
        function logout() {
            // 清除本地存储的数据
            clearLoginData();
            
            // 重置用户数据
            userData = {
                profile: null,
                account: null,
                level: null,
                subcount: null,
                playlists: null,
                cookie: null
            };
            
            // 重置表单
            phoneInput.value = '';
            phone2Input.value = '';
            captchaInput.value = '';
            passwordInput.value = '';
            
            // 切换回登录面板
            userInfoPanel.classList.remove('active');
            loginPanel.style.display = 'flex';
            
            // 重置登录按钮状态
            captchaLoginBtn.disabled = false;
            captchaLoginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 验证码登录';
            passwordLoginBtn.disabled = false;
            passwordLoginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 密码登录';
            
            // 清除验证码倒计时
            if (countdownInterval) {
                clearInterval(countdownInterval);
                sendCaptchaBtn.disabled = false;
                sendCaptchaBtn.textContent = '发送验证码';
            }
            
            // 显示退出成功消息
            showStatus('已成功退出登录', 'success');
            setTimeout(() => {
                loginStatus.innerHTML = '';
                loginStatus.className = 'login-status';
            }, 3000);
        }

        // 清除登录数据
        function clearLoginData() {
            localStorage.removeItem('netease_cookie');
            localStorage.removeItem('netease_profile');
            localStorage.removeItem('netease_account');
        }

        // 显示状态消息
        function showStatus(message, type) {
            loginStatus.textContent = message;
            loginStatus.className = `login-status ${type}`;
            
            // 5秒后清除错误/成功消息（除了加载中状态）
            if (type !== 'loading') {
                setTimeout(() => {
                    loginStatus.innerHTML = '';
                    loginStatus.className = 'login-status';
                }, 5000);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initEventListeners();
        });
    </script>
