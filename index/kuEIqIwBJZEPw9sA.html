<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPU 极限算力测试 - 毁灭级</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        /* UI Overlay */
        #ui-layer, #result-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10;
            transition: opacity 0.5s;
            backdrop-filter: blur(10px);
        }

        #result-layer { display: none; }
        
        h1 { 
            font-size: 3rem; margin: 0 0 10px 0; text-transform: uppercase; text-align: center;
            background: linear-gradient(135deg, #ff0055, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(255, 0, 85, 0.4);
            letter-spacing: 2px;
        }
        
        .subtitle { color: #888; margin-bottom: 40px; font-size: 1rem; text-align: center; max-width: 600px; line-height: 1.6; }
        
        .control-group { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .control-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
        
        label { color: #aaa; font-size: 0.85rem; display: block; margin-bottom: 8px; font-weight: bold; }

        select {
            padding: 12px 20px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            font-size: 1rem;
            border-radius: 6px;
            outline: none;
            width: 220px;
            transition: 0.3s;
        }
        select:hover { border-color: #ff0055; }

        .btn-start {
            padding: 18px 80px;
            font-size: 1.5rem;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        .btn-start:active { transform: scale(0.95); }
        
        /* HUD */
        #hud {
            position: absolute;
            top: 20px; left: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            pointer-events: none;
            display: none;
            font-family: 'Courier New', monospace;
            min-width: 200px;
        }
        .hud-row { display: flex; justify-content: space-between; margin: 5px 0; color: #ccc; font-size: 0.9rem; }
        .hud-val { color: #fff; font-weight: bold; }
        .highlight { color: #ff0055; }

        /* Progress Bar */
        #progress-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #222; display: none;
        }
        #progress-bar { width: 0%; height: 100%; background: #ff0055; transition: width 0.1s linear; }

        /* Results */
        .score-big { font-size: 5rem; font-weight: 900; color: #ff0055; text-shadow: 0 0 40px rgba(255,0,85,0.5); margin: 20px 0; }
        .score-detail { display: flex; gap: 40px; margin-bottom: 30px; }
        .detail-item { text-align: center; }
        .detail-label { color: #888; font-size: 0.9rem; }
        .detail-val { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }
        .btn-restart { padding: 12px 40px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        .btn-restart:hover { background: #444; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .control-row { flex-direction: column; gap: 10px; }
            select { width: 100%; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <!-- Main Menu -->
    <div id="ui-layer">
        <h1>GPU 极限算力测试</h1>
        <p class="subtitle">警告：该工具将生成数百万个多边形或进行海量光线运算。可能会导致设备发热或浏览器短暂无响应。</p>
        
        <div class="control-group">
            <div class="control-row">
                <div>
                    <label>测试模式</label>
                    <select id="test-mode">
                        <option value="raster">几何吞吐 (Vertex/Raster)</option>
                        <option value="raytracing">光线追踪 (Compute/ALU)</option>
                    </select>
                </div>
                
                <div id="stress-options">
                    <label>压力等级</label>
                    <select id="stress-level">
                        <option value="1">困难 (Heavy)</option>
                        <option value="2" selected>极高 (Extreme)</option>
                        <option value="3">地狱 (Nightmare)</option>
                    </select>
                </div>
            </div>
            <div style="text-align: center;">
                <button id="start-btn" class="btn-start">开始 15秒 测试</button>
            </div>
        </div>
        <p style="color: #444; margin-top: 20px; font-size: 0.8rem;">Build v2.1 - Extreme Stress Edition</p>
    </div>

    <!-- Result Screen -->
    <div id="result-layer">
        <h1>测试完成</h1>
        <div class="score-big" id="final-score">0</div>
        <div class="score-detail">
            <div class="detail-item">
                <div class="detail-label">平均 FPS</div>
                <div class="detail-val" id="res-fps">0</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">最低 FPS (1%)</div>
                <div class="detail-val" id="res-min">0</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">总帧数</div>
                <div class="detail-val" id="res-frames">0</div>
            </div>
        </div>
        <div style="color:#aaa; margin-bottom:20px;" id="res-gpu">GPU Model</div>
        <button class="btn-restart" onclick="location.reload()">重新测试</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-row"><span>FPS</span> <span id="fps-val" class="hud-val highlight">0</span></div>
        <div class="hud-row"><span>Time</span> <span id="time-val" class="hud-val">0s</span></div>
        <div class="hud-row"><span>Res</span> <span id="res-val" class="hud-val">--</span></div>
        <div class="hud-row" style="margin-top:10px; border-top:1px solid #444; padding-top:5px;">
            <span id="gpu-name" style="font-size:0.7rem; color:#888;">Detecting...</span>
        </div>
    </div>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const TEST_DURATION_MS = 15000;
        
        // --- State ---
        let camera, scene, renderer;
        let isRunning = false;
        let startTime = 0;
        let frameCount = 0;
        let framesArray = []; // To calculate 1% low
        let mode = 'raster';
        let difficulty = 1;
        
        // Stress Objects
        let meshGroup; // Raster
        let rtMaterial; // Raytracing

        // UI Refs
        const ui = document.getElementById('ui-layer');
        const resultUi = document.getElementById('result-layer');
        const hud = document.getElementById('hud');
        const fpsElem = document.getElementById('fps-val');
        const timeElem = document.getElementById('time-val');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const startBtn = document.getElementById('start-btn');
        const modeSel = document.getElementById('test-mode');
        const stressSel = document.getElementById('stress-level');

        // FPS calculation
        let lastFpsUpdate = 0;
        let fpsFrameCount = 0;

        // Mode Descriptions
        modeSel.addEventListener('change', (e) => {
            if(e.target.value === 'raytracing') {
                stressSel.innerHTML = `
                    <option value="1">困难 (HD, 30 Samples)</option>
                    <option value="2" selected>极高 (2K, 60 Samples)</option>
                    <option value="3">地狱 (4K Internal, 100 Samples)</option>
                `;
            } else {
                stressSel.innerHTML = `
                    <option value="500000">困难 (50万 三角面)</option>
                    <option value="1200000" selected>极高 (120万 三角面)</option>
                    <option value="2500000">地狱 (250万 三角面)</option>
                `;
            }
        });

        startBtn.addEventListener('click', () => {
            mode = modeSel.value;
            difficulty = mode === 'raster' ? parseInt(stressSel.value) : parseInt(stressSel.value);
            
            ui.style.opacity = '0';
            setTimeout(() => { 
                ui.style.display = 'none'; 
                hud.style.display = 'block'; 
                progressContainer.style.display = 'block';
            }, 500);
            
            init(mode, difficulty);
        });

        function init(testMode, level) {
            renderer = new THREE.WebGLRenderer({ 
                antialias: false, 
                powerPreference: "high-performance",
                precision: "highp"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.autoClear = true;
            document.body.appendChild(renderer.domElement);

            scene = new THREE.Scene();

            // Get GPU Name
            const gl = renderer.getContext();
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            const rendererName = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "Unknown GPU";
            const cleanName = rendererName.replace(/\[.*?\]/g, '').replace('ANGLE (', '').replace(')', '');
            document.getElementById('gpu-name').innerText = cleanName;
            document.getElementById('res-gpu').innerText = cleanName;
            document.getElementById('res-val').innerText = `${renderer.domElement.width}x${renderer.domElement.height}`;

            if (testMode === 'raster') {
                initRaster(level);
            } else {
                initRayTracing(level);
            }

            isRunning = true;
            startTime = performance.now();
            lastFpsUpdate = startTime;
            animate();
        }

        // ==========================================
        // 模式 1: 光栅化暴力测试 (Rasterization)
        // ==========================================
        function initRaster(count) {
            scene.background = new THREE.Color(0x050505);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 150;

            // Geometry: Tetrahedron is simple, but we spawn MILLIONS
            const geometry = new THREE.TetrahedronGeometry(1, 0);
            
            // Custom Shader Material for Vertex Stress
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color: { value: new THREE.Color(0xff0055) }
                },
                vertexShader: `
                    uniform float time;
                    varying vec3 vNormal;
                    varying vec3 vColor;
                    
                    // Pseudo-random
                    float random(vec2 st) {
                        return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
                    }

                    void main() {
                        vNormal = normal;
                        
                        // Per-instance transform
                        vec3 pos = position;
                        vec3 iPos = instanceMatrix[3].xyz; // Get instance position
                        
                        // Heavy Math per vertex - 保持原有计算复杂度
                        float dist = length(iPos);
                        float wave = sin(dist * 0.1 - time * 2.0) * 5.0;
                        float twist = cos(pos.y * 10.0 + time) * 0.5;
                        
                        // Scale based on math
                        pos *= (1.0 + sin(time + dist)*0.5);
                        
                        // Apply Instance Matrix manually
                        vec4 worldPosition = instanceMatrix * vec4(pos, 1.0);
                        
                        // Additional wave distortion after matrix
                        worldPosition.y += wave;
                        worldPosition.x += twist;

                        vColor = vec3(0.5 + 0.5 * sin(iPos.x * 0.1 + time), 
                                      0.5 + 0.5 * cos(iPos.y * 0.1 + time), 
                                      0.5 + 0.5 * sin(iPos.z * 0.1));

                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    varying vec3 vColor;
                    void main() {
                        // Simple lighting to save frag shader for vertex bottleneck
                        float light = dot(vNormal, normalize(vec3(1.0, 1.0, 1.0))) * 0.5 + 0.5;
                        gl_FragColor = vec4(vColor * light, 1.0);
                    }
                `,
                side: THREE.DoubleSide
            });

            meshGroup = new THREE.InstancedMesh(geometry, material, count);
            
            const dummy = new THREE.Object3D();
            // Spread them out in a huge cloud but ensure they're visible
            const spread = 200; // 减少分布范围确保可见

            for (let i = 0; i < count; i++) {
                dummy.position.set(
                    (Math.random() - 0.5) * spread,
                    (Math.random() - 0.5) * spread,
                    (Math.random() - 0.5) * spread
                );
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                dummy.scale.setScalar(Math.random() * 1.5 + 0.5);
                dummy.updateMatrix();
                meshGroup.setMatrixAt(i, dummy.matrix);
            }
            meshGroup.frustumCulled = false; // 禁用视锥剔除确保所有对象都被处理
            scene.add(meshGroup);

            // 添加一些基础照明
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
        }

        // ==========================================
        // 模式 2: 光线追踪算力测试 (Raytracing / Compute)
        // ==========================================
        function initRayTracing(difficultyLevel) {
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            // Define stress parameters
            let samplesPerFrame = 20; // Base
            if (difficultyLevel === 2) samplesPerFrame = 60;
            if (difficultyLevel === 3) samplesPerFrame = 120; // GPU Killer

            const fragmentShader = `
                precision highp float;
                uniform float time;
                uniform vec2 resolution;
                uniform float stressLoops; 
                
                #define MAX_BOUNCES 4
                #define NUM_SPHERES 12
                
                struct Ray { vec3 ro; vec3 rd; };
                
                // Sphere: xyz, radius
                vec4 spheres[NUM_SPHERES];
                
                // 初始化场景数据 (每一帧都重置，为了方便)
                void initScene() {
                    spheres[0] = vec4(0.0, -1000.5, -1.0, 1000.0); // 地面
                    spheres[1] = vec4(0.0, 0.0, -3.0, 1.0);        // 中心大球
                    
                    // 环绕球
                    for(int i=2; i<NUM_SPHERES; i++) {
                        float fi = float(i);
                        float angle = time * 0.5 + fi;
                        float radius = 2.0 + sin(time * 0.3 + fi)*0.5;
                        spheres[i] = vec4(cos(angle)*radius, 0.0 + sin(time + fi)*0.5, -3.0 + sin(angle)*radius, 0.3);
                    }
                }

                // 简单的随机函数
                float seed;
                float random() { return fract(sin(seed++) * 43758.5453); }

                // 射线求交
                float intersect(Ray r, out int id, out vec3 n) {
                    float d = 1e30;
                    id = -1;
                    for(int i=0; i<NUM_SPHERES; i++) {
                        vec3 oc = r.ro - spheres[i].xyz;
                        float b = dot(oc, r.rd);
                        float c = dot(oc, oc) - spheres[i].w * spheres[i].w;
                        float h = b*b - c;
                        if(h > 0.0) {
                            float t = -b - sqrt(h);
                            if(t > 0.001 && t < d) {
                                d = t;
                                id = i;
                                n = (r.ro + t*r.rd - spheres[i].xyz) / spheres[i].w;
                            }
                        }
                    }
                    return d;
                }

                // 路径追踪主逻辑
                vec3 trace(Ray r) {
                    vec3 col = vec3(0.0);
                    vec3 atten = vec3(1.0);
                    
                    for(int b=0; b<MAX_BOUNCES; b++) {
                        int id;
                        vec3 n;
                        float t = intersect(r, id, n);
                        
                        if(id == -1) {
                            // Sky color
                            col += atten * vec3(0.1, 0.15, 0.25) * (1.0 + r.rd.y); 
                            break;
                        }
                        
                        vec3 p = r.ro + t * r.rd;
                        
                        // Material Colors
                        vec3 albedo = vec3(0.7);
                        if(id == 0) albedo = vec3(0.1) * (mod(floor(p.x)+floor(p.z), 2.0) + 0.2); // Checkered floor
                        else if(id == 1) albedo = vec3(0.95, 0.95, 0.95); // Mirror
                        else albedo = vec3(0.5 + 0.5*sin(float(id)), 0.5 + 0.5*cos(float(id)), 0.8); // Random colors

                        // Emission for some spheres
                        if(id > 5) {
                             col += atten * vec3(2.0, 1.0, 0.5);
                             break;
                        }

                        // Reflection logic
                        if(id == 1) {
                            r.rd = reflect(r.rd, n);
                        } else {
                            // Diffuse scatter
                            vec3 randDir = normalize(vec3(random()-0.5, random()-0.5, random()-0.5));
                            if(dot(randDir, n) < 0.0) randDir = -randDir;
                            r.rd = normalize(n + randDir);
                        }
                        r.ro = p;
                        atten *= albedo;
                    }
                    return col;
                }

                void main() {
                    seed = gl_FragCoord.x * 123.45 + gl_FragCoord.y * 678.91 + time;
                    initScene();
                    
                    vec2 uv = (gl_FragCoord.xy - 0.5 * resolution.xy) / resolution.y;
                    vec3 tot = vec3(0.0);
                    
                    // --- STRESS LOOP ---
                    // 这里是显卡杀手。在 Shader 里硬跑循环，这会极大占用 ALU。
                    // 移动端 GPU 对这种长循环非常敏感。
                    float loops = stressLoops;
                    
                    for(float i=0.0; i<150.0; i++) { 
                        if(i >= loops) break;
                        
                        // Anti-aliasing jitter
                        vec2 off = vec2(random()-0.5, random()-0.5) / resolution.y;
                        
                        Ray r;
                        r.ro = vec3(0.0, 2.0, 4.0);
                        r.rd = normalize(vec3(uv + off, -1.5));
                        
                        // Camera rotation
                        float a = time * 0.1;
                        mat3 rot = mat3(cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a));
                        r.ro = rot * r.ro;
                        r.rd = rot * r.rd;
                        
                        tot += trace(r);
                    }
                    
                    tot /= loops;
                    
                    // Tone mapping
                    tot = tot / (tot + vec3(1.0));
                    tot = pow(tot, vec3(0.4545));
                    
                    gl_FragColor = vec4(tot, 1.0);
                }
            `;

            rtMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    resolution: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
                    stressLoops: { value: samplesPerFrame }
                },
                vertexShader: `void main() { gl_Position = vec4( position, 1.0 ); }`,
                fragmentShader: fragmentShader
            });

            const plane = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(plane, rtMaterial);
            scene.add(mesh);
        }

        // ==========================================
        // 主循环与逻辑
        // ==========================================
        let lastTime = 0;
        
        function animate(timeNow) {
            if(!isRunning) return;
            requestAnimationFrame(animate);

            const now = performance.now();
            const elapsed = now - startTime;
            
            // Progress Bar
            const progress = Math.min((elapsed / TEST_DURATION_MS) * 100, 100);
            progressBar.style.width = `${progress}%`;
            timeElem.innerText = `${((TEST_DURATION_MS - elapsed)/1000).toFixed(1)}s`;

            // End Test
            if (elapsed >= TEST_DURATION_MS) {
                finishTest();
                return;
            }

            // Update Scene
            const dt = (now - lastTime) * 0.001;
            lastTime = now;

            if(mode === 'raster') {
                if(meshGroup) {
                    meshGroup.material.uniforms.time.value = now * 0.001;
                    meshGroup.rotation.y = now * 0.0002;
                }
            } else {
                if(rtMaterial) {
                    rtMaterial.uniforms.time.value = now * 0.001;
                }
            }

            renderer.render(scene, camera);

            // FPS Calculation - 使用更稳定的方法
            frameCount++;
            fpsFrameCount++;
            
            // 每500ms更新一次FPS显示，避免频繁更新导致性能影响
            if (now - lastFpsUpdate >= 500) {
                const currentFPS = Math.round((fpsFrameCount * 1000) / (now - lastFpsUpdate));
                fpsElem.innerText = currentFPS;
                
                // Color coding
                if(currentFPS < 15) fpsElem.style.color = "#ff0000";
                else if(currentFPS < 30) fpsElem.style.color = "#ffaa00";
                else fpsElem.style.color = "#00ff55";
                
                framesArray.push(currentFPS);
                fpsFrameCount = 0;
                lastFpsUpdate = now;
            }
        }

        function finishTest() {
            isRunning = false;
            hud.style.display = 'none';
            progressContainer.style.display = 'none';
            resultUi.style.display = 'flex';

            // Calculate Stats - 使用收集的所有FPS样本
            const avgFps = framesArray.reduce((a, b) => a + b, 0) / framesArray.length;
            
            // Sort for 1% low
            framesArray.sort((a, b) => a - b);
            const low1PercentIndex = Math.floor(framesArray.length * 0.01);
            const low1Fps = framesArray[low1PercentIndex] || 0;

            // Score Formula
            // Score = AvgFPS * ResolutionFactor * DifficultyFactor
            const pixelCount = renderer.domElement.width * renderer.domElement.height;
            const hdPixels = 1920 * 1080;
            const resFactor = pixelCount / hdPixels; // 4K gives 4x score compared to 1080p
            
            // Difficulty multiplier
            let diffMult = 1;
            if (mode === 'raster') {
                // Base 500k = 1x
                diffMult = difficulty / 500000;
            } else {
                // Raytracing multiplier
                if (difficulty === 1) diffMult = 1.0;
                if (difficulty === 2) diffMult = 2.5;
                if (difficulty === 3) diffMult = 6.0;
            }

            // Normalize score to something looking like "3DMark" (e.g., 5000 pts)
            const baseScore = avgFps * resFactor * diffMult * 100;
            
            // Display
            animateScore(Math.round(baseScore));
            document.getElementById('res-fps').innerText = avgFps.toFixed(1);
            document.getElementById('res-min').innerText = low1Fps.toFixed(1);
            document.getElementById('res-frames').innerText = framesArray.length;
        }

        function animateScore(target) {
            const el = document.getElementById('final-score');
            let current = 0;
            const step = target / 50;
            const timer = setInterval(() => {
                current += step;
                if(current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                el.innerText = Math.round(current);
            }, 20);
        }
        
        // Handle Resize
        window.addEventListener('resize', () => {
            if (!renderer) return;
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(mode === 'raster') {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
            } else {
                if(rtMaterial) rtMaterial.uniforms.resolution.value.set(
                    window.innerWidth * window.devicePixelRatio, 
                    window.innerHeight * window.devicePixelRatio
                );
            }
        });

    </script>
</body>
