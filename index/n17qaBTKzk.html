<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高效音频压缩工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        neutral: '#64748B',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .shadow-soft {
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .transition-custom {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .scale-hover {
                @apply hover:scale-105 transition-all duration-300;
            }
        }
    </style>
</head>
<body class="font-inter bg-gray-50 text-dark min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm py-4 px-6 md:px-12">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa fa-volume-down text-primary text-2xl"></i>
                <h1 class="text-xl md:text-2xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                    高效音频压缩工具
                </h1>
            </div>
            <div class="text-sm text-neutral hidden md:block">
                浏览器端处理 · 保护隐私 · 免费使用
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-grow container mx-auto p-4 md:p-8 lg:p-12">
        <!-- 上传区域 -->
        <section class="mb-10">
            <div id="upload-container" class="bg-white rounded-xl shadow-soft p-6 md:p-8 border-2 border-dashed border-gray-200 hover:border-primary transition-custom">
                <div class="flex flex-col items-center justify-center text-center">
                    <i class="fa fa-cloud-upload text-5xl text-primary mb-4"></i>
                    <h2 class="text-xl font-semibold mb-2">上传音频</h2>
                    <p class="text-neutral mb-6 max-w-md">支持MP3、WAV、OGG等格式，文件将在浏览器中处理，不会上传到服务器</p>
                    
                    <label for="file-upload" class="bg-primary hover:bg-primary/90 text-white font-medium py-3 px-8 rounded-lg cursor-pointer transition-custom scale-hover flex items-center">
                        <i class="fa fa-file-audio-o mr-2"></i>选择音频
                    </label>
                    <input id="file-upload" type="file" accept="audio/*" class="hidden">
                    
                    <p id="file-name" class="mt-4 text-sm text-neutral hidden"></p>
                    <button id="reset-upload" class="mt-4 text-neutral hover:text-red-500 transition-custom hidden">
                        <i class="fa fa-times-circle mr-1"></i> 重新选择
                    </button>
                </div>
            </div>
        </section>

        <!-- 压缩设置区域 -->
        <section id="compression-settings" class="mb-10 hidden">
            <div class="bg-white rounded-xl shadow-soft p-6 md:p-8">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fa fa-sliders text-primary mr-2"></i>压缩设置
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- 比特率设置 -->
                    <div>
                        <label for="bitrate" class="block text-sm font-medium text-gray-700 mb-2">
                            目标比特率: <span id="bitrate-value">128</span> kbps
                        </label>
                        <input type="range" id="bitrate" min="32" max="320" step="16" value="128" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
                        <p class="text-xs text-neutral mt-1">数值越低，压缩率越高，音质可能下降越明显</p>
                    </div>
                    
                    <!-- 输出格式 -->
                    <div>
                        <label for="output-format" class="block text-sm font-medium text-gray-700 mb-2">
                            输出格式
                        </label>
                        <select id="output-format" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-custom">
                            <option value="mp3">MP3</option>
                            <option value="ogg">OGG</option>
                            <option value="wav">WAV (无损格式)</option>
                        </select>
                        <p class="text-xs text-neutral mt-1">选择压缩后的音频格式</p>
                    </div>
                </div>
                
                <div class="mt-6 flex justify-center">
                    <button id="compress-btn" class="bg-secondary hover:bg-secondary/90 text-white font-medium py-3 px-8 rounded-lg transition-custom scale-hover flex items-center">
                        <i class="fa fa-cog mr-2"></i>开始压缩
                    </button>
                </div>
            </div>
        </section>

        <!-- 预览区域 -->
        <section id="preview-section" class="mb-10 hidden">
            <div class="bg-white rounded-xl shadow-soft p-6 md:p-8">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <i class="fa fa-headphones text-primary mr-2"></i>压缩前后对比
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- 原音频预览 -->
                    <div class="flex flex-col items-center">
                        <h3 class="text-lg font-medium mb-4">原音频</h3>
                        <div class="relative w-full max-w-md bg-gray-100 rounded-lg p-4 mb-4">
                            <audio id="original-audio" controls class="w-full"></audio>
                            <div id="original-placeholder" class="text-center p-8">
                                <i class="fa fa-music text-4xl text-gray-300 mb-2"></i>
                                <p class="text-gray-400">暂无音频</p>
                            </div>
                        </div>
                        <div class="text-sm text-neutral w-full max-w-md">
                            <p><span class="font-medium">时长:</span> <span id="original-duration">--</span></p>
                            <p><span class="font-medium">大小:</span> <span id="original-size">--</span></p>
                            <p><span class="font-medium">格式:</span> <span id="original-format">--</span></p>
                            <p><span class="font-medium">比特率:</span> <span id="original-bitrate">--</span></p>
                        </div>
                    </div>
                    
                    <!-- 压缩后预览 -->
                    <div class="flex flex-col items-center">
                        <h3 class="text-lg font-medium mb-4">压缩后</h3>
                        <div class="relative w-full max-w-md bg-gray-100 rounded-lg p-4 mb-4">
                            <audio id="compressed-audio" controls class="w-full">
                            <div id="compressed-placeholder" class="text-center p-8">
                                <i class="fa fa-music text-4xl text-gray-300 mb-2"></i>
                                <p class="text-gray-400">暂无音频</p>
                            </div>
                        </div>
                        <div class="text-sm text-neutral w-full max-w-md">
                            <p><span class="font-medium">时长:</span> <span id="compressed-duration">--</span></p>
                            <p><span class="font-medium">大小:</span> <span id="compressed-size">--</span></p>
                            <p><span class="font-medium">格式:</span> <span id="compressed-format">--</span></p>
                            <p><span class="font-medium">比特率:</span> <span id="compressed-bitrate">--</span></p>
                        </div>
                    </div>
                </div>
                
                <div class="mt-8 flex justify-center">
                    <button id="download-btn" class="bg-primary hover:bg-primary/90 text-white font-medium py-3 px-8 rounded-lg transition-custom scale-hover flex items-center disabled:opacity-50 disabled:cursor-not-allowed" disabled="">
                        <i class="fa fa-download mr-2"></i>下载压缩音频
                    </button>
                </div>
            </div>
        </section>
        
        <!-- 提示信息区域 -->
        <section id="info-section" class="bg-blue-50 border-l-4 border-primary p-4 rounded-r-lg mb-10 hidden">
            <div class="flex">
                <div class="flex-shrink-0">
                    <i class="fa fa-info-circle text-primary"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-blue-700" id="info-message">
                        提示信息将显示在这里
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white border-t border-gray-200 py-6 px-6">
        <div class="container mx-auto text-center text-sm text-neutral">
            <p>高效音频压缩工具 © 2025 - 所有音频均在您的浏览器中处理，不会上传到任何服务器</p>
        </div>
    </footer>

    <!-- 加载动画 -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-lg shadow-lg flex items-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mr-4"></div>
            <p class="font-medium">正在处理音频...</p>
        </div>
    </div>

    <!-- 使用国内CDN加载FFmpeg库 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/ffmpeg.js/4.2.9003/ffmpeg.min.js"></script>
    <script>
        // 全局变量
        let originalAudioData = null;
        let compressedAudioData = null;
        let isAudioUploaded = false;
        let ffmpeg = null;
        
        // DOM 元素
        const fileUpload = document.getElementById('file-upload');
        const fileName = document.getElementById('file-name');
        const resetUpload = document.getElementById('reset-upload');
        const uploadContainer = document.getElementById('upload-container');
        const compressionSettings = document.getElementById('compression-settings');
        const previewSection = document.getElementById('preview-section');
        const infoSection = document.getElementById('info-section');
        const infoMessage = document.getElementById('info-message');
        const bitrateSlider = document.getElementById('bitrate');
        const bitrateValue = document.getElementById('bitrate-value');
        const outputFormat = document.getElementById('output-format');
        const compressBtn = document.getElementById('compress-btn');
        const downloadBtn = document.getElementById('download-btn');
        const originalAudio = document.getElementById('original-audio');
        const compressedAudio = document.getElementById('compressed-audio');
        const originalPlaceholder = document.getElementById('original-placeholder');
        const compressedPlaceholder = document.getElementById('compressed-placeholder');
        const originalDuration = document.getElementById('original-duration');
        const originalSize = document.getElementById('original-size');
        const originalFormat = document.getElementById('original-format');
        const originalBitrate = document.getElementById('original-bitrate');
        const compressedDuration = document.getElementById('compressed-duration');
        const compressedSize = document.getElementById('compressed-size');
        const compressedFormat = document.getElementById('compressed-format');
        const compressedBitrate = document.getElementById('compressed-bitrate');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        // 初始化FFmpeg
        async function initFFmpeg() {
            if (!ffmpeg) {
                showLoading(true);
                showInfo('正在加载音频处理引擎，请稍候...', 'info');
                
                try {
                    // 使用国内CDN提供的FFmpeg
                    ffmpeg = createFFmpeg({
                        log: false,
                        corePath: 'https://cdn.bootcdn.net/ajax/libs/ffmpeg.js/4.2.9003/ffmpeg-core.js'
                    });
                    
                    await ffmpeg.load();
                    showLoading(false);
                    showInfo('音频处理引擎已就绪', 'info');
                } catch (error) {
                    console.error('FFmpeg加载失败:', error);
                    showLoading(false);
                    showInfo('音频处理引擎加载失败，请检查网络或刷新页面重试', 'error');
                }
            }
        }
        
        // 事件监听器
        fileUpload.addEventListener('change', handleFileUpload);
        resetUpload.addEventListener('click', resetUploadedFile);
        bitrateSlider.addEventListener('input', updateBitrateValue);
        compressBtn.addEventListener('click', compressAudio);
        downloadBtn.addEventListener('click', downloadCompressedAudio);
        
        // 页面加载时初始化FFmpeg
        window.addEventListener('load', initFFmpeg);
        
        // 显示比特率值
        function updateBitrateValue() {
            bitrateValue.textContent = bitrateSlider.value;
        }
        
        // 处理文件上传
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // 检查是否是音频文件
            if (!file.type.startsWith('audio/')) {
                showInfo('请上传有效的音频文件', 'error');
                resetUploadedFile();
                return;
            }
            
            // 防止重复上传相同文件
            if (isAudioUploaded) {
                showInfo('已上传音频，请先压缩或重新选择', 'warning');
                return;
            }
            
            // 读取文件并显示
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                
                // 创建音频对象获取信息
                const audio = new Audio();
                audio.onloadedmetadata = function() {
                    // 提取文件格式
                    const format = file.name.split('.').pop().toLowerCase();
                    
                    // 存储原始音频数据
                    originalAudioData = {
                        base64: base64Data,
                        blob: file,
                        duration: audio.duration,
                        size: file.size,
                        format: format,
                        bitrate: '未知'
                    };
                    
                    // 更新UI
                    updateOriginalAudioUI();
                    fileName.textContent = file.name;
                    fileName.classList.remove('hidden');
                    resetUpload.classList.remove('hidden');
                    compressionSettings.classList.remove('hidden');
                    previewSection.classList.remove('hidden');
                    uploadContainer.classList.remove('border-dashed', 'border-gray-200');
                    uploadContainer.classList.add('border-primary');
                    
                    isAudioUploaded = true;
                    showInfo('音频上传成功，请调整压缩设置并点击"开始压缩"', 'info');
                };
                audio.src = base64Data;
            };
            reader.readAsDataURL(file);
        }
        
        // 重置上传
        function resetUploadedFile() {
            fileUpload.value = '';
            fileName.classList.add('hidden');
            resetUpload.classList.add('hidden');
            uploadContainer.classList.add('border-dashed', 'border-gray-200');
            uploadContainer.classList.remove('border-primary');
            
            // 重置音频数据
            originalAudioData = null;
            compressedAudioData = null;
            isAudioUploaded = false;
            
            // 重置UI
            resetOriginalAudioUI();
            resetCompressedAudioUI();
            compressionSettings.classList.add('hidden');
            previewSection.classList.add('hidden');
            infoSection.classList.add('hidden');
            downloadBtn.disabled = true;
        }
        
        // 更新原始音频UI
        function updateOriginalAudioUI() {
            originalAudio.src = originalAudioData.base64;
            originalAudio.classList.remove('hidden');
            originalPlaceholder.classList.add('hidden');
            originalDuration.textContent = formatDuration(originalAudioData.duration);
            originalSize.textContent = formatFileSize(originalAudioData.size);
            originalFormat.textContent = originalAudioData.format.toUpperCase();
            originalBitrate.textContent = originalAudioData.bitrate;
        }
        
        // 重置原始音频UI
        function resetOriginalAudioUI() {
            originalAudio.src = '';
            originalAudio.classList.add('hidden');
            originalPlaceholder.classList.remove('hidden');
            originalDuration.textContent = '--';
            originalSize.textContent = '--';
            originalFormat.textContent = '--';
            originalBitrate.textContent = '--';
        }
        
        // 重置压缩音频UI
        function resetCompressedAudioUI() {
            compressedAudio.src = '';
            compressedAudio.classList.add('hidden');
            compressedPlaceholder.classList.remove('hidden');
            compressedDuration.textContent = '--';
            compressedSize.textContent = '--';
            compressedFormat.textContent = '--';
            compressedBitrate.textContent = '--';
        }
        
        // 显示提示信息
        function showInfo(message, type = 'info') {
            infoMessage.textContent = message;
            infoSection.classList.remove('hidden');
            
            // 设置不同类型的样式
            infoSection.className = '';
            if (type === 'info') {
                infoSection.classList.add('bg-blue-50', 'border-l-4', 'border-primary', 'p-4', 'rounded-r-lg', 'mb-10');
                infoMessage.classList.add('text-blue-700');
                infoMessage.classList.remove('text-yellow-700', 'text-red-700');
            } else if (type === 'warning') {
                infoSection.classList.add('bg-yellow-50', 'border-l-4', 'border-yellow-400', 'p-4', 'rounded-r-lg', 'mb-10');
                infoMessage.classList.add('text-yellow-700');
                infoMessage.classList.remove('text-blue-700', 'text-red-700');
            } else if (type === 'error') {
                infoSection.classList.add('bg-red-50', 'border-l-4', 'border-red-400', 'p-4', 'rounded-r-lg', 'mb-10');
                infoMessage.classList.add('text-red-700');
                infoMessage.classList.remove('text-blue-700', 'text-yellow-700');
            }
        }
        
        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            else return (bytes / 1048576).toFixed(2) + ' MB';
        }
        
        // 格式化时长
        function formatDuration(seconds) {
            if (isNaN(seconds)) return '--';
            
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }
        
        // 压缩音频
        async function compressAudio() {
            if (!originalAudioData || !ffmpeg) return;
            
            showLoading(true);
            resetCompressedAudioUI();
            
            try {
                // 获取用户设置
                const targetBitrate = bitrateSlider.value;
                const format = outputFormat.value;
                
                // 准备输入文件名
                const inputFileName = `input.${originalAudioData.format}`;
                const outputFileName = `output.${format}`;
                
                // 写入文件到FFmpeg虚拟文件系统
                const arrayBuffer = await originalAudioData.blob.arrayBuffer();
                const uint8Array = new Uint8Array(arrayBuffer);
                ffmpeg.FS('writeFile', inputFileName, uint8Array);
                
                // 根据格式设置FFmpeg命令
                let command = ['-i', inputFileName];
                
                // 设置比特率
                command.push('-b:a', `${targetBitrate}k`);
                
                // 对于WAV格式，使用pcm_s16le编码
                if (format === 'wav') {
                    command.push('-c:a', 'pcm_s16le');
                }
                
                // 输出文件
                command.push(outputFileName);
                
                // 执行FFmpeg命令
                await ffmpeg.run(...command);
                
                // 读取输出文件
                const outputData = ffmpeg.FS('readFile', outputFileName);
                
                // 创建Blob和Base64数据
                const blob = new Blob([outputData.buffer], { type: `audio/${format}` });
                const base64Data = await blobToBase64(blob);
                
                // 获取压缩后音频信息
                const compressedSize = outputData.length;
                const duration = originalAudioData.duration; // 时长不变
                
                // 存储压缩后的音频数据
                compressedAudioData = {
                    base64: base64Data,
                    blob: blob,
                    duration: duration,
                    size: compressedSize,
                    format: format,
                    bitrate: `${targetBitrate} kbps`
                };
                
                // 确保压缩后大小小于原文件大小，如果不是则进一步压缩
                let iterations = 0;
                const maxIterations = 5; // 最大尝试次数
                
                while (compressedSize >= originalAudioData.size && iterations < maxIterations) {
                    iterations++;
                    const newBitrate = Math.max(32, targetBitrate - (iterations * 16));
                    
                    // 清理之前的输出
                    try {
                        ffmpeg.FS('unlink', outputFileName);
                    } catch (e) {}
                    
                    // 重新执行压缩
                    const newCommand = ['-i', inputFileName, '-b:a', `${newBitrate}k`];
                    if (format === 'wav') {
                        newCommand.push('-c:a', 'pcm_s16le');
                    }
                    newCommand.push(outputFileName);
                    
                    await ffmpeg.run(...newCommand);
                    
                    // 更新压缩数据
                    const newOutputData = ffmpeg.FS('readFile', outputFileName);
                    const newCompressedSize = newOutputData.length;
                    const newBlob = new Blob([newOutputData.buffer], { type: `audio/${format}` });
                    const newBase64Data = await blobToBase64(newBlob);
                    
                    compressedAudioData = {
                        base64: newBase64Data,
                        blob: newBlob,
                        duration: duration,
                        size: newCompressedSize,
                        format: format,
                        bitrate: `${newBitrate} kbps`
                    };
                }
                
                // 清理文件系统
                ffmpeg.FS('unlink', inputFileName);
                ffmpeg.FS('unlink', outputFileName);
                
                // 更新UI
                updateCompressedAudioUI();
                downloadBtn.disabled = false;
                
                // 计算压缩率
                const rate = ((1 - compressedAudioData.size / originalAudioData.size) * 100).toFixed(1);
                showInfo(`音频压缩成功，压缩率: ${rate}%`, 'info');
                
            } catch (error) {
                console.error('压缩失败:', error);
                showInfo(`压缩失败: ${error.message || '未知错误'}`, 'error');
            } finally {
                showLoading(false);
            }
        }
        
        // Blob转Base64
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        
        // 更新压缩音频UI
        function updateCompressedAudioUI() {
            if (!compressedAudioData) return;
            
            compressedAudio.src = compressedAudioData.base64;
            compressedAudio.classList.remove('hidden');
            compressedPlaceholder.classList.add('hidden');
            compressedDuration.textContent = formatDuration(compressedAudioData.duration);
            compressedSize.textContent = formatFileSize(compressedAudioData.size);
            compressedFormat.textContent = compressedAudioData.format.toUpperCase();
            compressedBitrate.textContent = compressedAudioData.bitrate;
        }
        
        // 下载压缩后的音频
        function downloadCompressedAudio() {
            if (!compressedAudioData) return;
            
            const link = document.createElement('a');
            link.href = compressedAudioData.base64;
            
            // 生成文件名
            const originalName = fileName.textContent.split('.').slice(0, -1).join('.');
            link.download = `${originalName}_compressed.${compressedAudioData.format}`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showInfo('音频已下载', 'info');
        }
        
        // 显示/隐藏加载动画
        function showLoading(show) {
            if (show) {
                loadingOverlay.classList.remove('hidden');
            } else {
                loadingOverlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
