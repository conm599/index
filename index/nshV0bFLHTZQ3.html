<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Audio to MIDI | 专业音频转换器</title>
    <style>
        /* --- 现代化 CSS 变量与重置 --- */
        :root {
            --primary: #00f2ff;
            --secondary: #4facfe;
            --accent: #ff0055;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 动态背景光效 */
        .ambient-light {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        /* --- 主容器 (磨砂玻璃) --- */
        .app-container {
            width: 90%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-muted);
            margin: 0 0 30px 0;
            font-size: 0.95rem;
        }

        /* --- 控件区域 --- */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        /* 自定义滑块 */
        input[type=range] {
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -6px; 
            box-shadow: 0 0 10px var(--primary);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* --- 上传区域 --- */
        .upload-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: rgba(0,0,0,0.2);
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(0, 242, 255, 0.05);
        }

        .upload-zone input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .icon-upload {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: block;
        }

        /* --- 可视化 Canvas --- */
        #visualizer {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            margin: 20px 0;
            display: none; /* Hide initially */
            border: 1px solid var(--glass-border);
        }

        /* --- 按钮 --- */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: #000;
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(0, 242, 255, 0.5);
        }
        
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { 
            background: #334155; 
            color: #64748b; 
            cursor: not-allowed; 
            box-shadow: none; 
        }

        .btn-download {
            background: rgba(255,255,255,0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            margin-top: 15px;
        }

        .btn-download:hover {
            background: rgba(0, 242, 255, 0.1);
        }

        /* --- 状态显示 --- */
        .status-bar {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .spinner {
            width: 18px; height: 18px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- 结果动作区 --- */
        .result-actions {
            display: none;
            gap: 10px;
            margin-top: 20px;
        }
        
        .result-actions button {
            flex: 1;
        }

    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="app-container">
        <header>
            <h1>Audio to MIDI Pro</h1>
            <p>高精度单声道音频转 MIDI | 本地离线处理</p>
        </header>

        <div class="controls-grid">
            <div class="control-group">
                <label>噪声门限 (Noise Gate)</label>
                <input type="range" id="threshold" min="0" max="0.1" step="0.001" value="0.015">
            </div>
            <div class="control-group">
                <label>检测精度 (Resolution)</label>
                <input type="range" id="resolution" min="30" max="100" step="10" value="50">
            </div>
        </div>

        <div class="upload-zone" id="dropZone">
            <span class="icon-upload">🎵</span>
            <span id="fileName">点击或拖入 MP3/WAV 文件</span>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div style="margin-top: 20px;">
            <button id="convertBtn" class="btn btn-primary" disabled>
                开始转换
            </button>
        </div>

        <canvas id="visualizer"></canvas>
        
        <div class="status-bar">
            <span id="statusText">等待文件...</span>
            <div class="spinner" id="spinner"></div>
        </div>

        <div class="result-actions" id="resultActions">
            <button class="btn btn-download" id="playPreviewBtn">▶️ 试听结果</button>
            <button class="btn btn-primary" id="downloadBtn">⬇️ 下载 MIDI</button>
        </div>
    </div>

    <script>
        /**
         * Professional MP3 to MIDI Converter Logic
         * 使用 RMS Gate, Autocorrelation, Median Smoothing
         */

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ui = {
            fileInput: document.getElementById('audioInput'),
            dropZone: document.getElementById('dropZone'),
            fileName: document.getElementById('fileName'),
            convertBtn: document.getElementById('convertBtn'),
            status: document.getElementById('statusText'),
            spinner: document.getElementById('spinner'),
            canvas: document.getElementById('visualizer'),
            resultActions: document.getElementById('resultActions'),
            downloadBtn: document.getElementById('downloadBtn'),
            playPreviewBtn: document.getElementById('playPreviewBtn'),
            threshold: document.getElementById('threshold'),
            resolution: document.getElementById('resolution')
        };

        let audioBuffer = null;
        let detectedNotes = []; // { note: int, start: float, duration: float }

        // --- UI 交互 ---

        ui.fileInput.addEventListener('change', handleFileSelect);
        
        ui.dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            ui.dropZone.classList.add('dragover');
        });
        
        ui.dropZone.addEventListener('dragleave', () => ui.dropZone.classList.remove('dragover'));
        
        ui.dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            ui.dropZone.classList.remove('dragover');
            ui.fileInput.files = e.dataTransfer.files;
            handleFileSelect({ target: ui.fileInput });
        });

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            ui.fileName.innerText = file.name;
            ui.status.innerText = "正在解码音频...";
            ui.spinner.style.display = "block";
            ui.convertBtn.disabled = true;
            ui.resultActions.style.display = "none";
            ui.canvas.style.display = "none";

            try {
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                ui.status.innerText = `准备就绪 (${audioBuffer.duration.toFixed(1)}s)`;
                ui.convertBtn.disabled = false;
                ui.convertBtn.innerText = "开始转换";
            } catch (err) {
                ui.status.innerText = "错误: 文件解码失败";
                console.error(err);
            } finally {
                ui.spinner.style.display = "none";
            }
        }

        ui.convertBtn.addEventListener('click', async () => {
            if (!audioBuffer) return;
            
            ui.convertBtn.disabled = true;
            ui.status.innerText = "正在分析音高...";
            ui.spinner.style.display = "block";
            ui.canvas.style.display = "block";
            
            // 使用 setTimeout 让 UI 刷新
            setTimeout(() => {
                processAudio(audioBuffer);
            }, 100);
        });

        // --- 核心处理逻辑 ---

        function processAudio(buffer) {
            const rawData = buffer.getChannelData(0); // 单声道
            const sampleRate = buffer.sampleRate;
            
            // 从滑块获取配置
            const sliceTime = parseInt(ui.resolution.value) / 1000; // 30ms - 100ms
            const noiseThreshold = parseFloat(ui.threshold.value);
            
            const samplesPerSlice = Math.floor(sampleRate * sliceTime);
            const totalSlices = Math.floor(rawData.length / samplesPerSlice);
            
            let rawNotes = [];
            const ctx = ui.canvas.getContext('2d');
            ui.canvas.width = totalSlices;
            ui.canvas.height = 100;
            ctx.fillStyle = '#4facfe';
            ctx.clearRect(0,0, ui.canvas.width, 100);

            // 1. 提取原始音高数据
            for (let i = 0; i < totalSlices; i++) {
                const start = i * samplesPerSlice;
                const end = start + samplesPerSlice;
                const slice = rawData.slice(start, end);
                
                // RMS 过滤静音
                const rms = Math.sqrt(slice.reduce((sum, x) => sum + x*x, 0) / slice.length);
                
                if (rms > noiseThreshold) {
                    const freq = detectPitch(slice, sampleRate);
                    if (freq > 0) {
                        const midiNum = freqToMidi(freq);
                        rawNotes.push({ t: i * sliceTime, note: midiNum });
                        // 绘制简单的可视化点
                        const y = 100 - ((midiNum - 40) * 1.5); // 简单映射
                        ctx.fillRect(i, y, 1, 2);
                    } else {
                        rawNotes.push(null);
                    }
                } else {
                    rawNotes.push(null);
                }
            }

            // 2. 数据平滑与去噪 (Smoothing & Glitch Removal)
            const smoothed = smoothData(rawNotes);

            // 3. 转换为 MIDI 事件 (Note On / Off)
            detectedNotes = eventsToNotes(smoothed, sliceTime);

            ui.status.innerText = `完成! 识别到 ${detectedNotes.length} 个音符`;
            ui.spinner.style.display = "none";
            ui.convertBtn.disabled = false;
            ui.convertBtn.innerText = "重新转换";
            ui.resultActions.style.display = "flex";
        }

        // --- 算法部分 ---

        // 自相关算法 (Autocorrelation)
        function detectPitch(buffer, sampleRate) {
            // 简单的自相关，但加入归一化
            let n = buffer.length;
            let rms = 0;
            for (let i=0;i<n;i++) rms+=buffer[i]*buffer[i];
            rms = Math.sqrt(rms/n);
            if(rms < 0.01) return -1;

            // 限制频率范围 80Hz - 1200Hz (典型人声/乐器)
            let minPeriod = Math.floor(sampleRate / 1200);
            let maxPeriod = Math.floor(sampleRate / 80);

            let bestPeriod = 0;
            let maxCorr = 0.01;

            for (let period = minPeriod; period <= maxPeriod; period++) {
                let sum = 0;
                for (let i = 0; i < n - period; i++) {
                    sum += buffer[i] * buffer[i + period];
                }
                let corr = sum / n; // 简化归一化
                
                if (corr > maxCorr) {
                    maxCorr = corr;
                    bestPeriod = period;
                }
            }

            if (bestPeriod > 0) {
                // 简单的倍频检查 (防止高八度错误)
                // 实际应用中可以加入抛物线插值来提高精度
                return sampleRate / bestPeriod;
            }
            return -1;
        }

        function freqToMidi(f) {
            return Math.round(12 * Math.log2(f / 440) + 69);
        }

        // 中值滤波平滑：去除瞬间的错误音高
        function smoothData(data) {
            let result = [...data];
            // 简单的 3点中值滤波
            for(let i=1; i<data.length-1; i++) {
                const prev = data[i-1];
                const curr = data[i];
                const next = data[i+1];
                
                if (prev && next && curr && prev.note === next.note && curr.note !== prev.note) {
                    result[i] = { t: curr.t, note: prev.note }; // 填补缝隙
                }
            }
            return result;
        }

        function eventsToNotes(rawStream, sliceDuration) {
            let notes = [];
            let currentNote = null;

            rawStream.forEach((item, index) => {
                if (item) {
                    // Note is playing
                    if (!currentNote) {
                        // Start new note
                        currentNote = { note: item.note, start: item.t, duration: 0 };
                    } else if (currentNote.note !== item.note) {
                        // Note changed
                        if(currentNote.duration > 0.05) notes.push(currentNote); // 忽略极短音
                        currentNote = { note: item.note, start: item.t, duration: 0 };
                    } else {
                        // Note continues
                        currentNote.duration += sliceDuration;
                    }
                } else {
                    // Silence
                    if (currentNote) {
                        if(currentNote.duration > 0.05) notes.push(currentNote);
                        currentNote = null;
                    }
                }
            });
            return notes;
        }

        // --- MIDI 生成与下载 ---

        ui.downloadBtn.addEventListener('click', () => {
            const midiData = buildMidiFile(detectedNotes);
            const blob = new Blob([midiData], { type: 'audio/midi' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'converted_melody.mid';
            link.click();
        });

        function buildMidiFile(notes) {
            // 基础 MIDI 结构
            const header = [
                0x4D, 0x54, 0x68, 0x64, // MThd
                0x00, 0x00, 0x00, 0x06, // Length
                0x00, 0x00, // Format 0
                0x00, 0x01, // 1 Track
                0x01, 0xE0  // 480 ticks per beat
            ];

            const trackData = [];
            
            // Tempo (120bpm = 500000 micros/beat)
            trackData.push(0x00, 0xFF, 0x51, 0x03, 0x07, 0xA1, 0x20);

            let lastTick = 0;
            const ticksPerSec = 960; // Based on 120bpm, 480TPQ

            // 将音符转换为线性事件流 (On/Off)
            let events = [];
            notes.forEach(n => {
                events.push({ type: 'on', tick: Math.round(n.start * ticksPerSec), note: n.note });
                events.push({ type: 'off', tick: Math.round((n.start + n.duration) * ticksPerSec), note: n.note });
            });
            events.sort((a, b) => a.tick - b.tick);

            events.forEach(e => {
                let delta = e.tick - lastTick;
                if(delta < 0) delta = 0; // 安全锁
                lastTick = e.tick;

                trackData.push(...toVLQ(delta));
                if (e.type === 'on') {
                    trackData.push(0x90, e.note, 80); // Note On, Velocity 80
                } else {
                    trackData.push(0x80, e.note, 0);  // Note Off
                }
            });

            trackData.push(0x00, 0xFF, 0x2F, 0x00); // End of track

            // Track Header
            const trackLen = trackData.length;
            const trackHead = [
                0x4D, 0x54, 0x72, 0x6B, // MTrk
                (trackLen >> 24) & 0xFF,
                (trackLen >> 16) & 0xFF,
                (trackLen >> 8) & 0xFF,
                (trackLen & 0xFF)
            ];

            return new Uint8Array([...header, ...trackHead, ...trackData]);
        }

        function toVLQ(num) {
            let buffer = [];
            buffer.push(num & 0x7F);
            while ((num >>= 7) > 0) {
                buffer.push((num & 0x7F) | 0x80);
            }
            return buffer.reverse();
        }

        // --- 在线试听 (Simple Synth) ---

        ui.playPreviewBtn.addEventListener('click', () => {
            if (detectedNotes.length === 0) return;
            
            const btn = ui.playPreviewBtn;
            if(btn.innerText.includes("停止")) {
                location.reload(); // 简单粗暴的停止方式：重置 (因为调度器很难清理)
                return;
            }

            btn.innerText = "⏹ 停止播放";
            
            const now = audioCtx.currentTime;
            detectedNotes.forEach(n => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; // 简单的正弦波
                osc.frequency.value = 440 * Math.pow(2, (n.note - 69) / 12);
                
                gain.gain.setValueAtTime(0.1, now + n.start);
                gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now + n.start);
                osc.stop(now + n.start + n.duration);
            });

            // 播放结束自动复原 (估算时间)
            const lastNote = detectedNotes[detectedNotes.length-1];
            const totalTime = lastNote.start + lastNote.duration;
            setTimeout(() => {
                btn.innerText = "▶️ 试听结果";
            }, totalTime * 1000);
        });

    </script>
</body>
</html>
