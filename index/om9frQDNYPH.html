<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32并发+顺序显示图片</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding: 20px; font-family: Arial, sans-serif; max-width: 1400px; margin: 0 auto; }
        .control { margin-bottom: 15px; }
        button { padding: 10px 20px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { font-size: 16px; margin-bottom: 15px; color: #333; }
        .image-container { 
            width: 100%; 
            height: 80vh; 
            border: 1px solid #ddd; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .image-wrapper { 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
        }
        .image-wrapper img { 
            max-width: 100%; 
            max-height: 400px; 
            object-fit: contain; 
        }
        .error { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>
    <div class="control">
        <button id="startBtn">开始32并发加载</button>
    </div>
    <div class="status" id="progressSpan">未开始 | 总任务数：0</div>
    <div class="image-container" id="imageContainer"></div>

    <script>
        // 1. 生成有序URL列表（按1/1→1/3440→2/1→2/9909→3/1→3/814顺序）
        function generateUrlList() {
            const layerConfig = { 1: 3440, 2: 9909, 3: 814 };
            const baseUrl = "https://swebp.naxid.top/{layer1}/{layer2}";
            const urlList = [];
            for (let layer1 = 1; layer1 <= 3; layer1++) {
                const maxLayer2 = layerConfig[layer1];
                for (let layer2 = 1; layer2 <= maxLayer2; layer2++) {
                    const url = baseUrl.replace("{layer1}", layer1).replace("{layer2}", layer2);
                    urlList.push({ url, index: urlList.length }); // 索引保证顺序（从0开始）
                }
            }
            return urlList;
        }

        // 2. 32并发请求池（控制并发+按索引存结果）
        class ConcurrentImagePool {
            constructor(maxConcurrency) {
                this.maxConcurrency = maxConcurrency; // 最大并发数
                this.currentConcurrency = 0;          // 当前并发数
                this.queue = [];                      // 待请求队列
                this.results = [];                    // 按索引存储结果：{index, url, success, img/error}
                this.total = 0;                       // 总任务数
                this.completed = 0;                   // 已完成数
                this.success = 0;                     // 成功数
                this.failed = 0;                      // 失败数
                this.onProgress = null;               // 进度回调
                this.onComplete = null;               // 完成回调
            }

            // 添加单个请求任务
            addTask(task) {
                this.queue.push(task);
                this.total++;
                this.runNext(); // 尝试执行下一个任务
            }

            // 执行队列中的下一个任务
            runNext() {
                if (this.queue.length === 0 || this.currentConcurrency >= this.maxConcurrency) return;
                
                this.currentConcurrency++;
                const task = this.queue.shift(); // 取出队首任务

                // 加载图片（处理跨域+加载失败）
                const img = new Image();
                img.crossOrigin = "anonymous"; // 解决跨域图片加载限制
                img.onload = () => {
                    this.success++;
                    this.results[task.index] = { ...task, success: true, img };
                    this.finishTask();
                };
                img.onerror = (err) => {
                    this.failed++;
                    this.results[task.index] = { ...task, success: false, error: err };
                    this.finishTask();
                };
                img.src = task.url;
            }

            // 任务完成后的统一处理
            finishTask() {
                this.completed++;
                this.currentConcurrency--;

                // 触发进度回调（用于更新状态+渲染图片）
                if (this.onProgress) {
                    this.onProgress({
                        completed: this.completed,
                        total: this.total,
                        success: this.success,
                        failed: this.failed,
                        currentConcurrency: this.currentConcurrency
                    });
                }

                // 所有任务完成时触发回调
                if (this.completed === this.total && this.onComplete) {
                    this.onComplete();
                }

                // 继续执行队列中的任务
                this.runNext();
            }
        }

        // 3. 顺序渲染图片（保证从第一张到最后一张依次显示）
        let renderIndex = 0; // 当前已渲染到的索引
        const imageContainer = document.getElementById('imageContainer');
        function renderOrderedImages(results) {
            // 从当前渲染索引开始，渲染所有已完成的图片
            while (renderIndex < results.length && results[renderIndex]) {
                const result = results[renderIndex];
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';
                
                // 拼接图片/错误信息
                const content = result.success 
                    ? `<img src="${result.img.src}" alt="图片${result.index + 1}" />` 
                    : `<p class="error">加载失败：${result.url}</p>`;
                
                wrapper.innerHTML = `
                    <p>序号：${result.index + 1} | URL：${result.url}</p>
                    ${content}
                `;
                imageContainer.appendChild(wrapper);
                renderIndex++; // 推进渲染索引
            }
        }

        // 4. 绑定按钮事件（启动加载）
        const startBtn = document.getElementById('startBtn');
        const progressSpan = document.getElementById('progressSpan');
        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            const urlList = generateUrlList();
            const total = urlList.length;
            progressSpan.textContent = `初始化完成 | 总任务数：${total}`;

            // 创建32并发池
            const pool = new ConcurrentImagePool(32);
            
            // 进度更新时：更新状态+渲染图片
            pool.onProgress = (progress) => {
                progressSpan.textContent = `
                    已完成：${progress.completed}/${progress.total} | 
                    成功：${progress.success} | 失败：${progress.failed} | 
                    当前并发：${progress.currentConcurrency}
                `.replace(/\s+/g, ' '); // 去除多余空格
                renderOrderedImages(pool.results); // 尝试渲染已完成的图片
            };

            // 所有任务完成时提示
            pool.onComplete = () => {
                progressSpan.textContent = `加载完成！总数：${total} | 成功：${pool.success} | 失败：${pool.failed}`;
            };

            // 将所有URL任务加入并发池
            urlList.forEach(task => pool.addTask(task));
        });
    </script>
</body>
</html>
