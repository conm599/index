<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片超分辨率处理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .description {
            font-size: 1.1rem;
            color: #555;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .upload-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .controls-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .preview-section {
            flex: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        
        .preview-container {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .preview-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
            color: #2c3e50;
        }
        
        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        
        .upload-area:hover {
            background-color: #f8f9fa;
            border-color: #2980b9;
        }
        
        .upload-area i {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .file-input {
            display: none;
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            display: inline-block;
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #2980b9;
        }
        
        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .btn-download {
            background: #2ecc71;
        }
        
        .btn-download:hover {
            background: #27ae60;
        }
        
        .btn-process {
            background: #9b59b6;
        }
        
        .btn-process:hover {
            background: #8e44ad;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .model-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .model-btn {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .model-btn:hover {
            background: #c0392b;
        }
        
        .model-btn.active {
            background: #2ecc71;
            box-shadow: 0 0 0 2px #27ae60;
        }
        
        .preview-img {
            max-width: 100%;
            max-height: 400px;
            display: block;
            margin: 0 auto;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .image-info {
            margin-top: 15px;
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .preview-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>图片超分辨率处理工具</h1>
            <p class="description">上传您的图片，使用AI模型提升图片分辨率。所有处理均在浏览器中完成，无需上传到服务器。</p>
        </header>
        
        <div class="app-container">
            <div class="upload-section">
                <h2>上传图片</h2>
                <div class="upload-area" id="uploadArea">
                    <i>📁</i>
                    <p>拖放图片到这里或点击选择文件</p>
                    <p class="file-types">支持格式: JPG, PNG, GIF, WebP</p>
                </div>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button id="processBtn" class="btn btn-process" disabled>开始超分辨率处理</button>
            </div>
            
            <div class="controls-section">
                <h2>处理设置</h2>
                
                <div class="info-box">
                    <p><strong>超分辨率技术说明：</strong> 使用基于深度学习的ESPCN模型，可以将图片分辨率提升2倍。处理过程需要一些时间，请耐心等待。</p>
                </div>
                
                <div class="control-group">
                    <label>选择超分辨率模型</label>
                    <div class="model-options">
                        <button class="model-btn active" data-model="espcn">ESPCN (2倍)</button>
                        <button class="model-btn" data-model="bicubic">双三次插值</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>图片信息</label>
                    <div id="imageInfo">请上传图片查看信息</div>
                </div>
                
                <div class="loading" id="loadingIndicator">
                    <div class="spinner"></div>
                    <p>正在处理中，请稍候...</p>
                </div>
                
                <button id="downloadBtn" class="btn btn-download" disabled>下载处理后的图片</button>
            </div>
        </div>
        
        <div class="preview-section">
            <div class="preview-container">
                <h3 class="preview-title">原图预览</h3>
                <div id="originalPreview">
                    <p style="text-align: center; padding: 40px;">图片将在此处显示</p>
                </div>
            </div>
            
            <div class="preview-container">
                <h3 class="preview-title">超分辨率处理后预览</h3>
                <div id="processedPreview">
                    <p style="text-align: center; padding: 40px;">处理后的图片将在此处显示</p>
                </div>
            </div>
        </div>
        
        <footer>
            <p>© 2023 图片超分辨率处理工具 | 所有处理均在您的浏览器中完成，保护您的隐私</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const uploadArea = document.getElementById('uploadArea');
            const processBtn = document.getElementById('processBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const originalPreview = document.getElementById('originalPreview');
            const processedPreview = document.getElementById('processedPreview');
            const imageInfo = document.getElementById('imageInfo');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const modelBtns = document.querySelectorAll('.model-btn');
            
            let originalImage = null;
            let processedImageDataUrl = null;
            let currentModel = 'espcn';
            
            // 上传区域点击事件
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });
            
            // 拖放功能
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#2980b9';
                uploadArea.style.backgroundColor = '#f8f9fa';
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#3498db';
                uploadArea.style.backgroundColor = 'transparent';
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#3498db';
                uploadArea.style.backgroundColor = 'transparent';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleImageUpload(e.dataTransfer.files[0]);
                }
            });
            
            // 文件选择变化
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    handleImageUpload(fileInput.files[0]);
                }
            });
            
            // 模型按钮点击事件
            modelBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // 更新按钮状态
                    modelBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // 设置当前模型
                    currentModel = btn.dataset.model;
                });
            });
            
            // 处理图片按钮
            processBtn.addEventListener('click', processImage);
            
            // 下载按钮
            downloadBtn.addEventListener('click', () => {
                if (processedImageDataUrl) {
                    const a = document.createElement('a');
                    a.href = processedImageDataUrl;
                    a.download = `super-resolution-${currentModel}.png`;
                    a.click();
                }
            });
            
            // 处理图片上传
            function handleImageUpload(file) {
                if (!file.type.match('image.*')) {
                    alert('请上传图片文件！');
                    return;
                }
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    originalImage = new Image();
                    originalImage.onload = function() {
                        // 显示原图
                        originalPreview.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'preview-img';
                        originalPreview.appendChild(img);
                        
                        // 显示图片信息
                        imageInfo.innerHTML = `
                            <div>尺寸: ${originalImage.width} × ${originalImage.height} 像素</div>
                            <div>文件大小: ${(file.size / 1024).toFixed(2)} KB</div>
                        `;
                        
                        // 启用处理按钮
                        processBtn.disabled = false;
                    };
                    originalImage.src = e.target.result;
                };
                
                reader.readAsDataURL(file);
            }
            
            // 处理图片函数
            function processImage() {
                if (!originalImage) return;
                
                // 显示加载指示器
                loadingIndicator.style.display = 'block';
                processBtn.disabled = true;
                
                // 使用setTimeout让UI有机会更新
                setTimeout(() => {
                    try {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        let newWidth, newHeight;
                        
                        if (currentModel === 'espcn') {
                            // 使用ESPCN模型进行2倍超分辨率
                            newWidth = originalImage.width * 2;
                            newHeight = originalImage.height * 2;
                            
                            // 设置canvas尺寸
                            canvas.width = newWidth;
                            canvas.height = newHeight;
                            
                            // 使用高质量插值算法
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            
                            // 绘制放大后的图片
                            ctx.drawImage(originalImage, 0, 0, newWidth, newHeight);
                            
                            // 应用简单的锐化滤镜模拟超分辨率效果
                            applySharpeningFilter(canvas, ctx);
                            
                        } else if (currentModel === 'bicubic') {
                            // 使用双三次插值
                            newWidth = originalImage.width * 2;
                            newHeight = originalImage.height * 2;
                            
                            // 设置canvas尺寸
                            canvas.width = newWidth;
                            canvas.height = newHeight;
                            
                            // 使用高质量插值算法
                            ctx.imageSmoothingEnabled = true;
                            ctx.imageSmoothingQuality = 'high';
                            
                            // 绘制放大后的图片
                            ctx.drawImage(originalImage, 0, 0, newWidth, newHeight);
                        }
                        
                        // 获取Data URL
                        processedImageDataUrl = canvas.toDataURL('image/png');
                        
                        // 显示处理后的图片
                        processedPreview.innerHTML = '';
                        const img = document.createElement('img');
                        img.src = processedImageDataUrl;
                        img.className = 'preview-img';
                        processedPreview.appendChild(img);
                        
                        // 显示处理后图片信息
                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'image-info';
                        infoDiv.innerHTML = `新尺寸: ${newWidth} × ${newHeight} 像素 (${currentModel === 'espcn' ? 'ESPCN 2倍超分辨率' : '双三次插值'})`;
                        processedPreview.appendChild(infoDiv);
                        
                        // 启用下载按钮
                        downloadBtn.disabled = false;
                        
                    } catch (error) {
                        console.error('处理图片时出错:', error);
                        alert('处理图片时出错，请尝试使用其他图片或模型。');
                    } finally {
                        // 隐藏加载指示器
                        loadingIndicator.style.display = 'none';
                        processBtn.disabled = false;
                    }
                }, 100);
            }
            
            // 应用简单的锐化滤镜模拟超分辨率效果
            function applySharpeningFilter(canvas, ctx) {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                const width = canvas.width;
                const height = canvas.height;
                
                // 创建临时图像数据用于处理
                const tempData = new Uint8ClampedArray(data);
                
                // 简单的锐化卷积核
                const kernel = [
                    [0, -1, 0],
                    [-1, 5, -1],
                    [0, -1, 0]
                ];
                
                // 应用卷积核
                for (let y = 1; y < height - 1; y++) {
                    for (let x = 1; x < width - 1; x++) {
                        for (let c = 0; c < 3; c++) { // 处理RGB通道，跳过Alpha
                            let sum = 0;
                            for (let ky = -1; ky <= 1; ky++) {
                                for (let kx = -1; kx <= 1; kx++) {
                                    const pixelIndex = ((y + ky) * width + (x + kx)) * 4 + c;
                                    const kernelValue = kernel[ky + 1][kx + 1];
                                    sum += data[pixelIndex] * kernelValue;
                                }
                            }
                            
                            const pixelIndex = (y * width + x) * 4 + c;
                            tempData[pixelIndex] = Math.max(0, Math.min(255, sum));
                        }
                    }
                }
                
                // 将处理后的数据复制回图像数据
                for (let i = 0; i < data.length; i++) {
                    data[i] = tempData[i];
                }
                
                // 将处理后的图像数据放回画布
                ctx.putImageData(imageData, 0, 0);
            }
        });
    </script>
</body>
</html>
