<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐播放器</title>
    <style>
        :root {
            --primary-color: #1db954;
            --bg-color: #191414;
            --card-bg: rgba(30, 30, 30, 0.8);
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
            --progress-bg: #535353;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        [data-theme="light"] {
            --bg-color: #f5f5f5;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-color: #333333;
            --text-secondary: #666666;
            --progress-bg: #e0e0e0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: var(--transition);
        }

        .player {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2), transparent);
            z-index: 0;
            border-radius: 20px 20px 0 0;
        }

        .album-art {
            width: 280px;
            height: 280px;
            margin: 0 auto 24px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .player.playing .album-art img {
            animation: rotateAlbum 20s linear infinite;
        }

        @keyframes rotateAlbum {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .song-info {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .song-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 16px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 4px;
            background-color: var(--progress-bg);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            transition: var(--transition);
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .control-btn.active {
            color: var(--primary-color);
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background-color: var(--primary-color);
            color: white;
        }

        .play-btn:hover {
            background-color: #1ed760;
            transform: scale(1.05);
        }

        .volume-container {
            display: flex;
            align-items: center;
            margin-top: 16px;
        }

        .volume-btn {
            margin-right: 12px;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            background-color: var(--progress-bg);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .volume-fill {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 2px;
            width: 80%;
        }

        .volume-handle {
            width: 12px;
            height: 12px;
            background-color: var(--primary-color);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            right: 20%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .loading {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            z-index: 10;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .player {
                padding: 20px;
            }
            
            .album-art {
                width: 240px;
                height: 240px;
            }
            
            .song-title {
                font-size: 18px;
            }
            
            .song-artist {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="player">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
        
        <button class="theme-toggle" id="theme-toggle">
            <svg viewBox="0 0 24 24">
                <path fill="currentColor" d="M12,18C8.7,18 6,15.3 6,12C6,8.7 8.7,6 12,6C15.3,6 18,8.7 18,12C18,15.3 15.3,18 12,18M12,8C9.8,8 8,9.8 8,12C8,14.2 9.8,16 12,16C14.2,16 16,14.2 16,12C16,9.8 14.2,8 12,8M12,4C7.6,4 4,7.6 4,12C4,16.4 7.6,20 12,20C16.4,20 20,16.4 20,12C20,7.6 16.4,4 12,4M12,2C17.5,2 22,6.5 22,12C22,17.5 17.5,22 12,22C6.5,22 2,17.5 2,12C2,6.5 6.5,2 12,2Z" />
            </svg>
        </button>
        
        <div class="album-art">
            <img id="cover" src="https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg" alt="专辑封面">
        </div>
        
        <div class="song-info">
            <div class="song-title" id="song-title">歌曲标题</div>
            <div class="song-artist" id="song-artist">艺术家</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="shuffle-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M14.83,13.41L13.42,14.82L16.55,17.95L14.5,20H20V14.5L17.96,16.54L14.83,13.41M14.5,4L16.54,6.04L4,18.59L5.41,20L17.96,7.46L20,9.5V4M10.59,9.17L5.41,4L4,5.41L9.17,10.58L10.59,9.17Z" />
                </svg>
            </button>
            
            <button class="control-btn" id="prev-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M6,18V6H8V18H6M9.5,12L18,6V18L9.5,12Z" />
                </svg>
            </button>
            
            <button class="control-btn play-btn" id="play-btn">
                <svg viewBox="0 0 24 24" id="play-icon">
                    <path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />
                </svg>
            </button>
            
            <button class="control-btn" id="next-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M6,18L14.5,12L6,6M16,6V18H18V6H16Z" />
                </svg>
            </button>
            
            <button class="control-btn" id="repeat-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" />
                </svg>
            </button>
        </div>
        
        <div class="volume-container">
            <button class="control-btn volume-btn" id="volume-btn">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
                </svg>
            </button>
            <div class="volume-slider" id="volume-slider">
                <div class="volume-fill" id="volume-fill"></div>
                <div class="volume-handle" id="volume-handle"></div>
            </div>
        </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script>
        // 获取DOM元素
        const player = document.querySelector('.player');
        const audio = document.getElementById('audio');
        const cover = document.getElementById('cover');
        const songTitle = document.getElementById('song-title');
        const songArtist = document.getElementById('song-artist');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const volumeBtn = document.getElementById('volume-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeFill = document.getElementById('volume-fill');
        const volumeHandle = document.getElementById('volume-handle');
        const themeToggle = document.getElementById('theme-toggle');
        const loading = document.getElementById('loading');

        // 播放列表和状态
        let currentSongIndex = 0;
        let songs = [];
        let isShuffled = false;
        let repeatMode = 'none'; // none, one, all
        let isDraggingProgress = false;
        let isDraggingVolume = false;

        // 从URL参数获取播放列表
        const urlParams = new URLSearchParams(window.location.search);
        const songParam = urlParams.get('id');
        const playlistParam = urlParams.get('playlist');
        const themeColor = urlParams.get('themeColor') || '#1db954';
        const theme = urlParams.get('theme') || 'dark';

        // 应用主题
        document.documentElement.style.setProperty('--primary-color', themeColor);
        document.documentElement.setAttribute('data-theme', theme);

        // 模拟播放列表 - 实际应用中应从API获取
        function initPlaylist() {
            if (playlistParam) {
                // 从歌单ID获取歌曲列表
                fetchPlaylist(playlistParam);
            } else if (songParam) {
                // 从歌曲ID列表获取歌曲信息
                const songIds = songParam.split(',');
                fetchSongs(songIds);
            } else {
                // 默认播放列表
                songs = [
                    {
                        id: '1',
                        title: '示例歌曲1',
                        artist: '示例艺术家1',
                        cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                        url: 'https://example.com/song1.mp3'
                    },
                    {
                        id: '2',
                        title: '示例歌曲2',
                        artist: '示例艺术家2',
                        cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                        url: 'https://example.com/song2.mp3'
                    }
                ];
                loadSong(currentSongIndex);
            }
        }

        // 从API获取歌单
        async function fetchPlaylist(playlistId) {
            showLoading();
            try {
                // 这里应该调用实际的API
                // const response = await fetch(`https://163api.qijieya.cn/playlist/track/all?id=${playlistId}`);
                // const data = await response.json();
                
                // 模拟API响应
                setTimeout(() => {
                    songs = [
                        {
                            id: '6821530729',
                            title: '歌单歌曲1',
                            artist: '歌单艺术家1',
                            cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                            url: 'https://example.com/playlist-song1.mp3'
                        },
                        {
                            id: '6821530730',
                            title: '歌单歌曲2',
                            artist: '歌单艺术家2',
                            cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                            url: 'https://example.com/playlist-song2.mp3'
                        }
                    ];
                    loadSong(currentSongIndex);
                    hideLoading();
                }, 1000);
            } catch (error) {
                console.error('获取歌单失败:', error);
                hideLoading();
            }
        }

        // 从API获取歌曲信息
        async function fetchSongs(songIds) {
            showLoading();
            try {
                // 这里应该调用实际的API
                // const response = await fetch(`https://163api.qijieya.cn/song/detail?ids=${songIds.join(',')}`);
                // const data = await response.json();
                
                // 模拟API响应
                setTimeout(() => {
                    songs = songIds.map(id => ({
                        id: id,
                        title: `歌曲 ${id}`,
                        artist: `艺术家 ${id}`,
                        cover: 'https://p2.music.126.net/6y-UleORITEDbvrOLV0Q8A==/5639395138885805.jpg',
                        url: `https://example.com/song${id}.mp3`
                    }));
                    loadSong(currentSongIndex);
                    hideLoading();
                }, 1000);
            } catch (error) {
                console.error('获取歌曲信息失败:', error);
                hideLoading();
            }
        }

        // 加载歌曲
        function loadSong(index) {
            if (songs.length === 0) return;
            
            const song = songs[index];
            songTitle.textContent = song.title;
            songArtist.textContent = song.artist;
            cover.src = song.cover;
            
            // 设置音频源
            audio.src = song.url;
            
            // 更新播放状态
            updatePlayState();
        }

        // 更新播放状态
        function updatePlayState() {
            if (audio.paused) {
                player.classList.remove('playing');
                playIcon.innerHTML = '<path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />';
            } else {
                player.classList.add('playing');
                playIcon.innerHTML = '<path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z" />';
            }
        }

        // 播放/暂停
        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updatePlayState();
        }

        // 下一首
        function nextSong() {
            if (isShuffled) {
                currentSongIndex = Math.floor(Math.random() * songs.length);
            } else {
                currentSongIndex = (currentSongIndex + 1) % songs.length;
            }
            loadSong(currentSongIndex);
            if (!audio.paused) {
                audio.play();
            }
        }

        // 上一首
        function prevSong() {
            if (isShuffled) {
                currentSongIndex = Math.floor(Math.random() * songs.length);
            } else {
                currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            }
            loadSong(currentSongIndex);
            if (!audio.paused) {
                audio.play();
            }
        }

        // 切换随机播放
        function toggleShuffle() {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('active', isShuffled);
        }

        // 切换循环模式
        function toggleRepeat() {
            const modes = ['none', 'one', 'all'];
            const currentIndex = modes.indexOf(repeatMode);
            repeatMode = modes[(currentIndex + 1) % modes.length];
            
            repeatBtn.classList.toggle('active', repeatMode !== 'none');
            
            // 更新图标
            if (repeatMode === 'one') {
                repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" /></svg>';
            } else {
                repeatBtn.innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M17,17H7V14L3,18L7,22V19H19V13H17M7,7H17V10L21,6L17,2V5H5V11H7V7Z" /></svg>';
            }
        }

        // 更新进度条
        function updateProgress() {
            if (!isDraggingProgress) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        }

        // 设置进度
        function setProgress(e) {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            
            audio.currentTime = (clickX / width) * duration;
        }

        // 格式化时间
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 更新音量
        function setVolume(e) {
            const width = volumeSlider.clientWidth;
            const clickX = e.offsetX;
            const volume = Math.max(0, Math.min(1, clickX / width));
            
            audio.volume = volume;
            volumeFill.style.width = `${volume * 100}%`;
            volumeHandle.style.right = `${(1 - volume) * 100}%`;
        }

        // 切换主题
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
        }

        // 显示加载状态
        function showLoading() {
            loading.classList.add('show');
        }

        // 隐藏加载状态
        function hideLoading() {
            loading.classList.remove('show');
        }

        // 事件监听
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        shuffleBtn.addEventListener('click', toggleShuffle);
        repeatBtn.addEventListener('click', toggleRepeat);
        themeToggle.addEventListener('click', toggleTheme);

        // 进度条事件
        progressBar.addEventListener('click', setProgress);
        
        progressBar.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            setProgress(e);
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                setProgress(e);
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingProgress = false;
        });

        // 音量控制事件
        volumeSlider.addEventListener('click', setVolume);
        
        volumeHandle.addEventListener('mousedown', (e) => {
            isDraggingVolume = true;
            e.preventDefault();
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDraggingVolume) {
                const rect = volumeSlider.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const volume = Math.max(0, Math.min(1, x / rect.width));
                
                audio.volume = volume;
                volumeFill.style.width = `${volume * 100}%`;
                volumeHandle.style.right = `${(1 - volume) * 100}%`;
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDraggingVolume = false;
        });

        // 音频事件
        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', updateProgress);

        audio.addEventListener('ended', () => {
            if (repeatMode === 'one') {
                audio.currentTime = 0;
                audio.play();
            } else if (repeatMode === 'all' || currentSongIndex < songs.length - 1) {
                nextSong();
            } else {
                player.classList.remove('playing');
                playIcon.innerHTML = '<path fill="currentColor" d="M8,5.14V19.14L19,12.14L8,5.14Z" />';
            }
        });

        // 初始化
        initPlaylist();
    </script>
</body>
</html>
