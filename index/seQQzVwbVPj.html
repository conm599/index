<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系模拟器 - NASA高清纹理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  canvas { display: block; }

  #title {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 18px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,255,255,0.5); pointer-events: none; z-index: 10;
    text-shadow: 0 0 20px rgba(100,150,255,0.3);
  }

  #info-panel {
    position: fixed; top: 20px; right: 20px; width: 300px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
    padding: 24px; z-index: 10; transition: opacity 0.4s, transform 0.4s;
    opacity: 0; transform: translateX(20px);
  }
  #info-panel.visible { opacity: 1; transform: translateX(0); }
  #info-panel h2 { font-size: 24px; font-weight: 300; margin-bottom: 4px; letter-spacing: 2px; }
  #info-panel .subtitle { font-size: 12px; color: rgba(255,255,255,0.35); margin-bottom: 16px; letter-spacing: 1px; }
  #info-panel .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
  #info-panel .stat .label { color: rgba(255,255,255,0.4); }
  #info-panel .stat .value { color: rgba(255,255,255,0.9); font-weight: 500; }
  #info-panel .desc { margin-top: 14px; font-size: 12px; line-height: 1.8; color: rgba(255,255,255,0.35); }

  #planet-nav {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10; padding: 10px 16px;
    background: rgba(0,0,0,0.5); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 50px;
  }
  .nav-btn {
    width: 48px; height: 48px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); cursor: pointer; transition: all 0.3s;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .nav-btn:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); transform: scale(1.15); }
  .nav-btn.active { border-color: rgba(100,180,255,0.8); background: rgba(100,180,255,0.2); box-shadow: 0 0 25px rgba(100,180,255,0.3); }
  .nav-btn .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
  .nav-btn .tooltip {
    position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); padding: 6px 12px; border-radius: 8px;
    font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .nav-btn:hover .tooltip { opacity: 1; }

  #controls-hint {
    position: fixed; bottom: 95px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.2); z-index: 10; pointer-events: none;
    letter-spacing: 1px;
  }

  #speed-control {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
  }
  #speed-control label { font-size: 10px; color: rgba(255,255,255,0.3); letter-spacing: 2px; }
  #speed-slider {
    -webkit-appearance: none; width: 100px; height: 3px; background: rgba(255,255,255,0.1);
    border-radius: 3px; outline: none; transform: rotate(-90deg); margin: 30px 0;
  }
  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: rgba(100,180,255,0.8); cursor: pointer; box-shadow: 0 0 10px rgba(100,180,255,0.5);
  }
  #speed-value { font-size: 11px; color: rgba(255,255,255,0.4); }

  #back-btn {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;
    padding: 8px 24px; color: rgba(255,255,255,0.6); font-size: 12px;
    cursor: pointer; z-index: 10; opacity: 0; transition: all 0.4s; pointer-events: none;
    letter-spacing: 1px;
  }
  #back-btn.visible { opacity: 1; pointer-events: all; }
  #back-btn:hover { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); }

  #loading {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100; transition: opacity 1s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .spinner { width: 50px; height: 50px; border: 2px solid rgba(255,255,255,0.05); border-top-color: rgba(100,180,255,0.6); border-radius: 50%; animation: spin 1s linear infinite; }
  #loading p { margin-top: 24px; font-size: 13px; color: rgba(255,255,255,0.4); letter-spacing: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar {
    width: 200px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px;
    margin-top: 20px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; background: linear-gradient(90deg, rgba(100,180,255,0.3), rgba(100,180,255,0.8));
    width: 0%; transition: width 0.3s;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>LOADING NASA TEXTURES</p>
  <div class="progress-bar"><div class="fill" id="progress"></div></div>
</div>

<div id="title">SOLAR SYSTEM</div>
<div id="back-btn" onclick="goBack()">← 返回总览</div>

<div id="info-panel">
  <h2 id="planet-name"></h2>
  <div class="subtitle" id="planet-name-en"></div>
  <div id="planet-stats"></div>
  <div class="desc" id="planet-desc"></div>
</div>

<div id="speed-control">
  <label>SPEED</label>
  <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1">
  <div id="speed-value">1.0x</div>
</div>

<div id="controls-hint">鼠标拖拽旋转 · 滚轮缩放 · 点击星球聚焦</div>
<div id="planet-nav"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ==================== NASA高清纹理 URLs ====================
// 使用 Solar System Scope 的2K高清纹理 (基于NASA数据)
const TEXTURES = {

  earthClouds: 'https://www.solarsystemscope.com/textures/download/2k_earth_clouds.jpg',
  moon: 'https://www.solarsystemscope.com/textures/download/2k_moon.jpg',
  mars: 'https://www.solarsystemscope.com/textures/download/2k_mars.jpg',
  jupiter: 'https://www.solarsystemscope.com/textures/download/2k_jupiter.jpg',
  saturn: 'https://www.solarsystemscope.com/textures/download/2k_saturn.jpg',
  saturnRing: 'https://www.solarsystemscope.com/textures/download/2k_saturn_ring_alpha.png',
  uranus: 'https://www.solarsystemscope.com/textures/download/2k_uranus.jpg',
  neptune: 'https://www.solarsystemscope.com/textures/download/2k_neptune.jpg',
  milkyWay: 'https://www.solarsystemscope.com/textures/download/2k_stars_milky_way.jpg'
};

const PLANETS = [
  {
    name: '太阳', nameEn: 'Sun', radius: 10, distance: 0, speed: 0, rotSpeed: 0.001,
    texture: TEXTURES.sun, isEmissive: true,
    stats: { '类型': '恒星 (G2V)', '直径': '1,392,700 km', '质量': '1.989×10³⁰ kg', '表面温度': '5,778 K', '年龄': '46亿年' },
    desc: '太阳是太阳系的中心天体，一颗黄矮星，包含太阳系99.86%的质量。核心通过核聚变产生巨大能量。'
  },
  {
    name: '水星', nameEn: 'Mercury', radius: 0.8, distance: 20, speed: 0.04, rotSpeed: 0.004,
    texture: TEXTURES.mercury,
    stats: { '类型': '类地行星', '直径': '4,879 km', '与太阳距离': '5,790万 km', '公转周期': '88 地球日', '表面温度': '-173~427°C' },
    desc: '水星是太阳系中最小的行星，也是距离太阳最近的行星，表面布满陨石坑，几乎没有大气层。'
  },
  {
    name: '金星', nameEn: 'Venus', radius: 1.3, distance: 28, speed: 0.03, rotSpeed: -0.002,
    texture: TEXTURES.venus,
    stats: { '类型': '类地行星', '直径': '12,104 km', '与太阳距离': '1.082亿 km', '公转周期': '225 地球日', '表面温度': '462°C' },
    desc: '金星是太阳系中最热的行星，浓密的二氧化碳大气产生强烈的温室效应，表面被厚厚的云层覆盖。'
  },
  {
    name: '地球', nameEn: 'Earth', radius: 1.4, distance: 38, speed: 0.025, rotSpeed: 0.01,
    texture: TEXTURES.earth, bumpMap: TEXTURES.earthNormal, specularMap: TEXTURES.earthSpecular,
    hasClouds: true, cloudTexture: TEXTURES.earthClouds, hasMoon: true,
    stats: { '类型': '类地行星', '直径': '12,742 km', '与太阳距离': '1.496亿 km', '公转周期': '365.25 天', '卫星': '1 (月球)' },
    desc: '地球是太阳系中唯一已知存在生命的行星，拥有液态水和适宜的大气层，是我们的家园。'
  },
  {
    name: '火星', nameEn: 'Mars', radius: 1.0, distance: 50, speed: 0.02, rotSpeed: 0.009,
    texture: TEXTURES.mars,
    stats: { '类型': '类地行星', '直径': '6,779 km', '与太阳距离': '2.279亿 km', '公转周期': '687 地球日', '卫星': '2 (火卫一、火卫二)' },
    desc: '火星被称为"红色星球"，拥有太阳系最高的火山——奥林帕斯山，是人类未来可能的移民目标。'
  },
  {
    name: '木星', nameEn: 'Jupiter', radius: 4.0, distance: 75, speed: 0.012, rotSpeed: 0.02,
    texture: TEXTURES.jupiter,
    stats: { '类型': '气态巨行星', '直径': '139,820 km', '与太阳距离': '7.786亿 km', '公转周期': '11.86 年', '卫星': '95+颗' },
    desc: '木星是太阳系最大的行星，大红斑是一个持续了数百年的巨型风暴，可容纳两个地球。'
  },
  {
    name: '土星', nameEn: 'Saturn', radius: 3.5, distance: 100, speed: 0.009, rotSpeed: 0.018,
    texture: TEXTURES.saturn, hasRing: true, ringTexture: TEXTURES.saturnRing,
    stats: { '类型': '气态巨行星', '直径': '116,460 km', '与太阳距离': '14.34亿 km', '公转周期': '29.46 年', '卫星': '146+颗' },
    desc: '土星以其壮观的环系统闻名，主要由冰粒和岩石碎片组成，是太阳系最美的行星。'
  },
  {
    name: '天王星', nameEn: 'Uranus', radius: 2.2, distance: 130, speed: 0.006, rotSpeed: 0.012,
    texture: TEXTURES.uranus,
    stats: { '类型': '冰巨行星', '直径': '50,724 km', '与太阳距离': '28.71亿 km', '公转周期': '84.01 年', '轴倾角': '97.77°' },
    desc: '天王星的自转轴几乎平行于公转轨道面，像是"躺着"绕太阳运行，呈美丽的蓝绿色。'
  },
  {
    name: '海王星', nameEn: 'Neptune', radius: 2.1, distance: 155, speed: 0.005, rotSpeed: 0.011,
    texture: TEXTURES.neptune,
    stats: { '类型': '冰巨行星', '直径': '49,244 km', '与太阳距离': '45.04亿 km', '公转周期': '164.8 年', '风速': '2,100 km/h' },
    desc: '海王星是太阳系最远的行星，拥有太阳系中最强的风暴，表面呈现深邃的蓝色。'
  }
];

// ==================== 场景初始化 ====================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(50, 80, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 3;
controls.maxDistance = 600;

// ==================== 纹理加载 ====================
const textureLoader = new THREE.TextureLoader();
const loadedTextures = {};
const textureUrls = Object.values(TEXTURES);
let loadedCount = 0;

function loadTexture(url, onProgress) {
  return new Promise((resolve) => {
    if (loadedTextures[url]) {
      resolve(loadedTextures[url]);
      return;
    }
    textureLoader.load(
      url,
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        loadedTextures[url] = tex;
        loadedCount++;
        if (onProgress) onProgress((loadedCount / textureUrls.length) * 100);
        resolve(tex);
      },
      undefined,
      () => {
        console.warn('Failed to load:', url);
        resolve(null);
      }
    );
  });
}

// 预加载所有纹理
async function preloadTextures() {
  for (const url of textureUrls) {
    await loadTexture(url, (p) => {
      document.getElementById('progress').style.width = p + '%';
    });
  }
}

// ==================== 星空背景 ====================
async function createStarfield() {
  const milkyWay = await loadTexture(TEXTURES.milkyWay);
  
  const starGeo = new THREE.BufferGeometry();
  const starCount = 20000;
  const positions = new Float32Array(starCount * 3);
  const colors = new Float32Array(starCount * 3);
  
  for (let i = 0; i < starCount; i++) {
    const r = 600 + Math.random() * 400;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
    
    // 星星颜色变化
    const temp = Math.random();
    if (temp < 0.2) { colors[i*3] = 1.0; colors[i*3+1] = 0.7; colors[i*3+2] = 0.5; }
    else if (temp < 0.4) { colors[i*3] = 0.7; colors[i*3+1] = 0.8; colors[i*3+2] = 1.0; }
    else if (temp < 0.6) { colors[i*3] = 1.0; colors[i*3+1] = 1.0; colors[i*3+2] = 0.9; }
    else { colors[i*3] = 1.0; colors[i*3+1] = 1.0; colors[i*3+2] = 1.0; }
  }
  
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  
  const starMat = new THREE.PointsMaterial({
    size: 0.7,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending
  });
  
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);
  
  // 银河背景贴图
  const bgGeo = new THREE.SphereGeometry(900, 64, 64);
  const bgMat = new THREE.MeshBasicMaterial({
    map: milkyWay,
    side: THREE.BackSide
  });
  const bgMesh = new THREE.Mesh(bgGeo, bgMat);
  scene.add(bgMesh);
}

// ==================== 光照 ====================
const ambientLight = new THREE.AmbientLight(0x333344, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.PointLight(0xffffff, 3, 600);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

// ==================== 创建星球 ====================
const planetMeshes = [];
const planetGroups = [];

function createPlanet(data, index) {
  const group = new THREE.Group();
  
  // 轨道线
  if (data.distance > 0) {
    const orbitPoints = [];
    for (let i = 0; i <= 256; i++) {
      const angle = (i / 256) * Math.PI * 2;
      orbitPoints.push(Math.cos(angle) * data.distance, 0, Math.sin(angle) * data.distance);
    }
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(
      orbitPoints.map((v, i) => new THREE.Vector3(orbitPoints[i*3], orbitPoints[i*3+1], orbitPoints[i*3+2]))
    );
    const orbitMat = new THREE.LineBasicMaterial({ 
      color: 0xffffff, 
      transparent: true, 
      opacity: 0.08 
    });
    const orbitLine = new THREE.Line(orbitGeo, orbitMat);
    scene.add(orbitLine);
  }
  
  // 星球几何
  const geo = new THREE.SphereGeometry(data.radius, 128, 128);
  let mat;
  
  if (data.isEmissive) {
    const tex = loadedTextures[data.texture];
    mat = new THREE.MeshBasicMaterial({
      map: tex,
      color: 0xffffff
    });
  } else {
    const tex = loadedTextures[data.texture];
    const matOpts = { 
      map: tex,
      roughness: 0.8,
      metalness: 0.1
    };
    
    if (data.bumpMap) {
      matOpts.bumpMap = loadedTextures[data.bumpMap];
      matOpts.bumpScale = 0.03;
    }
    if (data.specularMap) {
      matOpts.specularMap = loadedTextures[data.specularMap];
      matOpts.specular = new THREE.Color(0x333333);
    }
    
    mat = new THREE.MeshStandardMaterial(matOpts);
  }
  
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = { planetIndex: index };
  group.add(mesh);
  
  // 太阳光晕效果
  if (data.isEmissive) {
    const glowGeo = new THREE.SphereGeometry(data.radius * 1.5, 64, 64);
    const glowMat = new THREE.ShaderMaterial({
      uniforms: {
        viewVector: { value: camera.position },
        glowColor: { value: new THREE.Color(0xffaa00) }
      },
      vertexShader: `
        varying float intensity;
        uniform vec3 viewVector;
        void main() {
          vec3 vNormal = normalize(normalMatrix * normal);
          vec3 vNormel = normalize(normalMatrix * viewVector);
          intensity = pow(0.65 - dot(vNormal, vNormel), 2.5);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 glowColor;
        varying float intensity;
        void main() {
          vec3 col = glowColor * intensity;
          gl_FragColor = vec4(col, intensity * 0.5);
        }
      `,
      side: THREE.FrontSide,
      blending: THREE.AdditiveBlending,
      transparent: true
    });
    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
    group.add(glowMesh);
    
    // 第二层光晕
    const glow2Geo = new THREE.SphereGeometry(data.radius * 2.2, 64, 64);
    const glow2Mat = new THREE.ShaderMaterial({
      uniforms: {
        viewVector: { value: camera.position },
        glowColor: { value: new THREE.Color(0xff6600) }
      },
      vertexShader: `
        varying float intensity;
        uniform vec3 viewVector;
        void main() {
          vec3 vNormal = normalize(normalMatrix * normal);
          vec3 vNormel = normalize(normalMatrix * viewVector);
          intensity = pow(0.5 - dot(vNormal, vNormel), 4.0);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 glowColor;
        varying float intensity;
        void main() {
          vec3 col = glowColor * intensity;
          gl_FragColor = vec4(col, intensity * 0.3);
        }
      `,
      side: THREE.FrontSide,
      blending: THREE.AdditiveBlending,
      transparent: true
    });
    const glow2Mesh = new THREE.Mesh(glow2Geo, glow2Mat);
    group.add(glow2Mesh);
  }
  
  // 地球大气层
  if (data.hasClouds) {
    // 云层
    const cloudGeo = new THREE.SphereGeometry(data.radius * 1.01, 128, 128);
    const cloudMat = new THREE.MeshStandardMaterial({
      map: loadedTextures[data.cloudTexture],
      transparent: true,
      opacity: 0.35,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
    cloudMesh.userData.isCloud = true;
    group.add(cloudMesh);
    
    // 大气层光晕
    const atmoGeo = new THREE.SphereGeometry(data.radius * 1.08, 64, 64);
    const atmoMat = new THREE.ShaderMaterial({
      uniforms: {
        viewVector: { value: camera.position }
      },
      vertexShader: `
        varying float intensity;
        uniform vec3 viewVector;
        void main() {
          vec3 vNormal = normalize(normalMatrix * normal);
          vec3 vNormel = normalize(normalMatrix * viewVector);
          intensity = pow(0.6 - dot(vNormal, vNormel), 3.5);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying float intensity;
        void main() {
          vec3 atmoColor = vec3(0.4, 0.7, 1.0);
          gl_FragColor = vec4(atmoColor, intensity * 0.6);
        }
      `,
      side: THREE.FrontSide,
      blending: THREE.AdditiveBlending,
      transparent: true
    });
    const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
    group.add(atmoMesh);
  }
  
  // 月球
  if (data.hasMoon) {
    const moonGeo = new THREE.SphereGeometry(0.4, 32, 32);
    const moonMat = new THREE.MeshStandardMaterial({
      map: loadedTextures[TEXTURES.moon],
      roughness: 0.9
    });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    moonMesh.userData.isMoon = true;
    group.add(moonMesh);
  }
  
  // 土星环
  if (data.hasRing) {
    const innerR = data.radius * 1.4;
    const outerR = data.radius * 2.3;
    const ringGeo = new THREE.RingGeometry(innerR, outerR, 128);
    
    // UV映射
    const pos = ringGeo.attributes.position;
    const uvs = [];
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const dist = Math.sqrt(x*x + y*y);
      uvs.push((dist - innerR) / (outerR - innerR), 0.5);
    }
    ringGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    
    const ringTex = loadedTextures[data.ringTexture];
    const ringMat = new THREE.MeshBasicMaterial({
      map: ringTex,
      transparent: true,
      opacity: 0.85,
      side: THREE.DoubleSide
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    ringMesh.rotation.x = -Math.PI / 2.1;
    group.add(ringMesh);
  }
  
  // 初始位置
  if (data.distance > 0) {
    const angle = Math.random() * Math.PI * 2;
    group.position.x = Math.cos(angle) * data.distance;
    group.position.z = Math.sin(angle) * data.distance;
    group.userData.orbitAngle = angle;
  }
  
  scene.add(group);
  planetMeshes.push(mesh);
  planetGroups.push(group);
}

// ==================== 导航栏 ====================
function createNav() {
  const navContainer = document.getElementById('planet-nav');
  PLANETS.forEach((data, index) => {
    const btn = document.createElement('div');
    btn.className = 'nav-btn';
    btn.innerHTML = `<div class="dot" style="background:${data.isEmissive ? '#ffaa00' : data.texture === TEXTURES.venus ? '#e6c87a' : 'auto'}"></div><div class="tooltip">${data.name}</div>`;
    btn.onclick = () => focusPlanet(index);
    navContainer.appendChild(btn);
  });
  
  // 更新导航按钮颜色
  const colors = ['#ffaa00', '#a0a0a0', '#e6c87a', '#4a90d9', '#d94a2b', '#d4a574', '#f0d890', '#7ec8e3', '#4b70dd'];
  document.querySelectorAll('.nav-btn .dot').forEach((dot, i) => {
    dot.style.background = colors[i];
  });
}

// ==================== 速度控制 ====================
let speedMultiplier = 1;
const speedSlider = document.getElementById('speed-slider');
const speedValue = document.getElementById('speed-value');
speedSlider.addEventListener('input', () => {
  speedMultiplier = parseFloat(speedSlider.value);
  speedValue.textContent = speedMultiplier.toFixed(1) + 'x';
});

// ==================== 聚焦功能 ====================
let focusedPlanet = -1;
let cameraAnimating = false;
let cameraTargetPos = new THREE.Vector3();

function focusPlanet(index) {
  focusedPlanet = index;
  const data = PLANETS[index];
  const group = planetGroups[index];
  
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === index);
  });
  
  document.getElementById('planet-name').textContent = data.name;
  document.getElementById('planet-name-en').textContent = data.nameEn;
  
  const statsEl = document.getElementById('planet-stats');
  statsEl.innerHTML = '';
  if (data.stats) {
    Object.entries(data.stats).forEach(([key, val]) => {
      statsEl.innerHTML += `<div class="stat"><span class="label">${key}</span><span class="value">${val}</span></div>`;
    });
  }
  document.getElementById('planet-desc').textContent = data.desc || '';
  document.getElementById('info-panel').classList.add('visible');
  document.getElementById('back-btn').classList.add('visible');
  
  const planetPos = new THREE.Vector3();
  group.getWorldPosition(planetPos);
  const viewDist = data.radius * 5 + 5;
  
  cameraTargetPos.set(
    planetPos.x + viewDist * 0.7,
    planetPos.y + viewDist * 0.4,
    planetPos.z + viewDist * 0.7
  );
  
  cameraAnimating = true;
  controls.target.copy(planetPos);
}

function goBack() {
  focusedPlanet = -1;
  document.getElementById('info-panel').classList.remove('visible');
  document.getElementById('back-btn').classList.remove('visible');
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  
  cameraTargetPos.set(50, 80, 120);
  cameraAnimating = true;
  controls.target.set(0, 0, 0);
}
window.goBack = goBack;

// ==================== 点击检测 ====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(planetMeshes);
  if (intersects.length > 0) {
    const idx = intersects[0].object.userData.planetIndex;
    if (idx !== undefined) focusPlanet(idx);
  }
});

// ==================== 动画循环 ====================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const speed = speedMultiplier;
  
  PLANETS.forEach((data, index) => {
    const group = planetGroups[index];
    const mesh = planetMeshes[index];
    
    // 自转
    mesh.rotation.y += data.rotSpeed * speed;
    
    // 公转
    if (data.distance > 0) {
      group.userData.orbitAngle = (group.userData.orbitAngle || 0) + data.speed * 0.01 * speed;
      group.position.x = Math.cos(group.userData.orbitAngle) * data.distance;
      group.position.z = Math.sin(group.userData.orbitAngle) * data.distance;
    }
    
    // 云层和月球
    group.children.forEach(child => {
      if (child.userData.isCloud) child.rotation.y += 0.0004 * speed;
      if (child.userData.isMoon) {
        const moonAngle = Date.now() * 0.0004 * speed;
        child.position.x = Math.cos(moonAngle) * 3;
        child.position.z = Math.sin(moonAngle) * 3;
        child.position.y = Math.sin(moonAngle * 0.5) * 0.4;
        child.rotation.y += 0.002 * speed;
      }
    });
  });
  
  // 相机动画
  if (cameraAnimating) {
    camera.position.lerp(cameraTargetPos, 0.025);
    if (camera.position.distanceTo(cameraTargetPos) < 0.5) {
      cameraAnimating = false;
    }
  }
  
  // 跟随聚焦星球
  if (focusedPlanet >= 0 && !cameraAnimating) {
    const group = planetGroups[focusedPlanet];
    const planetPos = new THREE.Vector3();
    group.getWorldPosition(planetPos);
    controls.target.lerp(planetPos, 0.05);
  }
  
  // 更新shader uniforms
  planetGroups.forEach((group, idx) => {
    group.children.forEach(child => {
      if (child.material && child.material.uniforms && child.material.uniforms.viewVector) {
        const worldPos = new THREE.Vector3();
        child.getWorldPosition(worldPos);
        child.material.uniforms.viewVector.value = new THREE.Vector3().subVectors(camera.position, worldPos);
      }
    });
  });
  
  controls.update();
  renderer.render(scene, camera);
}

// ==================== 窗口适配 ====================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ==================== 启动 ====================
async function init() {
  await preloadTextures();
  await createStarfield();
  createNav();
  
  PLANETS.forEach((data, index) => {
    createPlanet(data, index);
  });
  
  // 隐藏加载界面
  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 500);
  
  animate();
}

init();
</script>
</body>
</html>
