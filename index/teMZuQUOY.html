<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muse Pro - 终极透明版</title>
    <style>
        :root {
            --bg-dark: #121212;
            /* 修改为半透明背景 */
            --bg-card: rgba(30, 30, 30, 0.6); 
            --bg-hover: rgba(255, 255, 255, 0.1);
            --primary: #1db954;
            --text-main: #ffffff;
            --text-sub: #e0e0e0; /* 稍微调亮以适应透明背景 */
            --player-height: 90px;
            --sidebar-width: 220px;
            --lyric-base-size: 22px;
            --bg-blur-amount: 0;
            --glass-blur: 10px; /* 统一玻璃模糊度 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }

        /* === 布局 === */
        .app-layout { display: flex; flex: 1; height: calc(100vh - var(--player-height)); overflow: hidden; position: relative; }

        /* === 侧边栏 (手机端适配) === */
        .sidebar {
            width: var(--sidebar-width); 
            background: rgba(0, 0, 0, 0.85); /* 侧边栏深色半透明 */
            backdrop-filter: blur(20px);
            padding: 24px;
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
            transition: transform 0.3s ease;
        }
        .logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            color: var(--text-sub); padding: 12px 16px; border-radius: 8px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { background: var(--bg-hover); color: white; }

        /* 手机端遮罩层 */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99;
        }

        /* === 主内容区 === */
        .main-content {
            flex: 1; 
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            overflow-y: auto; 
            padding: 20px 40px 120px; 
            position: relative;
        }
        .main-content.default-bg {
             background-image: linear-gradient(180deg, #222 0%, var(--bg-dark) 40%) !important;
             filter: none !important;
        }
        .content-wrapper { position: relative; z-index: 5; }

        /* === 顶部栏 & 汉堡菜单 === */
        .top-bar {
            position: sticky; top: 0; 
            /* 移除大黑块，改为完全透明或极淡 */
            background: transparent; 
            padding: 16px 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 15px;
        }
        
        /* 汉堡菜单按钮 */
        .mobile-menu-btn {
            display: none; /* 电脑端隐藏 */
            background: transparent; border: none; color: white; cursor: pointer;
        }
        .mobile-menu-btn svg { width: 28px; height: 28px; }

        /* === 搜索框 (优化透明度) === */
        .search-box {
            background: rgba(0, 0, 0, 0.2); /* 极淡的背景 */
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px; padding: 8px 20px;
            display: flex; align-items: center; width: 300px;
            transition: 0.3s;
        }
        .search-box:focus-within { background: rgba(0, 0, 0, 0.5); border-color: var(--primary); }
        .search-box input {
            background: transparent; border: none; color: white; margin-left: 10px; width: 100%; font-size: 14px;
        }

        /* === 列表样式 (统一替换原来的卡片黑块) === */
        .section-title { font-size: 24px; font-weight: 700; margin: 20px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        .song-list { display: flex; flex-direction: column; gap: 8px; }
        .song-row {
            display: grid; grid-template-columns: 40px 4fr 2fr 1fr; padding: 12px 16px;
            border-radius: 12px; align-items: center; color: var(--text-sub); cursor: pointer;
            /* 统一半透明样式 */
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.2s, background 0.2s;
        }
        .song-row:hover { 
            background: rgba(255, 255, 255, 0.15); 
            transform: scale(1.01);
        }
        .song-info { display: flex; align-items: center; gap: 15px; color: white; }
        .song-info img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        /* Tabs */
        .search-tabs { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 10px; }
        .tab-item {
            padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600;
            color: var(--text-sub); cursor: pointer; transition: 0.2s; 
            background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
        }
        .tab-item.active { background: var(--primary); color: black; }

        /* 专辑/歌单详情头部 */
        .album-header {
            display: flex; gap: 30px; margin-bottom: 30px; padding: 30px; 
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .album-cover { width: 200px; height: 200px; border-radius: 12px; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .album-info { display: flex; flex-direction: column; justify-content: flex-end; flex: 1; }
        .album-title { font-size: 32px; font-weight: 800; margin-bottom: 10px; }
        .play-all-btn {
            background: var(--primary); color: black; border: none; border-radius: 50px;
            padding: 12px 30px; font-weight: 700; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 10px; width: fit-content; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }

        /* === 全屏播放器 === */
        .full-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(30px);
            z-index: 200; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
            display: flex; flex-direction: column;
        }
        .full-player.active { transform: translateY(0); }
        
        .fp-header { display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding: 20px 40px; z-index: 10; }
        
        .btn-circle-action {
            background: rgba(255,255,255,0.1); border: none; width: 44px; height: 44px;
            border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.2s; text-decoration: none;
        }

        .fp-content { display: flex; flex: 1; padding: 0 60px 40px; gap: 60px; overflow: hidden; }
        .fp-left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .fp-cover-art { width: 80%; max-width: 450px; aspect-ratio: 1; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); object-fit: cover; margin-bottom: 40px; }
        .fp-title { font-size: 32px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .fp-artist { font-size: 18px; color: var(--text-sub); text-align: center; }

        .fp-right { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        .lyrics-box { flex: 1; overflow-y: auto; padding: 20px 0; mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%); }
        .lyric-line { font-size: var(--lyric-base-size); font-weight: 700; color: rgba(255,255,255,0.3); margin: 28px 0; transition: 0.3s; cursor: pointer; }
        .lyric-line.active { font-size: calc(var(--lyric-base-size) + 8px); color: white; transform: scale(1.05); transform-origin: left; text-shadow: 0 0 20px rgba(255,255,255,0.3); }

        .related-section { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); height: 160px; flex-shrink: 0; }
        .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
        .related-card { 
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .related-card img { width: 100%; aspect-ratio: 1; border-radius: 6px; margin-bottom: 6px; object-fit: cover; }
        .related-title { font-size: 12px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* === 底部播放条 === */
        .footer-player {
            height: var(--player-height); 
            background: rgba(20, 20, 20, 0.9); /* 半透明 */
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100;
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .footer-player.visible { transform: translateY(0); }
        
        .player-left { display: flex; align-items: center; width: 30%; gap: 16px; }
        .circle-art { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.1); animation: rotate 10s linear infinite; animation-play-state: paused; cursor: pointer; }
        .circle-art.spinning { animation-play-state: running; }
        @keyframes rotate { from {transform: rotate(0deg);} to {transform: rotate(360deg);} }
        
        .player-center { width: 40%; display: flex; flex-direction: column; align-items: center; }
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 6px; }
        .btn-icon { background: none; border: none; color: #b3b3b3; cursor: pointer; }
        .btn-icon:hover { color: white; }
        .btn-play { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; cursor: pointer; }
        
        .progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; }
        .progress-fill { height: 100%; background: white; width: 0%; border-radius: 2px; position: relative; }
        .progress-fill::after { content:''; position:absolute; right:-4px; top:-3px; width:10px; height:10px; background:white; border-radius:50%; opacity:0; transition:0.2s; }
        .progress-bar:hover .progress-fill::after { opacity: 1; }

        .loader { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* === 移动端适配 === */
        @media (max-width: 768px) {
            .sidebar { 
                position: fixed; left: -100%; top: 0; height: 100%; 
                width: 260px; transition: left 0.3s ease;
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            .sidebar.active { left: 0; }
            .sidebar-overlay.active { display: block; }
            
            .mobile-menu-btn { display: block; }
            .search-box { width: 100%; }
            .main-content { padding: 15px 15px 100px; }
            
            .song-row { grid-template-columns: 30px 1fr; gap: 15px; }
            .song-row > div:nth-child(3), .song-row > div:nth-child(4) { display: none; }
            
            .album-header { flex-direction: column; text-align: center; padding: 20px; gap: 20px; }
            .album-cover { width: 160px; height: 160px; margin: 0 auto; }
            .album-info { align-items: center; }
            .play-all-btn { margin: 0 auto; }
            
            .fp-content { flex-direction: column; padding: 20px; }
            .fp-left { flex: 0 0 auto; margin-bottom: 20px; }
            .fp-cover-art { width: 260px; margin-bottom: 20px; }
            .fp-right { height: auto; flex: 1; }
            .player-left { width: 60%; } .player-center { width: 40%; }
            .footer-player .btn-icon:not(.btn-play) { display: none; } 
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" onclick="ui.toggleSidebar()"></div>

    <div class="app-layout">
        <nav class="sidebar" id="sidebar">
            <div class="logo"><span style="color:var(--primary)">Muse</span> Pro</div>
            <div class="nav-btn active" onclick="window.router.home(); ui.toggleSidebar();">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> 推荐首页
            </div>
            <div class="nav-btn" onclick="window.router.settings(); ui.toggleSidebar();">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.2-.15.25-.42.12-.64l-2-3.46c-.13-.22-.4-.3-.6-.17l-2.61 1.02c-.39-.37-.82-.71-1.27-.99L15 2h-4l-.27 2.06c-.45.28-.88.62-1.27.99L6.87 4.12c-.2-.13-.47-.05-.6.17l-2 3.46c-.13.22-.08.5.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.2.15-.25.42-.12.64l2 3.46c.13.22.4.3.6.17l2.61-1.02c.39.37.82.71 1.27.99L11 22h4l.27-2.06c.45-.28.88-.62 1.27-.99l2.61 1.02c.2.13.47.05.6-.17l2-3.46c.13-.22.08-.5-.12-.64l-2.11-1.65zm-7.43 3.52c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg> 设置
            </div>
        </nav>

        <main class="main-content" id="main-view">
            </main>
    </div>

    <div class="full-player" id="full-player">
        <div class="fp-header">
            <a href="#" class="btn-circle-action" id="fp-download-btn" target="_blank" download title="下载歌曲">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
            <button class="btn-circle-action" onclick="window.ui.toggleFullPlayer(false)" title="关闭">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <div class="fp-content">
            <div class="fp-left">
                <img src="" class="fp-cover-art" id="fp-cover">
                <div class="fp-meta">
                    <div class="fp-title" id="fp-title"></div>
                    <div class="fp-artist" id="fp-artist"></div>
                </div>
            </div>
            
            <div class="fp-right">
                <div class="lyrics-box" id="lyrics-box">
                    <div class="lyric-line">等待播放...</div>
                </div>
                
                <div class="related-section" id="related-section">
                    <div style="color:white; font-weight:bold; margin-bottom:10px; font-size:14px;">猜你喜欢</div>
                    <div class="related-grid" id="related-container"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-player" id="footer-player">
        <div class="player-left">
            <img src="" class="circle-art" id="mini-cover" onclick="window.ui.toggleFullPlayer(true)">
            <div style="display:flex; flex-direction:column; justify-content:center;">
                <div style="color:white; font-size:14px; cursor:pointer;" id="mini-title" onclick="window.ui.toggleFullPlayer(true)"></div>
                <div style="color:#888; font-size:12px;" id="mini-artist"></div>
            </div>
        </div>
        <div class="player-center">
            <div class="controls">
                <button class="btn-icon" onclick="window.player.prev()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn-play" onclick="window.player.toggle()">
                    <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-icon" onclick="window.player.next()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
            <div class="progress-bar" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        <div style="width:30%;"></div>
    </footer>

    <div class="loader" id="loader"><div class="spinner"></div></div>
    <audio id="audio"></audio>

    <script>
        const API = 'https://163api.qijieya.cn';
        const state = { 
            playlist: [], index: 0, playing: false, lyrics: [], 
            userScroll: false, scrollTimer: null, history: [{type: 'home', data: null}], currentPage: 0,
            // 触摸手势变量
            touchStartX: 0, touchEndX: 0
        };
        
        var userSettings = {};
        const DEFAULT_SETTINGS = { bgUrl: '', bgBlur: 50, lyricSize: 22, showRelated: true };

        function initSettings() {
            try {
                const stored = localStorage.getItem('museProSettings');
                userSettings = stored ? JSON.parse(stored) : DEFAULT_SETTINGS;
            } catch (e) { userSettings = DEFAULT_SETTINGS; }
            applySettings(false);
        }

        function saveSettings() {
            localStorage.setItem('museProSettings', JSON.stringify(userSettings));
        }

        function applySettings(shouldSave = true) {
            const mainView = window.ui.el('main-view');
            const root = document.documentElement;

            if (userSettings.bgUrl && userSettings.bgUrl.trim() !== '') {
                mainView.style.backgroundImage = `url('${userSettings.bgUrl}')`;
                mainView.classList.remove('default-bg');
            } else {
                mainView.style.backgroundImage = '';
                mainView.classList.add('default-bg');
            }

            const blurPx = userSettings.bgBlur * 0.1;
            mainView.style.filter = userSettings.bgBlur > 0 ? `blur(${blurPx}px)` : 'none';
            root.style.setProperty('--lyric-base-size', `${userSettings.lyricSize}px`);
            
            if (shouldSave) saveSettings();
        }

        var ui = {};
        var router = {};
        var player = {};

        window.api = {
            get: async u => (await fetch(API+u)).json(),
            search: (kw, type) => window.api.get(`/cloudsearch?keywords=${kw}&type=${type}`),
            url: id => window.api.get(`/song/url/v1?id=${id}&level=standard`),
            album: id => window.api.get(`/album?id=${id}`),
            playlist: id => window.api.get(`/playlist/detail?id=${id}`),
            lyric: id => window.api.get(`/lyric?id=${id}`),
            simi: id => window.api.get(`/simi/song?id=${id}`)
        };

        ui = {
            el: id => document.getElementById(id),
            loading(show) { this.el('loader').style.display = show ? 'flex' : 'none'; },

            // 手机端侧边栏切换
            toggleSidebar() {
                const sb = this.el('sidebar');
                const ol = document.querySelector('.sidebar-overlay');
                sb.classList.toggle('active');
                ol.classList.toggle('active');
            },

            setActiveNav(name) {
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                if (name === 'home') document.querySelectorAll('.nav-btn')[0]?.classList.add('active');
                if (name === 'settings') document.querySelectorAll('.nav-btn')[1]?.classList.add('active');
            },
            
            // 渲染列表项的通用 HTML（替代黑块卡片）
            renderSongRow(song, index, listName) {
                // 封面获取逻辑：优先单曲封面，无则使用专辑封面
                const picUrl = song.al ? song.al.picUrl : (song.album ? song.album.picUrl : '');
                const songName = song.name;
                const artistName = song.ar ? song.ar.map(a=>a.name).join('/') : (song.artists ? song.artists.map(a=>a.name).join('/') : '未知');
                const albumName = song.al ? song.al.name : (song.album ? song.album.name : '');
                const duration = song.dt ? song.dt : song.duration;

                return `
                    <div class="song-row" onclick="window.player.playList('${listName}', ${index})">
                        <div style="text-align:center; font-weight:bold;">${index+1}</div>
                        <div class="song-info">
                            <img src="${picUrl}?param=100y100" onerror="this.src='https://via.placeholder.com/100'">
                            <div>
                                <div style="font-weight:600; margin-bottom:4px;">${songName}</div>
                                <div style="font-size:12px; opacity:0.8;">${artistName}</div>
                            </div>
                        </div>
                        <div style="opacity:0.8; font-size:13px;">${albumName}</div>
                        <div style="opacity:0.8; font-size:13px;">${window.player.fmtTime(duration/1000)}</div>
                    </div>
                `;
            },

            renderHome() {
                this.el('main-view').innerHTML = `
                    <div class="top-bar">
                        <button class="mobile-menu-btn" onclick="ui.toggleSidebar()">
                            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        </button>
                        <div class="search-box">
                            <svg width="18" height="18" fill="#ccc" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" placeholder="搜索歌曲/专辑..." onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)">
                        </div>
                        <div style="width:28px"></div> </div>
                    <div class="content-wrapper">
                        <div class="section-title">🔥 热门推荐</div>
                        <div class="song-list" id="hot-list-container">
                            </div>
                    </div>
                `;
                this.loadHot();
                this.setActiveNav('home');
            },

            async loadHot() {
                this.loading(true);
                const res = await window.api.get('/playlist/detail?id=3778678');
                this.loading(false);
                window.hotList = res.playlist.tracks.slice(0, 50);
                // 使用列表样式替代原来的 grid-cards
                this.el('hot-list-container').innerHTML = window.hotList.map((s, i) => 
                    this.renderSongRow(s, i, 'hotList')
                ).join('');
            },

            renderSearch(data, type, keyword) {
                const main = this.el('main-view');
                const tabsHtml = `
                    <div class="search-tabs">
                        <div class="tab-item ${type==1?'active':''}" onclick="window.router.search('${keyword}', 1)">单曲</div>
                        <div class="tab-item ${type==10?'active':''}" onclick="window.router.search('${keyword}', 10)">专辑</div>
                        <div class="tab-item ${type==1000?'active':''}" onclick="window.router.search('${keyword}', 1000)">歌单</div>
                    </div>
                `;

                let contentHtml = '';
                if (type == 1 && data.result.songs) {
                    window.searchList = data.result.songs;
                    contentHtml = `<div class="song-list">` + data.result.songs.map((s, i) => 
                        this.renderSongRow(s, i, 'searchList')
                    ).join('') + `</div>`;
                } 
                // 专辑和歌单依然保持卡片（但已透明化），因为它们是集合
                else if (type == 10 && data.result.albums) {
                    contentHtml = `<div class="related-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">` + data.result.albums.map(a => `
                        <div class="related-card" onclick="window.router.loadAlbum(${a.id})">
                            <img src="${a.picUrl}?param=300y300">
                            <div class="related-title" style="font-size:14px; margin-top:5px;">${a.name}</div>
                            <div style="font-size:12px; color:#aaa;">${a.artist.name}</div>
                        </div>
                    `).join('') + `</div>`;
                }
                else if (type == 1000 && data.result.playlists) {
                    contentHtml = `<div class="related-grid" style="grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));">` + data.result.playlists.map(p => `
                        <div class="related-card" onclick="window.router.loadPlaylist(${p.id})">
                            <img src="${p.coverImgUrl}?param=300y300">
                            <div class="related-title" style="font-size:14px; margin-top:5px;">${p.name}</div>
                            <div style="font-size:12px; color:#aaa;">${p.trackCount}首</div>
                        </div>
                    `).join('') + `</div>`;
                }

                main.innerHTML = `
                    <div class="top-bar">
                        <button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
                        <div class="search-box">
                            <input type="text" value="${keyword}" onkeypress="if(event.key==='Enter') window.router.search(this.value, 1)">
                        </div>
                        <button class="nav-btn" onclick="window.router.goBack()">返回</button>
                    </div>
                    <div class="content-wrapper">
                        ${tabsHtml}
                        ${contentHtml || '<div style="color:#888;margin-top:20px">未找到相关内容</div>'}
                    </div>
                `;
            },

            renderAlbumDetail(data) {
                const album = data.album;
                // 修复专辑歌曲无封面问题：将专辑封面赋给每首歌
                const songs = data.songs.map(s => {
                    if (!s.al) s.al = {};
                    if (!s.al.picUrl) s.al.picUrl = album.picUrl;
                    return s;
                });
                window.albumList = songs;
                
                const html = `
                    <div class="top-bar"><button class="nav-btn" onclick="window.router.goBack()">返回</button></div>
                    <div class="content-wrapper">
                        <div class="album-header">
                            <img src="${album.picUrl}?param=500y500" class="album-cover">
                            <div class="album-info">
                                <div class="album-title">${album.name}</div>
                                <div class="album-artist">${album.artist.name}</div>
                                <div style="font-size:14px; color:#ccc; margin-top:5px;">${album.size} 首歌曲 · ${new Date(album.publishTime).getFullYear()}</div>
                                <button class="play-all-btn" onclick="window.player.playList('albumList', 0)">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放全部
                                </button>
                            </div>
                        </div>
                        <div class="song-list">
                            ${songs.map((s, i) => this.renderSongRow(s, i, 'albumList')).join('')}
                        </div>
                    </div>
                `;
                this.el('main-view').innerHTML = html;
            },

            renderPlaylistDetail(data) {
                const playlist = data.playlist;
                window.plList = playlist.tracks;
                
                const html = `
                    <div class="top-bar"><button class="nav-btn" onclick="window.router.goBack()">返回</button></div>
                    <div class="content-wrapper">
                        <div class="album-header">
                            <img src="${playlist.coverImgUrl}?param=500y500" class="album-cover">
                            <div class="album-info">
                                <div class="album-title">${playlist.name}</div>
                                <div class="album-artist">${playlist.creator.nickname}</div>
                                <button class="play-all-btn" onclick="window.player.playList('plList', 0)">
                                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放全部
                                </button>
                            </div>
                        </div>
                        <div class="song-list">
                            ${window.plList.map((s, i) => this.renderSongRow(s, i, 'plList')).join('')}
                        </div>
                    </div>
                `;
                this.el('main-view').innerHTML = html;
            },
            
            renderSettings: () => {
                const mainView = window.ui.el('main-view');
                const html = `
                    <div class="top-bar">
                        <button class="mobile-menu-btn" onclick="ui.toggleSidebar()"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
                        <h2 style="font-weight:700; text-shadow:0 2px 5px rgba(0,0,0,0.3)">设置</h2>
                        <button class="nav-btn" onclick="window.router.home()">返回</button>
                    </div>
                    <div class="content-wrapper" style="padding: 20px 0;">
                        <div style="background: var(--bg-card); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; margin-bottom: 20px;">
                            <h3 style="margin-bottom: 15px; color: var(--primary);">个性化</h3>
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">上传本地背景图</label>
                                <input type="file" accept="image/*" onchange="ui.handleBgUpload(this)" 
                                    style="width: 100%; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.1); color: white;">
                            </div>

                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">背景模糊度: <span id="blur-value">${userSettings.bgBlur}%</span></label>
                                <input type="range" min="0" max="100" value="${userSettings.bgBlur}" 
                                    oninput="ui.el('blur-value').innerText = this.value + '%'; ui.handleSettingChange('bgBlur', parseInt(this.value));" 
                                    style="width: 100%;">
                            </div>
                        </div>
                        
                        <div style="background: var(--bg-card); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; margin-bottom: 20px;">
                            <h3 style="margin-bottom: 15px; color: var(--primary);">播放器</h3>
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 8px; font-weight: 600;">歌词字体大小: <span id="size-value">${userSettings.lyricSize}px</span></label>
                                <input type="range" min="16" max="36" value="${userSettings.lyricSize}" 
                                    oninput="ui.el('size-value').innerText = this.value + 'px'; ui.handleSettingChange('lyricSize', parseInt(this.value));" 
                                    style="width: 100%;">
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <label style="font-weight: 600;">显示相似推荐</label>
                                <input type="checkbox" ${userSettings.showRelated ? 'checked' : ''}
                                    onclick="ui.handleSettingChange('showRelated', this.checked)" style="width:20px; height:20px;">
                            </div>
                        </div>

                        <button onclick="if(confirm('重置所有设置？')) { localStorage.removeItem('museProSettings'); location.reload(); }" 
                                style="padding: 12px 24px; background: rgba(255, 50, 50, 0.8); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: 600;">
                            恢复默认设置
                        </button>
                    </div>
                `;
                mainView.innerHTML = html;
                window.ui.setActiveNav('settings');
            },
            
            handleSettingChange: (key, value) => {
                userSettings[key] = value;
                applySettings();
            },

            // 处理本地图片上传
            handleBgUpload: (input) => {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        userSettings.bgUrl = e.target.result;
                        applySettings();
                    };
                    reader.readAsDataURL(input.files[0]);
                }
            },

            toggleFullPlayer(show) {
                const fp = this.el('full-player');
                if(show) fp.classList.add('active');
                else fp.classList.remove('active');
                const relatedSection = this.el('related-section');
                if(relatedSection) relatedSection.style.display = userSettings.showRelated ? 'block' : 'none';
            }
        };

        // --- 手势处理 (全屏页) ---
        const fp = document.getElementById('full-player');
        fp.addEventListener('touchstart', e => { state.touchStartX = e.changedTouches[0].screenX; });
        fp.addEventListener('touchend', e => {
            state.touchEndX = e.changedTouches[0].screenX;
            if (state.touchEndX - state.touchStartX > 100) { // 右滑
                ui.toggleFullPlayer(false); // 关闭页面 (模拟退出)
            }
        });

        player = {
            audio: document.getElementById('audio'),
            init() {
                this.audio.addEventListener('timeupdate', () => {
                    const cur = this.audio.currentTime;
                    ui.el('progress-fill').style.width = (cur / this.audio.duration * 100) + '%';
                    this.syncLyrics(cur);
                });
                this.audio.addEventListener('ended', () => this.next());
                
                ui.el('progress-bar').addEventListener('click', e => {
                    const pct = e.offsetX / e.target.offsetWidth;
                    this.audio.currentTime = pct * this.audio.duration;
                });
                ui.el('lyrics-box').addEventListener('scroll', () => {
                    state.userScroll = true;
                    clearTimeout(state.scrollTimer);
                    state.scrollTimer = setTimeout(() => state.userScroll = false, 4000);
                });
            },
            async playList(listName, index) {
                const list = window[listName];
                if(!list) return;
                state.playlist = list.map(s => ({
                    id: s.id,
                    name: s.name,
                    artist: s.ar ? s.ar.map(a=>a.name).join('/') : (s.artists ? s.artists.map(a=>a.name).join('/') : '未知'),
                    // 修复：确保封面存在，如果单曲无封面则尝试用专辑封面
                    cover: s.al && s.al.picUrl ? s.al.picUrl : (s.album && s.album.picUrl ? s.album.picUrl : ''),
                    dt: s.dt || s.duration
                }));
                state.index = index;
                this.loadSong();
                ui.el('footer-player').classList.add('visible');
            },
            async loadSong() {
                const song = state.playlist[state.index];
                ui.loading(true);
                const set = (id, t) => { if(ui.el(id)) ui.el(id).innerText = t; };
                const setImg = (id, s) => { if(ui.el(id)) ui.el(id).src = s || 'https://via.placeholder.com/200'; };

                set('mini-title', song.name); set('mini-artist', song.artist); setImg('mini-cover', song.cover);
                set('fp-title', song.name); set('fp-artist', song.artist); setImg('fp-cover', song.cover);

                try {
                    const res = await window.api.url(song.id);
                    const url = res.data[0].url;
                    if (url) {
                        this.audio.src = url;
                        this.audio.play();
                        state.playing = true;
                        this.updateBtn();
                        ui.el('fp-download-btn').href = url; 
                        this.loadLyrics(song.id);
                        this.loadSimi(song.id);
                    } else { alert('无法播放：无版权或VIP'); }
                } catch(e) { console.error(e); }
                ui.loading(false);
            },
            async loadLyrics(id) {
                const res = await window.api.lyric(id);
                state.lyrics = [];
                const box = ui.el('lyrics-box');
                if(res.lrc) {
                    state.lyrics = res.lrc.lyric.split('\n').map(l => {
                        const m = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/.exec(l);
                        return m ? { t: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/1000, txt: m[4] } : null;
                    }).filter(x=>x);
                    box.innerHTML = state.lyrics.map((l,i) => `<div class="lyric-line" id="l-${i}" onclick="window.player.seek(${l.t})">${l.txt}</div>`).join('');
                } else { box.innerHTML = '<div class="lyric-line">纯音乐 / 无歌词</div>'; }
            },
            async loadSimi(id) {
                if (!userSettings.showRelated) return;
                const res = await window.api.simi(id);
                if(res.songs) {
                    window.simiList = res.songs;
                    ui.el('related-container').innerHTML = res.songs.slice(0,6).map((s,i) => `
                        <div class="related-card" onclick="window.player.playList('simiList', ${i})">
                            <img src="${s.album.picUrl}?param=100y100">
                            <div class="related-title">${s.name}</div>
                        </div>
                    `).join('');
                }
            },
            syncLyrics(t) {
                if(state.lyrics.length === 0) return;
                let idx = state.lyrics.findIndex(l => l.t > t) - 1;
                if(idx < 0) idx = 0;
                document.querySelector('.lyric-line.active')?.classList.remove('active');
                const line = ui.el('l-'+idx);
                if(line) {
                    line.classList.add('active');
                    if(!state.userScroll) line.scrollIntoView({behavior:'smooth', block:'center'});
                }
            },
            toggle() {
                if(this.audio.paused) { this.audio.play(); state.playing = true; } else { this.audio.pause(); state.playing = false; }
                this.updateBtn();
            },
            updateBtn() {
                ui.el('icon-play').style.display = state.playing ? 'none' : 'block';
                ui.el('icon-pause').style.display = state.playing ? 'block' : 'none';
                const img = ui.el('mini-cover');
                if(state.playing) img.classList.add('spinning'); else img.classList.remove('spinning');
            },
            prev() { if(state.playlist.length) { state.index = (state.index-1+state.playlist.length)%state.playlist.length; this.loadSong(); } },
            next() { if(state.playlist.length) { state.index = (state.index+1)%state.playlist.length; this.loadSong(); } },
            seek(t) { this.audio.currentTime = t; state.userScroll = false; },
            fmtTime: s => { const m=Math.floor(s/60), ss=Math.floor(s%60); return `${m}:${ss<10?'0':''}${ss}`; }
        };

        router = {
            home: () => { state.history.push({type:'home'}); ui.renderHome(); },
            settings: () => { state.history.push({type:'settings'}); ui.renderSettings(); },
            search: async (kw, type) => {
                if(!kw) return; ui.loading(true);
                const res = await window.api.search(kw, type); ui.loading(false);
                state.history.push({type:'search', data:{res, type, kw}});
                ui.renderSearch(res, type, kw);
            },
            loadAlbum: async (id) => {
                ui.loading(true);
                const res = await window.api.album(id); ui.loading(false);
                state.history.push({type:'album', data:res});
                ui.renderAlbumDetail(res);
            },
            loadPlaylist: async (id) => {
                ui.loading(true);
                const res = await window.api.playlist(id); ui.loading(false);
                state.history.push({type:'playlist', data:res});
                ui.renderPlaylistDetail(res);
            },
            goBack: () => {
                state.history.pop();
                const last = state.history[state.history.length-1];
                if(!last) return router.home();
                if(last.type==='home') ui.renderHome();
                if(last.type==='settings') ui.renderSettings();
                if(last.type==='search') ui.renderSearch(last.data.res, last.data.type, last.data.kw);
                if(last.type==='album') ui.renderAlbumDetail(last.data);
                if(last.type==='playlist') ui.renderPlaylistDetail(last.data);
            }
        };
        
        window.ui = ui; window.router = router; window.player = player;
        initSettings(); window.router.home(); window.player.init();
    </script>
</body>
</html>
