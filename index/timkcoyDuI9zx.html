<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频帧提取</title>
</head>
<body>
    <h3>视频帧提取</h3>
    <!-- 选择视频文件 -->
    <input type="file" id="videoInput" accept="video/*">
    <!-- 隐藏的视频播放器（用于加载视频） -->
    <video id="videoPlayer" controls style="display: none;"></video>
    <!-- 隐藏的Canvas（用于绘制视频帧） -->
    <canvas id="frameCanvas" style="display: none;"></canvas>
    <!-- 提取按钮（视频加载后可用） -->
    <button id="extractBtn" disabled>提取当前帧</button>
    <!-- 提取的图片展示区域 -->
    <div id="frameContainer">选择视频后，点击“提取当前帧”获取图片</div>

    <script>
        // 获取页面元素
        const videoInput = document.getElementById('videoInput');
        const videoPlayer = document.getElementById('videoPlayer');
        const frameCanvas = document.getElementById('frameCanvas');
        const extractBtn = document.getElementById('extractBtn');
        const frameContainer = document.getElementById('frameContainer');
        const canvasCtx = frameCanvas.getContext('2d'); // Canvas绘图上下文

        // 1. 选择视频后，加载到隐藏的播放器
        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            frameContainer.innerHTML = ''; // 清空之前的图片
            videoPlayer.src = URL.createObjectURL(file); // 用本地URL加载视频
            
            // 视频元数据加载完成后，设置Canvas尺寸（与视频分辨率一致）
            videoPlayer.addEventListener('loadedmetadata', () => {
                frameCanvas.width = videoPlayer.videoWidth;
                frameCanvas.height = videoPlayer.videoHeight;
                extractBtn.disabled = false; // 启用“提取”按钮
            });
        });

        // 2. 点击“提取”按钮，将当前视频画面转为图片
        extractBtn.addEventListener('click', () => {
            // 步骤1：把视频当前画面画到Canvas上
            canvasCtx.drawImage(
                videoPlayer,   // 要绘制的视频元素
                0, 0,          // 绘制起点（Canvas左上角）
                frameCanvas.width, frameCanvas.height // 绘制尺寸（与Canvas同大）
            );

            // 步骤2：把Canvas内容转成PNG图片的URL
            const frameUrl = frameCanvas.toDataURL('image/png');
            
            // 步骤3：创建图片元素并显示到页面
            const frameImg = document.createElement('img');
            frameImg.src = frameUrl;
            frameImg.style.width = '200px'; // 简单设置宽度，方便查看
            frameContainer.appendChild(frameImg);
        });
    </script>
</body>
</html>
