<!DOCTYPE html>
<html>
<head>
    <title>图片叠加工具</title>
    <style>
        #canvas-container {
            position: relative;
            width: 800px;
            height: 600px;
            border: 1px solid #000;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        input, button {
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>图片叠加工具</h2>
    <input type="file" id="bg-upload" accept="image/*" />
    <input type="file" id="overlay-upload" accept="image/*" />
    <button id="export-btn">导出高清图</button>

    <div id="canvas-container">
        <canvas id="main-canvas" width="800" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const bgUpload = document.getElementById('bg-upload');
        const overlayUpload = document.getElementById('overlay-upload');
        const exportBtn = document.getElementById('export-btn');

        let overlayImg = null;
        let offsetX = 0, offsetY = 0, scale = 1;

        // 上传底图
        bgUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        // 上传附图
        overlayUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onloadend = () => {
                overlayImg = new Image();
                overlayImg.onload = () => {
                    offsetX = (canvas.width - overlayImg.width) / 2;
                    offsetY = (canvas.height - overlayImg.height) / 2;
                    drawOverlay();
                };
                overlayImg.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        // 绘制附图
        function drawOverlay() {
            if (overlayImg) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(overlayImg, offsetX, offsetY, overlayImg.width * scale, overlayImg.height * scale);
            }
        }

        // 拖拽与缩放事件
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.offsetX;
            lastY = e.offsetY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && overlayImg) {
                offsetX += e.offsetX - lastX;
                offsetY += e.offsetY - lastY;
                lastX = e.offsetX;
                lastY = e.offsetY;
                drawOverlay();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (overlayImg) {
                scale += e.deltaY * -0.01;
                scale = Math.max(0.1, Math.min(5, scale)); // 限制缩放范围
                drawOverlay();
            }
        });

        // 导出高清图
        exportBtn.addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'output.png';
            link.click();
        });
    </script>
</body>
</html>
