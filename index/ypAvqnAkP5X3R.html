<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>孤勇者 - 音乐播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .player-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .song-info {
            padding: 30px;
            text-align: center;
            background: linear-gradient(120deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .song-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .song-artist {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .player-controls {
            padding: 30px;
            text-align: center;
        }
        
        .play-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
        }
        
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.6);
        }
        
        .play-btn.paused i {
            margin-left: 5px;
        }
        
        .progress-container {
            margin-bottom: 30px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.1s linear;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
        }
        
        .lyrics-container {
            height: 300px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-top: 20px;
            scroll-behavior: smooth;
        }
        
        .lyrics-line {
            font-size: 18px;
            line-height: 2.5;
            color: #666;
            text-align: center;
            transition: all 0.3s ease;
            padding: 5px 0;
            opacity: 0.6;
        }
        
        .lyrics-line.active {
            color: #667eea;
            font-weight: bold;
            font-size: 20px;
            opacity: 1;
            transform: scale(1.05);
        }
        
        .lyrics-word {
            transition: all 0.3s ease;
            display: inline-block;
            margin: 0 1px;
        }
        
        .lyrics-word.active {
            color: #764ba2;
            font-weight: bold;
            transform: scale(1.2);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        
        .volume-slider {
            width: 100px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            cursor: pointer;
        }
        
        .volume-fill {
            width: 70%;
            height: 100%;
            background: #667eea;
            border-radius: 2px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .error {
            color: #e74c3c;
            text-align: center;
            padding: 20px;
        }
        
        /* 滚动条样式 */
        .lyrics-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .lyrics-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        .lyrics-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }
        
        @media (max-width: 768px) {
            .player-container {
                border-radius: 10px;
            }
            
            .song-info {
                padding: 20px;
            }
            
            .song-title {
                font-size: 24px;
            }
            
            .lyrics-container {
                height: 250px;
            }
            
            .lyrics-line {
                font-size: 16px;
            }
            
            .lyrics-line.active {
                font-size: 18px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="player-container">
        <div class="song-info">
            <h1 class="song-title">孤勇者</h1>
            <p class="song-artist">陈奕迅</p>
        </div>
        
        <div class="player-controls">
            <button class="play-btn" id="playBtn">
                <i class="fas fa-play"></i>
            </button>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>
            
            <div class="volume-control">
                <i class="fas fa-volume-down"></i>
                <div class="volume-slider" id="volumeSlider">
                    <div class="volume-fill" id="volumeFill"></div>
                </div>
                <i class="fas fa-volume-up"></i>
            </div>
        </div>
        
        <div class="lyrics-container" id="lyricsContainer">
            <div class="loading" id="loading">
                <i class="fas fa-spinner fa-spin"></i> 正在加载歌词...
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata">
        <!-- 音频将通过JavaScript动态设置 -->
    </audio>

    <script>
        // 配置
        const CONFIG = {
            SONG_ID: '1901371647',
            LYRICS_API: 'https://wyy.naxid.top/lyric/new',
            AUDIO_API: 'https://api.qijieya.cn/meting/',
            TIMESTAMP: Date.now()
        };

        // 全局变量
        let lyricsData = [];
        let currentLyricIndex = 0;
        let currentWordIndex = -1;

        // DOM元素
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const lyricsContainer = document.getElementById('lyricsContainer');
        const loadingEl = document.getElementById('loading');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeFill = document.getElementById('volumeFill');

        // 初始化播放器
        async function initPlayer() {
            try {
                // 设置音频源
                audio.src = `${CONFIG.AUDIO_API}?type=url&id=${CONFIG.SONG_ID}`;
                
                // 加载歌词
                await loadLyrics();
                
                // 设置音量
                audio.volume = 0.7;
                updateVolumeDisplay();
                
                // 设置事件监听器
                setupEventListeners();
                
                // 隐藏加载提示
                loadingEl.style.display = 'none';
                
            } catch (error) {
                console.error('初始化播放器失败:', error);
                loadingEl.innerHTML = `<div class="error">加载失败，请刷新页面重试</div>`;
            }
        }

        // 加载歌词
        async function loadLyrics() {
            try {
                const response = await fetch(
                    `${CONFIG.LYRICS_API}?id=${CONFIG.SONG_ID}&timestamp=${CONFIG.TIMESTAMP}`,
                    {
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.code === 200 && data.yrc && data.yrc.lyric) {
                    // 解析逐字歌词
                    lyricsData = parseYrcLyrics(data.yrc.lyric);
                    renderLyrics();
                } else if (data.lrc && data.lrc.lyric) {
                    // 如果没有逐字歌词，使用普通歌词
                    lyricsData = parseLrcLyrics(data.lrc.lyric);
                    renderLyrics();
                } else {
                    throw new Error('未找到歌词');
                }
                
            } catch (error) {
                console.error('加载歌词失败:', error);
                lyricsContainer.innerHTML = `
                    <div class="error">
                        <p>歌词加载失败</p>
                        <p>${error.message}</p>
                    </div>
                `;
                lyricsData = [];
            }
        }

        // 解析逐字歌词（YRC格式）
        function parseYrcLyrics(yrcText) {
            const lines = [];
            const lineRegex = /\[(\d+),(\d+)\]\(([^)]+)\)/g;
            let match;
            
            // 按行分割
            const rawLines = yrcText.split('\n');
            
            rawLines.forEach(rawLine => {
                if (!rawLine.trim()) return;
                
                // 解析行信息
                const lineMatch = /\[(\d+),(\d+)\]/.exec(rawLine);
                if (!lineMatch) return;
                
                const startTime = parseInt(lineMatch[1]);
                const lineDuration = parseInt(lineMatch[2]);
                const lineContent = rawLine.replace(lineMatch[0], '');
                
                const line = {
                    startTime,
                    lineDuration,
                    words: [],
                    text: ''
                };
                
                // 解析逐字信息
                const wordRegex = /\((\d+),(\d+),(\d+)\)([^\(\)]+)/g;
                let wordMatch;
                let currentPos = 0;
                
                while ((wordMatch = wordRegex.exec(lineContent)) !== null) {
                    const wordStartTime = parseInt(wordMatch[1]);
                    const wordDuration = parseInt(wordMatch[2]);
                    const wordText = wordMatch[4];
                    
                    line.words.push({
                        startTime: wordStartTime,
                        duration: wordDuration,
                        text: wordText,
                        index: currentPos
                    });
                    
                    currentPos += wordText.length;
                }
                
                // 生成整行文本
                line.text = line.words.map(w => w.text).join('');
                lines.push(line);
            });
            
            return lines;
        }

        // 解析普通歌词（LRC格式）
        function parseLrcLyrics(lrcText) {
            const lines = [];
            const lineRegex = /\[(\d+):(\d+\.?\d*)\](.*)/g;
            let match;
            
            while ((match = lineRegex.exec(lrcText)) !== null) {
                const minutes = parseFloat(match[1]);
                const seconds = parseFloat(match[2]);
                const text = match[3].trim();
                
                if (text) {
                    lines.push({
                        startTime: minutes * 60 * 1000 + seconds * 1000,
                        text: text,
                        words: []
                    });
                }
            }
            
            return lines;
        }

        // 渲染歌词
        function renderLyrics() {
            if (lyricsData.length === 0) {
                lyricsContainer.innerHTML = '<div class="lyrics-line">暂无歌词</div>';
                return;
            }
            
            const lyricsHTML = lyricsData.map((line, index) => {
                if (line.words && line.words.length > 0) {
                    // 逐字歌词
                    const wordsHTML = line.words.map((word, wordIndex) => {
                        return `<span class="lyrics-word" data-line="${index}" data-word="${wordIndex}">${word.text}</span>`;
                    }).join('');
                    
                    return `<div class="lyrics-line" data-index="${index}">${wordsHTML}</div>`;
                } else {
                    // 普通歌词
                    return `<div class="lyrics-line" data-index="${index}">${line.text}</div>`;
                }
            }).join('');
            
            lyricsContainer.innerHTML = lyricsHTML;
        }

        // 更新歌词显示
        function updateLyrics(currentTime) {
            if (lyricsData.length === 0) return;
            
            // 找到当前时间对应的歌词行
            let newLyricIndex = -1;
            
            for (let i = lyricsData.length - 1; i >= 0; i--) {
                if (currentTime >= lyricsData[i].startTime) {
                    newLyricIndex = i;
                    break;
                }
            }
            
            // 更新行高亮
            if (newLyricIndex !== -1 && newLyricIndex !== currentLyricIndex) {
                // 移除旧的激活状态
                const oldLine = document.querySelector(`.lyrics-line[data-index="${currentLyricIndex}"]`);
                if (oldLine) {
                    oldLine.classList.remove('active');
                }
                
                // 添加新的激活状态
                const newLine = document.querySelector(`.lyrics-line[data-index="${newLyricIndex}"]`);
                if (newLine) {
                    newLine.classList.add('active');
                    currentLyricIndex = newLyricIndex;
                    
                    // 滚动到激活的歌词行
                    newLine.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center'
                    });
                }
            }
            
            // 如果是逐字歌词，更新逐字高亮
            const currentLine = lyricsData[currentLyricIndex];
            if (currentLine && currentLine.words && currentLine.words.length > 0) {
                let newWordIndex = -1;
                
                for (let i = currentLine.words.length - 1; i >= 0; i--) {
                    const word = currentLine.words[i];
                    if (currentTime >= word.startTime) {
                        newWordIndex = i;
                        break;
                    }
                }
                
                if (newWordIndex !== currentWordIndex) {
                    // 移除旧的逐字高亮
                    const oldWords = document.querySelectorAll(`.lyrics-word[data-line="${currentLyricIndex}"]`);
                    oldWords.forEach(word => {
                        word.classList.remove('active');
                    });
                    
                    // 添加新的逐字高亮
                    if (newWordIndex !== -1) {
                        const newWord = document.querySelector(
                            `.lyrics-word[data-line="${currentLyricIndex}"][data-word="${newWordIndex}"]`
                        );
                        if (newWord) {
                            newWord.classList.add('active');
                            currentWordIndex = newWordIndex;
                        }
                    }
                }
            }
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 播放/暂停按钮
            playBtn.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    playBtn.classList.remove('paused');
                } else {
                    audio.pause();
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playBtn.classList.add('paused');
                }
            });
            
            // 进度条点击
            progressBar.addEventListener('click', (e) => {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
                updateProgress();
            });
            
            // 音量控制
            volumeSlider.addEventListener('click', (e) => {
                const rect = volumeSlider.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.volume = Math.max(0, Math.min(1, percent));
                updateVolumeDisplay();
            });
            
            // 音频事件
            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });
            
            audio.addEventListener('timeupdate', () => {
                updateProgress();
                updateLyrics(audio.currentTime * 1000); // 转换为毫秒
            });
            
            audio.addEventListener('ended', () => {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                playBtn.classList.add('paused');
                currentLyricIndex = 0;
                currentWordIndex = -1;
            });
            
            audio.addEventListener('error', (e) => {
                console.error('音频加载错误:', e);
                lyricsContainer.innerHTML = `
                    <div class="error">
                        <p>音频加载失败，请检查网络连接</p>
                    </div>
                `;
            });
        }

        // 更新进度条
        function updateProgress() {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        }

        // 更新音量显示
        function updateVolumeDisplay() {
            const percent = audio.volume * 100;
            volumeFill.style.width = `${percent}%`;
        }

        // 格式化时间（秒 → MM:SS）
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 页面加载完成后初始化播放器
        window.addEventListener('DOMContentLoaded', initPlayer);
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                playBtn.click();
            } else if (e.code === 'ArrowLeft') {
                audio.currentTime = Math.max(0, audio.currentTime - 5);
            } else if (e.code === 'ArrowRight') {
                audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
            } else if (e.code === 'ArrowUp') {
                audio.volume = Math.min(1, audio.volume + 0.1);
                updateVolumeDisplay();
            } else if (e.code === 'ArrowDown') {
                audio.volume = Math.max(0, audio.volume - 0.1);
                updateVolumeDisplay();
            }
        });
    </script>
</body>
</html>
