<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片转Base64</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    body{padding:20px;max-width:600px;margin:0 auto}
    .box{border:1px solid #ddd;padding:20px;border-radius:12px}
    h2{margin-bottom:16px}
    input{margin:10px 0}
    textarea{width:100%;height:200px;margin-top:12px;padding:10px;border-radius:8px;border:1px solid #ddd}
    button{padding:8px 16px;background:#007bff;color:white;border:none;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
<div class="box">
  <h2>图片转 Base64</h2>
  <input type="file" id="file" accept="image/*">
  <button onclick="copy()">复制 Base64</button>
  <textarea id="result" placeholder="Base64 结果在这里"></textarea>
</div>

<script>
const fileInput = document.getElementById('file')
const result = document.getElementById('result')

fileInput.onchange = e => {
  const reader = new FileReader()
  reader.onload = () => {
    result.value = reader.result
  }
  reader.readAsDataURL(e.target.files[0])
}

function copy() {
  result.select()
  document.execCommand('copy')
  alert('已复制到剪贴板')
}
</script>
</body>
</html>
