<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丑照合集</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .description {
            color: #666;
            font-size: 1.2em;
        }
        
        .image-count {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #555;
        }
        
        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        
        @media (max-width: 768px) {
            .image-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 5px;
            }
            
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
        
        .image-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: #fff;
            aspect-ratio: 3/4;
        }
        
        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        
        .modal-content {
            display: block;
            margin: auto;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
        
        .close:hover {
            color: #bbb;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>丑照合集</h1>
        <p class="description">丑照合集</p>
    </div>

    <div id="loading" class="loading">图片加载中...</div>
    <div id="imageContainer" class="image-container"></div>
    
    <div id="modal" class="modal">

        ];

        // 更新图片计数
        document.getElementById('count').textContent = imageFiles.length;

        // 获取图片容器
        const imageContainer = document.getElementById('imageContainer');
        const loadingElement = document.getElementById('loading');

        // 创建图片元素的函数
        function createImageElement(src, index) {
            const imageItem = document.createElement('div');
            imageItem.className = 'image-item';
            
            const img = document.createElement('img');
            img.setAttribute('data-src', src);
            img.alt = `图片 ${index + 1}`;
            img.loading = 'lazy'; // 启用原生懒加载
            
            // 点击图片放大功能
            img.addEventListener('click', function() {
                document.getElementById('modalImg').src = this.src || this.getAttribute('data-src');
                document.getElementById('modal').style.display = 'block';
            });
            
            imageItem.appendChild(img);
            return imageItem;
        }

        // 使用 Intersection Observer 实现更高效的懒加载
        let observer;
        const imageItems = [];

        // 初始化图片加载
        function initializeImages() {
            // 清空容器
            imageContainer.innerHTML = '';
            
            // 创建所有图片元素
            imageFiles.forEach((file, index) => {
                const imageItem = createImageElement(file, index);
                imageItems.push({
                    element: imageItem,
                    loaded: false
                });
                imageContainer.appendChild(imageItem);
            });
            
            // 隐藏加载提示
            loadingElement.style.display = 'none';
            
            // 创建 Intersection Observer
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target.querySelector('img');
                        if (img && !img.src) {
                            // 设置图片源
                            img.src = img.getAttribute('data-src');
                        }
                    }
                });
            }, {
                rootMargin: '50px' // 提前50px开始加载
            });
            
            // 观察所有图片项
            imageItems.forEach(item => {
                observer.observe(item.element);
            });
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // 点击模态框外部关闭
        document.getElementById('modal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });

        // ESC键关闭模态框
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // 页面加载完成后初始化图片
        window.addEventListener('load', initializeImages);
