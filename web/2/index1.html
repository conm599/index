<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽象画廊</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .description {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .image-count {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            opacity: 0.8;
        }
        
        .image-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        
        @media (max-width: 768px) {
            .image-container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                padding: 5px;
            }
            
            body {
                padding: 10px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
        
        .image-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background-color: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            aspect-ratio: 3/4;
        }
        
        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
        
        .modal-content {
            display: block;
            margin: auto;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }
        
        .close:hover {
            color: #bbb;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1.2em;
        }
        
        /* 跳转按钮样式 */
        .nav-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        
        .nav-button:hover {
            transform: scale(1.2);
        }
        
        .nav-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 箭头指示点样式 */
        .arrow-indicator {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .arrow-icon {
            font-size: 24px;
            color: white;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
        
        /* 惊喜弹窗样式 */
        .surprise-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            animation: fadeIn 0.5s ease;
        }
        
        .surprise-content {
            position: relative;
            margin: 15% auto;
            padding: 20px;
            width: 80%;
            max-width: 500px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .surprise-content h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }
        
        .surprise-content p {
            font-size: 1em;
            margin-bottom: 20px;
        }
        
        .close-surprise {
            position: absolute;
            top: 15px;
            right: 20px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

        // 更新图片计数
        document.getElementById('count').textContent = imageFiles.length;

        // 获取图片容器
        const imageContainer = document.getElementById('imageContainer');
        const loadingElement = document.getElementById('loading');

        // 创建图片元素的函数
        function createImageElement(src, index) {
            const imageItem = document.createElement('div');
            imageItem.className = 'image-item';
            
            const img = document.createElement('img');
            img.src = src;
            img.alt = `图片 ${index + 1}`;
            img.loading = 'lazy'; // 启用原生懒加载
            
            // 点击图片放大功能
            img.addEventListener('click', function() {
                document.getElementById('modalImg').src = this.src;
                document.getElementById('modal').style.display = 'block';
            });
            
            imageItem.appendChild(img);
            return imageItem;
        }

        // 初始化图片加载
        function initializeImages() {
            // 清空容器
            imageContainer.innerHTML = '';
            
            // 创建所有图片元素
            imageFiles.forEach((file, index) => {
                const imageItem = createImageElement(file, index);
                imageContainer.appendChild(imageItem);
            });
            
            // 隐藏加载提示
            loadingElement.style.display = 'none';
        }

        // 关闭模态框
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // 点击模态框外部关闭
        document.getElementById('modal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });

        // ESC键关闭模态框
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // 处理箭头指示点点击事件
        function handleArrowClick() {
            const arrowIndicator = document.getElementById('arrowIndicator');
            const surpriseModal = document.getElementById('surpriseModal');
            
            // 隐藏箭头指示点
            arrowIndicator.style.display = 'none';
            
            // 显示惊喜弹窗
            surpriseModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // 关闭惊喜弹窗
        function closeSurprise() {
            const surpriseModal = document.getElementById('surpriseModal');
            surpriseModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // 页面加载完成后初始化图片
        window.addEventListener('load', function() {
            initializeImages();
            
            // 添加箭头指示点点击事件
            const arrowIndicator = document.getElementById('arrowIndicator');
            arrowIndicator.addEventListener('click', handleArrowClick);
            
            // 添加惊喜弹窗关闭事件

            closeSurpriseBtn.addEventListener('click', closeSurprise);

            surpriseModal.addEventListener('click', function(e) {
